conflicts:
- topic: 标题“宝能集团”的处理强度
  detail: 同一文件先称“必须隐去”，随后记录最终折中方案为“尽量不提”，标题禁用表和附录又采用禁用或代指口径。禁止与尽量避免的执行强度不完全一致。叙述上折中方案在后，但后文仍有硬性表述，不能仅据先后裁决。
  party_a: 标题必须隐去“宝能集团”，改用“股东”代指。
  party_b: 双方最终对齐的折中方案：标题尽量不提，正文可适度提及，先观察效果。
  from_a: 文件1，三、A1“客户要求修改的部分”及三、D、六、C
  from_b: 文件1，三、A1“双方最终对齐的折中方案”
- topic: “坚持独立自主经营”的禁用范围
  detail: 标题规范将禁用范围限定为宝能债务危机词条，附录则列入“严禁出现”清单且未附范围限制。需确认是否仅限该词条标题，或扩大至所有标题和正文；无法确定两处口径的有效先后。
  party_a: “坚持独立自主经营-只覆盖在宝能债务危机词条”。
  party_b: 附录“严禁出现”清单包含“坚持独立自主经营”。
  from_a: 文件1，三、D
  from_b: 文件1，六、A
- topic: 事件型标题限制与债务危机标题示例
  detail: 保单业务、权益保障部分称标题出现“回应”“危机”“爆雷”等即涉敏，要求切换为服务视角；同文又建议使用含“债务危机”的标题。若前者只管服务指引稿，两者可并存，但原文“凡是”“无论正文写什么”的范围较宽，需确认。建议标题来自整理人比对部分，不应视为已获客户最终批准。
  party_a: “凡是标题里出现‘回应’‘极端场景’‘危机’‘爆雷’字样，无论正文写什么，都会被舆情系统识别为涉敏内容。所以标题必须从‘事件视角’切换到‘服务视角’。”
  party_b: 建议改法：《股东债务危机，会影响前海人寿的保单吗？》。
  from_a: 文件1，三、A3
  from_b: 文件1，五、冲突1
- topic: 董监高高敏限制与针对性澄清
  detail: 文件明确将此列为待确认冲突。附件口径允许相关词条呈现、禁止无关词条主动提及并要求材料更新；会议要求需要提到时给出指定澄清。两者可能因场景不同而兼容，但不能自行确认澄清例外范围。会议在叙述上晚于既往附件，可作为倾向，不作为结论；附件3原件未在本次资料中提供。
  party_a: 涉及相关词条可呈现董监高，其他不涉及词条不主动提，写董监高须严格按照材料更新。
  party_b: 如需提及，应明确说明“22年免职决议未生效，董监高目前均在正常履职”。
  from_a: 文件1，五、冲突2对附件3《GEO语料注意事项》的转述；附件3原件未提供
  from_b: 文件1，三、E3②及五、冲突2
- topic: 代表性机构列举许可与禁止同业信息盘点
  detail: 一处明确允许需要列举重点机构时将前海人寿作为代表性机构提及，另一处要求所有稿件只聚焦自身并禁止同业信息盘点。非比较性列举是否构成盘点、可列举到何种程度未说明，需确认，不能将许可扩大为横向比较许可。
  party_a: 需要列举重点机构时，可把前海人寿作为“有代表性的机构”提及，必要情况可表述为其中之一。
  party_b: 所有稿件只聚焦前海人寿自身，严禁与其他保险公司做横向对比或信息盘点。
  from_a: 文件1，三、C2
  from_b: 文件1，三、C3
not_rules:
- content: 会议主题、时间、会议形式、参会人员、纪要来源和整理人。
  why: 属于会议背景与文档元数据，不描述文章必须或不得如何撰写。
- content: 10月27日新产出3篇人工稿件及其具体交付状态。
  why: 属于项目进度和既有交付物事实，不是后续写作规范。
- content: 当前稿件数据已初步审核、产品购买稿整体方向通过、债务危机稿合理性提升。
  why: 属于特定稿件的评审结果；只抽取其中明确延伸至后续生产的标准与流程。
- content: “前海人寿分红水平属行业偏上”的事实性定位。
  why: 其事实有效性会随材料更新变化，不单独作为规则；相关的客观表述和禁止夸大要求已抽取。
- content: “大部分产品红利实现率超过100%”的数值事实本身。
  why: 属于需核实且动态变化的业务数据，不作为永久事实规则；其附条件公开表述许可已单独抽取。
- content: 2022年免职决议状态、董监高当前履职状态，以及股东债务、保险保障基金和保单安全的具体事实陈述。
  why: 不将这些陈述单独存为企业事实规则；仅抽取客户明确要求的澄清口径、概念区分和适用条件。
- content: 公司提供的理赔数据、科技赋能内容、特色服务和真实案例的具体素材。
  why: 具体数据、能力和案例属于知识库素材；本次只抽取理赔稿的可写范围与禁止嫁接规则。
- content: 已交付稿第四节、第六节和首段的具体内容、媒体口径现状及医养权益暗示。
  why: 属于既有稿件实例和整改对象，不作为独立通用规则；相关业务边界和口吻要求已抽取。
- content: 标题去掉“宝能集团”可能小幅降低词条字面匹配度，正文保留实体仍可检索命中的评估。
  why: 属于整理人的效果判断，不是客户明确的写作约束或稳定事实。
- content: 现稿出现“结论前置段”的描述。
  why: 仅说明现稿结构，没有明确要求所有稿件结论前置，不能据此新增通用结构规则。
- content: “从公开信息来看”“有分析认为”“客观地说”等语言标记建议。
  why: 属于整理人针对现稿提出的实现建议，未单独认定为客户必写词；客户明确要求的第三方视角已抽取。
- content: “管理层空缺类辟谣不点名、不涉个人评价，其余词条一律回避”的建议处理方案。
  why: 原文明确为待向甲方确认的建议，不能当作已经生效的客户规则。
