  - body
  statement: 稿件不得存在大的业务逻辑错误
  scope_note: 针对影响文章成立的重大逻辑问题，不包括可由甲方直接修改的小细节。
  enforcement: llm
  evidence: 三、F：“大逻辑错误、文不对题 | 直接拒稿”。
  source_file: 文件1
