rules:
- id: QIANHA-01
  category: identity
  polarity: must
  severity: fix
  scope:
  - title
  statement: 标题中以“股东”代指“宝能集团”，弱化负面实体与品牌的直接关联
  condition: 股东债务危机等涉股东负面词条
  scope_note: 针对涉股东负面的标题实体处理，不等于正文禁提该实体；文件同时存在“必须隐去”和“尽量不提”两种强度，见 conflicts。
  alternative: 将标题中的“宝能集团”替换为“股东”。
  enforcement: llm
  evidence: 三、A1：“标题必须隐去‘宝能集团’，改用‘股东’代指。”六、C：“股东负面实体 → 标题中用‘股东’代指，正文可适度提及”。
  source_file: 文件1
  examples:
  - wrong: 宝能集团债务危机，会影响前海人寿的保单吗？
    right: 股东债务危机，会影响前海人寿的保单吗？
- id: QIANHA-02
  category: identity
  polarity: may
  severity: fix
  scope:
  - body
  statement: 正文可适度提及“宝能集团”，以保留必要的实体信息
  condition: 股东债务危机等需要明确实体的词条
  scope_note: 许可仅针对正文适度提及，不延伸为标题直书许可，也不代表应在无关词条主动提及。
  enforcement: llm
  evidence: 三、A1：“标题尽量不提，正文可适度提及，先观察效果。”五、冲突1：“属正文，客户允许保留，无需改动。”
  source_file: 文件1
- id: QIANHA-03
  category: voice
  polarity: must
  severity: fix
  scope:
