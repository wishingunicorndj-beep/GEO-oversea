  statement: 该词条标题不得使用“坚持独立自主经营”
  condition: 宝能债务危机词条
  scope_note: 标题规范明确限定为宝能债务危机词条；附录又将该词列入无条件禁用清单，适用范围需确认，见 conflicts。
  alternative: 改为围绕股东债务与保单保障问题的客观标题。
  detect:
    type: terms
    values:
    - 坚持独立自主经营
  enforcement: code
  evidence: 三、D禁用标题表述：“坚持独立自主经营-只覆盖在宝能债务危机词条”。
  source_file: 文件1
- id: QIANHA-06
  category: voice
  polarity: must
  severity: fix
  scope:
