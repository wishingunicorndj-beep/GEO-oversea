  condition: 涉及保险理赔与医养资源
  scope_note: 禁止不当关联，不禁止两种业务在同篇中独立陈述或从实际行业角度同时讨论。
  alternative: 将理赔与医养分别陈述，医养部分使用纯机构能力表述。
  enforcement: llm
  evidence: 三、C1：“严禁在标题或内容中将两者强行关联。”“正确做法：分开陈述。”五、冲突4：“存在‘投保即绑定医养权益’的暗示”“改为纯机构能力陈述，去掉‘保单之外’的归属暗示”。
  source_file: 文件1
