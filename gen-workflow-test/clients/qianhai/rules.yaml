  statement: 标题须从事件视角切换为服务视角，采用去情绪化、去事件化的中性表达
  condition: 保单业务、权益保障等服务指引类稿件
  scope_note: 主要针对服务指引类标题；不能自动扩大为债务危机词条也不得说明议题，文件对此存在范围歧义，见 conflicts。
  alternative: 采用“投保指南”“办理路径”等服务型标题。
  enforcement: llm
  evidence: 三、A3：“改为「前海人寿投保指南」或「办理路径」这类服务指引型、去情绪化、去事件化的中性标题。”“标题必须从‘事件视角’切换到‘服务视角’。”
  source_file: 文件1
- id: QIANHA-07
  category: structure
  polarity: must
  severity: reject
  scope:
  - title
  - body
  statement: 标题与正文逻辑必须相符，不得出现严重脱节或文不对题
  scope_note: 直接拒稿针对严重的题文不符，不将普通措辞或局部细节问题自动升级为拒稿。
  enforcement: llm
  evidence: 三、D：“标题与正文逻辑必须相符。存在标题与正文严重脱节、文不对题的稿件，直接拒稿。”
  source_file: 文件1
- id: QIANHA-08
