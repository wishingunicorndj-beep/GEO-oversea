  - body
  statement: 发稿表达须遵循低调原则，避免增加监管与舆情敏感度
  condition: 股东负面舆情相关内容的后续发稿
  scope_note: 约束涉敏内容的表达与呈现方式，不等于禁止所有针对性澄清或必要的正文实体信息。
  enforcement: llm
  evidence: 三、A1：“乙方同时承诺后续发稿严格遵循低调原则，避免引发新的监管问询。”
  source_file: 文件1
- id: QIANHA-04
  category: prohibition
  polarity: must_not
  severity: fix
  scope:
  - title
  statement: 标题不得使用“热点回应”“极端场景”“投保决策参考”“可靠性验核标准”
  scope_note: 依据标题规范抽取，直接检查标题；不据此扩大为这些词在所有正文语境中的一律禁用。
  alternative: 使用“前海人寿投保指南”“办理路径”等中性服务指引表述。
  detect:
    type: terms
    values:
    - 热点回应
    - 极端场景
    - 投保决策参考
    - 可靠性验核标准
  enforcement: code
  evidence: 三、A3：“标题严禁使用‘热点回应’‘极端场景’等易引发舆情或歧义的表述。”三、D“客户点名的禁用标题表述”列有“投保决策参考”“可靠性验核标准”。
  source_file: 文件1
  examples:
  - wrong: 前海人寿热点回应
    right: 前海人寿投保指南
