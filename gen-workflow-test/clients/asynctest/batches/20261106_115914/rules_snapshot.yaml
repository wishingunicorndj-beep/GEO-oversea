    - 前海聚元宝（2025版C款）两全保险（分红型）
  enforcement: code
  evidence: 文件1，其他：“更新一下：以下三款产品，后续稿件不提。前海尊享安泰（2025c版）两全保险前海尊享安泰（2025D版）两全保险前海聚元宝（2025版C款）两全保险（分红型）”。
  source_file: 文件1：语料问题1028.docx
