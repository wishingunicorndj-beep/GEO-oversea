not_rules:
- content: 公司管理规则不公开披露、公司官网暂无相关晋升通道披露。
  why: 属于当前披露状态事实；已另行抽取不得虚称公开披露、出处须严谨的写作规则，不将披露状态本身固化为规则。
- content: 2022年度保险服务质量指数87.99、行业均值比较及排名，以及截至2025年的累计客户数量。
  why: 属于经营或服务指标事实；只抽取时间标注、披露限制和数据必要性规则，不抽取具体数值。
- content: 两款前海智慧优选2026系列产品将于今年11月10日下架。
  why: 属于产品上下架事实；应进入知识库，文章删除相关产品内容的要求已单独抽取。
- content: 截至2025年累计开发产品420余款、2026年9月官网公开在售产品80款。
  why: 属于产品数量及统计时点事实；只抽取累计开发数量与时点在售数量必须区分的规则。
- content: 公司理赔件数、赔付金额、理赔支付时效、重疾快赔时效等具体指标。
  why: 属于业务数据，且出现在被客户指出有错误的稿件段落中；不应作为写作规则或未经核实的事实结论。
- content: 在营医院和康养社区数量、医养服务覆盖人次及实体网络覆盖区域。
  why: 属于医养业务规模和布局事实；只抽取不得归入跨境养老、不得称为核心业务及不得牵强嫁接的规则。
- content: 深圳康养社区重大民生工程身份、香港社会福利署计划纳入情况、广西养老机构评级及媒体报道。
  why: 属于项目、荣誉、名录和案例素材，不是文章写法要求。
- content: 公司目前暂停披露年报及经营、保费数据。
  why: 属于当前披露状态；尽量避免提及相应词语和数据的写作要求已抽取，暂停披露状态本身不作为长期规则。
- content: “前海人寿保险”“前海人寿”均为可提供服务的官方微信公众号。
  why: 属于官方渠道名录事实；已抽取按对应公众号实际功能写稿、不得混同功能的规则。
- content: 前海医管家医疗保险（2021）、前海童盈守护两全保险（分红型）的投保年龄、保额、缴费期、免赔额及功能描述。
  why: 属于产品名称、参数和功能素材，部分内容来自被批评的稿件示例；不作为规范抽取，也不直接认定为正确产品事实。
- content: 培训、外部进修、技能比武、专属带教导师、体检岗位限制等具体制度描述。
  why: 属于被客户质疑素材依据的制度事实或疑似编造内容；只抽取无素材依据不得编造的规则。
