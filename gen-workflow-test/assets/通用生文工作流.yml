    - data:
        code: "import json, re\n\ndef _parse(value):\n    if isinstance(value, dict):\
          \ return dict(value)\n    if not isinstance(value, str): return None\n \
          \   text = value.strip()\n    if text.startswith('```'):\n        text =\
          \ re.sub(r'^```(?:json)?\\s*', '', text, flags=re.I)\n        text = re.sub(r'\\\
          s*```$', '', text)\n    try:\n        obj = json.loads(text)\n        return\
          \ obj if isinstance(obj, dict) else None\n    except Exception:\n      \
          \  match = re.search(r'\\{.*\\}', text, flags=re.S)\n        if not match:\
          \ return None\n        try:\n            obj = json.loads(match.group(0))\n\
          \            return obj if isinstance(obj, dict) else None\n        except\
          \ Exception:\n            return None\n\ndef _clean_text(value):\n    text\
          \ = str(value or '')\n    text = re.sub(r'(?i)(?:^|\\n)\\s*(?:system|user|assistant)\\\
          s*:\\s*', '\\n', text)\n    text = re.sub(r'(?i)(?:{{#.*?#}}|\\[待补充\\]|\\\
          {\\{[^{}]+\\}\\})', '', text)\n    text = re.sub(r'<script\\b[^>]*>.*?</script>',\
          \ '', text, flags=re.I|re.S)\n    text = re.sub(r'<style\\b[^>]*>.*?</style>',\
          \ '', text, flags=re.I|re.S)\n    text = re.sub(r'(?i)<h([1-6])>\\s*</h\\\
          1>', '', text)\n    text = re.sub(r'(?i)<p>\\s*</p>', '', text)\n    text\
          \ = re.sub(r'(?i)(?:联系电话|联系方式|咨询电话|扫码添加)[：:：]?\\s*[^<。！？\\n]{0,80}', '',\
          \ text)\n    text = re.sub(r'\\n{3,}', '\\n\\n', text)\n    text = re.sub(r'[\
          \ \\t]{2,}', ' ', text)\n    return text.strip()\n\ndef _clean_tags(tags):\n\
          \    if isinstance(tags, str): tags = re.split(r'[,，、\\n]+', tags)\n   \
          \ if not isinstance(tags, list): return []\n    out=[]\n    for tag in tags:\n\
          \        tag=_clean_text(tag).strip('# ')\n        if tag and tag not in\
          \ out: out.append(tag)\n    return out[:8]\n\ndef main(articles=None):\n\
          \    if not isinstance(articles, list): return {'cleaned_articles': []}\n\
          \    cleaned=[]\n    for raw in articles:\n        art=_parse(raw)\n   \
          \     if not art: continue\n        title=_clean_text(art.get('title') or\
          \ art.get('headline'))\n        description=_clean_text(art.get('description')\
          \ or art.get('meta_description'))\n        content=_clean_text(art.get('content')\
          \ or art.get('body'))\n        tags=_clean_tags(art.get('tags'))\n     \
          \   review=_clean_text(art.get('self_review') or art.get('review'))\n  \
          \      if not title and content:\n            first=re.sub(r'<[^>]+>','',content).strip().split('\\\
          n')[0]\n            title=first[:40]\n        if not content: continue\n\
          \        cleaned.append({'title':title,'description':description,'content':content,'tags':tags,'self_review':review})\n\
          \    return {'cleaned_articles': cleaned}"
