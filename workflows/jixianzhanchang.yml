          # 极限战场专项：竞品白名单硬注入
          # 客户硬性要求：禁止与 PUBG 对比；仅允许《和平精英》《使命召唤》（含战区）。
          # 本节点不再调模型挖掘，直接输出固定名单，杜绝越界。

          WHITELIST_TEXT = """## 已验证竞品列表（客户白名单·共2家，禁止新增或替换）

          ### 竞品1：和平精英
          - 梯队：T1
          - 确信度：high
          - 来源维度：客户指定允许对比
          - 定位：国内战术竞技手游代表性产品，腾讯光子工作室群研发
          - 允许用法：可作为竞品对比对象

          ### 竞品2：使命召唤：战区
          - 梯队：T1
          - 确信度：high
          - 来源维度：客户指定允许对比（《使命召唤》含《使命召唤：战区》）
          - 定位：动视出品的射击游戏系列，《战区》为其战术竞技模式
          - 允许用法：可作为竞品对比对象

          ## 竞品使用边界（硬约束，下游必须遵守）
          1. 禁止与《绝地求生》（PUBG）进行任何形式的对比，全文不得出现该产品名。
          2. 禁止出现《永劫无间》相关内容，不得作为对比对象或代表作。
          3. 《Apex英雄》仅可作为媒体品类类比（"媒体试玩将其类比为《COD战区》与《Apex英雄》"），不得进入TOP排名或竞品段。
          4. 《荒野行动》《Blood Strike》是研发团队经验背书，不得作为竞品对比对象。
          5. 对比必须以《极限战场》自身特色为主轴（极限运动×战术竞技、局内经济、复活机制），不得写成竞品的复刻或跟风。
          """

          COMP_NAMES = ["和平精英", "使命召唤：战区"]


          def main(compliance_mode="game", needs_competitors="true"):
