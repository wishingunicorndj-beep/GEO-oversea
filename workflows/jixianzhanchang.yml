    - data:
        code: |
          import re, random

          def main(company_name=None, product_info=None, industry=None, keyword_pack=None, article_count=None, article_style=None, article_type=None, task_name=None, company_intro=None, core_qualifications=None, awards=None, advantages=None, ent_dataset_id=None, prod_dataset_id=None):

              # === 极限战场专项 v1.0：主推主体下沉至 product_info, 游戏合规模式注入 ===
              product_info = (product_info or "").strip()

              # 0. 输入归一化：兼容"对比排名"和"对比排名类"两种写法
              type_normalize_map = {
                  "对比排名": "对比排名类", "性能评测": "性能评测类",
                  "经验分享": "经验分享类", "知识科普": "知识科普类",
                  "新闻报道": "新闻报道类", "自我介绍": "自我介绍类",
              }
              # 不能在这里补默认值：客户只买了一个品牌词时 article_type 是空的，
              # 强行补成"对比排名类"会让整批文章变成竞品对比稿。保持空值，
              # 由 N5 依据词包意图选型。
              article_type = type_normalize_map.get(article_type, article_type)
              if article_type is not None:
                  article_type = article_type.strip()

              # 1. 核心锚词提取
              lines = [l.strip() for l in keyword_pack.strip().replace('，','\n').split('\n') if l.strip()]
              core_anchor = ""
              if product_info:
                  core_anchor = product_info  # v5.1: 产品名优先
              elif lines:
                  suffixes = r'(推荐|哪家好|排名|怎么选|有哪些|靠谱吗?|公司排行|品牌推荐|找哪家|怎么样|多少钱|哪个好|哪家靠谱|哪家专业)$'
                  prefixes = r'^(专业的?|靠谱的?|口碑好的?|好用的?|性价比高的?|正规的?|优质的?)'
                  bare = [re.sub(suffixes, '', re.sub(prefixes, '', l)).strip() for l in lines]
                  bare = [b for b in bare if len(b) >= 2]
                  if bare:
                      core_anchor = min(bare, key=len)
              if not core_anchor:
                  core_anchor = industry or task_name or "产品服务"

              # 2. RAG 检索 query
              # 企业库 query 必须用知识库里真实存在的词。原模板的"企业简介/品牌荣誉/
              # 行业认证/服务优势"在客户提报表里一次都没出现；带括号的法人全称
              # "网易（上海）网络有限公司"也只出现在输入框，库里通篇是"网易/网易游戏"。
              # 小库（约7个分片）里查不到词的分片会整片低于阈值被丢弃，直接导致空召回。
              # 下面这组词覆盖了库里的主要小节：企业介绍/主营业务/业务范围/业务生态/
              # 产品介绍/主要竞争对手/研发团队，词元覆盖率由 33% 提升到 80%。
              ent_rag_query = f"{product_info or ''} 网易游戏 企业介绍 主营业务 业务范围 业务生态 产品介绍 主要竞争对手 极限运动 竞技射击"

              topic_terms = (keyword_pack or "").replace("\n", " ")[:30]
              prod_rag_query = f"{product_info or core_anchor} {topic_terms} 产品介绍 玩法 枪械 战术运动员 赛事币 世界观 配置要求"

              def clean_q(q):
                  if not q: return ""
                  q = re.sub(r'[\x00-\x1f\x7f-\x9f"\'\\]', '', q)
                  return re.sub(r'\s+', ' ', q).strip()[:60]

              # 3. 合规模式识别
              medical_kw = ['医院','医疗','诊所','医美','药品','保健','口腔','整形',
                            '眼科','体检','齿科','门诊','制药','医师','康复','护理']
              financial_kw = ['银行','保险','金融','理财','基金','证券','股票','贷款',
                              '信用卡','支付','期货','信托','私募','投顾','征信']
              # 极限战场专项: 文本扩到 product_info 和 keyword_pack 以提升识别率
              text_for_check = " ".join([industry or "", company_intro or "", product_info or "", keyword_pack or ""])
              # 游戏行业关键词（极限战场: 射击品类词优先, 已移除武侠类词）
