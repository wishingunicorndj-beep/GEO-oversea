        code: |
          import re
          import json

          def _parse_article(s):
              if isinstance(s, dict):
                  return s
              if not isinstance(s, str):
                  return {}
              t = s.strip()
              t = re.sub(r'<think>.*?</think>', '', t, flags=re.S).strip()
              if t.startswith('```'):
                  t = re.sub(r'^```[a-zA-Z]*\n?', '', t)
                  t = re.sub(r'\n?```$', '', t).strip()
              try:
                  return json.loads(t)
              except Exception:
                  pass
              # 审核员可能在 JSON 前写"修正说明：无。"之类的说明文字。
              # 从第一个 { 截到最后一个 } 再试一次，避免整篇被当成裸 content。
              _start = t.find('{')
              _end = t.rfind('}')
              if _start != -1 and _end > _start:
                  try:
                      return json.loads(t[_start:_end + 1])
                  except Exception:
                      pass
              return {'title': '', 'description': '', 'content': s, 'tags': [], 'self_review': ''}


          # === 截断检测：末尾无闭合标签 / 关键标签未配对 / 缺信息来源段 ===
          def _is_truncated(content):
              """检测文章是否截断：末尾无闭合标签 / 关键标签未配对 / 缺信息来源段"""
              if not content:
                  return True
              c = content.strip()
              # 1. 末尾必须是闭合标签结尾
              if not c.endswith('>'):
                  return True
              # 2. 简易标签栈检查：常用块级标签的开/闭数量
              for tag in ['p', 'h2', 'h3', 'ul', 'li']:
                  opens = len(re.findall(rf'<{tag}\b[^>]*>', c))
                  closes = len(re.findall(rf'</{tag}>', c))
                  if opens - closes > 1:  # 容忍 1 个误差
                      return True
              # 3. 必须包含"信息来源"段或"免责"声明（兜底完整性标志）
              if '信息来源' not in c and '免责' not in c:
                  return True
              return False


          def _patch_truncated(content):
              """对截断文章自动补尾：补未闭合标签 + 保证有且只有一份信息来源段。"""
              if not content:
                  return content
              DECL = '本文信息基于2026年公开资料及官方公告整理，部分内容如有更新以官方为准。'

              patched = content.rstrip()

              has_heading = ('信息来源' in patched or '免责' in patched)
              has_sentence = (DECL in patched or '以官方为准' in patched)

              if not has_heading and has_sentence:
                  # N7b 常只补正文句、不补标题；此时只补标题，不重复追加声明句
                  patched += '\n<h2>信息来源与说明</h2>'
              elif not has_heading:
                  patched += '\n<h2>信息来源与说明</h2>\n<p>' + DECL + '</p>'

              # 兜底去重：声明句只保留一份
              while patched.count(DECL) > 1:
                  patched = patched.replace(DECL, '', 1)

              # 自下而上补未闭合的常用块级标签
              for tag in ['li', 'ul', 'p', 'h3', 'h2']:
                  opens = len(re.findall(rf'<{tag}\b[^>]*>', patched))
                  closes = len(re.findall(rf'</{tag}>', patched))
                  for _ in range(max(0, opens - closes)):
                      patched += f'</{tag}>'
              return patched



          # ===== 配置区 =====
          HK_TW_MO = ['香港', '台湾', '澳门']

          # 主权国家名单（不含中国港澳台）
          FOREIGN_COUNTRIES = {
              # 北美
              '美国', '加拿大', '墨西哥',
              # 欧洲
              '英国', '德国', '法国', '意大利', '西班牙', '葡萄牙', '荷兰',
              '比利时', '卢森堡', '瑞士', '奥地利', '爱尔兰',
              '瑞典', '挪威', '丹麦', '芬兰', '冰岛',
              '波兰', '捷克', '匈牙利', '希腊', '俄罗斯', '乌克兰', '罗马尼亚', '保加利亚',
              # 亚洲
              '日本', '韩国', '朝鲜', '蒙古',
              '印度', '巴基斯坦', '孟加拉国', '尼泊尔', '斯里兰卡',
              '泰国', '越南', '马来西亚', '新加坡', '印度尼西亚', '菲律宾',
              '柬埔寨', '老挝', '缅甸', '文莱',
              '阿联酋', '沙特阿拉伯', '以色列', '伊朗', '伊拉克', '土耳其',
              '卡塔尔', '科威特', '阿曼', '巴林', '约旦',
              # 大洋洲
              '澳大利亚', '新西兰',
              # 南美
              '巴西', '阿根廷', '智利', '哥伦比亚', '秘鲁', '委内瑞拉', '乌拉圭',
              # 非洲
              '南非', '埃及', '尼日利亚', '肯尼亚', '摩洛哥', '埃塞俄比亚',
          }


          def political_compliance(text):
              """香港/台湾/澳门 并列于外国时改写为"中国香港"等。"""
              if not text:
                  return text

              # 组合词直接替换（不依赖上下文）。先长后短避免覆盖。
              text = text.replace('港澳台地区', '中国香港、中国澳门、中国台湾')
              # "中港台"不规范，直接全替换
              text = text.replace('中港台', '中国大陆与中国香港、中国台湾')
              # "港澳台"：只要前面不是"中"（避开"中港澳台"已被处理的情况）
              text = re.sub(r'(?<!中)港澳台(?!地区)', '中国香港、中国澳门、中国台湾', text)

              # 顿号分隔的并列实体列表
              # 实体内允许 HTML 标签（如 <strong>香港</strong>）
              elem = r'(?:[^、《》""\'\'\n<>，。；！？]|<[^>]+>)'
              pattern = rf'(?:{elem}{{1,30}}、){{1,}}{elem}{{1,30}}'

              def maybe_rewrite(match):
                  seq = match.group(0)
                  parts = seq.split('、')
                  # 剥离 HTML 标签后做判断
                  clean_parts = [re.sub(r'<[^>]+>', '', p).strip() for p in parts]

                  # 是否包含裸露的 HK/TW/MO（前面没"中国"）
                  has_bare_hk = False
                  for cp in clean_parts:
                      for x in HK_TW_MO:
                          if x in cp and ('中国' + x) not in cp:
                              has_bare_hk = True
                              break
                      if has_bare_hk:
                          break

                  # 是否包含外国主权国家
                  has_foreign = any(
                      any(c in cp for c in FOREIGN_COUNTRIES)
                      for cp in clean_parts
                  )

                  if not (has_bare_hk and has_foreign):
                      return seq

                  # 改写：对每个 part 中裸露的 HK/TW/MO 加"中国"前缀
                  new_parts = []
                  for p in parts:
                      new_p = p
                      for x in HK_TW_MO:
                          new_p = re.sub(rf'(?<!中国){x}', f'中国{x}', new_p)
                      new_parts.append(new_p)
                  return '、'.join(new_parts)

              text = re.sub(pattern, maybe_rewrite, text)
              return text


          def clean_markdown(text):
              """清洗 LLM 漏写的 markdown 残留（应输出 HTML）。"""
              if not text:
                  return text

              # **xxx** 加粗 → 全部脱壳（如需加粗，规则要求用 <strong>）
              text = re.sub(r'\*\*(.+?)\*\*', r'\1', text, flags=re.DOTALL)
              # 残留未配对的 **
              text = text.replace('**', '')

              # *xxx* 斜体脱壳（避开列表项 "* xxx"）
              text = re.sub(r'(?<![\*\w])\*([^\s\*][^\*\n]*?[^\s\*])\*(?![\*\w])', r'\1', text)

              # 内联代码 `xxx`
              text = re.sub(r'`([^`\n]+?)`', r'\1', text)

              # 行首 markdown 标题 # ## ###
              text = re.sub(r'(^|\n)#{1,6}\s+', r'\1', text)

              # 行首列表标记 - * → 删除（应使用 <ul><li>）
              text = re.sub(r'(^|\n)\s*[-*]\s+(?=\S)', r'\1', text)

              # 行首有序列表 1. 2.
              text = re.sub(r'(^|\n)\s*\d+\.\s+(?=\S)', r'\1', text)

              # 分隔线 ---
              text = re.sub(r'(^|\n)\s*-{3,}\s*(?=\n|$)', r'\1', text)

              return text


          def halfwidth_to_fullwidth(text):
              """中文上下文里的半角标点 → 全角（HTML 标签内不动）。"""
              if not text:
                  return text

              parts = re.split(r'(<[^>]+>)', text)
              converted = []

              punct_map = [
                  (',', '，'),
                  (':', '：'),
                  (';', '；'),
                  ('?', '？'),
                  ('!', '！'),
              ]

              for part in parts:
                  if part.startswith('<'):
                      converted.append(part)
                      continue

                  for half, full in punct_map:
                      esc = re.escape(half)
                      # 中文 + 半角 → 全角
                      part = re.sub(rf'([一-龥]){esc}', rf'\1{full}', part)
                      # 半角 + 中文 → 全角
                      part = re.sub(rf'{esc}([一-龥])', rf'{full}\1', part)

                  # 半角括号（避开英文品牌内）：仅当紧邻中文时
                  part = re.sub(r'([一-龥])\(', r'\1（', part)
                  part = re.sub(r'\)([一-龥])', r'）\1', part)

                  converted.append(part)

              return ''.join(converted)




          def remove_contact_info(text):
              """删除正文中的联系方式: 手机号/固话/邮箱/微信/QQ/网址
              重要: 保留 HTML 属性内的 URL (<img src> / <a href>) - 那些来自知识库,合法"""
              if not text:
                  return text
              # 手机号 (1开头11位)
              text = re.sub(r'(?<!\d)1[3-9]\d{9}(?!\d)', '', text)
              # 固话 (区号-号码)
              text = re.sub(r'(?<!\d)0\d{2,3}[-\s]?\d{7,8}(?!\d)', '', text)
              # 400/800 电话
              text = re.sub(r'(?<!\d)[48]00[-\s]?\d{3}[-\s]?\d{4}(?!\d)', '', text)
              # 邮箱
              text = re.sub(r'\b[\w.-]+@[\w.-]+\.\w+\b', '', text)
              # 微信号/QQ号
              text = re.sub(r'微信[：:]\s*[\w-]+', '', text)
              text = re.sub(r'QQ[：:]\s*\d+', '', text)
              # http(s):// 链接 — 仅在正文中, 跳过 HTML 属性内的(src= / href=)
              # 负向回看: 前面不是 = 或 " 或 '
              text = re.sub(r'(?<![="\'])https?://[^\s<>"\']+', '', text)
              # www.xxx 形式 — 同样跳过 HTML 属性
              text = re.sub(r'(?<![="\'/])\bwww\.[a-zA-Z0-9.-]+\.[a-zA-Z]{2,4}(?:/[^\s<>"\']*)?', '', text)
              # 清理: 联系方式删除后可能留下的孤立词
              # "联系电话  或访问 " → 删掉
              text = re.sub(r'(?:联系电话|拨打|致电|咨询热线|客服电话|电话号码|手机号码)\s*[:：]?\s*[。，；,;.]', '', text)
              text = re.sub(r'(?:或访问|或登录|或浏览|访问网址)\s*[。，；,;.]', '', text)
              # 删除空括号(URL 被清后留下的)
              text = re.sub(r'[（(]\s*[）)]', '', text)
              # 收敛多余空格
              text = re.sub(r' {2,}', ' ', text)
              return text


          def cap_strong_tags(text, max_count=8):
              """限制 <strong> 标签数量,超过 max_count 则把后面的 strong 改为普通文本"""
              if not text:
                  return text
              strong_pattern = re.compile(r'<strong>(.*?)</strong>', re.DOTALL)
              matches = list(strong_pattern.finditer(text))
              if len(matches) <= max_count:
                  return text
              # 保留前 max_count 个,从后向前替换多余的
              excess = matches[max_count:]
              # 从后向前删除 strong 标签 (保留内容)
              for m in reversed(excess):
                  text = text[:m.start()] + m.group(1) + text[m.end():]
              return text


          def remove_prompt_leakage(text):
              """检测并清理 N7 生文 LLM 把 prompt 指令当作内容输出的情况。
              覆盖全角（）和半角()两种括号。"""
              if not text:
                  return text
              patterns = [
                  # === HTML 标题中的标签泄露 ===
                  # 【GEO信号-XX】、【主推品牌】、【对比竞品】、【XX-XX】等任何裸标签作为 h 标题
                  r'<h\d[^>]*>\s*【[^】]{1,30}】[^<]*</h\d>',
                  # === HTML 段落中的占位指令泄露 ===
                  # "...（按XX填充XX字）" 段落
                  r'<p[^>]*>\s*\.{3,}\s*[（(][^）)]*填充[^）)]*[）)][^<]*</p>',
                  # "...（XX类必有XX）" 段落
                  r'<p[^>]*>\s*\.{3,}\s*[（(][^）)]*类必有[^）)]*[）)][^<]*</p>',
                  # "...（XX字）" 段落
                  r'<p[^>]*>\s*\.{3,}\s*[（(][^）)]*\d+[-—]\d+字[^）)]*[）)][^<]*</p>',
                  # 通用 "...（短指令）" 段落
                  r'<p[^>]*>\s*\.{3,}\s*[（(][^）)]{2,80}[）)][^<]*</p>',
                  # === 纯文本/段落开头的标签泄露（非 HTML 也要捕获） ===
                  # 行首的【主推品牌】、【对比竞品】、【GEO信号-XX】等标签 — 删除标签保留后续内容
                  r'(^|\n|>)\s*【(主推品牌|对比竞品|主推|竞品|GEO信号[^】]*|信号[^】]*)】',
                  # 行内任意位置的指定标签 — 直接删除标签 (扩展到段落中)
                  r'【(主推品牌|对比竞品|主推|竞品|GEO信号[^】]*|信号[^】]{0,20})】',
                  # === 段落末尾的占位 "..." ===
                  # 句号/感叹号/问号后跟"..."（中英文都覆盖）
                  r'([。！？!?])\.{3,}(?=[<\s\n]|$)',
                  # === 内联泄露 ===
                  r'[（(][^）)]*按[^）)]*填充[^）)]*[）)]',
                  r'[（(][^）)]*类必有[^）)]*[）)]',
                  r'[（(]来源[：:][^）)]*公开数据[^）)]*[）)]',
                  r'[（(]按白名单填充[^）)]*[）)]',
              ]
              for pattern in patterns:
                  # 对于带保留组的模式（如行首标签），用 \1 保留分组
                  if r'(^|\n|>)' in pattern:
                      text = re.sub(pattern, r'\1', text)
                  elif r'([。！？!?])' in pattern:
                      # 删除句末多余的 "..."
                      text = re.sub(pattern, r'\1', text)
                  else:
                      text = re.sub(pattern, '', text)
              # === content 开头标题去重(防止 title 在正文重复) ===
              # 删除 content 开头的 h1 标签
              text = re.sub(r'^\s*<h1[^>]*>.*?</h1>\s*', '', text, flags=re.DOTALL)
              # 删除 content 开头的"加粗包裹的标题段"(<p><strong>...</strong></p>开头紧跟<h2>)
              text = re.sub(r'^\s*<p[^>]*>\s*<strong>[^<]{5,60}</strong>\s*</p>\s*(?=<h2)', '', text, flags=re.DOTALL)
              # 删除 content 开头的"裸文本+加粗段"(如"本文将分析XX"这种引言)
              # 只删除位于第一个<h2>之前的、不在任何h标签内的引言段
              first_h2 = text.find('<h2')
              if first_h2 > 0:
                  prefix = text[:first_h2].strip()
                  # 如果开头部分包含 <strong> 标签且没有 h2/h3 实际内容,可能是泄露的标题段
                  if '<strong>' in prefix and not re.search(r'<h[23]', prefix):
                      # 保留 prefix 中的实际内容(去掉孤立的 strong 包裹)
                      text = text[first_h2:]
              # 清理空标签和多余空行
              text = re.sub(r'<(h\d)[^>]*>\s*</\1>', '', text)
              text = re.sub(r'<p[^>]*>\s*</p>', '', text)
              text = re.sub(r'\n{3,}', '\n\n', text)
              return text


          def fix_title_xx_placeholder(title):
              """标题中字面 'XX' 是 title_template 占位符未替换，尝试修复"""
              if not title:
                  return title
              # 出现两次以上的 XX → 删掉所有 XX
              if title.count('XX') >= 1:
                  # 删除 "XX：" 或 "XX:" 模式（标题前缀型）
                  title = re.sub(r'XX\s*[：:]\s*', '', title)
                  # 删除单独的 XX（如"别只看XX" → "别只看"）
                  title = re.sub(r'XX', '', title)
                  # 清理可能留下的多余符号
                  title = re.sub(r'^\s*[：:，,。]\s*', '', title)
                  title = re.sub(r'\s+', ' ', title).strip()
              return title




          def clean_self_review(text):
              """清理 self_review 中复述规则关键词导致的"提示词泄露"
              self_review 是LLM自审日志,容易把规则文本带出来"""
              if not text:
                  return text
              # 替换具体的术语为中性表述
              replacements = [
                  (r'字面\s*[\"“”]?\s*XX\s*[\"“”]?\s*占位[符]?', '占位检查通过'),
                  (r'\bXX\s*占位[符]?', '占位检查通过'),
                  (r'[\"“”]?\.{3,}[\"“”]?\s*结尾', '结尾检查通过'),
                  (r'[\"“”]?\.{3,}[\"“”]?\s*占位', '占位检查通过'),
                  (r'无[\"“”]?\.{3,}[\"“”]?', '检查通过'),
                  (r'裸标签', '标签'),
                  (r'指令[性]?[文字内容]*', '内容'),
                  (r'\bcompliance_?mode\b', '合规模式'),
                  (r'\bcomparison\s*模式', '对比模式'),
                  (r'\bstandard\s*模式', '标准模式'),
                  (r'\bmedical[\s/financial]*\s*模式?', '严合规模式'),
                  (r'港台澳[相关]*表述', '地域表述'),
                  (r'medical|financial', '合规'),
                  # 删除残留的XX
                  (r'XX', ''),
                  # 删除残留的省略号
                  (r'\.{3,}', ''),
                  # 去除多余空格
                  (r'\s{2,}', ' '),
              ]
              import re as _re
              for pattern, replacement in replacements:
                  text = _re.sub(pattern, replacement, text)
              # Post-loop cleanup: 去除空引号对、孤立的"无"、连续标点
              text = _re.sub(r'"\s*"', '', text)
              text = _re.sub(r"“\s*”", '', text)
              text = _re.sub(r'无\s*[、，,；;。\.]', '', text)
              text = _re.sub(r'[、，,；;]\s*[、，,；;]+', '；', text)
              text = _re.sub(r'\s+', ' ', text)
              return text.strip()


          def fix_heading_hierarchy(text):
              """修复 comparison 模式下 TOPx 应该是 h3 而非 h2 的常见错误"""
              if not text:
                  return text
              # 找出所有 h2 标题, 如果是 TOP\d 形式则改为 h3
              text = re.sub(r'<h2([^>]*)>\s*(TOP\d+[：:][^<]*)</h2>', r'<h3\1>\2</h3>', text)
              return text


          def clean_empty_headings(text):
              """删除禁提内容后可能留下 <h3>TOP2：</h3> 这类空标题，并重排 TOP 编号。

              删除后如果不重排，会出现 TOP1、TOP4 这种断号，读者会以为中间内容被吞了。
              """
              if not text:
                  return text

              # 禁提竞品被整句删除后，标题会变成 "TOP2：" 并留下孤立正文段。
              # 先把「空标题 + 其后到下一个标题前的正文」整体删掉，避免残段无主语。
              # 只删紧随其后的相邻正文块（p/ul），遇到下一个标题即停止，
              # 避免把下一个小节的内容一起吞掉。
              text = re.sub(
                  r'<h(\d)[^>]*>\s*(?:TOP\d+\s*[：:]?)?\s*[：:，,、\s]*</h\1>'
                  r'(?:\s*<(?:p|ul|ol|div)[^>]*>.*?</(?:p|ul|ol|div)>)*',
                  '', text, flags=re.S)

              # 其它只剩下标点的空标题单独删除
              text = re.sub(r'<h(\d)[^>]*>\s*[：:，,、\s]*</h\1>', '', text)

              # 重排 TOP 编号（只处理 <hN>TOPx：... 形式）
              counter = {'n': 0}

              def renumber(m):
                  counter['n'] += 1
                  tag, attrs, rest = m.group(1), m.group(2), m.group(3)
                  return '<h%s%s>TOP%d：%s</h%s>' % (tag, attrs, counter['n'], rest, tag)

              text = re.sub(r'<h(\d)([^>]*)>\s*TOP\d+\s*[：:]\s*([^<]+)</h\1>', renumber, text)
              return text


          def clean_empty_paragraphs(text):
              """清理: 段落仅含 stub 残词(无任何实质内容)的整段删除"""
              if not text:
                  return text
              def is_only_stub(content):
                  # 含 <img>/<a>/<table> 等承载内容的标签 — 段落有意义, 不删
                  if re.search(r'<(img|a|table|iframe|video|audio|figure)\b', content):
                      return False
                  # 去 HTML 标签
                  plain = re.sub(r'<[^>]+>', '', content)
                  plain_no_punct = re.sub(r'[\s。，；,;.、：:!?！？]', '', plain)
                  # 只保留中文字符和数字英文
                  meaningful = re.sub(r'[访问拨打致电咨询邮箱联系电话或请欢迎查询登录浏览客服热线 ]', '', plain_no_punct)
                  # 如果除掉 stub 词和标点后,实质内容 < 4 字, 才认为是 stub
                  return len(meaningful) < 4
              def replace_if_stub(m):
                  if is_only_stub(m.group(1)):
                      return ''
                  return m.group(0)
              text = re.sub(r'<p[^>]*>(.*?)</p>', replace_if_stub, text, flags=re.DOTALL)
              # 同时清理段落内部的残句末尾 (实质内容 + 残stub结尾)
              # 例如 "六和创立1993年.联系." → "六和创立1993年."
              text = re.sub(r'([。.！!？?])\s*(联系|拨打|咨询|访问|邮箱|致电|电话|网址)\s*([。.！!？?])', r'\1', text)
              return text



          GUN_LIST = 'SCAR、MP5、AWM、Origin-12、SKS、Deagle'
          GUN_TOTAL = 24          # 客户确认：枪械共 24 种（知识库仅示例 6 款型号）
          ATHLETE_TOTAL = 8       # 客户确认：运动员共 8 名（知识库仅展开 4 位）
          GUN_CATEGORIES = '自动步枪、冲锋枪、狙击枪、霰弹枪、射手步枪、手枪'

          # 常见误植枪械型号（知识库未收录）
          BANNED_GUNS = ['M416', 'AK47', 'AK-47', 'AKM', 'Kar98k', 'Kar98K', 'M762',
                         'UMP45', 'M24', 'S686']

          SENT_LEFT = r'[^。！？!?<>]*'
          SENT_END = r'[。！？!?]'


          def _drop_sentences(text, keywords):
              """删除包含任一关键词的整句；无句号场景退化为只删词。"""
              for kw in keywords:
                  pat = SENT_LEFT + re.escape(kw) + SENT_LEFT + SENT_END
                  text = re.sub(pat, '', text)
                  text = text.replace(kw, '')
              return text


          def enforce_ecc_customer_facts(text):
              """极限战场客户已确认、无需语义推断的确定性兜底。

              只做删除、替换为已确认口径两类动作，绝不新增客户未确认的事实。
              """
              if not text:
                  return text

              # 1. 禁提产品：永劫无间 / 绝地求生 PUBG 整句删除
              text = _drop_sentences(text, ['永劫无间', '绝地求生', 'PlayerUnknown', 'PUBG'])

              # 2. "热点"战术装备：原表错误口径 -> 白皮书口径
              text = text.replace('动能助推系统', '单向护盾装置')
              text = re.sub(r'震荡手雷、单向护盾装置(?:、单向护盾装置)+',
                            '震荡手雷、单向护盾装置', text)

              # 3. 研发方口径：禁止"天下事业部孵化"
              text = re.sub(r'(?:由)?天下事业部(?:孵化|打造|研发)?', '由网易荒野事业部研发', text)

              # 4. 无依据收入数据（主语为永劫无间/出海标杆）
              text = re.sub(r'(?:全球)?累计收入(?:已经|已)?(?:超过|超|逾)\s*30\s*亿元(?:人民币)?', '', text)

              # 5. 地图数量锁死 2 张（只改数字，保留原句动词）
              text = re.sub(r'[1345]\s*张地图', '2张地图', text)

              # 6. 首曝/首测时间锁死
              text = re.sub(r'202[45]年10月9日', '2026年10月9日', text)
              text = re.sub(r'202[45]年10月15日', '2026年10月15日', text)

              # 7. 首测进行时/邀请语气 -> 已发生事实陈述
              text = re.sub(r'(?:目前|现在|当前)?正在(?:进行)?首测(?:中|阶段)?',
                            '于2026年10月15日开启删档限量PC首测', text)
              text = text.replace('可立即参与首测', '').replace('可立即参与', '')
              text = re.sub(r'抢(?:测试|首测)资格', '', text)
              text = re.sub(r'点击(?:立即)?预约|限时预约', '', text)

              # 8. 平台能力边界：不得写成已支持三端 / 全面适配手柄
              text = re.sub(r'(?<!计划)(?<!未来)(?<!将)(?:目前已|已经|已)?(?:全面)?支持三端互通',
                            '首测仅PC参与', text)
              # 手柄类结论整句删除；不替换成任何新事实
              text = re.sub(SENT_LEFT + r'(?:全面适配手柄|三端(?:统一|完整)支持手柄|'
                            r'统一支持手柄)' + SENT_LEFT + SENT_END, '', text)
              text = re.sub(r'(?:全面适配手柄|三端(?:统一|完整)支持手柄|统一支持手柄)', '', text)

              # 9. 枪械：知识库外型号 -> 删除该句（不替换成型号清单，避免再造事实）
              for g in BANNED_GUNS:
                  if g in text:
                      text = re.sub(SENT_LEFT + re.escape(g) + SENT_LEFT + SENT_END, '', text)
              # 枪械总数统一为 24 种（客户口径），只纠正明显的错误总数写法
              text = re.sub(r'(?:仅|只|共|有|包含|提供)?\s*(?:6|六)\s*(?:类|种|款)\s*枪械',
                            str(GUN_TOTAL) + '种枪械', text)
              text = re.sub(r'枪械(?:仅|只有|共计|共)?\s*(?:6|六)\s*(?:类|种|款)',
                            '枪械共 ' + str(GUN_TOTAL) + ' 种', text)
              # 品类与型号并列 -> 只保留品类名（客户要求讲品类时不带型号）
              text = re.sub(
                  r'(自动步枪|冲锋枪|狙击枪|霰弹枪|射手步枪|手枪)\s*[（(]\s*'
                  r'(?:SCAR|MP5|AWM|Origin-12|SKS|Deagle)\s*[）)]',
                  r'\1', text)
              text = re.sub(r'([、，])\s*(?=[、，])', '', text)
              text = text.replace('SCAR和SCAR', 'SCAR')

              # 10. 运动员总数统一为 8 名（客户口径）。
              #     注意：「四人小队」指队伍人数，不受此规则影响。
              text = re.sub(r'(?:仅|只有|共计|共)?\s*(?:4|四)\s*(?:名|位|个)\s*战术运动员',
                            str(ATHLETE_TOTAL) + '名战术运动员', text)
              text = re.sub(r'运动员(?:仅|只有|共计|共)\s*(?:4|四)\s*(?:名|位|个)',
                            '运动员共 ' + str(ATHLETE_TOTAL) + ' 名', text)

              # 11. 玩法数量锁死 5 类
              text = re.sub(r'(?:[2-46-9]|[1-9][0-9]+)\s*(?:类|种)玩法', '5类玩法', text)

              # 12. 竞品白名单外品牌：不得与研发前作做优劣对比
              text = re.sub(r'(?:相比|对比|优于|不如)(?:《)?(?:荒野行动|Blood Strike)(?:》)?',
                            '与研发团队前作相比', text)

              # 13. 同句重复表述收敛：平台边界句已点明 PC 时不再叠加
              text = re.sub(r'首测仅PC参与，(?=[^。！？!?<>]*PC首测)', '', text)

              # 14. 标点收敛：重复标点、空括号、多余空格
              text = re.sub(r'([，。；：、])\1+', r'\1', text)
              text = re.sub(r'[，,、；;：:]\s*。', '。', text)
              text = re.sub(r'。\s*。', '。', text)
              text = re.sub(r'[，,、；;：:]\s*[，,、；;：:]+', '，', text)
              text = re.sub(r'[（(]\s*[）)]', '', text)
              text = re.sub(r'\s{2,}', ' ', text)
              return text

          def clean_one(text):
              if not text:
                  return text
              text = enforce_ecc_customer_facts(text)
              text = remove_prompt_leakage(text)
              text = clean_empty_headings(text)
              text = remove_contact_info(text)
              text = clean_empty_paragraphs(text)
              text = cap_strong_tags(text, max_count=8)
              text = fix_heading_hierarchy(text)
              text = political_compliance(text)
              text = clean_markdown(text)
              text = halfwidth_to_fullwidth(text)
              return text


          def post_customer_fact_cleanup(text):
              """二次兜底：处理标题/摘要等无句号短文本及首次替换后的残余语义。"""
              if not text:
                  return text
              # 短文本（无句号）场景下整句规则不生效，这里做词级清理
              for banned in ['永劫无间', '绝地求生', 'PUBG', 'PlayerUnknown']:
                  text = text.replace(banned, '')
              text = text.replace('动能助推系统', '单向护盾装置')
              text = re.sub(r'天下事业部(?:孵化|打造|研发)?', '网易荒野事业部', text)
              text = re.sub(r'[1345]\s*张地图', '2张地图', text)
              text = re.sub(r'(?:[2-46-9]|[1-9][0-9]+)\s*(?:类|种)玩法', '5类玩法', text)
              text = re.sub(r'([，。；：、])\1+', r'\1', text)
              text = re.sub(r'。\s*。', '。', text)
              return text


          def _meaningful_len(s):
              """统计真正有含义的字符数（中文/英文/数字），忽略标点与空白。"""
              return len(re.findall(r'[\u4e00-\u9fa5A-Za-z0-9]', s or ''))


          def _fallback_title(title, content):
              """标题为空或只剩标点时，从正文第一个标题/首句里取一个。"""
              if title and _meaningful_len(title) >= 2:
                  return title.strip()

              body = content or ''

              # 1. 正文第一个 h2/h3（跳过"信息来源与说明"这类收尾段）
              for m in re.finditer(r'<h[23][^>]*>(.*?)</h[23]>', body, flags=re.S):
                  cand = re.sub(r'<[^>]+>', '', m.group(1)).strip()
                  cand = re.sub(r'^\s*TOP\d+\s*[：:]\s*', '', cand).strip()
                  if '信息来源' in cand or '免责' in cand:
                      continue
                  if _meaningful_len(cand) >= 2:
                      return cand

              # 2. 正文第一个段落的首句（跳过声明句）
              for m in re.finditer(r'<p[^>]*>(.*?)</p>', body, flags=re.S):
                  plain = re.sub(r'<[^>]+>', '', m.group(1)).strip()
                  if '本文信息基于' in plain or '以官方为准' in plain:
                      continue
                  first = re.split(r'[。！？!?]', plain)[0].strip()
                  if _meaningful_len(first) >= 4:
                      return first[:40]

              return ''


          def main(articles=None):
              if not isinstance(articles, list):
                  return {"cleaned_articles": []}

              cleaned = []
              for art in articles:
                  art = _parse_article(art)
                  if not isinstance(art, dict):
                      cleaned.append(art)
                      continue

                  title = str(art.get('title', ''))

                  # === N7b 标记的严重截断稿 [DROP]，整篇丢弃不输出 ===
                  if title.startswith('[DROP]'):
                      continue

                  description = str(art.get('description', ''))
                  content = str(art.get('content', ''))
                  tags = art.get('tags', [])
                  self_review = str(art.get('self_review', ''))

                  # === 轻度截断兜底——自动补未闭合标签 + 补信息来源段 ===
                  truncated_flag = ''
                  if _is_truncated(content):
                      content = _patch_truncated(content)
                      truncated_flag = ' [N8-pre兜底:已补结尾]'

                  new_title = post_customer_fact_cleanup(clean_one(title))
                  new_title = fix_title_xx_placeholder(new_title)
                  new_desc = post_customer_fact_cleanup(clean_one(description))
                  new_content = post_customer_fact_cleanup(clean_one(content))

                  # 标题兜底：清洗链（尤其 fix_title_xx_placeholder 抹掉 XX 后）可能
                  # 把整条标题清空，只剩标点。绝不能把空标题输出给发布方。
                  new_title = _fallback_title(new_title, new_content)
                  if not new_title:
                      # 正文里也找不到可用标题：整篇丢弃，避免输出空白条目
                      continue
                  new_review = clean_self_review(self_review) + truncated_flag

                  # 标签也应用客户确认事实兜底，避免旧玩法名和禁提游戏残留
                  if isinstance(tags, list):
                      new_tags = []
                      for t in tags:
                          cleaned_tag = post_customer_fact_cleanup(clean_self_review(political_compliance(enforce_ecc_customer_facts(str(t))))).strip()
                          if cleaned_tag and not any(b in cleaned_tag for b in ['永劫无间', '绝地求生', 'PUBG']):
                              new_tags.append(cleaned_tag)
                  else:
                      new_tags = tags

                  cleaned.append({
                      'title': new_title,
                      'description': new_desc,
                      'content': new_content,
                      'tags': new_tags,
                      'self_review': new_review,
                  })

              return {"cleaned_articles": cleaned}
