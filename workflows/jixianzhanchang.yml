            19. **内容完整性**：正文必须包含"信息来源与说明"段，FAQ 每题必须有完整答案，末尾标签必须闭合。缺失时按 6.1 补写。
            20. **数据跨段拼接**：不得把描述不同对象的数据合并成一句（如"首日预约50万、浏览量破百万"——前者是预约人数，后者是视频播放量，必须分句）。

