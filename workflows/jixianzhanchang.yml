              # 4a. 解析 N4 输出的文章类型权重（如果有）
              def parse_type_weights(text):
                  """从画像分析报告中提取文章类型权重"""
                  weights = {"对比排名类": 4, "自我介绍类": 3, "性能评测类": 3, "经验分享类": 2}
                  if not text:
                      return weights
                  patterns = [
                      (r'对比排名类[|｜]\s*(\d)', "对比排名类"),
                      (r'自我介绍类[|｜]\s*(\d)', "自我介绍类"),
                      (r'性能评测类[|｜]\s*(\d)', "性能评测类"),
                      (r'经验分享类[|｜]\s*(\d)', "经验分享类"),
                  ]
                  for pattern, key in patterns:
                      m = re.search(pattern, text)
                      if m:
                          w = max(1, min(5, int(m.group(1))))  # clamp 1-5
                          weights[key] = w
                  return weights

              def hamilton_allocate(weights, total):
                  """Hamilton 余数法：按权重分配整数篇数，总和严格等于 total"""
                  w_sum = sum(weights.values())
                  if w_sum == 0:
                      w_sum = 1
                  quotas = {k: v * total / w_sum for k, v in weights.items()}
                  result = {k: int(q) for k, q in quotas.items()}
                  remainder = total - sum(result.values())
                  fractionals = sorted(quotas.keys(), key=lambda k: quotas[k] - int(quotas[k]), reverse=True)
                  for i in range(remainder):
                      result[fractionals[i]] += 1
                  return result

              # 品牌词词包：所有关键词都含主推产品名时，客户买的是"产品是什么"这类
              # 品牌认知需求，不是竞品对比。全部生成自我介绍类，靠 content_focus 换角度。
              brand = (main_brand or "").strip()
              brand_hits = [k for k in keywords if brand and brand in k] if brand else []
              is_brand_only_pack = bool(keywords) and len(brand_hits) == len(keywords)

              # 决定是否使用智能选型
              if article_type and article_type.strip():
                  # 用户指定了 article_type → 全部文章用指定类型
                  type_allocation = {article_type: count}
                  use_smart_type = False
              elif is_brand_only_pack:
                  # 纯品牌词词包：不走权重抽签，整批自我介绍类，避免被默认值带成对比稿
                  type_allocation = {"自我介绍类": count}
                  use_smart_type = True
              else:
                  # 用户没指定 → 从 N4 解析权重 + Hamilton 分配
                  type_weights = parse_type_weights(profile_text)
                  type_allocation = hamilton_allocate(type_weights, count)
                  use_smart_type = True

              # 展开成 per-article 的类型列表并 shuffle
              type_list = []
              for t_name, t_count in type_allocation.items():
                  type_list.extend([t_name] * t_count)
              random.shuffle(type_list)



              comp_names = []
              m1 = re.findall(r'#{2,4}\s*竞品\d+[：:]\s*(.+?)(?:\n|$)', profile_text or "")
              if m1:
                  comp_names = [c.strip().strip('[]【】') for c in m1 if c.strip()]
              if not comp_names:
                  m2 = re.findall(r'品牌全称[：:]\s*(.+?)(?:\n|$)', profile_text or "")
                  comp_names = [c.strip() for c in m2 if c.strip()]
              if not comp_names:
                  m3 = re.findall(r'####?\s*(?:候选)?\d+[：:]\s*(.+?)(?:\n|$)', profile_text or "")
                  comp_names = [c.strip().strip('[]【】') for c in m3 if c.strip()]
              # 客户白名单硬过滤：即使上游画像忽略了白名单指令，也不能让禁区品牌
              # 进入计划。白名单直接来自 N3 注入节点，不依赖 N4 的输出格式。
              whitelist = [w.strip() for w in (whitelist_names or "").split("\n") if w.strip()]
              if whitelist:
                  def in_whitelist(name):
                      bare = re.sub(r'[《》\[\]【】（）()\s]', '', name)
                      for w in whitelist:
                          wb = re.sub(r'[《》\[\]【】（）()\s]', '', w)
                          if bare and wb and (bare in wb or wb in bare):
                              return True
                      return False
                  comp_names = [c for c in comp_names if in_whitelist(c)]
                  # 白名单里的规范名优先，避免"和平精英（腾讯）"这类带后缀的写法
                  normalized = []
                  for c in comp_names:
                      bare = re.sub(r'[《》\[\]【】（）()\s]', '', c)
                      for w in whitelist:
                          wb = re.sub(r'[《》\[\]【】（）()\s]', '', w)
                          if bare and wb and (bare in wb or wb in bare):
                              normalized.append(w)
                              break
                  comp_names = normalized

              # 白名单是硬注入的。模型只写出一部分、或输出全被过滤时，用白名单补齐，
              # 而不是把"竞品缺失警告"这种指令文本写进文章计划。
              if whitelist:
                  if not comp_names:
                      comp_names = list(whitelist)
                  else:
                      # 对比类需要至少 2 家，缺的从白名单补（保持白名单顺序）
                      missing = [w for w in whitelist if w not in comp_names]
                      if len(comp_names) < 2 and missing:
                          comp_names = comp_names + missing[:2 - len(comp_names)]

              seen = set()
              unique_comps = []
              for c in comp_names:
                  if c not in seen and len(c) >= 2:
                      seen.add(c)
                      unique_comps.append(c)
              comp_names = unique_comps

              plans = []
              used_combos = set()
              random.shuffle(keywords)

              shuffled_titles = list(title_templates)
              shuffled_focus = list(content_focus_pool)
              random.shuffle(shuffled_focus)
              shuffled_faq = list(faq_theme_pool)
              random.shuffle(shuffled_faq)
              random.shuffle(shuffled_titles)

              comp_usage = {name: 0 for name in comp_names}

              for i in range(count):
                  kw = keywords[i % len(keywords)]

                  # 当前文章的类型（每篇可能不同）
                  cur_type = type_list[i] if i < len(type_list) else article_type or "对比排名类"

                  # 使用当前文章的类型选择结构池
                  cur_structures = structures_map.get(cur_type, default_structures)
                  combo = None
                  for _ in range(200):
                      s = random.choice(cur_structures)
                      o = random.choice(organizing)
                      h = random.choice(hooks)
                      p = random.choice(perspectives)
                      l = random.choice(heading_levels)
                      if s in faq_friendly_structures:
                          faq_required = True
                      else:
                          faq_required = random.choice([True, False])
                      key = f"{s}|{o}|{h}|{p}|{l}"
                      if key not in used_combos:
                          used_combos.add(key)
                          combo = (s, o, h, p, l, faq_required)
                          break
                  if combo is None:
                      s_def = random.choice(cur_structures)
                      l_def = random.choice(heading_levels)
                      faq_def = s_def in faq_friendly_structures or random.choice([True, False])
                      combo = (s_def, random.choice(organizing),
                               random.choice(hooks), random.choice(perspectives), l_def, faq_def)

                  structure_dna = f"结构：{combo[0]} | 分组：{combo[1]} | 开篇：{combo[2]} | 视角：{combo[3]} | 标题层级：{combo[4]}"
                  tt = shuffled_titles[i % len(shuffled_titles)]

                  # 根据当前文章类型决定竞品数量
                  # 逐篇类型优先：品牌词词包会让全局 content_mode 恒为 brand_focus，
                  # 若让它压过文章类型，对比排名类会退化成零竞品自述稿。
                  if cur_type in ["对比排名类", "性能评测类"]:
                      cur_mode = "comparison"
                  elif cur_type == "经验分享类":
                      cur_mode = "experience"
                  elif cur_type in ["知识科普类", "新闻报道类"]:
                      cur_mode = "knowledge"
                  elif cur_type == "自我介绍类":
                      cur_mode = "brand_focus"
                  elif content_mode == "brand_focus":
                      cur_mode = "brand_focus"
                  else:
                      cur_mode = "knowledge"
                  # 极限战场: 客户白名单仅 2 家，对比类固定用满 2 家，不再随机 2-3
                  if cur_mode in ["brand_focus", "knowledge"]:
                      num_comp = 0
                  elif cur_mode == "experience":
                      num_comp = random.choice([0, 1, 2]) if len(comp_names) >= 2 else len(comp_names)
                  else:
                      num_comp = min(2, len(comp_names))
                  if comp_names and num_comp > 0:
                      # 均匀分配：优先选还没用过/用得少的竞品，避免每篇都选同样几家
                      sorted_by_usage = sorted(comp_names, key=lambda x: (comp_usage.get(x, 0), random.random()))
                      subset = sorted_by_usage[:min(num_comp, len(comp_names))]
                      for c in subset:
                          comp_usage[c] = comp_usage.get(c, 0) + 1
                  else:
                      subset = []

                  plans.append({
                      "keyword": kw,
                      "structure_dna": structure_dna,
                      "title_template": tt,
                      "faq_required": combo[5],
                      "content_focus": shuffled_focus[i % len(shuffled_focus)],
                      "faq_theme": shuffled_faq[i % len(shuffled_faq)],
                      "competitor_names": "、".join(subset) if subset else ("【竞品缺失警告】画像中无可用竞品，你必须从GEO画像分析报告的竞品档案中选取客户白名单内的竞品写入文章，对比排名类文章绝不允许只出现主推品牌" if content_mode == "comparison" else ""),
                      "company_name": company_name,
