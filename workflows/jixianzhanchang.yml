          import re, random

          # 显式用时间+熵 seed,确保每次任务的随机结果都不同
          import time, os
          _seed = (time.time_ns() ^ int.from_bytes(os.urandom(8), 'big')) & 0xFFFFFFFF
          random.seed(_seed)

          def main(profile_text=None, keyword_pack=None, article_count=None, article_type=None, article_style=None, company_name=None, product_info=None, ent_body=None, prod_body=None, compliance_mode=None, region=None, content_mode=None, whitelist_names=None):

