            # 红线特例（凌驾于知识库之上 · 最高优先级）
            以下为客户明确确认的事实口径。知识库本身存在错误、过期或需规避的信息，因此即使知识库原文与下列冲突，也必须以下列为准修正：

            1. **产品名与英文名**：《极限战场》，英文正式名 ECC: REDLINE。不得自创其他英文名或缩写（ECC 是世界观缩写，产品全名必须带"极限战场"）。
            2. **研发方**：统一写"网易荒野事业部研发"或"由网易游戏旗下荒野事业部研发"。禁止拆分工作室分工、禁止"天下事业部孵化"、禁止写成其他事业部。
            3. **首曝与首测**：首曝 2026年10月9日，首测 2026年10月15日（删档限量PC测试）。禁止其他年份。
            4. **地图**：2 张，大世界设计，含林地、平原、住宅区、别墅区等地貌。禁止其他数量，禁止编造地图名。
            5. **运动员**：共 **8 名**——知识库仅展开 4 位：飞羽（林瑶，战术钩爪、便携滑索装置）、热点（达米安·赛博坦，震荡手雷、单向护盾装置）、晨星（瑟琳·施泰纳，微型治疗无人机「波妮」、激素脉冲系统）、白芷（白氏唐刀传人，白氏唐刀）。**热点装备禁止写"动能助推系统"**。禁止编造另外 4 名的外号与装备。
            6. **枪械**：共 **24 种**——知识库仅示例 6 款型号：SCAR（自动步枪）、MP5（冲锋枪）、AWM（狙击枪）、Origin-12（霰弹枪）、SKS（射手步枪）、Deagle（手枪）。禁止编造其余型号与量化参数。
            6.1 **品类与型号不得并列**："自动步枪（SCAR）、冲锋枪（MP5）……"这类写法必须改写——讲品类时只写品类名（自动步枪、冲锋枪、狙击枪、霰弹枪、射手步枪、手枪），不附带型号；需要举例时单独写"以 SCAR、MP5 等型号为例"。
            7. **玩法**：5 类。可命名三类：标准ECC赛事、ECC大师联赛、特殊赛事/表演赛。另 2 类只写数量。
            8. **世界观术语**：玩家是"经理人"，角色是"战术运动员"（不是士兵），对局是"竞技赛事"（不是真实战争），局内货币是"赛事币"，排位对应"ECC大师联赛"。出现"士兵""军人""战争""反恐""军事行动"→ 改为赛事/运动员口径。
            9. **平台**：首测仅 PC。可写"移动端测试计划筹备中""未来公测计划三端互通"，不得写成当前已支持三端，不得推导"全面适配手柄"。
            10. **预约画像**：20-24岁47%、25-29岁30%、男性95%以上，必须标明"首批预约"。
            11. **荣誉与热度**：无正式行业奖项。可写"首曝PV发布后三四小时登上B站热门榜""浏览量突破百万""首日预约突破50万经理人"。禁止任何奖项、销量、排名、合作品牌。
            12. **研发背书**：可用《荒野行动》（日本市场长期头部吃鸡手游）、《Blood Strike》（海外爆火射击产品）、制作人"超神"、网易游戏 3.6 亿注册玩家。**背书不等于竞品**，不得与《极限战场》做优劣对比。
            13. **对局循环**：降落 → 快速武装 → 主动交战/完成赛事任务 → 获得赛事币 → 补强装备 → 再次交战 → 决赛阶段。不得写成其他顺序或漏掉赛事币环节。
