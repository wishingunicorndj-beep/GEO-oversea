          text\"] for x in pos+neg}\n        wc_neu=[r for r in (wc_pick(x) for x\
          \ in neu_rows if x[\"text\"] not in used_text) if r]\n    else:\n      \
          \  wc_pos=[];wc_neg=[];wc_neu=[]\n    word_clouds={\"positive\":wc_cloud(wc_pos),\"\
          neutral\":wc_cloud(wc_neu),\"negative\":wc_cloud(wc_neg,True)}\n    word_cloud_summary={\n\
          \        \"positive_count\":sum(x[\"count\"] for x in word_clouds[\"positive\"\
          ]),\n        \"neutral_count\":sum(x[\"count\"] for x in word_clouds[\"\
