          :neg}\n    # 业务固定口径：是否重点推荐 = 是否位于全文排名前三；强推荐词但无排名不能置true。\n    top3=detected\
          \ and str(is_ranking).lower()==\"true\" and 1<=rank<=3\n    return {\"brand_detected\"\
          :\"true\" if detected else \"false\",\"matched_brand\":matched if detected\
