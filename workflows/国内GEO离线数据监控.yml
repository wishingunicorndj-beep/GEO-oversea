    - data:
        code: "import json\nfrom typing import Any\n\n\ndef as_object(value: Any)\
          \ -> dict:\n    if isinstance(value, dict):\n        return value\n    if\
          \ isinstance(value, str):\n        try:\n            parsed = json.loads(value)\n\
          \        except (TypeError, ValueError):\n            return {}\n      \
          \  return parsed if isinstance(parsed, dict) else {}\n    return {}\n\n\n\
          def as_list(value: Any) -> list:\n    if isinstance(value, list):\n    \
          \    return value\n    if isinstance(value, str):\n        try:\n      \
          \      parsed = json.loads(value)\n        except (TypeError, ValueError):\n\
          \            return []\n        return parsed if isinstance(parsed, list)\
          \ else []\n    return []\n\n\ndef text(value: Any, default: str = \"\")\
          \ -> str:\n    if value is None or value == \"\":\n        return default\n\
          \    if isinstance(value, bool):\n        return \"true\" if value else\
          \ \"false\"\n    return str(value)\n\n\ndef main(http_body: Any) -> dict:\n\
          \    raw = as_object(http_body)\n    if not raw:\n        raise ValueError(\"\
          Dify 工作流未返回任何内容，请检查 HTTP 节点地址与网络\")\n    if raw.get(\"code\") and not raw.get(\"\
          data\"):\n        raise ValueError(text(raw.get(\"message\") or raw.get(\"\
          msg\"), \"Dify 工作流调用失败\"))\n\n    data = raw.get(\"data\")\n    data = as_object(data)\
          \ if not isinstance(data, dict) else data\n\n    # 子工作流失败必须显式报错，不能静默退化为默认值（否则会被误判为品牌未提及）。\n\
          \    status = text(data.get(\"status\") or raw.get(\"status\") or \"\").lower()\n\
          \    if status and status not in (\"succeeded\", \"success\", \"completed\"\
          ):\n        err = text(data.get(\"error\") or raw.get(\"error\") or data.get(\"\
          message\") or raw.get(\"message\"),\n                   \"子工作流执行失败\")\n\
          \        raise ValueError(f\"Dify 子工作流状态 {status}：{err}\")\n\n    outputs\
          \ = data.get(\"outputs\")\n    if outputs is None:\n        outputs = raw.get(\"\
          outputs\")\n    if outputs is None and status in (\"succeeded\", \"success\"\
          , \"completed\"):\n        raise ValueError(\"Dify 子工作流已成功但未返回 outputs 字段\"\
          )\n    if isinstance(outputs, str):\n        outputs = as_object(outputs)\n\
          \    if not isinstance(outputs, dict) or not outputs:\n        raise ValueError(\"\
          Dify 工作流未返回可解析的 outputs 对象\")\n    # 业务字段缺失同样视为失败，避免把空结果当成“品牌未提及”。\n   \
          \ if \"brand_detected\" not in outputs:\n        raise ValueError(\"Dify\
          \ 子工作流 outputs 缺少 brand_detected 字段\")\n\n    tags = outputs.get(\"key_tags\"\
          , outputs.get(\"word_cloud_tags\", []))\n    # 旁路走外部子工作流，不在本文件内产出正面率；字段保留为空值，避免下游缺\
          \ key。\n    return {\"branch_result\": {\n        \"brand_detected\": text(outputs.get(\"\
          brand_detected\"), \"false\"),\n        \"rank_pos\": text(outputs.get(\"\
          rank_pos\")),\n        \"is_top_recommend\": text(outputs.get(\"is_top_recommend\"\
          ), \"false\"),\n        \"sentiment_score\": text(outputs.get(\"sentiment_score\"\
          ), \"0.000\"),\n        \"sentiment_label\": text(outputs.get(\"sentiment_label\"\
          ), \"neutral\"),\n        \"sentiment_reasoning\": text(outputs.get(\"sentiment_reasoning\"\
          )),\n        \"brand_sentiment_analysis\": as_object(outputs.get(\"brand_sentiment_analysis\"\
          )),\n        \"is_ranking\": text(outputs.get(\"is_ranking\"), \"false\"\
          ),\n        \"competitor_mentions\": as_list(outputs.get(\"competitor_mentions\"\
          )),\n        \"competitor_pos\": text(outputs.get(\"competitor_pos\")),\n\
          \        \"competitor_count\": text(outputs.get(\"competitor_count\"), \"\
          0\"),\n        \"summary\": text(outputs.get(\"summary\")),\n        \"\
          key_tags\": as_list(tags),\n        \"matched_brand\": text(outputs.get(\"\
          matched_brand\")),\n        \"sentiment_classic_words\": as_list(outputs.get(\"\
          sentiment_classic_words\")),\n        \"sentiment_word_clouds\": as_object(outputs.get(\"\
