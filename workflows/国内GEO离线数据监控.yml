          \      \"销量\",\"热度\",\"颜值\",\"配置\",\"性能\",\"档次\",\"频率\",\"占比\")\n    def\
          \ wc_occ(term,unit,negative):\n        \"\"\"返回有效出现位置；负向词若紧接正向属性词，则该次出现视为误切并跳过。\"\
          \"\"\n        out=[];cur=0\n        while True:\n            i=unit.find(term,cur)\n\
          \            if i<0:break\n            tail_hit=any(unit[i+len(term):].startswith(a)\
          \ for a in WC_POS_TAIL)\n            if not (negative and (tail_hit or negated_at(unit,i))):\n\
          \                out.append(i)\n            cur=i+len(term)\n        return\
          \ out\n    def wc_pick(row,negative=False):\n        unit=str(row.get(\"\
          text\") or \"\")\n        if not wc_owned(unit, str(row.get(\"sid\") or\
          \ \"\")):return None\n        kws=[]\n        for w in (row.get(\"keywords\"\
          ) or []):\n            t=str(w or \"\").strip()\n            if not t or\
          \ len(t)>WC_MAX or t not in unit or t in kws:continue\n            if not\
          \ wc_occ(t,unit,negative):continue   # 该词全部出现均为误切，丢弃\n            kws.append(t)\n\
          \            if len(kws)>=2:break   # 每句三类合计最多2个\n        if not kws:return\
          \ None\n        return {\"text\":unit,\"keywords\":kws,\"start\":text_start.get(unit,999999999)}\n\
          \n    def wc_cloud(rows,negative=False):\n        terms={}\n        for\
