          , \"电子产品贸易\", \"电子产品\", \"商贸\", \"贸易\",\n    \"科技发展\", \"驾校\", \"设计\", \"\
          科技\", \"设备\"\n]\nREGION_PREFIXES = [\n    \"北京市\", \"上海市\", \"天津市\", \"\
          重庆市\", \"内蒙古自治区\", \"广西壮族自治区\", \"宁夏回族自治区\",\n    \"新疆维吾尔自治区\", \"西藏自治区\"\
          , \"北京\", \"上海\", \"天津\", \"重庆\", \"广东\", \"浙江\", \"江苏\",\n    \"山东\", \"\
          河北\", \"河南\", \"湖北\", \"湖南\", \"江西\", \"福建\", \"四川\", \"云南\", \"贵州\", \"\
