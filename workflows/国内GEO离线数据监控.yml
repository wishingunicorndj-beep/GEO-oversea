          :\"true\" if top3 else \"false\",\"sentiment_score\":f\"{score:.3f}\",\"\
          sentiment_label\":label,\n            \"sentiment_reasoning\":reason,\"\
          sentiment_classic_words\":classic,\"brand_sentiment_analysis\":detail,\n\
