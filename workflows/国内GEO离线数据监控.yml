          , \"广西\", \"宁夏\", \"新疆\",\n    \"西藏\", \"内蒙古\", \"深圳\", \"广州\", \"杭州\",\
          \ \"南京\", \"成都\", \"武汉\", \"南昌\", \"呼和浩特\", \"漯河\"\n]\nWEAK_ALIASES = {\"\
          科技\", \"智能\", \"环保\", \"设备\", \"食品\", \"设计\", \"医院\", \"驾校\", \"服务\", \"\
          公司\", \"集团\"}\nGENERIC_PARENTHETICAL = {\"中国\", \"中国大陆\", \"大陆\", \"国内\"\
          , \"全球\", \"国际\", \"总部\", \"官方\"}\n# 明确的母品牌—产品品牌关系用于客户边界硬校验。这里只放所有权稳定、歧义低的家族名；\n\
          # 其余长尾关系仍由全局实体LLM结合query判断，避免把普通品类词误当客户别名。\nBRAND_FAMILIES = {\n    \"苹果\"\
          : [\"Apple\", \"iPhone\", \"iPad\", \"Mac\", \"MacBook\", \"AirPods\", \"\
          Apple Watch\"]\n}\n\ndef visible_text(text: Any) -> str:\n    \"\"\"只移除不可见格式与URL；不改写可见文字、标点或Emoji。\"\
          \"\"\n    value=html.unescape(str(text or \"\"))\n    value=re.sub(r\"!\\\
          [([^\\]]*)\\]\\([^)]*\\)\",r\"\\1\",value)\n    value=re.sub(r\"\\[([^\\\
          ]]+)\\]\\([^)]*\\)\",r\"\\1\",value)\n    value=re.sub(r\"https?://[^\\\
          s)]+\",\"\",value)\n    value=re.sub(r\"<[^>]+>\",\"\",value)\n    value=re.sub(r\"\
          (?m)^\\s{0,3}#{1,6}\\s*\",\"\",value)\n    value=re.sub(r\"(?m)^\\s*>\\\
          s?\",\"\",value)\n    value=value.replace(\"```\",\"\").replace(\"**\",\"\
          \").replace(\"__\",\"\").replace(\"`\",\"\")\n    value=re.sub(r\"\\\\([.#*+\\\
          -])\",r\"\\1\",value)\n    return value\n\ndef catalog_text(text: Any) ->\
          \ str:\n    \"\"\"证据目录移除图片、URL与强调符，但保留Markdown标题/编号结构供切分。\"\"\"\n    value=html.unescape(str(text\
          \ or \"\"))\n    value=re.sub(r\"!\\[[^\\]]*\\]\\([^)]*\\)\",\"\",value)\n\
          \    value=re.sub(r\"\\[([^\\]]+)\\]\\([^)]*\\)\",r\"\\1\",value)\n    value=re.sub(r\"\
          https?://[^\\s)]+\",\"\",value)\n    value=re.sub(r\"<[^>]+>\",\"\",value)\n\
          \    # answer_raw 可能把整张 Markdown 表格压成一行。保留加粗单元格边界，\n    # 供 exact_units\
          \ 将“**需求方向** | 推荐对象 | 说明”逐行恢复；写入目录前再移除标记。\n    value=re.sub(r\"\\*\\*\\\
          s*([^*\\n]{1,160}?)\\s*\\*\\*\",lambda m:\"\\ue000\"+m.group(1)+\"\\ue001\"\
          ,value)\n    value=value.replace(\"```\",\"\").replace(\"**\",\"\").replace(\"\
          __\",\"\").replace(\"`\",\"\")\n    value=re.sub(r\"\\\\([.#*+\\-])\",r\"\
          \\1\",value)\n    return value\n\ndef char_count(text: Any) -> int:\n  \
          \  # 统一按用户可见正文计数：空白、URL和Markdown控制符不计；可见标点、数字、Emoji均计入。\n    return len(re.sub(r\"\
          \\s+\", \"\", visible_text(text)))\n\ndef match_text(text: Any) -> str:\n\
          \    value = visible_text(text).replace(\"　\", \" \")\n    return re.sub(r\"\
          \\s+\", \" \", value).strip()\n\ndef split_declared(value: Any) -> List[str]:\n\
          \    if isinstance(value, list):\n        raw = value\n    else:\n     \
          \   text = str(value or \"\").strip()\n        if not text:\n          \
          \  return []\n        # 不按普通空格和斜杠拆分，保护English multi-word brand与合法名称。\n \
          \       raw = re.split(r\"\\|\\||[、，,；;\\n]+\", text)\n    out = []\n  \
          \  for item in raw:\n        name = re.sub(r\"\\s+\", \" \", str(item or\
          \ \"\")).strip(\" \\t|,，;；\")\n        if name and name not in out:\n  \
          \          out.append(name)\n    return out\n\ndef strip_once(text: str,\
          \ suffixes: List[str]) -> str:\n    for suffix in sorted(suffixes, key=len,\
          \ reverse=True):\n        if text.endswith(suffix) and len(text) >= len(suffix)\
          \ + 2:\n            return text[:-len(suffix)].strip()\n    return text\n\
          \ndef strip_region(text: str) -> str:\n    for prefix in sorted(REGION_PREFIXES,\
