          negative\"]),\n    }\n    word_cloud_summary[\"total_count\"]=(word_cloud_summary[\"\
          positive_count\"]\n        +word_cloud_summary[\"neutral_count\"]+word_cloud_summary[\"\
          negative_count\"])\n\n    label=\"positive\" if score>=0.1 else (\"negative\"\
          \ if score<=-0.1 else \"neutral\")\n    detail={\"char_count\":{\"total\"\
          :total,\"positive\":sum(x[\"char_count\"] for x in pos),\"negative\":sum(x[\"\
