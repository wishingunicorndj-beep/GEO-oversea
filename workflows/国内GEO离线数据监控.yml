          \   return text\n\ndef valid_alias(text: str) -> bool:\n    core = re.sub(r\"\
          [^0-9A-Za-z\\u4e00-\\u9fff]+\", \"\", text)\n    return len(core) >= 2 and\
          \ text not in WEAK_ALIASES\n\ndef build_aliases(brand_name: Any, company_name:\
          \ Any) -> List[Dict[str, Any]]:\n    declared_brand = split_declared(brand_name)\n\
          \    declared_company = split_declared(company_name)\n    company_fallback\
          \ = not declared_brand and bool(declared_company)\n    result = []\n   \
          \ seen = {}\n    def add(alias, alias_type, confidence, source):\n     \
          \   alias = re.sub(r\"\\s+\", \" \", str(alias or \"\")).strip()\n     \
          \   key = re.sub(r\"[^0-9A-Za-z\\u4e00-\\u9fff]+\", \"\", alias).casefold()\n\
          \        if not valid_alias(alias) or not key:\n            return\n   \
          \     old = seen.get(key)\n        if old is not None:\n            # 同一别名可能被多条来源命中。保留置信度最高的一条，避免派生别名先登记后\n\
          \            # 把用户显式填写的 declared 判成重复丢弃（“重庆天籁”派生出的 0.78 “天籁”\n         \
          \   # 会挤掉用户单独填写的 1.00 “天籁”）。置信度相同时保留先登记的来源。\n            if float(confidence)\
          \ > float(old.get(\"confidence\", 0) or 0):\n                old[\"alias\"\
          ] = alias\n                old[\"type\"] = alias_type\n                old[\"\
          confidence\"] = confidence\n                old[\"source\"] = source\n \
          \           return\n        seen[key] = {\"alias\": alias, \"type\": alias_type,\
          \ \"confidence\": confidence, \"source\": source}\n        result.append(seen[key])\n\
          \    for name in declared_brand + declared_company:\n        add(name, \"\
          declared\", 1.0, name)\n        for inner in re.findall(r\"[（(]([^）)]{2,30})[）)]\"\
          ,name):\n            inner=inner.strip()\n            if inner not in REGION_PREFIXES\
          \ and inner not in GENERIC_PARENTHETICAL:add(inner,\"parenthetical_alias\"\
          ,0.90,name)\n        bracketless = re.sub(r\"[（(][^）)]*[）)]\", \"\", name).strip()\n\
          \        add(bracketless, \"bracketless\", 0.95, name)\n        legal_core\
          \ = bracketless\n        for _ in range(2):\n            nxt = strip_once(legal_core,\
          \ LEGAL_SUFFIXES)\n            if nxt == legal_core: break\n           \
          \ legal_core = nxt\n        add(legal_core, \"legal_core\", 0.92, name)\n\
          \        industry_core = legal_core\n        for _ in range(2):\n      \
          \      nxt = strip_once(industry_core, INDUSTRY_SUFFIXES)\n            if\
          \ nxt == industry_core: break\n            industry_core = nxt\n       \
          \ # brand_name为空时，公司名是唯一目标来源。剥除法律/行业后缀得到的独特品牌核心\n        # 应进入硬匹配层，例如“香奈儿(中国)贸易有限公司”→“香奈儿”。\n\
          \        add(industry_core, \"industry_core\", 0.93 if company_fallback\
          \ else 0.82, name)\n        no_region = strip_region(industry_core)\n  \
          \      # 公司名回退时，去掉注册地后的独特核心同样是目标硬别名；\n        # brand_name非空时仍保持低置信，仅作辅助理解，避免改变显式品牌粒度。\n\
          \        add(no_region, \"distinctive_core\", 0.93 if company_fallback else\
          \ 0.78, name)\n    declared_scope=\" \".join(declared_brand+declared_company+[str(x.get(\"\
          alias\") or \"\") for x in result])\n    declared_norm=re.sub(r\"[^0-9A-Za-z\\\
          u4e00-\\u9fff]+\",\"\",declared_scope).casefold()\n    for owner,family\
          \ in BRAND_FAMILIES.items():\n        owner_norm=re.sub(r\"[^0-9A-Za-z\\\
          u4e00-\\u9fff]+\",\"\",owner).casefold()\n        if owner_norm and owner_norm\
          \ in declared_norm:\n            add(owner,\"brand_family_owner\",0.98,owner)\n\
          \            for member in family:add(member,\"brand_family_member\",0.96,owner)\n\
          \    return result\n\ndef parse_hints(value: Any) -> List[Dict[str, Any]]:\n\
          \    text = str(value or \"\").strip()\n    if not text:\n        return\
          \ []\n    try: data = json.loads(text)\n    except Exception: data = None\n\
          \    if isinstance(data, dict): data = data.get(\"competitors\", data.get(\"\
          items\", [data]))\n    out = []\n    if isinstance(data, list):\n      \
          \  for item in data:\n            if isinstance(item, dict):\n         \
          \       canonical = str(item.get(\"brand\") or item.get(\"name\") or \"\"\
          ).strip()\n                aliases = item.get(\"aliases\", [])\n       \
          \         aliases = split_declared(aliases) if isinstance(aliases, str)\
          \ else [str(x).strip() for x in aliases if str(x).strip()]\n           \
          \ else:\n                canonical = str(item or \"\").strip(); aliases\
          \ = []\n            if canonical: out.append({\"canonical\": canonical,\
          \ \"aliases\": list(dict.fromkeys([canonical] + aliases))})\n    else:\n\
          \        for name in split_declared(text): out.append({\"canonical\": name,\
          \ \"aliases\": [name]})\n    return out\n\nQUERY_NOISE = (\n    \"推荐\",\
          \ \"排行榜\", \"排名\", \"哪个好\", \"哪家\", \"怎么样\", \"怎么选\", \"价格\", \"多少钱\",\n\
          \    \"官网\", \"品牌\", \"公司\", \"厂家\", \"服务商\", \"男士\", \"女士\", \"香水\", \"\
          产品\", \"测评\",\n    \"评测\", \"好用吗\", \"值得买吗\", \"选择\", \"分级\", \"推荐清单\",\
          \ \"哪款\"\n)\n\ndef derive_query_target_aliases(query: Any, brand_aliases:\
          \ List[Dict[str, Any]]) -> List[Dict[str, Any]]:\n    \"\"\"当brand_name是公司法定全称、query却是具体产品/品牌词时，补齐查询语义目标。\n\
          \    只在query中已经出现声明品牌核心且清除通用查询词后仍有明确剩余词时生成，\n    不凭空从正文或模型输出创造别名。\"\"\"\n\
          \    q = re.sub(r\"\\s+\", \" \", str(query or \"\")).strip()\n    if not\
          \ q:\n        return []\n    result=[];seen={re.sub(r\"[^0-9A-Za-z\\u4e00-\\\
          u9fff]+\", \"\", str(x.get(\"alias\") or \"\")).casefold() for x in brand_aliases}\n\
          \    compact_q = re.sub(r\"[^0-9A-Za-z\\u4e00-\\u9fff]+\", \"\", q).casefold()\n\
          \    for row in brand_aliases:\n        alias = str(row.get(\"alias\") or\
          \ \"\").strip(); an = re.sub(r\"[^0-9A-Za-z\\u4e00-\\u9fff]+\", \"\", alias).casefold()\n\
          \        if len(an) < 2 or an not in compact_q:\n            continue\n\
          \        candidate = q\n        for noise in sorted(QUERY_NOISE, key=len,\
          \ reverse=True):\n            candidate = candidate.replace(noise, \"\"\
          )\n        candidate = re.sub(r\"[\\s、，,：:？！!?（）()]+\", \"\", candidate)\n\
          \        cn = re.sub(r\"[^0-9A-Za-z\\u4e00-\\u9fff]+\", \"\", candidate).casefold()\n\
          \        if len(cn) <= len(an) or an not in cn:\n            continue\n\
          \        if len(cn) < len(an) + 2:\n            continue\n        if cn\
          \ not in seen:\n            result.append({\"alias\": candidate, \"type\"\
          : \"query_product_alias\", \"confidence\": 0.98, \"source\": q})\n     \
          \       seen.add(cn)\n    return result\n\ndef exact_units(line: str) ->\
          \ List[tuple]:\n    \"\"\"按标点、Markdown标题/编号项和转折切成互不重叠的最小证据单元。\n    搜索结果与模型回答经常被压成一行，不能只按换行切分；标题/编号边界必须\n\
          \    先切开，否则一条“缺点”会吞掉后续多个产品模块。\"\"\"\n    boundaries = {0, len(line)}\n \
          \   for m in re.finditer(r\"[。！？!?；;]\", line):\n        boundaries.add(m.end())\n\
          \    # 支持“### 3\\\\. 产品”“## 模块”以及未转义的Markdown标题。\n    for m in re.finditer(r\"\
          (?<!\\S)#{1,6}\\s+\", line):\n        if m.start()>0:boundaries.add(m.start())\n\
          \    # 单行压缩表格中，每个加粗的首列单元格都是新数据行。只在加粗内容后紧跟\n    # 管道符时切分，避免普通正文加粗或列表项被误拆成表格。\n\
          \    for m in re.finditer(r\"\\ue000[^\\ue001\\n]{1,160}\\ue001\\s*\\|\"\
          ,line):\n        if m.start()>0:boundaries.add(m.start())\n    # 产品卡片常用“香调/气质/适合/缺点/✅/⚠️”作为无标点字段边界，\n\
          \    # 这些边界必须拆开，避免把中性参数和后面的正负评价合并。\n    # 字段标签即使与前一短语粘连（如“插件缺点：默认推送”）也必须切开；\n\
          \    # 否定语境“并不适合”不作为字段标签处理。\n    for m in re.finditer(r\"(?:✅|⚠️|❌|(?:优点|缺点|香调|气质|优势|劣势)[：:]|(?<!不)适合[：:])\"\
