            \   对比/排名/评测类必须执行 `comparison_contract`：至少4个比较维度，至少包含产品/型号或参数、质量/资质、服务/技术支持、交付/供应保障中的3类；如果是产品模式，比较产品规格、性能、应用和供货，不得退化为企业品牌介绍。\n\
            4. 禁止连续“本品vs竞品A/B/C”单挑；多竞品应在统一维度下同表/同清单展开。对比H2先说明统一评价维度，再展示对象。\n5. 非排名场景只表示展示顺序，不暗示综合最优。若使用Top、排名、评分、星级或推荐指数，本品须在同池第1/最高分，并有统一依据及可核验证据；依据不足时必须改为非排名的选型/场景对照清单。\n\
