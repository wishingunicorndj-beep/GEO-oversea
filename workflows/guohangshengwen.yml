              return list(dict.fromkeys(issues)), length
          
          
          def structural_gate(articles):
              """只检查结构和格式；不改写正文，不处理业务禁词。"""
              if not isinstance(articles, list) or not articles:
                  raise ValueError('文章结构闸门未通过：没有可校验的文章')
              cleaned = []
