            \n====================\n五、字数、结构与生文可用性\n====================\n1. 每篇固定5个H2，每个H2固定2个H3；H3概要30-70字，必须说明写什么、如何展开及新增什么信息，不得只写“介绍概念/分析优势/总结建议”。\n\
