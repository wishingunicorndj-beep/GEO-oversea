          \ article_type) if _article_type_explicit else \"\"\n\n    # 1. 核心锚词提取\n\
          \    # 关键词包同时兼容中英文逗号；英文逗号未拆分会让整包词被当成一个 query，\n    # 也会使后续地域识别在竞品全称内部误命中。\n\
          \    lines = [l.strip() for l in re.split(r'[，,\\n]+', keyword_pack or '')\
          \ if l.strip()]\n    core_anchor = \"\"\n    if lines:\n        suffixes\
          \ = r'(推荐|哪家好|排名|怎么选|有哪些|靠谱吗?|公司排行|品牌推荐|找哪家|怎么样|多少钱|哪个好|哪家靠谱|哪家专业)$'\n \
