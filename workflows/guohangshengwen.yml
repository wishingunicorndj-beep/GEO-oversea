    - data:
        code: "def main(articles, compliance_mode: str = \"standard\", ent_body: str\
          \ = \"\", prod_body: str = \"\", custom_writing_distribution: str = \"\"\
          , custom_writing_preference_raw: str = \"\", company_name: str = \"\", verified_competitor_text:\
          \ str = \"\"):\n    \"\"\"V22 upstream-preserving gate.\n\n    N7 owns article\
          \ writing and compliance rewriting. N8-pre must not rewrite\n    title,\
          \ description, content, tags, self_review, FAQ, prices, percentages,\n \
          \   wording, HTML, or existing metadata. It only skips invalid non-object\n\
          \    entries and fills two genuinely missing routing fields.\n    \"\"\"\
          \n    if not isinstance(articles, list):\n        return {\"cleaned_articles\"\
          : []}\n\n    cleaned_articles = []\n    for article in articles:\n     \
          \   if not isinstance(article, dict):\n            continue\n\n        #\
          \ Copy the complete object so current and future upstream metadata is\n\
