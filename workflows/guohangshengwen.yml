        code: |
          def _as_list(value):
              return value if isinstance(value, list) else []

          def _bind_articles(articles, plans, branch_name):
              articles = _as_list(articles)
              plans = _as_list(plans)
              if len(articles) != len(plans):
                  raise ValueError('{}线路文章数量异常：计划{}篇，实际{}篇'.format(branch_name, len(plans), len(articles)))
              bound = []
              for pos, (article, plan) in enumerate(zip(articles, plans), 1):
                  if not isinstance(article, dict):
                      raise ValueError('{}线路第{}篇输出不是文章对象'.format(branch_name, pos))
                  item = dict(article)
                  title = str(item.get('title', '') or '').strip()
                  content = str(item.get('content', '') or '').strip()
                  if not title or not content:
                      raise ValueError('{}线路第{}篇文章为空或输出协议解析失败'.format(branch_name, pos))
                  plan = plan if isinstance(plan, dict) else {}
                  item['_article_index'] = plan.get('article_index', plan.get('文章序号', pos))
                  item['_article_total'] = plan.get('article_total', len(plans))
                  item['_keyword'] = plan.get('keyword', plan.get('关键词', ''))
                  item['_keyword_mode'] = plan.get('keyword_mode', '')
                  bound.append(item)
              return bound

          def main(category_articles, brand_articles, merged_plans):
              plans = _as_list(merged_plans)
              category_plans = [p for p in plans if isinstance(p, dict) and p.get('keyword_mode') != 'brand']
              brand_plans = [p for p in plans if isinstance(p, dict) and p.get('keyword_mode') == 'brand']
              combined = _bind_articles(category_articles, category_plans, '品类词')
              combined.extend(_bind_articles(brand_articles, brand_plans, '品牌词'))
              combined.sort(key=lambda x: int(x.get('_article_index', 0) or 0))
              if len(combined) != len(plans):
                  raise ValueError('最终文章数量异常：计划{}篇，实际{}篇'.format(len(plans), len(combined)))
              return {'all_articles': combined, 'compliance_mode': 'standard'}
