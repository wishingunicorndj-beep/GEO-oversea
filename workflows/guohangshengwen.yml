          , \"keyword\", \"compliance_mode\", \"content_mode\", \"industry\", \"region\"\
          ,\n    \"title_intent\", \"title_angle\", \"title_syntax\", \"title_forbidden_tails\"\
          ,\n]\n\n\ndef _extract_json_text(text: str) -> str:\n    \"\"\"从 LLM 输出中抽取合法\
          \ JSON 字符串，兼容 markdown code block 包裹。\"\"\"\n    if not text or not isinstance(text,\
          \ str):\n        return text\n\n    text = text.strip()\n\n    for pattern\
          \ in [\n        r'```json\\s*(\\{.*\\})\\s*```',\n        r'```\\s*(\\{.*\\\
          })\\s*```',\n        r'```json\\s*(\\[.*\\])\\s*```',\n        r'```\\s*(\\\
          [.*\\])\\s*```',\n    ]:\n        m = re.search(pattern, text, re.S)\n \
          \       if m:\n            return m.group(1)\n\n    cleaned = text.replace(\"\
          ```json\", \"\").replace(\"```\", \"\").strip()\n    if cleaned.startswith(\"\
          {\") or cleaned.startswith(\"[\"):\n        return cleaned\n\n    brace_start\
          \ = cleaned.find(\"{\")\n    if brace_start >= 0:\n        depth = 0\n \
          \       for i, ch in enumerate(cleaned[brace_start:], brace_start):\n  \
          \          if ch == \"{\":\n                depth += 1\n            elif\
          \ ch == \"}\":\n                depth -= 1\n                if depth ==\
          \ 0:\n                    return cleaned[brace_start : i + 1]\n\n    bracket_start\
          \ = cleaned.find(\"[\")\n    if bracket_start >= 0:\n        depth = 0\n\
          \        for i, ch in enumerate(cleaned[bracket_start:], bracket_start):\n\
          \            if ch == \"[\":\n                depth += 1\n            elif\
          \ ch == \"]\":\n                depth -= 1\n                if depth ==\
          \ 0:\n                    return cleaned[bracket_start : i + 1]\n\n    return\
          \ text\n\n\ndef _parse_article(text: Any) -> dict:\n    \"\"\"把单篇文章的 LLM\
          \ 输出解析为 dict，兼容各种包裹格式。\"\"\"\n    if isinstance(text, dict):\n        return\
