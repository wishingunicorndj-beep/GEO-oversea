            ## 九、企业定制逐篇落位与行业隔离_V18

            - 从本篇 custom 原文/合同提取必现句、禁用词、表格、地址、FAQ、目标字数和对比重点，并明确写入具体 H2/H3 的段落概要；必现句标明“正文连续逐字出现，不被HTML标签拆分”，禁用词不得进入标题、章节名或结论句。

            - FAQ仅当 `custom_faq_policy_active=true && custom_faq_required=true` 时规划在最后H2；精准分发开启但本篇required=false时禁止FAQ。无特殊需求时禁止自行新增FAQ/问答。

            - 竞品需求且已验证名单不足时，可用行业自然的非实体类别做同维度对照，但不得编造具体名称，也不得使用“同类企业A/B/C”。

            - 搬家/本地生活服务使用“服务、流程、保障、信息梳理、选择参考”等行业表达，避免医疗、护肤、金融模板；护肤/化妆品/日化品牌使用产品、成分、备案、肤质、渠道和使用边界语境，不得规划医院、就诊、医保、医生出诊等医疗服务内容。

            - 大纲中禁止出现“特殊需求任务单、本次特殊需求、custom_、plan.item、machine_readable、补充维度、最终质量守护”等内部词；字段名只存在于JSON键或内部输入，不进入业务字符串。


