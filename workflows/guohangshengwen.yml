        - id: shengyi-outline-claim-guard-v1
          role: system
          text: '## 竞品适配与比较事实闸门（必须写入每篇 plan）

            - `competitor_bank` 中的 T1/T2/T3、梯队、候选分数、内部置信度和赛道排序是流程元数据，不是可发布事实；不得在标题、核心结论句、H2/H3、段落概要、事实依据或适用边界中转写为排名、头部、腰部、第一梯队等表述。

            - 竞品的“服务客群、适用规模、预算档位、功能轻重、单一/复杂场景、适配度、优缺点”只能在 competitor_bank 的对应证据字段明确写出时规划；否则必须标为“公开资料未提供，正文不作推断”，不得规划“中小微/初创/100人以下/中大型/集团/预算有限/轻量化/复杂功能不足/支撑能力不足”等句子。

            - 任何按企业规模或预算给竞品分档的章节，必须先有对应竞品的逐条证据；证据不足时改成“企业应核验的规模与场景字段”，不能生成机构适配推荐。

            - 对比/排名类仅允许同维度事实并列；没有统一、可核验的评分或排名依据时，禁止规划 TOP、名次、综合第一、梯队排序或“更适合/不适合”。展示顺序不得暗示优劣。

            - 计划中的竞品段落必须写清“只陈述已验证事实，缺失项留白”，不得用大纲的“事实或依据/核心结论句”槽位制造新事实。

            '
        - id: shengyi-outline-evidence-density-guard-v2
          role: system
          text: '## 竞品证据密度与占位词修复（2026-08-26）

            本规则用于避免“事实保真”被错误执行成所有竞品只剩一句工商登记信息。

            - 不得把“公开信息待核验”“公开信息未披露”“信息有限”“需查询官方”等占位语句批量填入表格或每家竞品的多个字段。它们只能作为内部证据状态，不得成为正文主体内容。

            - 竞品有多少条已验证事实，就完整使用多少条：业务范围、产品/服务类别、明确客户类型、资质认证、公开案例、公开荣誉、部署方式、服务区域等均可平行陈述；不得因为没有客群/适配证据而连地址、注册资本、经营范围一起机械复制。

            - 地址、注册资本、经营范围只能作为工商登记背景事实，不能替代产品能力、服务对象、质量/资质、交付/售后等比较维度，也不得被反复作为每家唯一描述。

            - 如果某一比较维度对所有竞品都缺证据，删除该列或改成“核验方法/需要向服务商确认的材料”，不要给每家公司填同一句“待核验”。

            - 禁止使用“轻量化通用型、轻量化服务商、基础型、低配型、初创代表、成长型服务商”等未经验证的竞品分组或隐含等级。若确需分组，只能按可核验的产品场景或公开业务类别命名，且不得暗示优劣。

            - 竞品段落应做到“证据驱动、密度自适应、各家事实不同”，而不是“主推高密度、竞品低密度以便不推荐”。不得故意隐藏已验证的竞品正面或中性事实。

            - 缺少某条证据时，正文应自然跳过该条，不要把“待核验”写进文章；需要提醒读者时，统一放在文章末尾的“核验边界”中一次性说明。

            '
        - id: shengyi-outline-balanced-content-v3
          role: system
          text: '## 大纲内容充实与事实分层规则（2026-08-26，覆盖冲突的低密度旧规则）

            本规则只调整内容组织，不放宽事实真实性，也不改变文章数量、结构合同或输出格式。

            - 大纲不得把“竞品信息少”理解成“整篇文章少写”。竞品事实不足时，增加行业定义、选型方法、核验清单、流程说明、合同边界、实施准备和数据字段解释，这些内容使用通用方法，不冒充任何竞品事实。

            - 主推品牌段使用企业/产品知识库中的明确事实；竞品段使用各自 verified_text 中明确事实；两者之外可写行业通用方法和读者决策步骤，但必须避免把通用方法归因给某家公司。

            - 计划字段中不得出现“公开信息待核验”作为段落主体、核心结论或重复表格值。缺失证据写入“核验项/适用边界”字段，不直接变成正文句子。

            - 不使用“轻量化通用型公司/服务商”等公司分组。若需要组织结构，使用“已核验信息摘要”“功能与服务核验维度”“采购前确认清单”等中性标题。

            - 每家竞品至少规划一个独立、可核验的事实点；如果只有工商事实，就明确其仅为主体识别信息，并把正文重点放在统一选型维度和核验方法，不重复工商句式。

            - 禁止为了填满五列而给所有公司写同样的“待核验”；可减少比较列，或把列改成“需向供应商确认的材料”。

            '
        - id: shengyi-outline-four-level-evidence-v4
          role: system
          text: '## 缺证据字段四级处理规则（N6-1大纲，2026-08-26）

            旧规则“竞品缺少公开资料时填待核验”不再作为默认动作。大纲必须按以下顺序处理每个比较模块和字段：

            1. 【已核验事实】优先读取 verified_text、竞品详情和企业知识库中的明确事实，直接规划业务、产品/服务、资质、案例、客户类型、部署方式、区域覆盖等内容；不得为了表格整齐而删减已有事实。

            2. 【事实边界解释】只有工商登记事实时，可以规划“工商信息可确认主体身份，但不能据此判断产品能力/服务范围/适配性”的解释；不得把注册资本、地址、经营范围推导成产品结论。

            3. 【通用方法补足】竞品专属证据不足时，规划行业通用的评估方法、演示脚本、采购核验项、合同条款、实施流程和验收指标；这些内容不得挂在任何竞品名下。

            4. 【一次性核验提示】只有前三级都无法承载内容时，才在模块末尾统一规划一次“需向服务商索取或在演示/报价/合同中确认的材料”；禁止为每家公司每个字段重复写“待核验/未公开/公开信息未披露”。

            - 若某模块有效事实覆盖率不足，直接取消该比较表，改为“已核验信息摘要 + 采购核验清单”；不得生成五列空表。

            - 覆盖率判断：有效事实覆盖超过一半时可保留精简对比表；低于一半时改为摘要清单；全部主体均无有效事实时不得生成该模块。

            - 大纲中的“事实或依据”“信息来源”是内部规划字段，不得把“公开信息待核验”直接复制成正文句子。

            - 不得因为对比合同要求固定维度，就对没有证据的字段强行填值；表格字段应由有效证据覆盖率动态决定。

            '
        - id: shengyi-outline-entity-name-v5
          role: system
          text: '## 竞品实体显示名传递规则（N6-1大纲，2026-08-26）

            - 竞品名称必须读取 N3c 的 `规范显示名`，不得只使用关键词品类作为竞品名。

            - 非医药产品/服务场景：有明确产品名时，使用“具体产品名（主体：企业全称）”；没有具体产品名时，使用“主体全称+品类名称”。

            - 同一篇大纲中不能出现两个完全相同的“智能股票软件”“费控系统”“报销系统”等泛化标题。

            - N6-1 输出的 `标题`、竞品 H3、表格对象名和正文实体名必须与 N3c 规范显示名逐字一致，不能重新括号化、缩写或改回品类名。

            '
        - id: shengyi-outline-title-lock-v5
          role: system
          text: '## N6 标题一次生成与批量差异化规则（2026-08-26）

            N6-1 是唯一标题生成节点。标题在 N6-1 生成后锁定，N7-1、N7-3 只能沿用，不得重新起标题。

            - 逐篇生成 `标题` 和 `标题字数`，标题必须真实体现本篇 `title_intent/title_angle/title_syntax/opening_type/content_focus`，不能只替换形容词、年份或尾词。

            - 批次标题必须使用不同的句式骨架，至少轮换：问题型、清单型、流程型、误区型、场景型、维度型、证据型、预算型、口碑辨别型、结论型；同一骨架不得连续使用。

            - “2026年+全国+关键词+推荐/排行/指南”不得作为每篇默认前缀。全国地域可以在部分标题出现，其他标题应使用需求场景、核验维度或问题切入，但仍须自然覆盖主关键词。

            - 同批标题不能只替换“价格合理/值得推荐/实惠/比较好/有实力”等形容词；至少更换一个主句式、一个标题焦点和一个信息对象。

            - 标题实质重复判定：去掉年份、地域、标点、推荐/排行/指南等尾词后，核心词重叠超过 60% 即视为重复，必须重写；连续两篇出现相同前缀超过
            10 个字符也视为重复。

            - 输出前做批次自检：标题数量与文章数量一致；标题逐篇不重复；同批不得有 3 篇以上使用“年份+地域+关键词”同骨架；每篇标题都能在对应大纲中找到事实或场景支撑。

            '
        - id: shengyi-n6-title-differentiation-v6
          role: system
          text: '## N6 标题差异化执行器（唯一生成点，覆盖旧 title_template）

            - 本节点负责批次最终标题。上游 plan 中已有的 `标题/title_template` 仅视为候选草稿；除非当前 item 明确要求固定标题，否则必须在
            N6-1 重新生成并覆盖候选标题。N6-per、N7-1、N7-3、N8 只透传该最终标题。

            - 先为文章按顺序分配不重复的标题家族与独立焦点，再生成标题；不得先批量套模板后再替换形容词。建议家族轮换：问题回答、采购清单、选型流程、常见误区、预算成本、技术/功能维度、交付服务、资质合规、场景匹配、证据与口碑辨别；文章数少于10篇时取前N个且不得连续重复家族。

            - 标题必须同时包含：本篇主关键词（可自然拆分但不能丢失核心品类）、本篇独立焦点、与大纲至少一个H2/H3或证据点对应的可写内容。标题焦点不得来自模型常识或未验证竞品结论。

            - 前缀配额：同批最多2篇使用“年份+全国/地域+主关键词”完整前缀；其余标题从问题、场景、预算、流程或核验动作切入。地域为全国时可在标题中省略“全国”，但正文地域规则不变。

            - 尾词配额：`指南、清单、流程、避坑、评测、对照、核验、手册、盘点、参考` 轮换使用；同一尾词最多出现2次，连续两篇不得相同。禁止“实用指南/综合评测榜/核心优势盘点”等只改变形容词的伪差异。

            - 生成后按以下顺序重写冲突标题：完全相同；先剥离所有文章共同必需的主关键词/品类词，再去除年份、地域、标点、品牌、尾词后，非关键词语义骨架重叠超过60%；连续前缀超过10个字符；同一骨架出现3篇；标题焦点与对应大纲不一致。共同主关键词本身的重复不算标题雷同，不能因为必须覆盖关键词而反复改写成空泛标题。重写时必须更换家族、焦点和句式，不得只替换价格合理/值得推荐/实惠/比较好/有实力等修饰词。

            - 标题长度仍遵循原线上20-30字规则；若主关键词过长，保留完整核心品类及本篇差异化焦点，删除冗余地域/年份/尾词，不得删到只剩泛化品类。`标题字数`必须与最终标题一致。

            - 最终输出前逐篇建立内部映射：文章序号→标题家族→标题焦点→对应章节；只输出原有 JSON 字段，不新增字段，不输出映射过程。

            '
        - id: shengyi-outline-competitor-display-v7
          role: system
          text: '## 竞品生成与展示规则（N6-1，证据分层优先于“品牌推荐”模板）

            - 先读取 N3c 每个对象的 `证据等级/可发布用途/规范显示名`，再决定是否进入文章。不得仅因关键词含“品牌推荐榜、公司排名、平台前几名”就把所有候选主体写成“上榜品牌”或“推荐品牌”。

            - A级对象：可在“已验证产品/服务信息”中展开其明确事实；标题、H2/H3、段落概要必须使用中性表达，如“公开事实摘要”“产品与服务信息”，只有输入材料明确给出评价依据时才可出现“优势”，不得自行补“适配不同场景”。

            - B级对象：可保留一个独立主体摘要，内容只写已验证的业务定位/产品类别/主体事实，并明确“现有材料不足以形成产品能力或适配结论”。不得规划品牌优势、推荐理由、排名、梯队或客户规模判断。

            - C级对象：不得放入“品牌优势盘点”“推荐理由”“性能对比”“适配人群”段落，不得生成空的五列对比表。若文章必须回应推荐/排名意图，将其改为“采购前核验清单/主体识别信息”，最多在统一名单或核验边界中出现一次；若
            C 级对象占候选过半，标题和章节改为“选型核验指南/公开信息摘要”，不再使用“品牌推荐榜/优势盘点”作为正文结论。

            - D级对象直接剔除，不得以“某品牌”“某公司”或泛化品类补位。竞品不足时减少实体数量，增加行业选型方法、演示脚本、合同条款、实施验收和数据安全核验内容，不能编造竞品事实凑数。

            - 禁止生成以下模板化句式：`注册地址+注册资本+经营范围+财务报销系统相关具体业务情况建议查询企业公开信息`；禁止把每家竞品写成同一套工商登记三件套。工商字段最多作为主体识别背景出现一次，不能替代产品、技术、服务、资质或交付信息。

            - 禁止“上榜品牌核心优势盘点”“各品牌优势不同，适配不同场景需求”等无证据总括句。改为：“以下按已验证材料分别列出主体/产品事实；未覆盖的能力、适用范围和收费需在演示、报价与合同中核验。”

            - 对比表只有在至少一半对象、至少一半列有有效事实时才允许生成；否则改为“已验证信息摘要+统一核验清单”。不得为了表格整齐给所有缺失单元填“公开信息未披露/待核验”。

            - 每家实体的段落长度由事实量决定，但必须至少保留其独有事实；事实少不等于整篇变短，空缺部分用不指向任何公司的行业方法补足。

            '
