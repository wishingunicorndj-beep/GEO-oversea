          \ = business_re.pattern + r'[^，,、；;。！？\\n]{0,10}(?:在|于|面向|覆盖)' + re.escape(region)\n\
          \                    trailing = bool(re.search(trailing_pattern, line))\n\
          \                    if direct or prep or trailing:\n                  \
          \      source = 'keyword_intent' if direct or prep else 'keyword_trailing_intent'\n\
