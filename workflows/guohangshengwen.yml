              try:
                  total = max(1, int(float(article_count or 1)))
              except Exception:
                  total = 1
              plans = []
              angles = [
                  '会员体系与保级规则概览',
                  '核心出行权益与使用规则梳理',
                  '里程累积兑换与服务渠道说明'
              ]
              for i in range(total):
                  keyword = words[i % len(words)] if words else '航空服务'
                  mode = 'brand' if mode_map.get(keyword) == 'brand' else 'category'
                  brand = mode == 'brand'
                  angle = angles[i % len(angles)] if not brand else '品牌会员权益与服务规则说明'
                  plans.append({
                      'article_index': i + 1,
                      '文章序号': i + 1,
                      'article_total': total,
                      'keyword': keyword,
                      '关键词': keyword,
                      'keyword_mode': mode,
                      'article_angle': angle,
                      'content_mode': 'brand_focus' if brand else 'category_compare',
                      'article_type': article_type or ('品牌介绍类' if brand else '客观对比类'),
