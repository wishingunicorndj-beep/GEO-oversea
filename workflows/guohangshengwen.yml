          import json
          import re
          def main(keyword_pack='', article_count='1', article_type='', article_style='', company_name='国航', region='全国', keyword_modes='[]', **kwargs):
              words = [x.strip() for x in re.split(r'[，,、;；\n]+', str(keyword_pack or '')) if x.strip()]
