          \    return ''\n\n\n# === 新增：从原始文本全量提取内容(JSON 完全解析失败时的终极兜底) ===\ndef _rescue_from_raw(raw_text):\n\
          \    \"\"\"当 _parse_json 返回空 dict 时,尝试从原始文本直接抢救出文章内容\"\"\"\n    if not raw_text\
          \ or not isinstance(raw_text, str):\n        return '', '', '', [], ''\n\
          \    cleaned = _strip_think(raw_text)\n    # 已知 JSON 包裹时只读取 content 字段；纯\
