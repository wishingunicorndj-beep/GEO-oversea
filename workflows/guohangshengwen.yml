          \ is None:\n        return ''\n    try:\n        return json.loads('\"'\
          \ + raw_value + '\"', strict=False).strip()\n    except Exception:\n   \
          \     return raw_value.replace('\\\\\"', '\"').replace('\\\\\\\\', '\\\\\
          ').replace('\\\\n', '\\n').replace('\\\\t', '\\t').strip()\n\n\ndef _scan_json_string_field(raw,\
          \ field):\n    \"\"\"转义感知地恢复 JSON 字符串字段，畸形输出时不越过同级元数据。\"\"\"\n    if not\
