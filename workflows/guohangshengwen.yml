          \        )\n        entity_brand_re = re.compile(\n            r'^[\\u4e00-\\\
          u9fff]{2,10}(?:科技|化工|石化|新材料|实业|集团|品牌)'\n            r'(?:有限公司|股份有限公司|集团|公司)?'\n\
          \        )\n    \n        hits = []\n        for line_order, line in enumerate(lines):\n\
          \            for region in regions:\n                start = 0\n       \
          \         while True:\n                    pos = line.find(region, start)\n\
          \                    if pos < 0:\n                        break\n      \
          \              start = pos + len(region)\n                    left = line[max(0,\
          \ pos - 12):pos]\n                    rest = line[pos + len(region):]\n\
          \                    if entity_short_re.match(rest) or entity_brand_re.match(rest):\n\
