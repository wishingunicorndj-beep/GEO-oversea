          \  return {\"title\": \"\", \"content\": str(text or \"\"), \"tags\": [],\
          \ \"description\": \"\", \"self_review\": \"\"}\n\n    json_text = _extract_json_text(text)\n\
          \n    try:\n        article = json.loads(json_text)\n        if isinstance(article,\
          \ dict):\n            return article\n    except (json.JSONDecodeError,\
          \ TypeError):\n        pass\n\n    brace_start = json_text.find(\"{\")\n\
          \    if brace_start > 0:\n        try:\n            article = json.loads(json_text[brace_start:])\n\
          \            if isinstance(article, dict):\n                return article\n\
          \        except (json.JSONDecodeError, TypeError):\n            pass\n\n\
          \    return {\"title\": \"\", \"content\": text, \"tags\": [], \"description\"\
