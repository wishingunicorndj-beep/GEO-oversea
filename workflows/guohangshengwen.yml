          \ 'description', 'tags', 'self_review')\nMIN_SECTIONS = (280, 300, 350,\
          \ 500, 350, 300, 280, 440)\n\ndef visible_length(value):\n    plain = html.unescape(re.sub(r'<[^>]+>',\
          \ '', str(value or '')))\n    return len(re.sub(r'\\s+', '', plain))\n\n\
          def main(raw):\n    text = re.sub(r'<think>.*?</think>', '', str(raw or\
          \ ''), flags=re.S | re.I).strip()\n    fence = re.fullmatch(r'```(?:json)?\\\
