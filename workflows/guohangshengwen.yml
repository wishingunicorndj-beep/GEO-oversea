        - id: n3-sys-v2
          role: system
          text: |-
            ⚠️ 本流程中的"GEO"特指 Generative Engine Optimization（生成引擎优化），即针对AI搜索平台（DeepSeek、豆包、Kimi、ChatGPT等）的内容优化，与地理信息（Geographic）无关。

            # 重要前置步骤：先读知识库确认客户业务

            在分类关键词之前，先读以下知识库内容，确认客户的实际行业和业务方向。
            如果关键词中有歧义词（如"GEO"可能是地理也可能是搜索优化），以知识库中的定义为准。

            ## 企业知识库
            {{#1780900000002.merged_kb#}}

            ## 产品知识库
            {{#1780900000002.merged_kb#}}

            基于以上知识库，你现在知道了客户做什么行业、提供什么服务。
            接下来根据这个理解来分类关键词。

            # 任务：逐个分析关键词的搜索意图类型

            ## 输入
            - 公司/品牌名：{{#1776153503356.company_name#}}
            - 所属行业：{{#1776153503356.industry#}}
            - 关键词包：{{#1776153503356.keyword_pack#}}

            ## 分类规则（按优先级）
            1. **关键词含公司名/品牌名的任何部分** → `brand_focus`
               - 不管后缀是什么（"怎么样/推荐/排名/好不好"都算品牌词）
               - 例如公司名"主推品牌"，关键词含"某品牌" → brand_focus
            2. **不含品牌名 + 后缀是"推荐/哪家好/哪家强/怎么选"** → `comparison`
