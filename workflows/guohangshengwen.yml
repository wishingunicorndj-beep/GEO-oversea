        code: "import json\nimport re\n\n_IMG_BLOCK = re.compile(r'##\\s*\\[IMAGE\\\
          ](.*?)(?=\\n##\\s*\\[IMAGE\\]|\\Z)', re.DOTALL)\n_IMG_URL = re.compile(r'!\\\
          [.*?\\]\\((https?://[^\\s\\)]+)\\)')\n_IMG_CORE = re.compile(r'【图片核心描述】\\\
          s*\\n+\\s*(.+?)\\s*(?:\\n|$)')\n_IMG_OCR = re.compile(r'【图片文字信息[（(]?OCR[）)]?】\\\
          s*\\n+\\s*(.+?)\\s*(?:\\n|$)')\n_IMG_VLM = re.compile(r'【图片语义理解[^】]*】\\\
          s*\\n+\\s*(.+?)\\s*(?:\\n---|\\n##|\\Z)', re.DOTALL)\n\ndef _extract_images(content,\
          \ manifest, seen):\n    for block in _IMG_BLOCK.findall(content or \"\"\
          ):\n        um = _IMG_URL.search(block)\n        if not um:\n          \
          \  continue\n        url = um.group(1).strip()\n        if not url or url\
          \ in seen:\n            continue\n        seen.add(url)\n        cm = _IMG_CORE.search(block)\n\
          \        om = _IMG_OCR.search(block)\n        vm = _IMG_VLM.search(block)\n\
          \        core = cm.group(1).strip() if cm else \"产品实拍图\"\n        ocr =\
          \ om.group(1).strip() if om else \"无OCR文字信息\"\n        vlm = re.sub(r'\\\
          s+', ' ', vm.group(1).strip()) if vm else core\n        manifest.append({\"\
          id\": \"pimg_%d\" % (len(manifest) + 1), \"url\": url, \"core\": core, \"\
          ocr\": ocr, \"vlm\": vlm})\n\ndef main(body):\n    \"\"\"\n    解析 JSON:\
          \ 拼接 records 中所有 segment 的 content, 并提取图片清单 image_manifest。\n    \"\"\"\n\
          \    if isinstance(body, str):\n        try:\n            data = json.loads(body)\n\
          \        except json.JSONDecodeError:\n            return {\"content\":\
          \ \"\", \"image_manifest\": []}\n    else:\n        data = body\n\n    records\
          \ = data.get(\"records\", []) if isinstance(data, dict) else []\n    content_list\
          \ = []\n    image_manifest = []\n    seen_urls = set()\n    for record in\
          \ records:\n        segment = record.get(\"segment\", {}) if isinstance(record,\
          \ dict) else {}\n        content = segment.get(\"content\", \"\") if isinstance(segment,\
          \ dict) else \"\"\n        if content:\n            content_list.append(content.strip())\n\
          \            _extract_images(content, image_manifest, seen_urls)\n\n   \
          \ final_content = \"\\n\\n\".join(content_list)\n    return {\n        \"\
          content\": final_content,\n        \"image_manifest\": image_manifest\n\
          \    }"
