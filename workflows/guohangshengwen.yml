            必须为 null/0，custom_faq_policy_active=false，不得继承本次 FAQ 数量或结构。


            ## 特殊需求全量单次生效规则_V7

            - 本次输入节点的原始 `custom_writing_preference` 是唯一事实源。所有特殊需求控制项，包括文章数量覆盖、类型配比、竞品露出、竞品匿名、禁止竞品、必现句/slogan、禁用词、字数、风格、结构、FAQ、表格、性价比、合规从严要求等，都只能从本次原始输入中识别。

            - “特殊需求解析与分发”节点只能解析本次原文，不得把上一批文章、上一轮解析结果、历史 plan.item、历史 self_review、历史
            quality_scores、示例文本中的结论带到本次。

            - 如果本次 `custom_writing_preference` 为空、null、无、未填写，则本次没有任何特殊需求：所有 machine_readable
            字段回到 null/no/false，后续计划、大纲、生文、清洗、质检不得执行旧的特殊需求。

            - 如果本次有新的 `custom_writing_preference`，必须重新解析、重新分发；新需求覆盖旧需求，旧需求视为不存在。解析结果里凡是不能在本次原文中找到依据的控制项都必须忽略。

            - 若解析输出与本次原文冲突，以本次原文为准；若解析输出包含本次原文没有写的 FAQ 数量、必现句、禁用竞品、性价比、字数、类型配比等，后续节点必须当作无效字段。


            ## 特殊需求任务单与验收规则_V8

            - 不要只把 custom_writing_preference 当作一段提示词，而要拆成“每篇文章必须完成的任务单”。任务单至少覆盖：数量、类型配比、竞品露出/匿名/差异化、每篇必含事实、必现句、禁用词、字数、结构、FAQ、表格、地址/门店、对比重点、合规等价表达、最终验收口径。

            - 大纲和生文节点必须逐条执行 plan.item.custom_writing_instruction 与 plan.item.custom_contract_summary；不能因为默认模板、行业模板、补字数、清洗、合规改写而丢失任务单。

            - 客户要求“每篇都要/每篇文章都要/所有文章都要”的内容，是逐篇硬约束，不是全批次出现一次即可。每篇标题、正文、FAQ、自评都要检查是否满足。

            - 客户要求竞品“不要每篇一样/不要都一样/差异化/轮换”时，计划节点必须给不同文章分配不同竞品组合；竞品不足时不得编造，要在自评和终检里明确“可验证竞品不足”，不能假装满足。

            - 客户要求“对比突出某个维度”时，该维度必须进入每篇大纲的核心章节和正文主体，不得只在开头泛泛提一句。医疗/金融场景不能写“最好/第一/最专业”等绝对化词，但必须保留客户意图，改成合规表达，如“从公开资质、医师背景、从业年限等维度看更具参考价值/处于较高水平/更适合重视该维度的用户”。

            - 最终质检必须把特殊需求作为硬验收项：如果每篇必含事实缺失、竞品差异化缺失、对比重点缺失、文章数量不一致、正文不完整、FAQ数量不一致等，应判定失败或由清洗节点补足，不能只给机械检查通过。

