        code: "import json\nimport re\n\n\ndef _normalize_articles(articles):\n  \
          \  \"\"\"Normalize only the container type; never rewrite article fields.\"\
          \"\"\n    if articles is None:\n        return []\n    if isinstance(articles,\
          \ list):\n        return articles\n    if isinstance(articles, dict):\n\
          \        return [articles]\n    if isinstance(articles, str):\n        try:\n\
          \            parsed = json.loads(articles)\n        except Exception:\n\
          \            return []\n        if isinstance(parsed, list):\n         \
          \   return parsed\n        if isinstance(parsed, dict):\n            return\
          \ [parsed]\n    return []\n\n\ndef _plain(text):\n    return re.sub(r'\\\
          s+', ' ', re.sub(r'<[^>]+>', '', str(text or ''))).strip()\n\n\ndef _faq_orphan_count(content):\n\
          \    \"\"\"Read-only check. It must never add, delete, or rewrite FAQ content.\"\
          \"\"\n    original = str(content or '')\n    token_re = r'(<h[1-6][^>]*>(?:(?!</h[1-6]>)[\\\
          s\\S])*</h[1-6]>|<(?:p|li)[^>]*>(?:(?!</(?:p|li)>)[\\s\\S])*</(?:p|li)>)'\n\
          \    parts = re.split(token_re, original, flags=re.I)\n    faq_level = None\n\
          \    missing = 0\n\n    def is_faq_heading(text):\n        return bool(re.search(r'FAQ|常见.{0,12}(?:问题|疑问)|问答|答疑|问题解答|疑问解答',\
          \ text, re.I))\n\n    def is_question(text):\n        text = str(text or\
          \ '').strip()\n        return bool(\n            re.match(r'^(?:问|Q)\\s*[：:]',\
          \ text, re.I)\n            or re.match(r'^问题\\s*(?:\\d+|[一二三四五六七八九十]+)?\\\
