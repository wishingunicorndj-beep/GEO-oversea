          \ 1-5\n                weights[key] = w\n        return weights\n\n    def\
          \ hamilton_allocate(weights, total):\n        \"\"\"Hamilton 余数法：按权重分配整数篇数，总和严格等于\
          \ total\"\"\"\n        w_sum = sum(weights.values())\n        if w_sum ==\
          \ 0:\n            w_sum = 1\n        quotas = {k: v * total / w_sum for\
          \ k, v in weights.items()}\n        result = {k: int(q) for k, q in quotas.items()}\n\
          \        remainder = total - sum(result.values())\n        fractionals =\
          \ sorted(quotas.keys(), key=lambda k: quotas[k] - int(quotas[k]), reverse=True)\n\
          \        for i in range(remainder):\n            result[fractionals[i]]\
          \ += 1\n        return result\n\n    def infer_keyword_type_weights(keyword_text,\
