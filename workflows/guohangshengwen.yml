    - data:
        code: |
          """
          品牌词生文支线 - 节点 7-5b：放在 7-3"无问题"分支之后
          输入变量配置：
            - n7_text → 7-1 AI生文节点的 text 输出
          输出变量：structured_output —— 与 7-5a 结构完全一致
          """

          import re
          import json as _json

          def _strip_think(raw):
              if not raw:
                  return ''
              s = re.sub(r'<think>.*?</think>', '', raw, flags=re.S | re.I)
              if '</think>' in s:
                  s = s.split('</think>')[-1]
              if '<think>' in s:
                  s = re.sub(r'<think>.*', '', s, flags=re.S | re.I)
              return s

          def _extract_html(s):
              if not s:
                  return ''
              # === 修改：从第一个 HTML 标签起抓到原文末尾,容忍末尾标签未闭合(N7 偶发截断) ===
              m = re.search(r'<(?:p|h[1-4])[\s>][\s\S]*', s, flags=re.I)
              return m.group(0).strip() if m else s.strip()

          # === 新增：N7 JSON 被截断时的字段兜底正则提取 ===
          def _regex_extract_field(raw, field):
              """从原始文本里直接抽 "field": "value"(应对 LLM 输出畸形/截断 JSON)"""
              if not raw or not field:
                  return ''
              pattern = r'"%s"\s*:\s*"((?:\\.|[^"\\])*)"' % re.escape(field)
              m = re.search(pattern, raw, re.S)
              if not m:
                  return ''
              val = m.group(1)
              val = val.replace('\\"', '"').replace('\\\\', '\\').replace('\\n', '\n').replace('\\t', '\t')
              return val.strip()

          def main(n7_text):
              _n7j = {}
              raw = _strip_think(n7_text or '')
              # === 修改：兼容 N7 输出被截断没有结尾 } 的情况 ===
              # 优先匹配完整 {...},失败则匹配从 { 开始到结尾的所有内容
              try:
                  _mj = re.search(r'\{[\s\S]*\}', raw, re.S)
                  if not _mj:
                      _mj = re.search(r'\{[\s\S]*', raw, re.S)
                  if _mj:
                      _block = _mj.group(0)
                      try:
                          _n7j = _json.loads(_block, strict=False)
                      except Exception:
                          # 截断的 JSON 解析失败 → 尝试补全结尾再解析
                          _patched = _block.rstrip().rstrip(',') + '"}' if not _block.rstrip().endswith('}') else _block
                          try:
                              _n7j = _json.loads(_patched, strict=False)
                          except Exception:
                              _n7j = {}
              except Exception:
                  _n7j = {}

              title = (_n7j.get('title') or '').strip()
              content = (_n7j.get('content') or '').strip()
              description = (_n7j.get('description') or '').strip()
              tags = _n7j.get('tags') or []
              self_review = (_n7j.get('self_review') or '').strip()

              if not isinstance(tags, list):
                  tags = []

              # === 新增:JSON 解析失败/字段缺失时,从原文用正则直接抽 ===
              # 应对 N7 输出畸形 JSON 或被截断,JSON 解析拿到的字段不完整的情况
              _t = _regex_extract_field(raw, 'title')
              if _t and len(_t) >= 5 and len(_t) > len(title):
                  title = _t
              _d = _regex_extract_field(raw, 'description')
              if _d and len(_d) > len(description):
                  description = _d
              if not tags:
                  _tm = re.search(r'"tags"\s*:\s*\[([^\]]*)\]', raw, re.S)
                  if _tm:
                      tags = [s.strip() for s in re.findall(r'"([^"]+)"', _tm.group(1))]

              if not content:
                  content = _extract_html(raw)
              else:
                  if '<think>' in content or '</think>' in content:
                      content = _extract_html(_strip_think(content))
                  # === 新增:content 看起来被截断(末尾没有完整闭合标签) → 用原文 HTML 兜底 ===
                  # 判断:content 末尾不是 </p>/</h2>/</h3>/</ul>/</ol> 之一,且原文 HTML 比 content 长
                  _content_tail = content.rstrip()[-6:]
                  if not re.search(r'</(?:p|h[1-4]|ul|ol|li)>\s*$', content, re.I):
                      _raw_html = _extract_html(raw)
                      if _raw_html and len(_raw_html) > len(content):
                          content = _raw_html

              if not title or len(title.strip()) < 5:
                  m = re.search(r'<h2[^>]*>(.*?)</h2>', content, re.S)
                  if m:
                      title = re.sub(r'<[^>]+>', '', m.group(1)).strip()

              if not description:
                  description = re.sub(r'<[^>]+>', '', content)[:120].strip()

              if not self_review:
                  self_review = '[守护]合规预检通过,无需清洗,直接采用N7原文(已去思考链)'

              return {'structured_output': {
                  'title': title, 'content': content, 'description': description,
                  'tags': tags, 'self_review': self_review
              }}
