          \ children, \"evidence\": evidence, \"avoid\": avoid}\n\n\nUNIVERSAL_GEO_FACTORS\
          \ = [\n    factor(\"UGEO_01\", \"实体与主题清晰\", 18, [\"品牌/产品/服务名称统一\", \"业务边界清楚\"\
