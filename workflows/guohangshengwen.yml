    - data:
        code: |
          import json, re
          def words(s): return [x.strip() for x in re.split(r'[，,、;；\n]+', str(s or '')) if x.strip()]
          def main(company_name, industry, keyword_pack, article_count, article_style, article_type, task_name, company_intro, core_qualifications, awards, advantages, ent_dataset_id, task_description, prod_dataset_id):
              ws=words(keyword_pack)
              core=re.sub(r'(股份有限公司|有限责任公司|有限公司|公司|集团)$','',str(company_name or '').strip())
              tokens=[x for x in [core,'中国国航','国航','Air China'] if len(x)>=2]
              modes=[{'keyword':w,'mode':'brand' if any(t in w for t in tokens) else 'category','index':i+1} for i,w in enumerate(ws)]
              anchor=ws[0] if ws else (industry or task_name or '航空服务')
              clean=lambda s: re.sub(r'\s+',' ',re.sub(r'[\x00-\x1f\x7f-\x9f"\\]','',str(s or ''))).strip()[:80]
              return {'ent_rag_query':clean(f'{company_name} 企业简介 业务范围 资质 荣誉'), 'prod_rag_query':clean(f'{anchor} 会员权益 产品服务 适用条件 有效期'), 'article_count':str(int(article_count) if article_count else 1), 'article_style':article_style or '专业客观', 'article_type':article_type or '', 'compliance_mode':'standard', 'content_mode':'comparison', 'region':'全国', 'region_source':'default_national', 'region_confidence':'default', 'core_service':anchor, 'keyword_modes':json.dumps(modes,ensure_ascii=False)}
        code_language: python3
        desc: ''
        outputs:
          article_count:
            children:
            type: string
          article_style:
            children:
            type: string
          article_type:
            children:
            type: string
          compliance_mode:
