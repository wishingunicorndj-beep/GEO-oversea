        code: |-
          import json
          import re

          _IMG_BLOCK = re.compile(r'##\s*\[IMAGE\](.*?)(?=\n##\s*\[IMAGE\]|\Z)', re.DOTALL)
          _IMG_URL = re.compile(r'!\[.*?\]\((https?://[^\s\)]+)\)')
          _IMG_CORE = re.compile(r'【图片核心描述】\s*\n+\s*(.+?)\s*(?:\n|$)')
          _IMG_OCR = re.compile(r'【图片文字信息[（(]?OCR[）)]?】\s*\n+\s*(.+?)\s*(?:\n|$)')
          _IMG_VLM = re.compile(r'【图片语义理解[^】]*】\s*\n+\s*(.+?)\s*(?:\n---|\n##|\Z)', re.DOTALL)

          def _extract_images(content, manifest, seen):
              for block in _IMG_BLOCK.findall(content or ""):
                  um = _IMG_URL.search(block)
                  if not um:
                      continue
                  url = um.group(1).strip()
                  if not url or url in seen:
                      continue
                  seen.add(url)
                  cm = _IMG_CORE.search(block)
                  om = _IMG_OCR.search(block)
                  vm = _IMG_VLM.search(block)
                  core = cm.group(1).strip() if cm else "产品实拍图"
                  ocr = om.group(1).strip() if om else "无OCR文字信息"
                  vlm = re.sub(r'\s+', ' ', vm.group(1).strip()) if vm else core
                  manifest.append({"id": "pimg_%d" % (len(manifest) + 1), "url": url, "core": core, "ocr": ocr, "vlm": vlm})

          def main(body):
              """
              解析 JSON: 拼接 records 中所有 segment 的 content, 并提取图片清单 image_manifest。
              """
              if isinstance(body, str):
                  try:
                      data = json.loads(body)
                  except json.JSONDecodeError:
                      return {"content": "", "image_manifest": []}
              else:
                  data = body

              records = data.get("records", []) if isinstance(data, dict) else []
              content_list = []
              image_manifest = []
              seen_urls = set()
              for record in records:
                  segment = record.get("segment", {}) if isinstance(record, dict) else {}
                  content = segment.get("content", "") if isinstance(segment, dict) else ""
                  if content:
                      content_list.append(content.strip())
                      _extract_images(content, image_manifest, seen_urls)

              final_content = "\n\n".join(content_list)
              return {
                  "content": final_content,
                  "image_manifest": image_manifest
              }
