        code: "\"\"\"国航文章机械检查；部署时嵌入 Dify 代码节点，不依赖本地文件。\"\"\"\nimport html\nimport\
          \ json\nimport re\nfrom html.parser import HTMLParser\n\nFIELDS = ('title',\
          \ 'content', 'description', 'tags', 'self_review')\nBANNED = ('独有', '唯一',\
          \ '终身', '全网第一', '行业第一', '最佳', '最优',\n          '最好', '首选', '综合第一', 'TOP1',\
          \ 'TOP2')\nMIN_LENGTH, MAX_LENGTH = 2500, 4200\nCOMPETITOR = r'(?<!山)(?:东航|东方航空|南航|南方航空)'\n\
          OFFICIAL_MEMBER_TERM = re.compile(r'(?:年度卓越)?终身白金卡')\nMARKDOWN_LINK = re.compile(r'\\\
          [[^\\]]+\\]\\([^)]*\\)')\nCATEGORY_BRAND_IN_TITLE = re.compile(r'(?:中国国际航空|国航|凤凰知音)')\n\
          CATEGORY_COMPARISON_CUE = re.compile(r'(?:选择参考|选哪个|哪家|哪个好|对比|比较|推荐|排名)')\n\
          \n\nclass _Body(HTMLParser):\n    def __init__(self):\n        super().__init__(convert_charrefs=True)\n\
          \        self.text, self.stack, self.errors = [], [], []\n        self.counts\
          \ = {}\n\n    def handle_starttag(self, tag, attrs):\n        self.counts[tag]\
          \ = self.counts.get(tag, 0) + 1\n        if tag in ('script', 'style', 'iframe'):\n\
          \            self.errors.append('正文含非文章标签：' + tag)\n        if tag not in\
          \ ('br', 'hr', 'img', 'input', 'meta', 'link', 'wbr', 'source'):\n     \
          \       self.stack.append(tag)\n\n    def handle_startendtag(self, tag,\
          \ attrs):\n        self.handle_starttag(tag, attrs)\n        if self.stack\
          \ and self.stack[-1] == tag:\n            self.handle_endtag(tag)\n\n  \
          \  def handle_endtag(self, tag):\n        if not self.stack or self.stack[-1]\
          \ != tag:\n            self.errors.append('HTML标签闭合或嵌套异常：' + tag)\n    \
          \    else:\n            self.stack.pop()\n        if tag in ('p', 'li',\
          \ 'h2', 'h3', 'h4', 'td', 'th'):\n            self.text.append('\\n')\n\n\
          \    def handle_data(self, data):\n        self.text.append(data)\n\n\n\
          def parse_article(raw):\n    if isinstance(raw, dict):\n        return dict(raw)\n\
          \    if not isinstance(raw, str):\n        raise ValueError('文章输出不是JSON对象或文本')\n\
          \    raw = re.sub(r'<think>.*?</think>', '', raw, flags=re.S | re.I).strip()\n\
          \    fence = re.fullmatch(r'```(?:json)?\\s*([\\s\\S]*?)\\s*```', raw, re.I)\n\
          \    if fence:\n        raw = fence.group(1)\n    try:\n        article\
          \ = json.loads(raw)\n    except (ValueError, TypeError):\n        raise\
          \ ValueError('文章JSON不完整或无法解析，需要重新输出完整对象')\n    if not isinstance(article,\
          \ dict):\n        raise ValueError('文章必须是单个JSON对象')\n    return article\n\
          \n\ndef _snippet(text, start, end):\n    return re.sub(r'\\s+', ' ', text[max(0,\
          \ start - 20):end + 35]).strip()\n\n\ndef _category_title_issues(article,\
          \ body):\n    \"\"\"品类标题保持品类范围，不把目标品牌拼成第二主题。\"\"\"\n    title = article['title'].strip()\n\
          \    issues = []\n    allow_target_brand = bool(re.search(r'(?:怎么选|如何选|选哪个|哪家|哪个好|值得|推荐)',\
          \ title))\n    if CATEGORY_BRAND_IN_TITLE.search(title) and not allow_target_brand:\n\
          \        issues.append('品类词标题不应追加目标品牌或产品名称：请保留品类主题，品牌内容放入正文')\n    if CATEGORY_COMPARISON_CUE.search(title):\n\
          \        headings = re.findall(r'<h[23][^>]*>(.*?)</h[23]>', article['content'],\
          \ re.I | re.S)\n        heading_text = re.sub(r'<[^>]+>', '', ' '.join(headings))\n\
