          def main(articles, compliance_mode: str = "standard", ent_body: str = "", prod_body: str = "", custom_writing_distribution: str = "", custom_writing_preference_raw: str = "", company_name: str = "", verified_competitor_text: str = ""):
              """V22 upstream-preserving gate.

              N7 owns article writing and compliance rewriting. N8-pre must not rewrite
              title, description, content, tags, self_review, FAQ, prices, percentages,
              wording, HTML, or existing metadata. It only skips invalid non-object
              entries and fills two genuinely missing routing fields.
              """
              if not isinstance(articles, list):
                  return {"cleaned_articles": []}

              cleaned_articles = []
              for article in articles:
                  if not isinstance(article, dict):
                      continue

                  # Copy the complete object so current and future upstream metadata is
                  # preserved automatically. Never rebuild from a fixed field whitelist.
                  preserved = dict(article)

                  # Add routing defaults only when the key is absent. Existing empty or
                  # explicit values remain upstream-owned and are not overwritten.
                  if "_compliance_mode" not in preserved:
                      preserved["_compliance_mode"] = compliance_mode or "standard"
                  if "_company_name" not in preserved and company_name:
                      preserved["_company_name"] = company_name

                  cleaned_articles.append(preserved)

              return {"cleaned_articles": cleaned_articles}
