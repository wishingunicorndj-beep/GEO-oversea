    - data:
        code: "import json\nimport re\n\n\ndef _normalize_articles(articles):\n  \
          \  \"\"\"Normalize only the container type; never rewrite article fields.\"\
          \"\"\n    if articles is None:\n        return []\n    if isinstance(articles,\
          \ list):\n        return articles\n    if isinstance(articles, dict):\n\
          \        return [articles]\n    if isinstance(articles, str):\n        try:\n\
          \            parsed = json.loads(articles)\n        except Exception:\n\
          \            return []\n        if isinstance(parsed, list):\n         \
          \   return parsed\n        if isinstance(parsed, dict):\n            return\
          \ [parsed]\n    return []\n\n\ndef _plain(text):\n    return re.sub(r'\\\
          s+', ' ', re.sub(r'<[^>]+>', '', str(text or ''))).strip()\n\n\ndef _faq_orphan_count(content):\n\
          \    \"\"\"Read-only check. It must never add, delete, or rewrite FAQ content.\"\
          \"\"\n    original = str(content or '')\n    token_re = r'(<h[1-6][^>]*>(?:(?!</h[1-6]>)[\\\
          s\\S])*</h[1-6]>|<(?:p|li)[^>]*>(?:(?!</(?:p|li)>)[\\s\\S])*</(?:p|li)>)'\n\
          \    parts = re.split(token_re, original, flags=re.I)\n    faq_level = None\n\
          \    missing = 0\n\n    def is_faq_heading(text):\n        return bool(re.search(r'FAQ|常见.{0,12}(?:问题|疑问)|问答|答疑|问题解答|疑问解答',\
          \ text, re.I))\n\n    def is_question(text):\n        text = str(text or\
          \ '').strip()\n        return bool(\n            re.match(r'^(?:问|Q)\\s*[：:]',\
          \ text, re.I)\n            or re.match(r'^问题\\s*(?:\\d+|[一二三四五六七八九十]+)?\\\
          s*[：:、.]?', text, re.I)\n            or text.endswith(('？', '?'))\n    \
          \    )\n\n    def is_answer(text):\n        return bool(re.match(r'^(?:答|A)\\\
          s*[：:]', str(text or '').strip(), re.I))\n\n    for index, part in enumerate(parts):\n\
          \        if not part or not part.strip():\n            continue\n      \
          \  value = _plain(part)\n        heading = re.match(r'<h([1-6])\\b', part,\
          \ re.I)\n        if heading:\n            level = int(heading.group(1))\n\
          \            if is_faq_heading(value):\n                faq_level = level\n\
          \                continue\n            if faq_level is not None and level\
          \ <= faq_level:\n                faq_level = None\n        if faq_level\
          \ is None or not is_question(value) or is_answer(value):\n            continue\n\
          \n        next_value = ''\n        next_part = ''\n        for next_index\
          \ in range(index + 1, len(parts)):\n            if parts[next_index] and\
          \ parts[next_index].strip():\n                next_part = parts[next_index]\n\
          \                next_value = _plain(parts[next_index])\n              \
          \  break\n        unlabelled_answer = bool(\n            re.match(r'<(?:p|li)\\\
          b', next_part, re.I)\n            and len(next_value) >= 8\n           \
          \ and not is_question(next_value)\n        )\n        if not is_answer(next_value)\
          \ and not unlabelled_answer:\n            missing += 1\n    return missing\n\
          \n\ndef _quality_score(title, content):\n    \"\"\"Read-only diagnostics.\
          \ Findings never trigger content mutation.\"\"\"\n    issues = []\n    title_len\
          \ = len(str(title or ''))\n    content_len = len(_plain(content))\n    if\
          \ title_len < 20:\n        issues.append(f'标题过短({title_len}字,要求≥20)')\n\
          \    elif title_len > 28:\n        issues.append(f'标题超长({title_len}字,要求≤28)')\n\
          \    if content_len < 2500:\n        issues.append(f'内容过短({content_len}字,至少2500)')\n\
          \    elif content_len > 4200:\n        issues.append(f'内容过长({content_len}字,上限4200)')\n\
          \    for tag in ('p', 'h2', 'h3', 'h4', 'strong'):\n        opened = len(re.findall(rf'<{tag}\\\
          b[^>]*>', str(content or ''), re.I))\n        closed = len(re.findall(rf'</{tag}>',\
          \ str(content or ''), re.I))\n        if opened != closed:\n           \
          \ issues.append(f'HTML标签未闭合:{tag}')\n    orphan_count = _faq_orphan_count(content)\n\
          \    if orphan_count:\n        issues.append(f'FAQ有{orphan_count}个问题缺少答案')\n\
          \    if issues:\n        return f'❌ 机械检查发现 {len(issues)} 个问题: {\" | \".join(issues)}'\n\
          \    return f'✅ 机械检查通过 (标题{title_len}字,内容{content_len}字)'\n\n\ndef _tag_text(tags):\n\
          \    \"\"\"Adapt array[object].tags to N8's existing array[string] output\
          \ contract.\"\"\"\n    if isinstance(tags, list):\n        return ','.join(str(tag)\
          \ for tag in tags)\n    return str(tags or '')\n\n\ndef _is_gate_placeholder(content):\n\
          \    \"\"\"识别 N8-hard 旧版产生的占位正文；仅用于恢复上游正文，不生成新内容。\"\"\"\n    text = str(content\
          \ or '')\n    return bool(re.search(r'终稿硬校验未通过|该占位内容不得发布为正式文章', text))\n\
          \n\ndef _upstream_content(item):\n    \"\"\"优先保留文章正文；兼容旧版 hard-gate 的占位覆盖结果。\"\
          \"\"\n    content = str(item.get('content', '') or '')\n    original = str(item.get('_original_content_before_final_gate',\
          \ '') or '')\n    if original.strip() and _is_gate_placeholder(content):\n\
          \        return original\n    return content\n\n\n\ndef _n8_target_total(articles):\n\
          \    totals = []\n    for item in articles or []:\n        if not isinstance(item,\
          \ dict):\n            continue\n        for key in (\"_article_total\",\
          \ \"article_total\"):\n            try:\n                value = int(item.get(key,\
          \ 0) or 0)\n            except Exception:\n                value = 0\n \
          \           if value > 0:\n                totals.append(value)\n    return\
          \ max(totals) if totals else 0\n\n\ndef main(articles, knowledge_base_evidence=\"\
          \", verified_competitor_evidence=\"\", competitor_detail_evidence=\"\",\
          \ final_validation_report=\"\"):\n    \"\"\"V21 pure merge: article title/content/tags\
          \ are upstream-owned and immutable here.\"\"\"\n    normalized = _normalize_articles(articles)\n\
          \    source_count = len(normalized)\n\n    # V23 最终数量硬边界：N8 不按序号去重，不覆盖文章；仅限制输出数量。\n\
          \    target_total = _n8_target_total(normalized)\n    if target_total >\
          \ 0:\n        if len(normalized) > target_total:\n            normalized\
          \ = normalized[:target_total]\n        elif len(normalized) < target_total:\n\
          \            # 数量不足时只补空对象，绝不生成标题、正文或其他内容。\n            for _ in range(target_total\
          \ - len(normalized)):\n                normalized.append({\n           \
          \         \"title\": \"\",\n                    \"content\": \"\",\n   \
          \                 \"description\": \"\",\n                    \"tags\":\
          \ [],\n                    \"self_review\": \"\",\n                    \"\
          _generation_status\": \"missing_iteration_output\",\n                  \
          \  \"_rewrite_required\": True,\n                })\n\n    article_titles\
          \ = []\n    article_tags = []\n    quality_scores = []\n    generated_articles_list\
          \ = []\n\n    for item in normalized:\n        if not isinstance(item, dict):\n\
          \            # 数组中的非对象项也按一篇保留，确保结果数组长度与上游输入一致。\n            item = {'content':\
          \ str(item or '')}\n        # 数量一致性：逐条合并上游文章，不因 blocked/_rewrite_required\
          \ 静默丢弃。\n        # 兼容旧版 N8-hard 的占位覆盖：若上游同时保留原文元数据，则恢复原文输出，\n        # 质检状态和重写队列仍通过元数据保留；本节点不生成、不补写文章。\n\
          \        # No strip, regex replacement, truncation, padding, FAQ deletion,\
          \ or\n        # domain fallback is allowed in this merge node.\n       \
          \ title = str(item.get('title', '') or '')\n        content = _upstream_content(item)\n\
          \        tags = item.get('tags', [])\n\n        article_titles.append(title)\n\
          \        generated_articles_list.append(content)\n        article_tags.append(_tag_text(tags))\n\
          \        gate_score = _quality_score(title, content)\n        gate_status\
          \ = str(item.get('_final_validation_status', '') or '').strip()\n      \
          \  gate_issues = item.get('_final_validation_issues', [])\n        if gate_status:\n\
          \            gate_score += ' | 终稿硬校验=' + gate_status\n            if isinstance(gate_issues,\
          \ list) and gate_issues:\n                gate_score += ' | ' + '；'.join(str(x)\
          \ for x in gate_issues[:4])\n        quality_scores.append(gate_score)\n\
          \n    expected_totals = []\n    for item in normalized:\n        if not\
          \ isinstance(item, dict):\n            continue\n        try:\n        \
          \    total = int(item.get('_article_total', 0) or 0)\n        except Exception:\n\
          \            total = 0\n        if total > 0:\n            expected_totals.append(total)\n\
          \    if expected_totals and len(generated_articles_list) != max(expected_totals):\n\
          \        count_issue = f'最终文章数量{len(generated_articles_list)}/{max(expected_totals)}'\n\
          \        quality_scores = [f'❌ 机械检查发现文章数量异常:{count_issue} | {score}' for\
          \ score in quality_scores]\n\n    evidence_parts = []\n    knowledge = str(knowledge_base_evidence\
          \ or '').strip()\n    verified = str(verified_competitor_evidence or '').strip()\n\
          \    detail = str(competitor_detail_evidence or '').strip()\n    if knowledge:\n\
          \        evidence_parts.append(knowledge)\n    competitor_parts = ['【Dify\
          \ v2607e 写文实际使用的竞品 evidence】']\n    if verified:\n        competitor_parts.extend(['##\
          \ 校验后竞品材料', verified])\n    if detail:\n        competitor_parts.extend(['##\
          \ 竞品逐维度详情', detail])\n    if len(competitor_parts) > 1:\n        evidence_parts.append('\\\
          n\\n'.join(competitor_parts))\n\n    blocked_count = len([x for x in normalized\
          \ if isinstance(x, dict) and str(x.get('_final_validation_status', '')).lower()\
          \ == 'blocked'])\n    publishable_count = len([x for x in normalized if\
          \ isinstance(x, dict) and str(x.get('_final_validation_status', '')).lower()\
          \ in ('passed', 'warning')])\n\n    return {\n        'article_titles':\
          \ article_titles,\n        'quality_scores': quality_scores,\n        'article_images':\
          \ [],\n        'evaluation_reports': [],\n        'article_tags': article_tags,\n\
          \        'generated_articles_list': generated_articles_list,\n    'evidence':\
          \ '\\n\\n'.join(evidence_parts),\n        'batch_sufficiency_report': '上游输入{}篇；目标{}篇；输出{}篇；blocked文章{}；可发布文章{}。blocked文章保留正常正文与重写指令，不用占位文案覆盖，也不在结果合并阶段静默丢弃。'.format(\n\
          \        source_count,\n        target_total or source_count,\n        len(generated_articles_list),\n\
          \        blocked_count,\n        publishable_count\n    ),\n    'rewrite_queue':\
          \ [\n        {\n            'rewrite_index': i + 1,\n            'source_title':\
          \ str(x.get('title', '') or ''),\n            'hard_issues': x.get('_final_validation_issues',\
          \ [])[:8] if isinstance(x.get('_final_validation_issues', []), list) else\
          \ [str(x.get('_final_validation_issues', ''))]\n        }\n        for i,\
          \ x in enumerate(normalized)\n        if isinstance(x, dict) and str(x.get('_final_validation_status',\
          \ '')).lower() == 'blocked'\n    ],\n    'final_validation_report': str(final_validation_report\
          \ or ''),\n}"
