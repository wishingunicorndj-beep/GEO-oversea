          \ += 1\n                j -= 1\n            if slash_count % 2 == 0:\n \
          \               tail = raw[i:]\n                if field == 'content' and\
          \ not re.match(\n                    r'\"\\s*(?:,\\s*\"(?:description|tags|self_review|source_compliance)\"\
          \\s*:|[}\\]])',\n                    tail,\n                    re.I,\n\
          \                ):\n                    i += 1\n                    continue\n\
