          \                    matched_plan = plan\n                    bind_method\
          \ = \"keyword_fallback\"\n                    break\n\n        if isinstance(matched_plan,\
          \ dict):\n            article = _copy_plan_contract_v10(article, matched_plan,\
          \ bind_method)\n            plan_idx = _plan_index_v10(matched_plan)\n \
          \           if plan_idx is not None:\n                used_plan_indexes.add(plan_idx)\n\
          \            if _is_content_filter_v23(article.get('content')) or _is_content_filter_v23(article.get('title'))\
          \ or not str(article.get('content', '') or '').strip():\n              \
          \  article['_generation_status'] = 'content_filter'\n                article['_rewrite_required']\
