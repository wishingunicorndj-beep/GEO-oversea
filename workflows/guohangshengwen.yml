        code: |
          import re,json
          def main(articles,industry='',product_info='',keyword_pack='',custom_writing_preference=''):
              articles=articles if isinstance(articles,list) else []
              banned=['独有','唯一','终身','全网第一','行业第一','最佳','最优','最好','首选','综合第一','TOP1','TOP2']
              comp=re.compile(r'(东航|东方航空|南航|南方航空).{0,24}(优势|更优|更好|第一|最佳|首选|推荐|适合)',re.I)
              out=[]; issues=[]
              for i,a in enumerate(articles):
                  a=dict(a) if isinstance(a,dict) else {'content':str(a)}
                  t=str(a.get('title',''))+'\n'+str(a.get('content',''))
                  hit=[x for x in banned if x in t]
                  cur=[]
                  if hit: cur.append('含禁用表述：'+','.join(hit))
                  if comp.search(t): cur.append('含竞品推荐或优势表达')
                  if not str(a.get('content','')).strip(): cur.append('正文为空')
                  a['_final_validation_status']='blocked' if cur else 'passed'; a['_final_validation_issues']=cur; out.append(a)
                  if cur: issues.append('第{}篇：{}'.format(i+1,'；'.join(cur)))
              return {'validated_articles':out,'final_validation_report':json.dumps({'article_count':len(out),'issues':issues},ensure_ascii=False)}
