    - data:
        code: |
          """
          品牌词生文支线 - 节点 7-5a：放在 7-4 LLM清洗之后（"有问题"分支）
          输入变量配置：
            - n7_text → 7-1 AI生文节点的 text 输出
            - clean_out → 7-4 LLM清洗节点的 text 输出
          输出变量：structured_output
          """

          import re
          import json as _json

          def _strip_think(raw):
              if not raw:
                  return ''
              s = re.sub(r'<think>.*?</think>', '', raw, flags=re.S | re.I)
              if '</think>' in s:
                  s = s.split('</think>')[-1]
              if '<think>' in s:
                  s = re.sub(r'<think>.*', '', s, flags=re.S | re.I)
              return s

          def _extract_html(s):
              if not s:
                  return ''
              m = re.search(r'<(?:p|h[1-4])[\s>].*</(?:p|ul|ol|h[1-4])>', s, flags=re.S | re.I)
              return m.group(0).strip() if m else s.strip()

          def main(n7_text, clean_out):
              if isinstance(clean_out, str):
                  try:
                      _cm = re.search(r'\{.*\}', _strip_think(clean_out), re.S)
                      clean_out = _json.loads(_cm.group(0), strict=False) if _cm else {}
                  except Exception:
                      clean_out = {}
              if not isinstance(clean_out, dict):
                  clean_out = {}

              title = clean_out.get('title', '') or ''
              content = clean_out.get('content', '') or ''
              description = clean_out.get('description', '') or ''
              tags = clean_out.get('tags', []) or []
              self_review = clean_out.get('self_review', '') or ''

              plain = re.sub(r'<[^>]+>', '', content).strip()

              n7_clean = _extract_html(_strip_think(n7_text or ''))
              n7_plain = re.sub(r'<[^>]+>', '', n7_clean).strip()

              markers = ['（原样）', '(原样)', '内容不变', '同上', '此处省略', '保持原文', '其余略', '(略)', '（略）']
              has_ph = any(m in content for m in markers) or content.strip().endswith('原样')
              too_short = len(plain) < 800
              has_think = '<think>' in content or '</think>' in content
              broken = too_short or has_ph or has_think

              if broken and len(n7_plain) > max(len(plain), 800):
                  _n7j = {}
                  try:
                      _mj = re.search(r'\{.*\}', _strip_think(n7_text or ''), re.S)
                      if _mj:
                          _n7j = _json.loads(_mj.group(0), strict=False)
                  except Exception:
                      _n7j = {}
                  _jc = (_n7j.get('content') or '').strip()
                  if _jc:
                      content = _strip_think(_jc)
                      if '<think>' in content or '</think>' in content:
                          content = _extract_html(_strip_think(content))
                  else:
                      content = n7_clean
                  if not title or len(title.strip()) < 5:
                      title = (_n7j.get('title') or '').strip()
                  if not title or len(title.strip()) < 5:
                      m = re.search(r'<h2[^>]*>(.*?)</h2>', content, re.S)
                      if m:
                          title = re.sub(r'<[^>]+>', '', m.group(1)).strip()
                  if not description:
                      description = (_n7j.get('description') or '').strip() or re.sub(r'<[^>]+>', '', content)[:120].strip()
                  if not tags:
                      _t = _n7j.get('tags') or []
                      if isinstance(_t, list) and _t:
                          tags = _t
                  skipped = (len(plain) == 0)
                  if skipped:
                      self_review = '[守护]预检无问题,跳过改写直接采用N7原文(已去思考链/抠正文)'
                  else:
                      reason = '占位符' if has_ph else ('残留思考链' if has_think else '过短')
                      self_review = '[守护]cleanup异常(%s),已回退N7原文(已去思考链/抠正文)' % reason
              else:
                  if has_think:
                      content = _extract_html(_strip_think(content))

              return {'structured_output': {
                  'title': title, 'content': content, 'description': description,
                  'tags': tags, 'self_review': self_review
              }}
