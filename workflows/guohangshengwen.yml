          \            '内蒙古','广西','西藏','宁夏','新疆','北京','天津','上海','重庆','河北','山西','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','海南','四川','贵州','云南','陕西','甘肃','青海',\n\
          \            '广州','深圳','成都','杭州','武汉','南京','西安','郑州','长沙','苏州','东莞','青岛','沈阳','大连','哈尔滨','长春','济南','厦门','福州','昆明','贵阳','南宁','合肥','石家庄','太原','兰州','南昌','乌鲁木齐','呼和浩特','海口','银川','西宁','拉萨','珠海','佛山','中山','惠州','无锡','常州','温州','宁波','嘉兴','绍兴','金华','台州','泉州','漳州','烟台','潍坊','临沂','徐州','扬州','泰州','镇江','盐城','芜湖','洛阳','襄阳','宜昌','岳阳','株洲','柳州','桂林','保定','唐山','廊坊','邯郸','秦皇岛','承德','张家口','邢台','衡水','沧州',\n\
          \            '香港','澳门','台湾','港澳台','华东','华南','华北','华中','东北','西北','西南','长三角','珠三角','京津冀','大湾区','环渤海','成渝',\n\
          \        ]\n        regions = sorted(set(regions), key=len, reverse=True)\n\
          \        # 业务词分为生产采购类、本地服务类、门店交易类；“推荐/排名/对比”等仅为意图修饰，不单独触发地域。\n        business_re\
          \ = re.compile(r'(?:厂家|供应商|生产商|制造商|服务商|经销商|代理商|加工(?:厂|商|服务)?|采购|批发|零售|报价|选型|维修|安装|施工|培训|机构|平台|中心|回收|收购|店铺|门店|实体店|商家|门店|鉴定|估价|寄售|典当行|二手|上门|同城|维修店|服务店|展厅|营业厅|网点|租赁|家政|搬家|保洁|培训机构|医院|诊所|律师事务所|旅行社)')\n\
