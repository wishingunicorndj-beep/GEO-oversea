    - data:
        code: "\"\"\"国航文章机械检查；部署时嵌入 Dify 代码节点，不依赖本地文件。\"\"\"\nimport html\nimport\
          \ json\nimport re\nfrom html.parser import HTMLParser\n\nFIELDS = ('title',\
          \ 'content', 'description', 'tags', 'self_review')\nBANNED = ('独有', '唯一',\
          \ '终身', '全网第一', '行业第一', '最佳', '最优',\n          '最好', '首选', '综合第一', 'TOP1',\
          \ 'TOP2')\nMIN_LENGTH, MAX_LENGTH = 2500, 4200\nCOMPETITOR = r'(?<!山)(?:东航|东方航空|南航|南方航空)'\n\
          OFFICIAL_MEMBER_TERM = re.compile(r'(?:年度卓越)?终身白金卡')\nMARKDOWN_LINK = re.compile(r'\\\
          [[^\\]]+\\]\\([^)]*\\)')\nCATEGORY_BRAND_IN_TITLE = re.compile(r'(?:中国国际航空|国航|凤凰知音)')\n\
          CATEGORY_COMPARISON_CUE = re.compile(r'(?:选择参考|选哪个|哪家|哪个好|对比|比较|推荐|排名)')\n\
          \n\nclass _Body(HTMLParser):\n    def __init__(self):\n        super().__init__(convert_charrefs=True)\n\
          \        self.text, self.stack, self.errors = [], [], []\n        self.counts\
          \ = {}\n\n    def handle_starttag(self, tag, attrs):\n        self.counts[tag]\
          \ = self.counts.get(tag, 0) + 1\n        if tag in ('script', 'style', 'iframe'):\n\
          \            self.errors.append('正文含非文章标签：' + tag)\n        if tag not in\
          \ ('br', 'hr', 'img', 'input', 'meta', 'link', 'wbr', 'source'):\n     \
          \       self.stack.append(tag)\n\n    def handle_startendtag(self, tag,\
          \ attrs):\n        self.handle_starttag(tag, attrs)\n        if self.stack\
          \ and self.stack[-1] == tag:\n            self.handle_endtag(tag)\n\n  \
          \  def handle_endtag(self, tag):\n        if not self.stack or self.stack[-1]\
          \ != tag:\n            self.errors.append('HTML标签闭合或嵌套异常：' + tag)\n    \
          \    else:\n            self.stack.pop()\n        if tag in ('p', 'li',\
          \ 'h2', 'h3', 'h4', 'td', 'th'):\n            self.text.append('\\n')\n\n\
          \    def handle_data(self, data):\n        self.text.append(data)\n\n\n\
          def parse_article(raw):\n    if isinstance(raw, dict):\n        return dict(raw)\n\
          \    if not isinstance(raw, str):\n        raise ValueError('文章输出不是JSON对象或文本')\n\
          \    raw = re.sub(r'<think>.*?</think>', '', raw, flags=re.S | re.I).strip()\n\
          \    fence = re.fullmatch(r'```(?:json)?\\s*([\\s\\S]*?)\\s*```', raw, re.I)\n\
          \    if fence:\n        raw = fence.group(1)\n    try:\n        article\
          \ = json.loads(raw)\n    except (ValueError, TypeError):\n        raise\
          \ ValueError('文章JSON不完整或无法解析，需要重新输出完整对象')\n    if not isinstance(article,\
          \ dict):\n        raise ValueError('文章必须是单个JSON对象')\n    return article\n\
          \n\ndef _snippet(text, start, end):\n    return re.sub(r'\\s+', ' ', text[max(0,\
          \ start - 20):end + 35]).strip()\n\n\ndef _category_title_issues(article,\
          \ body):\n    \"\"\"品类标题保持品类范围，不把目标品牌拼成第二主题。\"\"\"\n    title = article['title'].strip()\n\
          \    issues = []\n    allow_target_brand = bool(re.search(r'(?:怎么选|如何选|选哪个|哪家|哪个好|值得|推荐)',\
          \ title))\n    if CATEGORY_BRAND_IN_TITLE.search(title) and not allow_target_brand:\n\
          \        issues.append('品类词标题不应追加目标品牌或产品名称：请保留品类主题，品牌内容放入正文')\n    if CATEGORY_COMPARISON_CUE.search(title):\n\
          \        headings = re.findall(r'<h[23][^>]*>(.*?)</h[23]>', article['content'],\
          \ re.I | re.S)\n        heading_text = re.sub(r'<[^>]+>', '', ' '.join(headings))\n\
          \        if not re.search(r'(?:判断|选择|适用|维度|服务|权益|规则|差异|对比|比较)', heading_text):\n\
          \            issues.append('标题包含选择或比较意图，但正文没有对应的判断维度或事实说明')\n    return\
          \ issues\n\n\ndef inspect_article(article, mode):\n    issues = []\n   \
          \ for name in FIELDS:\n        value = article.get(name)\n        if name\
          \ == 'tags':\n            if not isinstance(value, list) or any(not isinstance(x,\
          \ str) for x in value):\n                issues.append('tags必须是字符串数组')\n\
          \        elif not isinstance(value, str):\n            issues.append(name\
          \ + '必须是字符串')\n    if issues:\n        return issues, 0\n    parser = _Body()\n\
          \    parser.feed(article['content'])\n    parser.close()\n    body = ''.join(parser.text)\n\
          \    length = len(re.sub(r'\\s+', '', body))\n    min_length, max_length\
          \ = (2200, 2650) if mode == 'brand' else ((2800, 3500) if mode == 'anniversary'\
          \ else (MIN_LENGTH, MAX_LENGTH))\n    if length < min_length:\n        issues.append('正文过短：{}字，本线路最低{}字'.format(length,\
          \ min_length))\n    elif length > max_length:\n        issues.append('正文过长：{}字，本线路上限{}字；请删除重复解释并保留事实限定'.format(length,\
          \ max_length))\n    if not 20 <= len(article['title'].strip()) <= 38:\n\
          \        issues.append('标题长度异常：{}字，要求20—38字'.format(len(article['title'].strip())))\n\
          \    if mode == 'category':\n        issues.extend(_category_title_issues(article,\
          \ body))\n    h2_count = parser.counts.get('h2', 0)\n    if mode == 'brand'\
          \ and h2_count != 5:\n        issues.append('品牌词正文结构异常：必须且只能有5个h2部分，当前{}个'.format(h2_count))\n\
          \    elif mode == 'anniversary' and h2_count != 8:\n        issues.append('32周年正文结构异常：必须有8个h2章节，当前{}个'.format(h2_count))\n\
          \    elif mode == 'category' and h2_count < 5:\n        issues.append('正文结构不足：至少需要5个h2章节')\n\
          \    if not parser.counts.get('p', 0):\n        issues.append('正文缺少p段落')\n\
          \    if MARKDOWN_LINK.search(article['content']):\n        issues.append('正文含Markdown链接，必须改为HTML链接或纯文本网址')\n\
          \    issues.extend(dict.fromkeys(parser.errors))\n    if parser.stack:\n\
          \        issues.append('HTML标签未闭合：' + ','.join(parser.stack[-5:]))\n\n \
          \   # 客户尚未授权正式名称或否定句豁免；只报告位置，不机械改写事实。\n    visible = {'标题': article['title'],\
          \ '正文': body,\n               '摘要': article['description'], '标签': ' '.join(article['tags'])}\n\
          \    for field, value in visible.items():\n        for word in BANNED:\n\
          \            matches = list(re.finditer(re.escape(word), value, re.I))\n\
          \            if matches:\n                official_matches = []\n      \
          \          normal_matches = []\n                for match in matches:\n\
          \                    left = max(0, match.start() - 4)\n                \
          \    right = min(len(value), match.end() + 4)\n                    context\
          \ = value[left:right]\n                    if ((word == '终身' and OFFICIAL_MEMBER_TERM.search(context))\n\
          \                            or (word == '唯一' and re.search(r'中国唯一载国旗飞行的民用航空公司',\
          \ value[max(0, match.start()-6):min(len(value), match.end()+24)]))\n   \
          \                         or (word == '终身' and re.search(r'终身有效(?:无需保级)?',\
          \ value[max(0, match.start()-2):min(len(value), match.end()+8)]))):\n  \
          \                      official_matches.append(match)\n                \
          \    else:\n                        normal_matches.append(match)\n     \
          \           # 正式会员名称属于材料事实，不作为禁用词阻断；仅拦截普通语境中的绝对化表达。\n                if\
          \ normal_matches:\n                    contexts = ' / '.join(_snippet(value,\
          \ m.start(), m.end()) for m in normal_matches[:2])\n                   \
          \ issues.append('{}含禁用词“{}”({}处)：{}'.format(field, word, len(normal_matches),\
          \ contexts))\n        if mode == 'brand':\n            match = re.search(COMPETITOR,\
          \ value, re.I)\n            if match:\n                issues.append('品牌词文章出现竞品：'\
          \ + _snippet(value, match.start(), match.end()))\n        else:\n      \
          \      # 按句扫描，避免跨越HTML段落匹配相邻但无关的品牌。\n            for sentence in re.split(r'[。！？；\\\
          n]', value):\n                pattern = COMPETITOR + r'.{0,40}(优势|更优|更好|优于|胜过|领先|第一|最佳|首选|推荐|适合|值得选择)'\n\
          \                match = re.search(pattern, sentence, re.I)\n          \
          \      if match:\n                    issues.append('疑似竞品优势或推荐，需定点复核：' +\
          \ _snippet(sentence, match.start(), match.end()))\n                    break\n\
          \    if re.search(r'<think>|</think>|此处省略|其余略|\\(略\\)|（略）|\\{\\{#', article['content'],\
          \ re.I):\n        issues.append('正文含思考标签、占位符或内部变量')\n    return list(dict.fromkeys(issues)),\
          \ length\n\n\ndef structural_gate(articles):\n    \"\"\"只检查结构和格式；不改写正文，不处理业务禁词。\"\
          \"\"\n    if not isinstance(articles, list) or not articles:\n        raise\
          \ ValueError('文章结构闸门未通过：没有可校验的文章')\n    cleaned = []\n    errors = []\n\
          \    for index, item in enumerate(articles, 1):\n        try:\n        \
          \    article = parse_article(item)\n            if article.get('_keyword_mode',\
          \ '') not in ('brand', 'category', 'anniversary'):\n                raise\
          \ ValueError('缺少有效的品牌/品类/32周年来源标签')\n            issues, _ = inspect_article(article,\
          \ article.get('_keyword_mode', ''))\n            structural = [issue for\
          \ issue in issues if any(key in issue for key in (\n                '必须是',\
          \ '文章必须', '正文含Markdown链接', '正文含思考标签',\n                'HTML标签', '正文含非文章标签',\
          \ '正文缺少p段落',\n                '正文结构不足', '文章缺少有效的品牌/品类来源标签'))]\n        \
          \    if structural:\n                errors.append('第{}篇：{}'.format(index,\
          \ '；'.join(structural)))\n            else:\n                article['_structural_validation']\
          \ = 'passed'\n                cleaned.append(article)\n        except ValueError\
          \ as exc:\n            errors.append('第{}篇：{}'.format(index, exc))\n   \
          \ if errors:\n        raise ValueError('文章结构闸门未通过：' + ' | '.join(errors)[:4000])\n\
          \    return {'cleaned_articles': cleaned}\n\n\ndef precheck(raw, mode):\n\
          \    try:\n        article = parse_article(raw)\n        issues, length\
          \ = inspect_article(article, mode)\n    except ValueError as exc:\n    \
          \    issues, length = [str(exc)], 0\n    return {'issues': '\\n'.join(issues)\
          \ if issues else '无机械问题',\n            'has_issues': int(bool(issues)),\
          \ 'content_len': length}\n\n\ndef accept_article(raw, mode):\n    article\
          \ = parse_article(raw)\n    issues, _ = inspect_article(article, mode)\n\
          \    if issues:\n        raise ValueError('文章修复后复检未通过：' + '；'.join(issues)[:3000])\n\
          \    return {'structured_output': {name: article[name] for name in FIELDS}}\n\
          \n\ndef final_gate(articles):\n    if not isinstance(articles, list) or\
          \ not articles:\n        raise ValueError('终稿硬校验未通过：没有可校验的文章')\n    out,\
          \ errors = [], []\n    for i, item in enumerate(articles, 1):\n        try:\n\
          \            article = parse_article(item)\n            mode = article.get('_keyword_mode',\
          \ '')\n            if mode not in ('brand', 'category', 'anniversary'):\n\
          \                issues = ['文章缺少有效的品牌/品类/32周年来源标签']\n            else:\n\
          \                issues, _ = inspect_article(article, mode)\n          \
          \  if issues:\n                errors.append('第{}篇：{}'.format(i, '；'.join(issues)))\n\
          \            else:\n                article['_final_validation_status']\
          \ = 'passed'\n                article['_final_validation_issues'] = []\n\
          \                out.append(article)\n        except ValueError as exc:\n\
          \            errors.append('第{}篇：{}'.format(i, exc))\n    if errors:\n \
          \       raise ValueError('终稿硬校验未通过：' + ' | '.join(errors)[:4000])\n    return\
          \ {'validated_articles': out,\n            'final_validation_report': json.dumps({'article_count':\
          \ len(out), 'issues': []}, ensure_ascii=False)}\n\n\ndef main(articles,\
          \ industry='', product_info='', keyword_pack='', custom_writing_preference=''):\n\
          \    source = articles if isinstance(articles, list) and articles else [None]\n\
          \    validated, errors = [], []\n    for index, item in enumerate(source,\
          \ 1):\n        try:\n            validated.append(final_gate([item])['validated_articles'][0])\n\
          \        except ValueError as exc:\n            message = str(exc).replace('第1篇：',\
          \ '第{}篇：'.format(index), 1)\n            article = dict(item) if isinstance(item,\
          \ dict) else {\n                'title': '', 'content': str(item or ''),\
          \ 'description': '', 'tags': [], 'self_review': ''\n            }\n    \
          \        article['_final_validation_status'] = 'failed'\n            article['_final_validation_issues']\
          \ = [message]\n            risk = '风险提示：' + message\n            article['self_review']\
          \ = (str(article.get('self_review', '') or '').strip('；') + '；' + risk).strip('；')\n\
          \            validated.append(article)\n            errors.append(message)\n\
          \    return {\n        'validated_articles': validated,\n        'final_validation_report':\
          \ json.dumps({\n            'article_count': len(validated),\n         \
          \   'status': 'failed' if errors else 'passed',\n            'issues': errors,\n\
          \        }, ensure_ascii=False),\n    }\n"
