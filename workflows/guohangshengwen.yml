          \"):\n\n    # 0. 输入归一化：兼容\"对比排名\"和\"对比排名类\"两种写法。\n    # 空 article_type 表示“自动混排”，不能用“对比排名类”作为默认值，否则会把整批文章锁死为排名/对比。\n\
          \    _article_type_explicit = bool(str(article_type or '').strip())\n  \
