          \    headings = list(re.finditer(r'<h2\\b[^>]*>[\\s\\S]*?</h2>', content,\
          \ re.I))\n    if len(headings) != 8:\n        issues.append('当前只有{}个h2章节，必须恰好8个'.format(len(headings)))\n\
