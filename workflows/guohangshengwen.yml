        code: "import json\n\ndef _as_list(value):\n    return value if isinstance(value,\
          \ list) else []\n\nimport ast\n\ndef _coerce_article(value, depth=0):\n\
          \    \"\"\"递归兼容Dify迭代器的多层包装、JSON/Python字典字符串。\"\"\"\n    if depth > 8 or\
          \ value is None:\n        return None\n    if isinstance(value, dict):\n\
          \        if 'title' in value or 'content' in value:\n            return\
          \ value\n        for nested in value.values():\n            found = _coerce_article(nested,\
          \ depth + 1)\n            if isinstance(found, dict):\n                return\
          \ found\n        return None\n    if isinstance(value, list):\n        for\
          \ nested in value:\n            found = _coerce_article(nested, depth +\
          \ 1)\n            if isinstance(found, dict):\n                return found\n\
          \        return None\n    if isinstance(value, str):\n        raw = value.strip()\n\
          \        if not raw:\n            return None\n        if raw.startswith('```')\
          \ and raw.endswith('```'):\n            raw = raw[3:-3].strip()\n      \
          \      if raw.lower().startswith('json'):\n                raw = raw[4:].strip()\n\
          \        candidates = [raw]\n        if '{' in raw and '}' in raw:\n   \
          \         candidates.append(raw[raw.find('{'):raw.rfind('}') + 1])\n   \
          \     for candidate in candidates:\n            for parser in (json.loads,\
          \ ast.literal_eval):\n                try:\n                    found =\
          \ _coerce_article(parser(candidate), depth + 1)\n                except\
          \ (TypeError, ValueError, SyntaxError):\n                    continue\n\
          \                if isinstance(found, dict):\n                    return\
          \ found\n        return None\n    return None\n\ndef _bind_articles(articles,\
          \ plans, branch_name):\n    articles = _as_list(articles)\n    plans = _as_list(plans)\n\
          \    if len(articles) != len(plans):\n        raise ValueError('{}线路文章数量异常：计划{}篇，实际{}篇'.format(branch_name,\
          \ len(plans), len(articles)))\n    bound = []\n    for pos, (article, plan)\
          \ in enumerate(zip(articles, plans), 1):\n        article = _coerce_article(article)\n\
          \        if not isinstance(article, dict):\n            raise ValueError('{}线路第{}篇输出不是文章对象'.format(branch_name,\
          \ pos))\n        item = dict(article)\n        title = str(item.get('title',\
          \ '') or '').strip()\n        content = str(item.get('content', '') or '').strip()\n\
          \        if not title or not content:\n            raise ValueError('{}线路第{}篇文章为空或输出协议解析失败'.format(branch_name,\
          \ pos))\n        plan = plan if isinstance(plan, dict) else {}\n       \
          \ item['_article_index'] = plan.get('article_index', plan.get('文章序号', pos))\n\
          \        item['_article_total'] = plan.get('article_total', len(plans))\n\
          \        item['_keyword'] = plan.get('keyword', plan.get('关键词', ''))\n \
          \       item['_keyword_mode'] = plan.get('keyword_mode', '')\n        item['allow_target_brand_in_title']\
          \ = bool(plan.get('allow_target_brand_in_title', False))\n        bound.append(item)\n\
          \    return bound\n\ndef main(category_articles, brand_articles, anniversary_articles,\
          \ merged_plans):\n    plans = _as_list(merged_plans)\n    category_plans\
          \ = [p for p in plans if isinstance(p, dict) and p.get('keyword_mode') ==\
          \ 'category']\n    brand_plans = [p for p in plans if isinstance(p, dict)\
          \ and p.get('keyword_mode') == 'brand']\n    anniversary_plans = [p for\
          \ p in plans if isinstance(p, dict) and p.get('keyword_mode') == 'anniversary']\n\
          \    combined = _bind_articles(category_articles, category_plans, '品类词')\n\
          \    combined.extend(_bind_articles(brand_articles, brand_plans, '品牌词'))\n\
          \    combined.extend(_bind_articles(anniversary_articles, anniversary_plans,\
          \ '32周年'))\n    combined.sort(key=lambda x: int(x.get('_article_index',\
          \ 0) or 0))\n    if len(combined) != len(plans):\n        raise ValueError('最终文章数量异常：计划{}篇，实际{}篇'.format(len(plans),\
          \ len(combined)))\n    return {'all_articles': combined, 'compliance_mode':\
