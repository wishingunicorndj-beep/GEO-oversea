          \        if plan_idx is None:\n            plan_idx = idx + 1\n        if\
          \ plan_idx in used_plan_indexes:\n            continue\n        empty_slot\
          \ = {\n            'title': '',\n            'content': '',\n          \
          \  'description': '',\n            'tags': [],\n            'self_review':\
          \ '',\n            '_generation_status': 'missing_iteration_output',\n \
          \           '_rewrite_required': True,\n            '_title_source_v23':\
          \ 'empty_slot',\n        }\n        empty_slot = _copy_plan_contract_v10(empty_slot,\
          \ plan, 'missing_iteration_output')\n        all_articles.append(empty_slot)\n\
          \        used_plan_indexes.add(plan_idx)\n        missing_slots -= 1\n\n\
          \    # 仅当序号完整且唯一时排序；否则保持上游输入顺序，避免错误序号导致正常文章错位。\n    current_indices = [_article_index_v10(x)\
          \ for x in all_articles]\n    if (current_indices and all(x is not None\
