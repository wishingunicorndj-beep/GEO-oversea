    - data:
        code: |-
          import json
          import re
          from html.parser import HTMLParser

          FIELDS = ('title', 'content', 'description', 'tags', 'self_review')
          MARKDOWN_LINK = re.compile(r'\[[^\]]+\]\([^)]*\)')

          class _Body(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.counts = {}
                  self.errors = []

              def handle_starttag(self, tag, attrs):
                  self.counts[tag] = self.counts.get(tag, 0) + 1
                  if tag in ('script', 'style', 'iframe'):
                      self.errors.append('正文含非文章标签：' + tag)
                  if tag not in ('br', 'hr', 'img', 'input', 'meta', 'link', 'wbr', 'source'):
                      self.stack.append(tag)

              def handle_endtag(self, tag):
                  if not self.stack or self.stack[-1] != tag:
                      self.errors.append('HTML标签闭合或嵌套异常：' + tag)
                  else:
                      self.stack.pop()

          def _parse(raw):
              if isinstance(raw, dict):
                  return dict(raw)
              if not isinstance(raw, str):
                  raise ValueError('文章输出不是JSON对象或文本')
              try:
                  article = json.loads(raw)
              except (ValueError, TypeError):
                  raise ValueError('文章JSON不完整或无法解析')
              if not isinstance(article, dict):
                  raise ValueError('文章必须是单个JSON对象')
              return article

          def main(articles, compliance_mode: str = 'standard', ent_body: str = '', prod_body: str = '', custom_writing_distribution: str = '', custom_writing_preference_raw: str = '', company_name: str = '', verified_competitor_text: str = ''):
              if not isinstance(articles, list) or not articles:
                  raise ValueError('文章结构闸门未通过：没有可校验的文章')
              cleaned_articles = []
              errors = []
              for index, item in enumerate(articles, 1):
                  try:
                      article = _parse(item)
                      missing = [field for field in FIELDS if field not in article]
                      mode = article.get('_keyword_mode', '')
                      if missing:
                          raise ValueError('缺少字段：' + ','.join(missing))
                      if mode not in ('brand', 'category'):
                          raise ValueError('缺少有效的品牌/品类来源标签')
                      if not isinstance(article['tags'], list) or any(not isinstance(x, str) for x in article['tags']):
                          raise ValueError('tags必须是字符串数组')
                      content = str(article.get('content') or '')
                      if MARKDOWN_LINK.search(content):
                          raise ValueError('正文含Markdown链接，必须改为HTML链接或纯文本网址')
                      if re.search(r'<think>|</think>|此处省略|其余略|\(略\)|（略）|\{\{#', content, re.I):
                          raise ValueError('正文含思考标签、占位符或内部变量')
                      parser = _Body()
                      parser.feed(content)
                      parser.close()
                      if parser.errors or parser.stack:
                          raise ValueError('HTML结构异常：' + '；'.join(parser.errors + (['未闭合：' + ','.join(parser.stack[-5:])] if parser.stack else [])))
                      if not parser.counts.get('p', 0) or parser.counts.get('h2', 0) < 5:
                          raise ValueError('正文结构不足：至少需要p段落和5个h2章节')
                      article['_structural_validation'] = 'passed'
                      if '_compliance_mode' not in article:
                          article['_compliance_mode'] = compliance_mode or 'standard'
                      if '_company_name' not in article and company_name:
                          article['_company_name'] = company_name
                      cleaned_articles.append(article)
                  except ValueError as exc:
                      errors.append('第{}篇：{}'.format(index, exc))
              if errors:
                  raise ValueError('文章结构闸门未通过：' + ' | '.join(errors)[:4000])
              return {'cleaned_articles': cleaned_articles}
        code_language: python3
        desc: "文章结构闸门：检查字段、线路标签、HTML、Markdown链接和占位符，不改写业务内容。"
