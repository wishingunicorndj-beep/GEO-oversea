          \"\n    out = []\n    if val is None:\n        return out\n    if isinstance(val,\
          \ str):\n        txt = _extract_json_text(val)\n        if txt != val and\
          \ txt and txt[0] in \"[{\":\n            try:\n                return _flatten_any_list_v10(json.loads(txt))\n\
          \            except Exception:\n                pass\n        if txt and\
          \ txt.strip().startswith(\"[\"):\n            try:\n                return\
          \ _flatten_any_list_v10(json.loads(txt))\n            except Exception:\n\
          \                pass\n        return [val]\n    if isinstance(val, list):\n\
          \        for item in val:\n            out.extend(_flatten_any_list_v10(item))\n\
          \        return out\n    if isinstance(val, dict):\n        for key in (\"\
          all_articles\", \"cleaned_articles\", \"merged_plans\", \"output\", \"data\"\
          , \"plan\"):\n            if isinstance(val.get(key), list):\n         \
          \       return _flatten_any_list_v10(val.get(key))\n        return [val]\n\
          \    return []\n\n\ndef _safe_plain_v10(value):\n    return re.sub(r\"\\\
          s+\", \"\", str(value or \"\"))\n\n\ndef _is_content_filter_v23(value):\n\
          \    text = str(value or '')\n    return bool(re.search(r'作为AI机器人|无法就这个问题|其他合法且建设性|符合法律和伦理标准',\
          \ text, re.I))\n\n\ndef _article_index_v10(article):\n    for key in (\"\
          _article_index\", \"article_index\", \"文章序号\"):\n        val = article.get(key)\
          \ if isinstance(article, dict) else None\n        try:\n            if val\
          \ not in (\"\", None):\n                return int(val)\n        except\
          \ Exception:\n            pass\n    return None\n\n\ndef _plan_index_v10(plan):\n\
          \    for key in (\"article_index\", \"文章序号\", \"_article_index\"):\n   \
          \     val = plan.get(key) if isinstance(plan, dict) else None\n        try:\n\
          \            if val not in (\"\", None):\n                return int(val)\n\
          \        except Exception:\n            pass\n    return None\n\n\n\ndef\
          \ _target_total_v23(plans, articles):\n    \"\"\"计划输入是篇数唯一事实源；仅在没有计划总数时才读取文章元数据。\"\
          \"\"\n    def totals_from(items):\n        totals = []\n        for item\
          \ in items or []:\n            if not isinstance(item, dict):\n        \
          \        continue\n            for key in (\"article_total\", \"_article_total\"\
          ):\n                try:\n                    value = int(item.get(key,\
          \ 0) or 0)\n                except Exception:\n                    value\
          \ = 0\n                if value > 0:\n                    totals.append(value)\n\
          \        return totals\n\n    plan_totals = totals_from(plans)\n    if plan_totals:\n\
          \        return max(plan_totals)\n    article_totals = totals_from(articles)\n\
          \    return max(article_totals) if article_totals else 0\n\n\ndef _copy_plan_contract_v10(article,\
          \ plan, bind_method):\n    if not isinstance(article, dict) or not isinstance(plan,\
          \ dict):\n        return article\n    mode = plan.get(\"compliance_mode\"\
          , article.get(\"_compliance_mode\", \"standard\") or \"standard\")\n   \
          \ article[\"_compliance_mode\"] = mode\n    for key in PLAN_CARRY_KEYS_V10:\n\
          \        if key in plan:\n            article[\"_\" + key] = plan.get(key)\n\
          \    article[\"_plan_bind_method_v10\"] = bind_method\n    return article\n\
          \n\ndef main(articles: list, merged_plans: list) -> dict:\n    \"\"\"\n\
          \    合并所有分支文章，并把每篇文章重新绑定到本篇 plan。\n    V10 重点：聚合器可能嵌套、分支顺序可能错位、标题可能不含 keyword，因此本次特殊需求合约优先按顺序/序号保真。\n\
          \    \"\"\"\n    articles = _flatten_any_list_v10(articles)\n    merged_plans\
          \ = [p for p in _flatten_any_list_v10(merged_plans) if isinstance(p, dict)]\n\
          \n    any_custom = any(bool(p.get(\"custom_policy_active\")) for p in merged_plans\
          \ if isinstance(p, dict))\n\n    plan_by_index = {}\n    plan_map = {}\n\
          \    for p in merged_plans:\n        idx = _plan_index_v10(p)\n        if\
          \ idx is not None and idx not in plan_by_index:\n            plan_by_index[idx]\
          \ = p\n        kw = p.get(\"keyword\", \"\")\n        if kw:\n         \
          \   plan_map[kw] = p\n\n    all_articles = []\n    used_plan_indexes = set()\n\
          \    for i, text in enumerate(articles):\n        article = _parse_article(text)\n\
          \        upstream_title_v23 = str(article.get(\"title\", \"\") or \"\")\n\
          \n        matched_plan = None\n        bind_method = \"\"\n        art_idx\
          \ = _article_index_v10(article)\n        if art_idx is not None and art_idx\
          \ in plan_by_index:\n            matched_plan = plan_by_index[art_idx]\n\
          \            bind_method = \"article_index\"\n\n        # 无 article_index\
          \ 时按迭代输出顺序绑定；不得用标题关键词猜测并重排已有文章。\n        # 标题可能被 LLM 改写、包含多个关键词，关键词匹配会把正文绑定到错误篇位。\n\
          \        if matched_plan is None and i < len(merged_plans):\n          \
          \  matched_plan = merged_plans[i]\n            bind_method = \"custom_order\"\
          \ if any_custom else \"order_no_index\"\n\n        # 仅当没有可用的顺序计划时，才允许使用关键词作为最后兜底绑定方式。\n\
          \        if matched_plan is None:\n            art_title = article.get(\"\
