          \ len(current_indices)):\n        all_articles.sort(key=lambda x: _article_index_v10(x))\n\
          \n\n    # V23 最终数量守卫：只限制数组数量；不按 article_index 去重，不替换已有文章对象。\n    target_total\
          \ = _target_total_v23(merged_plans, all_articles)\n    if target_total >\
          \ 0:\n        # 输入数量已达目标时，纯聚合原则：不去重、不重排、不生成替代文章。\n        if len(all_articles)\
