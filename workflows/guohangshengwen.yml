                  except ValueError as exc:
                      errors.append('第{}篇：{}'.format(index, exc))
              if errors:
                  raise ValueError('文章结构闸门未通过：' + ' | '.join(errors)[:4000])
              return {'cleaned_articles': cleaned}
          
          
          def precheck(raw, mode):
