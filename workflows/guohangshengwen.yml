    - data:
        code: |
          import json
          import re
          from typing import Any


          PLAN_CARRY_KEYS_V10 = [
              "custom_article_group", "custom_required_competitors", "custom_writing_instruction",
              "custom_cost_performance_highest", "competitor_names", "company_name",
              "article_index", "article_total",
              "custom_competitor_alias_mode", "custom_faq_required", "custom_faq_policy_active", "custom_run_scoped",
              "custom_policy_active", "custom_raw_preference",
              "custom_address_required_each_article", "custom_comparison_required", "custom_competitor_variation_required",
              "custom_doctor_qualification_focus", "custom_comparison_targets",
              "custom_comparison_target_mode", "custom_competitor_gap_note", "custom_contract_summary",
              "custom_source_of_truth", "keyword", "compliance_mode", "content_mode", "industry", "region",
              "title_intent", "title_angle", "title_syntax", "title_forbidden_tails",
          ]


          def _extract_json_text(text: str) -> str:
              """从 LLM 输出中抽取合法 JSON 字符串，兼容 markdown code block 包裹。"""
              if not text or not isinstance(text, str):
                  return text

              text = text.strip()

              for pattern in [
                  r'```json\s*(\{.*\})\s*```',
                  r'```\s*(\{.*\})\s*```',
                  r'```json\s*(\[.*\])\s*```',
                  r'```\s*(\[.*\])\s*```',
              ]:
                  m = re.search(pattern, text, re.S)
                  if m:
                      return m.group(1)

              cleaned = text.replace("```json", "").replace("```", "").strip()
              if cleaned.startswith("{") or cleaned.startswith("["):
                  return cleaned

              brace_start = cleaned.find("{")
              if brace_start >= 0:
                  depth = 0
                  for i, ch in enumerate(cleaned[brace_start:], brace_start):
                      if ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return cleaned[brace_start : i + 1]

              bracket_start = cleaned.find("[")
              if bracket_start >= 0:
                  depth = 0
                  for i, ch in enumerate(cleaned[bracket_start:], bracket_start):
                      if ch == "[":
                          depth += 1
                      elif ch == "]":
                          depth -= 1
                          if depth == 0:
                              return cleaned[bracket_start : i + 1]

              return text


          def _parse_article(text: Any) -> dict:
              """把单篇文章的 LLM 输出解析为 dict，兼容各种包裹格式。"""
              if isinstance(text, dict):
                  return text

              if not isinstance(text, str) or not text.strip():
                  return {"title": "", "content": str(text or ""), "tags": [], "description": "", "self_review": ""}

              json_text = _extract_json_text(text)

              try:
                  article = json.loads(json_text)
                  if isinstance(article, dict):
                      return article
              except (json.JSONDecodeError, TypeError):
                  pass

              brace_start = json_text.find("{")
              if brace_start > 0:
                  try:
                      article = json.loads(json_text[brace_start:])
                      if isinstance(article, dict):
                          return article
                  except (json.JSONDecodeError, TypeError):
                      pass

              return {"title": "", "content": text, "tags": [], "description": "", "self_review": ""}


          def _flatten_any_list_v10(val: Any) -> list:
              """递归压平 Dify 聚合器可能产生的 array[array[object/string]]。"""
              out = []
              if val is None:
                  return out
              if isinstance(val, str):
                  txt = _extract_json_text(val)
                  if txt != val and txt and txt[0] in "[{":
                      try:
                          return _flatten_any_list_v10(json.loads(txt))
                      except Exception:
                          pass
                  if txt and txt.strip().startswith("["):
                      try:
                          return _flatten_any_list_v10(json.loads(txt))
                      except Exception:
                          pass
                  return [val]
              if isinstance(val, list):
                  for item in val:
                      out.extend(_flatten_any_list_v10(item))
                  return out
              if isinstance(val, dict):
                  for key in ("all_articles", "cleaned_articles", "merged_plans", "output", "data", "plan"):
                      if isinstance(val.get(key), list):
                          return _flatten_any_list_v10(val.get(key))
                  return [val]
              return []


          def _safe_plain_v10(value):
              return re.sub(r"\s+", "", str(value or ""))


          def _is_content_filter_v23(value):
              text = str(value or '')
              return bool(re.search(r'作为AI机器人|无法就这个问题|其他合法且建设性|符合法律和伦理标准', text, re.I))


          def _article_index_v10(article):
              for key in ("_article_index", "article_index", "文章序号"):
                  val = article.get(key) if isinstance(article, dict) else None
                  try:
                      if val not in ("", None):
                          return int(val)
                  except Exception:
                      pass
              return None


          def _plan_index_v10(plan):
              for key in ("article_index", "文章序号", "_article_index"):
                  val = plan.get(key) if isinstance(plan, dict) else None
                  try:
                      if val not in ("", None):
                          return int(val)
                  except Exception:
                      pass
              return None



          def _target_total_v23(plans, articles):
              """计划输入是篇数唯一事实源；仅在没有计划总数时才读取文章元数据。"""
              def totals_from(items):
                  totals = []
                  for item in items or []:
                      if not isinstance(item, dict):
                          continue
                      for key in ("article_total", "_article_total"):
                          try:
                              value = int(item.get(key, 0) or 0)
                          except Exception:
                              value = 0
                          if value > 0:
                              totals.append(value)
                  return totals

              plan_totals = totals_from(plans)
              if plan_totals:
                  return max(plan_totals)
              article_totals = totals_from(articles)
              return max(article_totals) if article_totals else 0


          def _copy_plan_contract_v10(article, plan, bind_method):
              if not isinstance(article, dict) or not isinstance(plan, dict):
                  return article
              mode = plan.get("compliance_mode", article.get("_compliance_mode", "standard") or "standard")
              article["_compliance_mode"] = mode
              for key in PLAN_CARRY_KEYS_V10:
                  if key in plan:
                      article["_" + key] = plan.get(key)
              article["_plan_bind_method_v10"] = bind_method
              return article


          def main(articles: list, merged_plans: list) -> dict:
              """
              合并所有分支文章，并把每篇文章重新绑定到本篇 plan。
              V10 重点：聚合器可能嵌套、分支顺序可能错位、标题可能不含 keyword，因此本次特殊需求合约优先按顺序/序号保真。
              """
              articles = _flatten_any_list_v10(articles)
              merged_plans = [p for p in _flatten_any_list_v10(merged_plans) if isinstance(p, dict)]

              any_custom = any(bool(p.get("custom_policy_active")) for p in merged_plans if isinstance(p, dict))

              plan_by_index = {}
              plan_map = {}
              for p in merged_plans:
                  idx = _plan_index_v10(p)
                  if idx is not None and idx not in plan_by_index:
                      plan_by_index[idx] = p
                  kw = p.get("keyword", "")
                  if kw:
                      plan_map[kw] = p

              all_articles = []
              used_plan_indexes = set()
              for i, text in enumerate(articles):
                  article = _parse_article(text)
                  upstream_title_v23 = str(article.get("title", "") or "")

                  matched_plan = None
                  bind_method = ""
                  art_idx = _article_index_v10(article)
                  if art_idx is not None and art_idx in plan_by_index:
                      matched_plan = plan_by_index[art_idx]
                      bind_method = "article_index"

                  # 无 article_index 时按迭代输出顺序绑定；不得用标题关键词猜测并重排已有文章。
                  # 标题可能被 LLM 改写、包含多个关键词，关键词匹配会把正文绑定到错误篇位。
                  if matched_plan is None and i < len(merged_plans):
                      matched_plan = merged_plans[i]
                      bind_method = "custom_order" if any_custom else "order_no_index"

                  # 仅当没有可用的顺序计划时，才允许使用关键词作为最后兜底绑定方式。
                  if matched_plan is None:
                      art_title = article.get("title", "")
                      for kw, plan in plan_map.items():
                          core_kw = re.sub(r"(推荐|哪家好|哪家值得选|怎么样|好不好)[？??]?$", "", str(kw or "")).strip()
                          if core_kw and core_kw in art_title:
                              matched_plan = plan
                              bind_method = "keyword_fallback"
                              break

                  if isinstance(matched_plan, dict):
                      article = _copy_plan_contract_v10(article, matched_plan, bind_method)
                      plan_idx = _plan_index_v10(matched_plan)
                      if plan_idx is not None:
                          used_plan_indexes.add(plan_idx)
                      if _is_content_filter_v23(article.get('content')) or _is_content_filter_v23(article.get('title')) or not str(article.get('content', '') or '').strip():
                          article['_generation_status'] = 'content_filter'
                          article['_rewrite_required'] = True
                          article['_original_filtered_text'] = str(article.get('content', '') or '')[:300]
                          # 纯聚合节点：只标记状态，不修改上游标题、正文、描述、标签或自评。
                          article['_title_source_v23'] = 'upstream_preserved' if upstream_title_v23.strip() else 'upstream_empty'
                  else:
                      article["_compliance_mode"] = article.get("_compliance_mode", "standard") or "standard"
                      article["_plan_bind_method_v10"] = "unbound"

                  all_articles.append(article)

              # iteration continue-on-error 可能完全没有返回某个失败项；仅在实际文章数不足时补空篇位。
              missing_slots = max(0, len(merged_plans) - len(all_articles))
              for idx, plan in enumerate(merged_plans):
                  if missing_slots <= 0:
                      break
                  plan_idx = _plan_index_v10(plan)
                  if plan_idx is None:
                      plan_idx = idx + 1
                  if plan_idx in used_plan_indexes:
                      continue
                  empty_slot = {
                      'title': '',
                      'content': '',
                      'description': '',
                      'tags': [],
                      'self_review': '',
                      '_generation_status': 'missing_iteration_output',
                      '_rewrite_required': True,
                      '_title_source_v23': 'empty_slot',
                  }
                  empty_slot = _copy_plan_contract_v10(empty_slot, plan, 'missing_iteration_output')
                  all_articles.append(empty_slot)
                  used_plan_indexes.add(plan_idx)
                  missing_slots -= 1

              # 仅当序号完整且唯一时排序；否则保持上游输入顺序，避免错误序号导致正常文章错位。
              current_indices = [_article_index_v10(x) for x in all_articles]
              if (current_indices and all(x is not None for x in current_indices)
                      and len(set(current_indices)) == len(current_indices)):
                  all_articles.sort(key=lambda x: _article_index_v10(x))


              # V23 最终数量守卫：只限制数组数量；不按 article_index 去重，不替换已有文章对象。
              target_total = _target_total_v23(merged_plans, all_articles)
              if target_total > 0:
                  # 输入数量已达目标时，纯聚合原则：不去重、不重排、不生成替代文章。
                  if len(all_articles) == target_total:
                      all_articles = list(all_articles)
                  elif len(all_articles) > target_total:
                      # 超量时只做稳定截断，保留上游文章对象及其全部字段。
                      all_articles = all_articles[:target_total]
                  else:
                      # 少量时只增加空篇位，不生成标题或正文。
                      plan_by_index = {_plan_index_v10(p): p for p in merged_plans if _plan_index_v10(p) is not None}
                      for idx in range(len(all_articles) + 1, target_total + 1):
                          plan = plan_by_index.get(idx, {"article_index": idx, "article_total": target_total})
                          empty_slot = {
                              "title": "",
                              "content": "",
                              "description": "",
                              "tags": [],
                              "self_review": "",
                              "_generation_status": "missing_iteration_output",
                              "_rewrite_required": True,
                              "_title_source_v23": "empty_slot",
                          }
                          all_articles.append(_copy_plan_contract_v10(empty_slot, plan, "final_count_guard"))

              return {"all_articles": all_articles, "compliance_mode": "standard"}
