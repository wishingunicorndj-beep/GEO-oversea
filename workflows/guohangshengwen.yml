    - data:
        code: |
          # -*- coding: utf-8 -*-
          """
          节点 7-5a：数据处理代码节点（最终修复版）

          关键修复：
          1. THINK 标签写正确（<think>...</think> 而非 <!think>）
          2. 简化逻辑：clean_out 有效就直接用，不做不必要的"重建"
          3. markers 占位符仅匹配明确的占位符，不误伤正常文章
          4. 解析 JSON 时优先剥 markdown 围栏（```json ... ```）
          5. content 有效性阈值：合规正文低于2000字才视为短文并回退/重写；2000-2500字为有效范围
          6. JSON 畸形/截断时从原始文本直接提取 HTML 正文兜底
          """
          import re
          import json

          MAX_INPUT_LEN = 200_000

          def _clamp(val):
              if isinstance(val, str) and len(val) > MAX_INPUT_LEN:
                  return val[:MAX_INPUT_LEN]
              return val

          def _strip_think(raw):
              """剥离 <think>...</think> 思考链"""
              if not raw or not isinstance(raw, str):
                  return raw or ''
              s = re.sub(r'<think>.*?</think>', '', raw, flags=re.S | re.I)
              if '</think>' in s:
                  s = s.split('</think>', 1)[-1]
              if '<think>' in s:
                  s = re.sub(r'<think>.*', '', s, flags=re.S | re.I)
              return s

          def _parse_json(text):
              """从字符串中提取并解析 JSON 对象，宽容处理 markdown 围栏"""
              if not text or not isinstance(text, str):
                  return {}
              s = _strip_think(text).strip()
              # 剥 markdown 围栏
              m = re.search(r'```(?:json)?\s*(\{[\s\S]*\})\s*```', s, re.S)
              if m:
                  s = m.group(1)
              # 直接解析
              try:
                  obj = json.loads(s, strict=False)
                  if isinstance(obj, dict):
                      return obj
              except Exception:
                  pass
              # 兜底：抠出第一个 { 到最后一个 } 的范围
              start = s.find('{')
              end = s.rfind('}')
              if start >= 0 and end > start:
                  try:
                      obj = json.loads(s[start:end + 1], strict=False)
                      if isinstance(obj, dict):
                          return obj
                  except Exception:
                      pass
              # === 新增：JSON 截断(无闭合 })时尝试补全后解析 ===
              if start >= 0 and (end < 0 or end <= start):
                  _block = s[start:].rstrip().rstrip(',')
                  _suffixes = ['"' + '}', '"]}', '"' + '}]']
                  for suffix in _suffixes:
                      try:
                          obj = json.loads(_block + suffix, strict=False)
                          if isinstance(obj, dict):
                              return obj
                      except Exception:
                          continue
              return {}

          _META_TAIL_RE = re.compile(
              r'"\s*,\s*"(?:description|tags|self_review|source_compliance)"\s*:',
              re.I,
          )


          def _decode_json_string(raw_value):
              if raw_value is None:
                  return ''
              try:
                  return json.loads('"' + raw_value + '"', strict=False).strip()
              except Exception:
                  return raw_value.replace('\\"', '"').replace('\\\\', '\\').replace('\\n', '\n').replace('\\t', '\t').strip()


          def _scan_json_string_field(raw, field):
              """转义感知地恢复 JSON 字符串字段，畸形输出时不越过同级元数据。"""
              if not raw or not field:
                  return ''
              m = re.search(r'"%s"\s*:\s*"' % re.escape(field), raw, re.I)
              if not m:
                  return ''
              start = m.end()
              i = start
              while i < len(raw):
                  if raw[i] == '"':
                      slash_count = 0
                      j = i - 1
                      while j >= start and raw[j] == '\\':
                          slash_count += 1
                          j -= 1
                      if slash_count % 2 == 0:
                          tail = raw[i:]
                          if field == 'content' and not re.match(
                              r'"\s*(?:,\s*"(?:description|tags|self_review|source_compliance)"\s*:|[}\]])',
                              tail,
                              re.I,
                          ):
                              i += 1
                              continue
                          return _decode_json_string(raw[start:i])
                  i += 1
              value = raw[start:]
              if field == 'content':
                  boundary = _META_TAIL_RE.search(value)
                  if boundary:
                      value = value[:boundary.start()]
                  value = re.sub(r'\s*```\s*$', '', value)
              return _decode_json_string(value.rstrip().rstrip(','))


          def _trim_metadata_tail(value):
              if not value:
                  return ''
              m = _META_TAIL_RE.search(value)
              return value[:m.start()].rstrip() if m else value.strip()


          def _extract_html(s):
              """从已限定边界的字段值中提取 HTML，容忍末尾标签未闭合。"""
              if not s:
                  return ''
              m = re.search(r'<(?:p|h[1-6])[\s>][\s\S]*', s, flags=re.I)
              if not m:
                  return ''
              html = _trim_metadata_tail(m.group(0))
              html = re.sub(r'(?:您好|你好)[，,](?:虽然)?我(?:无法|不能)[\s\S]*$', '', html).rstrip()
              return html


          def _regex_extract_field(raw, field):
              return _scan_json_string_field(raw, field)

          def _to_plain(html):
              return re.sub(r'<[^>]+>', '', html or '').strip()

          PLACEHOLDER_MARKERS = [
              '（原样）', '(原样)', '此处省略', '其余略', '(略)', '（略）', '内容不变同上',
          ]

          def _check_broken(content_html, content_plain):
              """判定内容是否异常，返回异常原因（空字符串表示正常）。"""
              if not content_html or not content_plain:
                  return '为空'
              if '<think>' in content_html or '</think>' in content_html:
                  return '残留思考链'
              if _META_TAIL_RE.search(content_html) or re.search(
                  r'"(?:description|tags|self_review|source_compliance)"\s*:',
                  content_html,
                  re.I,
              ):
                  return '正文混入JSON元数据'
              for mk in PLACEHOLDER_MARKERS:
                  if mk in content_html:
                      return '占位符'
              if content_plain.endswith('原样'):
                  return '占位符'
              if len(content_plain) < 2000:
                  return f'正文过短({len(content_plain)}字,合规合同下限2000/上限2500):疑似截断或展开不足,必须回退改写/重写,不得直接采用'
              return ''


          # === 新增：从原始文本全量提取内容(JSON 完全解析失败时的终极兜底) ===
          def _rescue_from_raw(raw_text):
              """当 _parse_json 返回空 dict 时,尝试从原始文本直接抢救出文章内容"""
              if not raw_text or not isinstance(raw_text, str):
                  return '', '', '', [], ''
              cleaned = _strip_think(raw_text)
              # 已知 JSON 包裹时只读取 content 字段；纯 HTML 响应才从首标签兜底。
              content_value = _scan_json_string_field(cleaned, 'content')
              content = _extract_html(content_value or cleaned)
              if not content:
                  return '', '', '', [], ''
              # 正则抽 title
              title = _regex_extract_field(cleaned, 'title')
              if not title or len(title) < 5:
                  m = re.search(r'<h2[^>]*>(.*?)</h2>', content, re.S | re.I)
                  if m:
                      title = re.sub(r'<[^>]+>', '', m.group(1)).strip()
              # 正则抽 description
              description = _regex_extract_field(cleaned, 'description')
              if not description:
                  description = _to_plain(content)[:120]
              # 正则抽 tags
              tags = []
              tm = re.search(r'"tags"\s*:\s*\[([^\]]*)\]', cleaned, re.S)
              if tm:
                  tags = [s.strip() for s in re.findall(r'"([^"]+)"', tm.group(1)) if s.strip()]
              # 正则抽 self_review
              self_review = _regex_extract_field(cleaned, 'self_review')
              return title, content, description, tags, self_review


          def main(n7_text, clean_out):
              n7_text = _clamp(n7_text)
              clean_out = _clamp(clean_out)

              # ========= 解析 clean_out =========
              if isinstance(clean_out, dict):
                  c = clean_out
              else:
                  c = _parse_json(clean_out)
              if not isinstance(c, dict):
                  c = {}

              c_title = (c.get('title') or '').strip()
              c_content = c.get('content') or ''
              c_desc = (c.get('description') or '').strip()
              c_tags = c.get('tags') or []
              c_review = (c.get('self_review') or '').strip()

              if c_content and isinstance(c_content, str):
                  if '<think>' in c_content or '</think>' in c_content:
                      c_content = _strip_think(c_content)

              c_plain = _to_plain(c_content)
              c_reason = _check_broken(c_content, c_plain)

              # === 新增：clean_out JSON 解析失败但原始文本含 HTML 时,从原文抢救 ===
              if c_reason and isinstance(clean_out, str) and '<h2' in clean_out:
                  _rc_title, _rc_content, _rc_desc, _rc_tags, _rc_review = _rescue_from_raw(clean_out)
                  _rc_plain = _to_plain(_rc_content)
                  _rc_reason = _check_broken(_rc_content, _rc_plain)
                  if not _rc_reason and len(_rc_plain) > len(c_plain):
                      c_title = _rc_title or c_title
                      c_content = _rc_content
                      c_desc = _rc_desc or c_desc
                      c_tags = _rc_tags or c_tags
                      c_review = _rc_review or c_review
                      c_plain = _rc_plain
                      c_reason = ''

              # ========= 解析 n7_text =========
              if isinstance(n7_text, dict):
                  n = n7_text
              else:
                  n = _parse_json(n7_text)
              if not isinstance(n, dict):
                  n = {}

              n_title = (n.get('title') or '').strip()
              n_content = n.get('content') or ''
              n_desc = (n.get('description') or '').strip()
              n_tags = n.get('tags') or []

              if n_content and isinstance(n_content, str):
                  if '<think>' in n_content or '</think>' in n_content:
                      n_content = _strip_think(n_content)

              n_plain = _to_plain(n_content)
              n_reason = _check_broken(n_content, n_plain)

              # === 新增：n7_text JSON 解析失败但原始文本含 HTML 时,从原文抢救 ===
              if n_reason and isinstance(n7_text, str) and '<h2' in n7_text:
                  _rn_title, _rn_content, _rn_desc, _rn_tags, _rn_review = _rescue_from_raw(n7_text)
                  _rn_plain = _to_plain(_rn_content)
                  _rn_reason = _check_broken(_rn_content, _rn_plain)
                  if not _rn_reason and len(_rn_plain) > len(n_plain):
                      n_title = _rn_title or n_title
                      n_content = _rn_content
                      n_desc = _rn_desc or n_desc
                      n_tags = _rn_tags or n_tags
                      n_plain = _rn_plain
                      n_reason = ''

              # ========= 选择最终输出 =========
              if not c_reason:
                  # clean_out 正常，直接用
                  title = c_title
                  content = c_content
                  description = c_desc
                  tags = c_tags
                  self_review = c_review or '[守护]clean_out正常,直接采用'
              elif not n_reason:
                  # clean_out 异常，回退 N7
                  title = n_title or c_title
                  if not title or len(title) < 5:
                      m = re.search(r'<h2[^>]*>(.*?)</h2>', n_content, re.S | re.I)
                      if m:
                          title = re.sub(r'<[^>]+>', '', m.group(1)).strip()
                  content = n_content
                  description = n_desc or c_desc or _to_plain(content)[:120]
                  tags = n_tags or c_tags
                  self_review = '[守护]clean_out异常(%s),已回退N7原文' % c_reason
              else:
                  # 两边都异常，尽量保留有内容的一边
                  if len(c_plain) >= len(n_plain):
                      title = c_title or n_title
                      content = c_content
                      description = c_desc or n_desc
                      tags = c_tags or n_tags
                  else:
                      title = n_title or c_title
                      content = n_content
                      description = n_desc or c_desc
                      tags = n_tags or c_tags
                  self_review = '[守护]clean_out(%s)和N7(%s)均异常,保留较长一份' % (c_reason, n_reason)

              if not isinstance(tags, list):
                  tags = []

              return {'structured_output': {
                  'title': title,
                  'content': content,
                  'description': description,
                  'tags': tags,
                  'self_review': self_review,
              }}
