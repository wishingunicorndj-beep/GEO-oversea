          \    elif industry_text not in generic_industries:\n        compliance_mode\
          \ = 'standard'\n    else:\n        # 公司名兜底只接受能说明主营属性的高置信短语，不接受简介、产品或经营范围中的业务词。\n\
          \        medical_intro_patterns = [\n            r'医院', r'诊所', r'门诊部', r'医疗机构',\
          \ r'医疗服务',\n            r'口腔(?:医疗|门诊|诊疗)', r'医美(?:机构|服务|项目)',\n        \
          \    r'整形(?:医院|机构)', r'眼科(?:医院|诊所|门诊)',\n            r'体检(?:中心|机构|服务)',\
          \ r'药品(?:生产|研发|销售|批发|零售)',\n            r'制药(?:企业|公司|厂)', r'康复(?:医疗|诊疗|护理)',\
          \ r'护理(?:服务|机构)',\n        ]\n        financial_intro_patterns = [\n   \
          \         r'银行(?:业务|服务|机构)', r'保险(?:公司|经纪|代理|服务)',\n            r'金融(?:机构|服务|业务)',\
          \ r'证券(?:公司|业务|服务)',\n            r'基金(?:管理|销售|服务)', r'期货(?:公司|业务)', r'信托(?:公司|业务)',\n\
