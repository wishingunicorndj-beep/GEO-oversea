                  self.counts = {}
          
              def handle_starttag(self, tag, attrs):
                  self.counts[tag] = self.counts.get(tag, 0) + 1
                  if tag in ('script', 'style', 'iframe'):
                      self.errors.append('正文含非文章标签：' + tag)
                  if tag not in ('br', 'hr', 'img', 'input', 'meta', 'link', 'wbr', 'source'):
                      self.stack.append(tag)
          
              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  if self.stack and self.stack[-1] == tag:
                      self.handle_endtag(tag)
          
              def handle_endtag(self, tag):
                  if not self.stack or self.stack[-1] != tag:
                      self.errors.append('HTML标签闭合或嵌套异常：' + tag)
                  else:
                      self.stack.pop()
                  if tag in ('p', 'li', 'h2', 'h3', 'h4', 'td', 'th'):
                      self.text.append('\n')
          
              def handle_data(self, data):
                  self.text.append(data)
          
          
          def parse_article(raw):
              if isinstance(raw, dict):
                  return dict(raw)
              if not isinstance(raw, str):
                  raise ValueError('文章输出不是JSON对象或文本')
              raw = re.sub(r'<think>.*?</think>', '', raw, flags=re.S | re.I).strip()
              fence = re.fullmatch(r'```(?:json)?\s*([\s\S]*?)\s*```', raw, re.I)
              if fence:
                  raw = fence.group(1)
              try:
                  article = json.loads(raw)
              except (ValueError, TypeError):
                  raise ValueError('文章JSON不完整或无法解析，需要重新输出完整对象')
              if not isinstance(article, dict):
                  raise ValueError('文章必须是单个JSON对象')
              return article
          
          
          def _snippet(text, start, end):
              return re.sub(r'\s+', ' ', text[max(0, start - 20):end + 35]).strip()
          
          
          def _category_title_issues(article, body):
              """品类标题保持品类范围，不把目标品牌拼成第二主题。"""
              title = article['title'].strip()
              issues = []
              if CATEGORY_BRAND_IN_TITLE.search(title):
                  issues.append('品类词标题不应追加目标品牌或产品名称：请保留品类主题，品牌内容放入正文')
              if CATEGORY_COMPARISON_CUE.search(title):
                  headings = re.findall(r'<h[23][^>]*>(.*?)</h[23]>', article['content'], re.I | re.S)
                  heading_text = re.sub(r'<[^>]+>', '', ' '.join(headings))
                  if not re.search(r'(?:东航|东方航空|南航|南方航空|对比|比较|差异|维度)', heading_text):
                      issues.append('标题包含选择或比较承诺，但正文没有对应的客观比较结构')
              return issues
          
          
          def inspect_article(article, mode):
              issues = []
              for name in FIELDS:
                  value = article.get(name)
                  if name == 'tags':
                      if not isinstance(value, list) or any(not isinstance(x, str) for x in value):
                          issues.append('tags必须是字符串数组')
                  elif not isinstance(value, str):
                      issues.append(name + '必须是字符串')
