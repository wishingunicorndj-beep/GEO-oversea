    - data:
        code: "import json, re\ndef words(s): return [x.strip() for x in re.split(r'[，,、;；\\\
          n]+', str(s or '')) if x.strip()]\ndef _unique(items):\n    out=[]\n   \
          \ for item in items:\n        value=str(item or '').strip()\n        if\
          \ value and value not in out:\n            out.append(value)\n    return\
          \ out\ndef _intent(keyword):\n    text=str(keyword or '')\n    if any(x\
          \ in text for x in ('选哪个','怎么选','推荐','值得','对比','比较','哪家','哪个好')):\n    \
          \    return 'decision'\n    if any(x in text for x in ('排名','排行','TOP')):\n\
          \        return 'ranking'\n    if any(x in text for x in ('怎么样','好不好','评价','体验')):\n\
          \        return 'evaluation'\n    return 'information'\ndef main(company_name,\
          \ industry, keyword_pack, article_count, article_style, article_type, task_name,\
          \ company_intro, core_qualifications, awards, advantages, ent_dataset_id,\
          \ task_description, prod_dataset_id, custom_writing_distribution=''):\n\
          \    ws=words(keyword_pack)\n    core=re.sub(r'(股份有限公司|有限责任公司|有限公司|公司|集团)$','',str(company_name\
          \ or '').strip())\n    tokens=[x for x in [core,'中国国航','国航','Air China','凤凰知音','PhoenixMiles']\
          \ if len(x)>=2]\n    anniversary_tokens=('32周年','三十二周年','周年礼遇','周年庆','周年活动')\n\
          \    category_subjects=('航司','航空会员','航司会员','三大航','会籍','航司服务','航空服务')\n \
          \   category_cues=('怎么选','选哪个','哪个好','哪家','推荐','对比','比较','入门','攻略','指南','避坑','注意事项','评价','口碑','体验','更好','含金量','划算','最合适')\n\
          \    competitor_tokens=('国航','东航','南航')\n    def _is_category(w):\n    \
          \    subject_hit=any(x in w for x in category_subjects)\n        cue_hit=any(x\
          \ in w for x in category_cues)\n        multi_airline=sum(1 for x in competitor_tokens\
          \ if x in w) >= 2\n        return (subject_hit and cue_hit) or (multi_airline\
          \ and cue_hit)\n    def _route(w):\n        if any(t in w for t in anniversary_tokens):\n\
          \            return 'anniversary'\n        if _is_category(w):\n       \
          \     return 'category'\n        if any(t.lower() in w.lower() for t in\
          \ tokens):\n            return 'brand'\n        return 'category'\n    modes=[{'keyword':w,'mode':_route(w),'index':i+1}\
          \ for i,w in enumerate(ws)]\n    try:\n        custom=json.loads(custom_writing_distribution\
          \ or '{}')\n    except Exception:\n        custom={}\n    if not isinstance(custom,dict):\
          \ custom={}\n    custom_terms=[x for x in custom.get('retrieval_terms',[])\
          \ if isinstance(x,str)]\n    custom_scope=[x for x in custom.get('content_scope',[])\
          \ if isinstance(x,str)]\n    seeds=[]\n    for item in modes:\n        keyword=item['keyword']\n\
          \        intent=_intent(keyword)\n        terms=[keyword]\n        if any(x\
          \ in keyword for x in ('会员','金卡','银卡','白金卡','凤凰知音','里程','航段','保级','权益')):\n\
          \            terms.extend(['会员等级','会员权益','里程','定级航段','升级保级规则'])\n      \
          \  if any(x in keyword for x in ('出差','商旅','短途','高频','常飞')):\n         \
          \   terms.extend(['短途出差','航段累积','商旅出行'])\n        if any(x in keyword for\
          \ x in ('服务','怎么样','体验')):\n            terms.extend(['服务内容','服务条件','服务渠道'])\n\
          \        if intent in ('decision','ranking'):\n            terms.extend(['判断维度','适用条件','客观比较'])\n\
          \        terms.extend(custom_terms)\n        seeds.append({'keyword':keyword,'mode':item['mode'],'query_intent':intent,'retrieval_terms':_unique(terms),'content_scope':_unique(custom_scope)})\n\
          \    anchor=ws[0] if ws else (industry or task_name or '航空服务')\n    clean=lambda\
          \ s: re.sub(r'\\s+',' ',re.sub(r'[\\x00-\\x1f\\x7f-\\x9f\"\\\\]','',str(s\
          \ or ''))).strip()[:80]\n    return {'ent_rag_query':clean(f'{company_name}\
          \ 企业简介 业务范围 资质 荣誉'), 'prod_rag_query':clean(f'{anchor} 会员权益 产品服务 适用条件 有效期'),\
          \ 'keyword_query_seeds':seeds, 'article_count':str(int(article_count) if\
          \ article_count else 1), 'article_style':article_style or '克制、事实支撑的PR稿件风格',\
          \ 'article_type':article_type or '', 'compliance_mode':'standard', 'content_mode':'comparison',\
          \ 'region':'全国', 'region_source':'default_national', 'region_confidence':'default',\
          \ 'core_service':anchor, 'keyword_modes':json.dumps(modes,ensure_ascii=False)}\n"
