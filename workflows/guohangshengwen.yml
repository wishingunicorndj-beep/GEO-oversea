    - data:
        code: "import json\nimport re\nfrom html.parser import HTMLParser\n\nFIELDS\
          \ = ('title', 'content', 'description', 'tags', 'self_review')\nMARKDOWN_LINK\
          \ = re.compile(r'\\[[^\\]]+\\]\\([^)]*\\)')\n\nclass _Body(HTMLParser):\n\
          \    def __init__(self):\n        super().__init__(convert_charrefs=True)\n\
          \        self.stack = []\n        self.counts = {}\n        self.errors\
          \ = []\n\n    def handle_starttag(self, tag, attrs):\n        self.counts[tag]\
          \ = self.counts.get(tag, 0) + 1\n        if tag in ('script', 'style', 'iframe'):\n\
          \            self.errors.append('正文含非文章标签：' + tag)\n        if tag not in\
          \ ('br', 'hr', 'img', 'input', 'meta', 'link', 'wbr', 'source'):\n     \
          \       self.stack.append(tag)\n\n    def handle_endtag(self, tag):\n  \
          \      if not self.stack or self.stack[-1] != tag:\n            self.errors.append('HTML标签闭合或嵌套异常：'\
          \ + tag)\n        else:\n            self.stack.pop()\n\ndef _parse(raw):\n\
          \    if isinstance(raw, dict):\n        return dict(raw)\n    if not isinstance(raw,\
          \ str):\n        raise ValueError('文章输出不是JSON对象或文本')\n    try:\n       \
          \ article = json.loads(raw)\n    except (ValueError, TypeError):\n     \
          \   raise ValueError('文章JSON不完整或无法解析')\n    if not isinstance(article, dict):\n\
          \        raise ValueError('文章必须是单个JSON对象')\n    return article\n\ndef main(articles,\
          \ compliance_mode: str = 'standard', ent_body: str = '', prod_body: str\
          \ = '', custom_writing_distribution: str = '', custom_writing_preference_raw:\
          \ str = '', company_name: str = '', verified_competitor_text: str = ''):\n\
          \    if not isinstance(articles, list) or not articles:\n        raise ValueError('文章结构闸门未通过：没有可校验的文章')\n\
          \    cleaned_articles = []\n    errors = []\n    for index, item in enumerate(articles,\
          \ 1):\n        try:\n            article = _parse(item)\n            missing\
          \ = [field for field in FIELDS if field not in article]\n            mode\
          \ = article.get('_keyword_mode', '')\n            if missing:\n        \
          \        raise ValueError('缺少字段：' + ','.join(missing))\n            if mode\
          \ not in ('brand', 'category'):\n                raise ValueError('缺少有效的品牌/品类来源标签')\n\
          \            if not isinstance(article['tags'], list) or any(not isinstance(x,\
          \ str) for x in article['tags']):\n                raise ValueError('tags必须是字符串数组')\n\
          \            content = str(article.get('content') or '')\n            if\
          \ MARKDOWN_LINK.search(content):\n                raise ValueError('正文含Markdown链接，必须改为HTML链接或纯文本网址')\n\
          \            if re.search(r'<think>|</think>|此处省略|其余略|\\(略\\)|（略）|\\{\\\
          {#', content, re.I):\n                raise ValueError('正文含思考标签、占位符或内部变量')\n\
          \            parser = _Body()\n            parser.feed(content)\n      \
          \      parser.close()\n            if parser.errors or parser.stack:\n \
          \               raise ValueError('HTML结构异常：' + '；'.join(parser.errors +\
          \ (['未闭合：' + ','.join(parser.stack[-5:])] if parser.stack else [])))\n \
          \           if not parser.counts.get('p', 0) or parser.counts.get('h2',\
          \ 0) < 5:\n                raise ValueError('正文结构不足：至少需要p段落和5个h2章节')\n \
          \           article['_structural_validation'] = 'passed'\n            if\
          \ '_compliance_mode' not in article:\n                article['_compliance_mode']\
          \ = compliance_mode or 'standard'\n            if '_company_name' not in\
          \ article and company_name:\n                article['_company_name'] =\
          \ company_name\n            cleaned_articles.append(article)\n        except\
          \ ValueError as exc:\n            errors.append('第{}篇：{}'.format(index,\
          \ exc))\n    if errors:\n        raise ValueError('文章结构闸门未通过：' + ' | '.join(errors)[:4000])\n\
          \    return {'cleaned_articles': cleaned_articles}"
