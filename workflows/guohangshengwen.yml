          \ JSON 畸形/截断时从原始文本直接提取 HTML 正文兜底\n\"\"\"\nimport re\nimport json\n\nMAX_INPUT_LEN\
          \ = 200_000\n\ndef _clamp(val):\n    if isinstance(val, str) and len(val)\
