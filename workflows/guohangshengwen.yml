          ] = \"unbound\"\n\n        all_articles.append(article)\n\n    # iteration\
          \ continue-on-error 可能完全没有返回某个失败项；仅在实际文章数不足时补空篇位。\n    missing_slots = max(0,\
          \ len(merged_plans) - len(all_articles))\n    for idx, plan in enumerate(merged_plans):\n\
