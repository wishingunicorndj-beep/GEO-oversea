          \            if re.search(r'<think>|</think>|此处省略|其余略|\\(略\\)|（略）|\\{\\\
          {#', content, re.I):\n                raise ValueError('正文含思考标签、占位符或内部变量')\n\
          \            parser = _Body()\n            parser.feed(content)\n      \
          \      parser.close()\n            if parser.errors or parser.stack:\n \
          \               raise ValueError('HTML结构异常：' + '；'.join(parser.errors +\
          \ (['未闭合：' + ','.join(parser.stack[-5:])] if parser.stack else [])))\n \
          \           if not parser.counts.get('p', 0) or parser.counts.get('h2',\
          \ 0) < 5:\n                raise ValueError('正文结构不足：至少需要p段落和5个h2章节')\n \
          \           article['_structural_validation'] = 'passed'\n            if\
          \ '_compliance_mode' not in article:\n                article['_compliance_mode']\
          \ = compliance_mode or 'standard'\n            if '_company_name' not in\
          \ article and company_name:\n                article['_company_name'] =\
          \ company_name\n            cleaned_articles.append(article)\n        except\
          \ ValueError as exc:\n            errors.append('第{}篇：{}'.format(index,\
          \ exc))\n            if isinstance(item, dict):\n                failed_article\
          \ = dict(item)\n            else:\n                failed_article = {'title':\
          \ '', 'content': str(item or ''), 'description': '', 'tags': [], 'self_review':\
