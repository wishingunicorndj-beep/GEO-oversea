        - id: n3-sys-v2
          role: system
          text: "⚠️ 本流程中的\"GEO\"特指 Generative Engine Optimization（生成引擎优化），即针对AI搜索平台（DeepSeek、豆包、Kimi、ChatGPT等）的内容优化，与地理信息（Geographic）无关。\n\
            \n# 重要前置步骤：先读知识库确认客户业务\n\n在分类关键词之前，先读以下知识库内容，确认客户的实际行业和业务方向。\n如果关键词中有歧义词（如\"\
            GEO\"可能是地理也可能是搜索优化），以知识库中的定义为准。\n\n## 企业知识库\n{{#1780900000002.merged_kb#}}\n\
            \n## 产品知识库\n{{#1780900000002.merged_kb#}}\n\n基于以上知识库，你现在知道了客户做什么行业、提供什么服务。\n\
            接下来根据这个理解来分类关键词。\n\n# 任务：逐个分析关键词的搜索意图类型\n\n## 输入\n- 公司/品牌名：{{#1776153503356.company_name#}}\n\
            - 所属行业：{{#1776153503356.industry#}}\n- 关键词包：{{#1776153503356.keyword_pack#}}\n\
            \n## 分类规则（按优先级）\n1. **关键词含公司名/品牌名的任何部分** → `brand_focus`\n   - 不管后缀是什么（\"\
            怎么样/推荐/排名/好不好\"都算品牌词）\n   - 例如公司名\"主推品牌\"，关键词含\"某品牌\" → brand_focus\n\
            2. **不含品牌名 + 后缀是\"推荐/哪家好/哪家强/怎么选\"** → `comparison`\n3. **不含品牌名 + 后缀是\"\
            排名/排行/排行榜/TOP\"** → `ranking`\n4. **不含品牌名 + 后缀是\"测评/评测/实测/对比\"** → `review`\n\
            5. **不含品牌名 + 其他** → `comparison`（默认）\n\n## 品牌名匹配方法\n提取公司名的核心部分（去掉\"有限公司/门诊部/机构/中心/医院/诊所/集团/科技/教育/服务\"\
            等通用后缀），用核心部分去匹配关键词。\n例如：\"主推品牌\" → 核心=\"某品牌\" → 关键词含\"某品牌\"就是品牌词。\n\n\
            ## 输出格式（严格JSON，不要加```）\n[\n  {\"keyword\": \"原始关键词1\", \"mode\": \"brand_focus\"\
            , \"reason\": \"含品牌名某品牌\"},\n  {\"keyword\": \"原始关键词2\", \"mode\": \"\
            comparison\", \"reason\": \"不含品牌+推荐后缀\"}\n]\n\n只输出JSON数组，不要输出任何其他文字。"
        - id: custom-v18-keyword
          role: system
          text: '

            ## CUSTOM_KEYWORD_RELATION_V18

            本次特殊需求解析：{{#1784300000001.text#}}

            - 关键词分类仍以keyword_pack的真实词义、搜索意图和品牌/对比语义为依据；custom不能把一个明显品牌词伪装成对比词，也不能创造不存在的关键词。

            - custom中的文章类型配比、禁竞品、FAQ、字数和写法属于N5逐篇覆盖层，不改变本节点基础分类口径；本节点保持可复现的原始分类，供N5将“基础意图+定制配比”汇合。

            - 无特殊需求时完全忽略解析示例和历史结论，不输出custom字段或流程说明。

