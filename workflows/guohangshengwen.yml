        code: |
          import re, json

          def main(n7_text):
              text = n7_text or ''
              # 剥 think 链
              if '<think>' in text or '</think>' in text:
                  text = re.sub(r'<think>.*?</think>', '', text, flags=re.S | re.I)
                  if '</think>' in text:
                      text = text.split('</think>')[-1]
              # 剥代码块
              text = re.sub(r'^\s*```[a-zA-Z]*\s*\n?', '', text)
              text = re.sub(r'\n?\s*```\s*$', '', text)
              # 抠 JSON
              data = {}
              parsed = False
              m = re.search(r'\{.*\}', text, re.S)
              if m:
                  try:
                      data = json.loads(m.group(0))
                      parsed = True
                  except Exception:
                      data = {}
              title = str(data.get('title', '') or '')
              content = str(data.get('content', '') or '')

              issues = []
              # ---- 标题 ----
              if title:
                  tlen = len(title)
                  if tlen < 20:
                      issues.append(f'标题过短({tlen}字,要求20-28):从正文提取一个真实角度/数字,扩写到20-28字,不要硬凑')
                  elif tlen > 28:
                      issues.append(f'标题超长({tlen}字,要求20-28):重写精简,绝不从结尾硬砍,裁完必须是完整通顺短语')
                  if re.search(r'[：:，,、；;]$', title.rstrip()):
                      issues.append('标题以标点结尾(截断):改成完整短语收尾')
                  else:
                      _t = title.rstrip()
                      _last = _t[-1] if _t else ''
                      _bef = _t[-2] if len(_t) >= 2 else ''
                      if (_last == '全' and _bef not in '大齐安健保完周两万俱成顾') or _last in '与及或之而和':
                          issues.append(f'标题结尾是半截词("{_t[-2:]}"):补全成完整词(如"全攻略""全指南")或换完整短语收尾,严禁停在单字')
                  if re.search(r'\[|\]|\{|\}|XX|xx', title):
                      issues.append('标题含占位符/XX:替换成正文里的真实内容')

              # ---- 正文 ----
              plain = re.sub(r'<[^>]+>', '', content)
              clen = len(plain)
              # 解析失败/截断 硬检测(最高优先:解析没成功 或 正文极短,几乎一定是N7被截断)
              if not parsed or clen < 1500:
                  issues.append(f'N7输出疑似被截断或JSON解析失败(解析{"成功" if parsed else "失败"},正文仅{clen}字):需整篇重新生成完整文章,严禁直接采用截断稿')
              elif clen < 3000:
                  issues.append(f'正文过短({clen}字,目标3000-3500):扩展主推服务维度或补充真实数据,不要用空话凑字数')
              elif clen > 4200:
                  issues.append(f'正文过长({clen}字,上限4200):精简到3500以内,删冗余不删信息')

              if '**' in content:
                  issues.append('正文含 ** 残留(markdown没转<strong>):清理掉**,该加粗的用<strong>')
              if re.search(r'\[(?:内容|此处|待补|填写|XX|xx)[^\]]*\]|【(?:内容|此处|待补)】', content):
                  issues.append('正文含占位符泄漏:替换成真实内容')
              if re.search(r'[¥￥]\s*\d|\d+\s*元(?![档级期度])|\d+\s*万元', content):
                  issues.append('正文含价格信息:删除具体价格')
              if re.search(r'(?:结束语|closing_phrase|title_style|content_mode|compliance_mode)\s*[:：]', content):
                  issues.append('正文含内部标签泄漏:删除')

              # ---- 判断是否需要整篇重写(而非局部微调) ----
              needs_regenerate = False
              if not parsed or clen < 1800:
                  needs_regenerate = True
              elif clen < 2400 and len(issues) >= 3:
                  needs_regenerate = True

              issues_str = '\n'.join(f'{i+1}. {x}' for i, x in enumerate(issues)) if issues else '无明显机械问题'
              return {
                  'issues': issues_str,
                  'has_issues': 1 if issues else 0,
                  'content_len': clen,
              }
