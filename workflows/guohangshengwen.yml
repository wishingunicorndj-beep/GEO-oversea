          \ dict):\n            raise ValueError('不是JSON对象')\n    except (ValueError,\
          \ TypeError) as exc:\n        return {'issues': '初稿无法解析为完整JSON：{}；请根据大纲和证据重新生成完整文章'.format(exc),\
          \ 'content_len': 0}\n    content = str(article.get('content', '') or '')\n\
          \    count = visible_length(content)\n    issues = []\n    missing = [name\
          \ for name in FIELDS if name not in article]\n    if missing:\n        issues.append('缺少字段：'\
          \ + ','.join(missing))\n    title_len = len(str(article.get('title', '')\
          \ or '').strip())\n    if not 20 <= title_len <= 38:\n        issues.append('标题{}字，要求20—38字'.format(title_len))\n\
          \    if count < 2800:\n        issues.append('正文只有{}字，距最低2800字还差{}字；请补到约3100字'.format(count,\
