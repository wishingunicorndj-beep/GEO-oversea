          \ isinstance(x, dict) and str(x.get('_final_validation_status', '')).lower()\
          \ in ('passed', 'warning')])\n\n    return {\n        'article_titles':\
          \ article_titles,\n        'quality_scores': quality_scores,\n        'article_images':\
