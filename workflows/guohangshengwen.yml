        code: |-
          import json
          import re


          def _normalize_articles(articles):
              """Normalize only the container type; never rewrite article fields."""
              if articles is None:
                  return []
              if isinstance(articles, list):
                  return articles
              if isinstance(articles, dict):
                  return [articles]
              if isinstance(articles, str):
                  try:
                      parsed = json.loads(articles)
                  except Exception:
                      return []
                  if isinstance(parsed, list):
                      return parsed
                  if isinstance(parsed, dict):
                      return [parsed]
              return []


          def _plain(text):
              return re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', '', str(text or ''))).strip()


          def _faq_orphan_count(content):
              """Read-only check. It must never add, delete, or rewrite FAQ content."""
              original = str(content or '')
              token_re = r'(<h[1-6][^>]*>(?:(?!</h[1-6]>)[\s\S])*</h[1-6]>|<(?:p|li)[^>]*>(?:(?!</(?:p|li)>)[\s\S])*</(?:p|li)>)'
              parts = re.split(token_re, original, flags=re.I)
              faq_level = None
              missing = 0

              def is_faq_heading(text):
                  return bool(re.search(r'FAQ|常见.{0,12}(?:问题|疑问)|问答|答疑|问题解答|疑问解答', text, re.I))

              def is_question(text):
                  text = str(text or '').strip()
                  return bool(
                      re.match(r'^(?:问|Q)\s*[：:]', text, re.I)
                      or re.match(r'^问题\s*(?:\d+|[一二三四五六七八九十]+)?\s*[：:、.]?', text, re.I)
                      or text.endswith(('？', '?'))
                  )

              def is_answer(text):
                  return bool(re.match(r'^(?:答|A)\s*[：:]', str(text or '').strip(), re.I))

              for index, part in enumerate(parts):
                  if not part or not part.strip():
                      continue
                  value = _plain(part)
                  heading = re.match(r'<h([1-6])\b', part, re.I)
                  if heading:
                      level = int(heading.group(1))
                      if is_faq_heading(value):
                          faq_level = level
                          continue
                      if faq_level is not None and level <= faq_level:
                          faq_level = None
                  if faq_level is None or not is_question(value) or is_answer(value):
                      continue

                  next_value = ''
                  next_part = ''
                  for next_index in range(index + 1, len(parts)):
                      if parts[next_index] and parts[next_index].strip():
                          next_part = parts[next_index]
                          next_value = _plain(parts[next_index])
                          break
                  unlabelled_answer = bool(
                      re.match(r'<(?:p|li)\b', next_part, re.I)
                      and len(next_value) >= 8
                      and not is_question(next_value)
                  )
                  if not is_answer(next_value) and not unlabelled_answer:
                      missing += 1
              return missing


          def _quality_score(title, content):
              """Read-only diagnostics. Findings never trigger content mutation."""
              issues = []
              title_len = len(str(title or ''))
              content_len = len(_plain(content))
              if title_len < 20:
                  issues.append(f'标题过短({title_len}字,要求≥20)')
              elif title_len > 28:
                  issues.append(f'标题超长({title_len}字,要求≤28)')
              if content_len < 2500:
                  issues.append(f'内容过短({content_len}字,至少2500)')
              elif content_len > 4200:
                  issues.append(f'内容过长({content_len}字,上限4200)')
              for tag in ('p', 'h2', 'h3', 'h4', 'strong'):
                  opened = len(re.findall(rf'<{tag}\b[^>]*>', str(content or ''), re.I))
                  closed = len(re.findall(rf'</{tag}>', str(content or ''), re.I))
                  if opened != closed:
                      issues.append(f'HTML标签未闭合:{tag}')
              orphan_count = _faq_orphan_count(content)
              if orphan_count:
                  issues.append(f'FAQ有{orphan_count}个问题缺少答案')
              if issues:
                  return f'❌ 机械检查发现 {len(issues)} 个问题: {" | ".join(issues)}'
              return f'✅ 机械检查通过 (标题{title_len}字,内容{content_len}字)'


          def _tag_text(tags):
              """Adapt array[object].tags to N8's existing array[string] output contract."""
              if isinstance(tags, list):
                  return ','.join(str(tag) for tag in tags)
              return str(tags or '')


          def _is_gate_placeholder(content):
              """识别 N8-hard 旧版产生的占位正文；仅用于恢复上游正文，不生成新内容。"""
              text = str(content or '')
              return bool(re.search(r'终稿硬校验未通过|该占位内容不得发布为正式文章', text))


          def _upstream_content(item):
              """优先保留文章正文；兼容旧版 hard-gate 的占位覆盖结果。"""
              content = str(item.get('content', '') or '')
              original = str(item.get('_original_content_before_final_gate', '') or '')
              if original.strip() and _is_gate_placeholder(content):
                  return original
              return content



          def _n8_target_total(articles):
              totals = []
              for item in articles or []:
                  if not isinstance(item, dict):
                      continue
                  for key in ("_article_total", "article_total"):
                      try:
                          value = int(item.get(key, 0) or 0)
                      except Exception:
                          value = 0
                      if value > 0:
                          totals.append(value)
              return max(totals) if totals else 0


          def main(articles, knowledge_base_evidence="", verified_competitor_evidence="", competitor_detail_evidence="", final_validation_report=""):
              """V21 pure merge: article title/content/tags are upstream-owned and immutable here."""
              normalized = _normalize_articles(articles)
              source_count = len(normalized)

              # V23 最终数量硬边界：N8 不按序号去重，不覆盖文章；仅限制输出数量。
              target_total = _n8_target_total(normalized)
              if target_total > 0:
                  if len(normalized) > target_total:
                      normalized = normalized[:target_total]
                  elif len(normalized) < target_total:
                      # 数量不足时只补空对象，绝不生成标题、正文或其他内容。
                      for _ in range(target_total - len(normalized)):
                          normalized.append({
                              "title": "",
                              "content": "",
                              "description": "",
                              "tags": [],
                              "self_review": "",
                              "_generation_status": "missing_iteration_output",
                              "_rewrite_required": True,
                          })

              article_titles = []
              article_tags = []
              quality_scores = []
              generated_articles_list = []

              for item in normalized:
                  if not isinstance(item, dict):
                      # 数组中的非对象项也按一篇保留，确保结果数组长度与上游输入一致。
                      item = {'content': str(item or '')}
                  # 数量一致性：逐条合并上游文章，不因 blocked/_rewrite_required 静默丢弃。
                  # 兼容旧版 N8-hard 的占位覆盖：若上游同时保留原文元数据，则恢复原文输出，
                  # 质检状态和重写队列仍通过元数据保留；本节点不生成、不补写文章。
                  # No strip, regex replacement, truncation, padding, FAQ deletion, or
                  # domain fallback is allowed in this merge node.
                  title = str(item.get('title', '') or '')
                  content = _upstream_content(item)
                  tags = item.get('tags', [])

                  article_titles.append(title)
                  generated_articles_list.append(content)
                  article_tags.append(_tag_text(tags))
                  gate_score = _quality_score(title, content)
                  gate_status = str(item.get('_final_validation_status', '') or '').strip()
                  gate_issues = item.get('_final_validation_issues', [])
                  if gate_status:
                      gate_score += ' | 终稿硬校验=' + gate_status
                      if isinstance(gate_issues, list) and gate_issues:
                          gate_score += ' | ' + '；'.join(str(x) for x in gate_issues[:4])
                  quality_scores.append(gate_score)

              expected_totals = []
              for item in normalized:
                  if not isinstance(item, dict):
                      continue
                  try:
                      total = int(item.get('_article_total', 0) or 0)
                  except Exception:
                      total = 0
                  if total > 0:
                      expected_totals.append(total)
              if expected_totals and len(generated_articles_list) != max(expected_totals):
                  count_issue = f'最终文章数量{len(generated_articles_list)}/{max(expected_totals)}'
                  quality_scores = [f'❌ 机械检查发现文章数量异常:{count_issue} | {score}' for score in quality_scores]

              evidence_parts = []
              knowledge = str(knowledge_base_evidence or '').strip()
              verified = str(verified_competitor_evidence or '').strip()
              detail = str(competitor_detail_evidence or '').strip()
              if knowledge:
                  evidence_parts.append(knowledge)
              competitor_parts = ['【Dify v2607e 写文实际使用的竞品 evidence】']
              if verified:
                  competitor_parts.extend(['## 校验后竞品材料', verified])
              if detail:
                  competitor_parts.extend(['## 竞品逐维度详情', detail])
              if len(competitor_parts) > 1:
                  evidence_parts.append('\n\n'.join(competitor_parts))

              blocked_count = len([x for x in normalized if isinstance(x, dict) and str(x.get('_final_validation_status', '')).lower() == 'blocked'])
              publishable_count = len([x for x in normalized if isinstance(x, dict) and str(x.get('_final_validation_status', '')).lower() in ('passed', 'warning')])

              return {
                  'article_titles': article_titles,
                  'quality_scores': quality_scores,
                  'article_images': [],
                  'evaluation_reports': [],
                  'article_tags': article_tags,
                  'generated_articles_list': generated_articles_list,
              'evidence': '\n\n'.join(evidence_parts),
                  'batch_sufficiency_report': '上游输入{}篇；目标{}篇；输出{}篇；blocked文章{}；可发布文章{}。blocked文章保留正常正文与重写指令，不用占位文案覆盖，也不在结果合并阶段静默丢弃。'.format(
                  source_count,
                  target_total or source_count,
                  len(generated_articles_list),
                  blocked_count,
                  publishable_count
              ),
              'rewrite_queue': [
                  {
                      'rewrite_index': i + 1,
                      'source_title': str(x.get('title', '') or ''),
                      'hard_issues': x.get('_final_validation_issues', [])[:8] if isinstance(x.get('_final_validation_issues', []), list) else [str(x.get('_final_validation_issues', ''))]
                  }
                  for i, x in enumerate(normalized)
                  if isinstance(x, dict) and str(x.get('_final_validation_status', '')).lower() == 'blocked'
              ],
              'final_validation_report': str(final_validation_report or ''),
          }
        code_language: python3
