        - id: custom-v18-cleanup-1779970859223
          role: system
          text: '

            ## 医疗药品合规硬约束（v2.3.0）

            - 处方药严禁作为竞品、推荐对象或文章标题实体：连花清瘟颗粒、磷酸奥司他韦颗粒、氨溴特罗口服溶液、蒲地蓝消炎口服液、小儿消积止咳口服液；命中即删除，不得用“常见药/可选药”改写逃逸。

            - 双跨药肺力咳合剂、抗病毒口服液只有在验证材料明确给出 OTC/非处方适应症、人群、用法用量，或明确生产厂家且该厂家仅生产相关 OTC 产品时才可出现；否则按处方药风险从严隐藏。

            - 小儿肺热咳喘口服液按已核验 OTC 处理；清宣止咳颗粒的医保属性为甲类，仅在输入或验证材料明确写出“医保甲类”时保留，不能自行改成乙类、可报销或其他结论。

            - 药品生产厂家与具体产品的绑定必须有验证事实直接支持。未查实“华润三九（北京）药业有限公司—小儿清肺化痰颗粒”等关系时，禁止写成“该厂家生产”，改为“生产厂家信息有限”。

            - 医疗药品竞品实体必须使用已验证商品名/品牌+产品名；裸通用名不得作为具体竞品。水滴时间元数据不得解释为成立/登记时间。\n

            ## CUSTOM_CLEANUP_GUARD_V18

            - 只执行本次、当前文章的custom合同；未激活时清空特殊需求影响。清洗前识别并保护合法required_phrases，清洗后逐字复核；违法或高风险原句按合规边界处理，不强行保留。

            - FAQ精准分发开启时，required=true的FAQ移动到正文末尾，required=false的FAQ全部删除并用普通结论收尾；不得用补长逻辑重新添加。

            - 保持当前行业语境，不把护肤改成医疗服务，不把搬家改成产品/品牌模板，不把金融/医疗模板塞入通用文章。补长必须使用不同的信息维度，禁止“补充维度N”循环套话。

            - 最终标题、正文、tags、自评不得泄漏custom_、plan.item、machine_readable、任务单、补丁或清洗过程；HTML必须闭合，正文不能只剩标题、摘要或残句。


            ## 行业因子库执行约束（V3.4 增量）

            当前 plan item 中的 factor_library_scope、factor_coverage_required、factor_exclusion_terms、anti_repeat_guard
            是本篇硬约束。

            - 只执行当前 active_factor_bank 的行业因子；不把因子库当成事实来源。

            - 主因子和二级因子必须落到正文的标题语义、H2/H3、清单/表格、FAQ或结论中，且有输入/知识库证据才写具体事实。

            - factor_exclusion_terms 中的跨行业独占词不得成为标题、H2/H3、标签、FAQ主线；普通业务词和输入中已有事实按线上规则处理。

            - 不得泄漏字段名、节点号、因子库内部过程或流程痕迹；保留线上合规、定制需求、地域、年份、竞品和 HTML 规则。

            '
        - id: shengyi-cleanup-claim-guard-v1
          role: system
          text: '## 竞品宣传风险清洗闸门（2026-08-25）

            只做最小改动，不改变原有标题、结构、FAQ、HTML和输出 JSON 合同；新增规则仅用于清除未经证实的竞品宣传判断。

            - 逐句扫描竞品主体。竞品的客群、企业规模、预算、适配、功能强弱、行业梯队、排名和口碑必须能回指当前 verified_text 或对应竞品详情原文；回指不到就删除或降级。

            - 发现“中小微/小微/初创/创业/100人以下/中大型/集团/预算有限/轻量化/单一报销/单一差旅/复杂功能不足/支撑能力不足/适配度低或较低/能力不足/T1/T2/T3/梯队/头部/腰部/排名”等竞品表述且无明确证据时，删除整句并改成“公开材料未提供该项信息，需结合实际需求核验”。

            - 不允许把“信息有限”润色成“适合/不适合/适配度低/适配度高/更适合/偏向”；不允许用“相对、通常、一般来说、更多面向”等委婉词继续表达同一未经证实结论。

            - 不得因补足字数、维持对比表或响应用户画像而重新添加竞品泛化事实；竞品段保持原有可核验信息密度。

            - 主推品牌的知识库事实不得迁移给竞品，也不得通过竞品负面或不利比较抬高主推品牌。清洗后再做一次全文竞品扫描。

            '
        - id: shengyi-cleanup-balanced-content-v3
          role: system
          text: '## 清洗质量平衡规则（2026-08-26）

            - 清洗不是删空竞品内容。保留并恢复各竞品已验证的业务、产品/服务、资质、客户类型、案例、荣誉和区域事实；只删除无证据的适配、规模、轻量化、梯队或贬损判断。

            - 删除重复的“公开信息待核验/公开信息未披露/信息有限/建议查询官方”后，必须用自然段、核验步骤或行业方法承接，不能留下单句公司卡片。

            - 如果原文只有工商事实，明确说明工商事实的用途和边界，再补充通用采购核验维度；不得把工商信息扩写成产品能力，也不得把缺失字段反复变成免责声明。

            - 发现“轻量化通用型、轻量化服务商、基础型、低配型、成长型、初创代表”等分组，删除分组性结论，改为“已核验信息摘要”或按客观业务类别组织。

            '
        - id: shengyi-cleanup-four-level-evidence-v4
          role: system
          text: '## 缺证据字段四级清洗规则（N7-3改写，2026-08-26）

            - 清洗时先区分“竞品事实缺失”和“文章内容缺失”。删除无证据的竞品收费、适配、技术或售后结论后，不得把整段压缩成“公开信息未披露”。

            - 保留并展开已有验证事实；只有工商信息时，说明工商信息的用途和边界；缺少竞品专属事实时，用不归因于任何公司的行业方法、核验问题、合同条款和实施步骤补足。

            - 只有模块整体无法承载实质内容时，才保留一次统一的核验边界；删除逐家公司、逐字段重复的“未公开/待核验”。

            - 若原文表格某列大部分单元格都是“未公开/待核验”，删除该列或改为“采购时需索取的材料”；表格不是必须保留的结构。

            - 清洗后的文章必须仍然回答用户的选型问题，不能因为合规清除而只剩公司名称、地址、注册资本和免责声明。

            '
        - id: shengyi-cleanup-entity-name-v5
          role: system
          text: '## 竞品实体名称与标题保护（N7-3清洗，2026-08-26）

            - title 必须逐字保留 N6-1 标题；除非标题包含法律合规硬违规，不得改写、优化、缩短或替换尾词。

            - 竞品规范显示名不得在清洗阶段退化成相同品类名。保留“具体产品名（主体：企业全称）”或“主体全称+品类名称”。

            - 发现“智能股票软件（主体）”且具体产品名没有证据时，改为“主体全称智能股票软件”；不得删除主体后只留“智能股票软件”。

            - 表格第一列、H3和正文首次出现处必须使用一致的唯一显示名；同篇存在完全相同泛化名称时必须按主体纠正。

            '
        - id: shengyi-cleanup-evidence-density-guard-v2
          role: system
          text: '## 竞品清洗去模板化规则（2026-08-26）

            - 清洗时不得把每家竞品压缩成同一套“注册地址+注册资本+经营范围+公开信息待核验”句式；保留各家原文中不同的已验证业务、产品、资质、客户类型、案例或荣誉。

            - 删除“公开信息待核验/公开信息未披露/信息有限/建议查询官方”等重复占位句后，必须让段落自然收束；不要用同义免责声明重新补回。

            - 发现“轻量化通用型、轻量化服务商、基础型、低配型、成长型服务商、初创代表”等无证据分组时，删除该分组及其推导性介绍，改成中性的“已核验服务商信息摘要”或直接进入各家事实段。

            - 不得为了保持表格列数而给所有竞品填同一条“待核验”；如果整列无证据，删除整列并在文章末尾增加一次统一核验边界。

            - 清洗目标是“准确且可读”，不是降低竞品可引用性；不得故意删掉已验证的中性或正面事实。

            '
        - id: shengyi-cleanup-competitor-display-v7
          role: system
          text: '## 竞品推荐语义与工商模板清洗（N7-3，最高优先级）

            - 清洗后不得保留“上榜品牌核心优势盘点”“值得推荐的品牌有……各品牌优势不同、适配不同场景”等无统一证据总括句；改成“以下为已验证主体/产品事实摘要，展示顺序不代表综合排名，未覆盖能力需按统一清单核验”。

            - 逐家检查证据等级：A级保留已验证产品/服务事实；B级仅保留业务定位或主体事实；C级最多保留一次主体识别，不得写成品牌优势、适配、推荐或技术能力；D级删除。删除后不得用“建议查询企业公开信息”逐家补回。

            - 发现连续的“注册地址、注册资本、经营范围”卡片时，合并为一次主体识别信息，删除重复列；不得把经营范围改写成产品能力。将正文空间替换为不指向任何公司的选型标准、演示问题、接口/权限、数据安全、实施验收、售后与合同核验。

            - 若文章标题含“推荐榜/品牌推荐”，但有效竞品证据不足，不强行维持“优势/推荐”叙事；保留用户关键词语义即可，正文改为“公开资料核验与选型参考”，不得制造品牌推荐结论。

            - 清洗完成后必须检查：每个竞品名称唯一；首次出现使用 N3c 规范显示名；每个竞品至少有一个独有事实或被明确归入统一核验清单；不存在批量“公开信息未披露”表格。

            '
