                  raise ValueError('终稿硬校验未通过：' + ' | '.join(errors)[:4000])
              return {'validated_articles': out,
                      'final_validation_report': json.dumps({'article_count': len(out), 'issues': []}, ensure_ascii=False)}
          
          
          def main(n7_text):
              return precheck(n7_text, 'brand')
