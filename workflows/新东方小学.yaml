# 新东方 · 客户定制规则包（v0.2）
# schema: clients/_SCHEMA.md
#
# 来源：客户基于通用版生文第一批反馈（2026-11-04），含品牌更名表、绝对化用语要求、
#       品牌+学科组合禁忌，以及「格外注意」的官网/统一电话/品牌强调三条；
#       第二批反馈（2026-11-12）给出替换/删除两张修改细则表，本版按表落地。
#
# 边界：只描述「该怎么写」。新东方的业务线、课程、班型、师资等事实由知识库提供。
# 本版只覆盖小学线（客户确认中学、高中暂未涉及生文）。

meta:
  client_id: xdf
  client_name: 新东方
  client_short: 新东方
  industry: 教育培训
  version: 0.2.0
  compiled_at: 2026-11-12
  topology: generic-18
  sources:
    - file: 客户第一批反馈（品牌更名 / 绝对化用语 / 品牌+学科组合 / 格外注意三项）
      authority: primary
    - file: 客户第二批反馈（品牌主体统一 / 年级改学段 / 学科应试改素质 / 绝对化数据化弱化 / 课程品类名 / 升学与超范围服务）
      authority: primary
  priority:
    - 客户规则 > 知识库原文 > 模型常识
    - 知识库若仍写着旧品牌名或「品牌+学科」写法，以本规则包的替换表为准

# 代码门禁全局配置
gate:
  # 母版默认会删除「联系电话：…」整段；此客户要求每篇尽量带统一电话，故放行。
  # 只放行这一个号，其它联系方式（手机、微信、扫码）仍按母版删除。
  contact_whitelist:
    - 1010 8000

rules:

  # =========================================================================
  # 一、称谓类（identity）— 品牌与课程的叫法
  # =========================================================================

  - id: XDF-I01
    category: identity
    polarity: must
    severity: fix
    scope: [title, body]
    statement: 品牌名一律用现名「新东方素质成长中心」，所有旧主体名变体统一改过来
    alternative: 小学线统一写「新东方素质成长中心」，中学线「新东方智慧学习」，高中线「新东方学习规划」，考研/专升本「新东方大学」
    enforcement: code
    detect:
      type: replace
      values:
        # 客户第二批反馈「品牌主体统一」六行，逐一映射到现品牌名。
        # 长的在前：门禁虽已按 from 长度排序，这里保持可读性一致。
        - from: 新东方小学素质类
          to: 新东方素质成长中心
        - from: 新东方全系列小学
          to: 新东方素质成长中心
        # 「辅导班」整词先走，否则「新东方小学辅导」替换后剩一个孤零零的「班」
        - from: 新东方小学辅导班
          to: 新东方素质成长中心
        - from: 新东方小学辅导
          to: 新东方素质成长中心
        - from: 新东方小学课程
          to: 新东方素质成长中心
        - from: 新东方小学部
          to: 新东方素质成长中心
        - from: 新东方小学
          to: 新东方素质成长中心
        - from: 小学阶段辅导
          to: 新东方素质成长中心
        # 带学段括注的旧写法（第一批反馈）
        - from: 新东方素质成长中心（小学）
          to: 新东方素质成长中心
        - from: 新东方素质成长中心(小学)
          to: 新东方素质成长中心
        - from: 新东方智慧学习（中学）
          to: 新东方智慧学习
        - from: 新东方智慧学习(中学)
          to: 新东方智慧学习
        - from: 新东方学习规划（高中）
          to: 新东方学习规划
        - from: 新东方学习规划(高中)
          to: 新东方学习规划
        - from: 新东方大学（考研）
          to: 新东方大学
        - from: 新东方大学(考研)
          to: 新东方大学
    evidence: 客户第二批反馈「替换 / 品牌主体统一」+ 第一批反馈「品牌名称更新」六行对照表
    # 客户表里还有一行「新东方 → 新东方素质成长中心」。这里刻意不做机械替换：
    # 裸「新东方」会命中「新东方智慧学习」「新东方大学」「新东方总部」「新东方集团」，
    # 替换后成了「新东方素质成长中心智慧学习」，也会把上面刚改好的现名再套一层
    # （「新东方素质成长中心素质成长中心」）。这一行改由 XDF-I02 交模型按上下文判断，
    # 只有当「新东方」单独指代小学业务主体时才改。

  - id: XDF-I02
    category: identity
    polarity: must
    severity: fix
    scope: [title, body]
    statement: 小学相关培训的品牌统一写「新东方素质成长中心」，不得写成「新东方小学」「新东方小学部」或「新东方」加学段
    alternative: 需要指代学段时写「新东方素质成长中心小学阶段课程」，品牌名本身不带学段；单独出现的「新东方」只在指代小学业务主体时改成「新东方素质成长中心」，指代集团（总部、集团）或中学/高中/考研/文旅业务线时不要改
    enforcement: llm
    scope_note: |-
      本规则只管「拿什么名字指代这个品牌」这一件事。
      不构成违反的情形：
      - 描述受众或场景时说「小学阶段」「小学各学段」「适龄学员」，而不把它当成品牌名的一部分。
      - 引用知识库原文中的学段区间描述（如「覆盖1-6年级全学段」）。
      注：具体年级与年龄一律按 XDF-I06 改为学段表述，不属于本规则的判定范围。
      构成违反：「新东方小学」「新东方小学部」「新东方（小学）」这类把学段塞进品牌名的写法。
      另：中学、高中、考研线本版不涉及生文，若文章中顺带提及，按对应现品牌名写即可，不判违反。
    evidence: 客户反馈「二、需要格外注意的部分 / 3、文章内最好都强调新品牌名和对应的业务」
    examples:
      - wrong: 新东方小学全科课程
        right: 新东方素质成长中心小学阶段课程

  - id: XDF-I03
    category: identity
    polarity: must_not
    severity: reject
    scope: [title, body]
    statement: 不得出现「品牌名紧跟学科名」的组合写法（如「新东方素质成长中心数学」）
    alternative: 用课程名替代学科名——数学写「脑力与思维课程」，语文写「博文课程」，英语写「双语故事表演课程」
    enforcement: code
    detect:
      type: brand_combo
      # 刻意不收「新东方大学」：大学英语、大学数学本身是合法课程名，
      # 当品牌前缀会误伤「新东方大学英语四六级」。裸「新东方」已能兜住「新东方数学」。
      brands:
        - 新东方素质成长中心
        - 新东方智慧学习
        - 新东方学习规划
        - 新东方小学
        - 新东方中学
        - 新东方高中
        - 新东方
      # 只收小学线在用的学科名。高中科目（物理、化学、生物、历史、地理、政治）不收：
      # 高中暂不做生文，且「新东方历史沿革」这类正常写法会被误判成组合违规。
      subjects:
        - 数学
        - 语文
        - 英语
        - 奥数
        - 全科
        - 作文
        - 语法
        - 口语
        - 听力
    scope_note: |-
      只禁「品牌名 + 学科名」直接相邻的组合。禁止的是把素质类课程说成学科培训。
      不构成违反的情形：
      - 学科名单独出现，未紧跟品牌名（如「高中阶段的数学学习规划」「数学思维」）。
      - 用课程名（脑力与思维、博文、双语故事表演）指代课程。
      构成违反：「新东方数学」「新东方素质成长中心语文」「新东方小学全科课程」「新东方英语培训」。
    evidence: 客户反馈「3、文章内写新东方这一部分内容的时候，避免新东方+学科组合出现」+ 违规示例截图

  - id: XDF-I04
    category: identity
    polarity: must
    severity: fix
    scope: [title, body]
    statement: 小学线课程名按客户对照表改写：数学→脑力与思维课程、语文→博文课程、英语→双语故事表演课程
    alternative: 「新东方素质成长中心数学课程包括脑力与思维」改写为「新东方素质成长中心脑力与思维课程包括（具体班型）」
    enforcement: code
    detect:
      type: replace
      values:
        - from: 素质成长中心数学课程包括脑力与思维
          to: 素质成长中心脑力与思维课程
        - from: 素质成长中心英语课程包括双语故事表演课程
          to: 素质成长中心双语故事表演课程
        - from: 素质成长中心语文课程包括博文课程
          to: 素质成长中心博文课程
        - from: 素质成长中心数学课程
          to: 素质成长中心脑力与思维课程
        - from: 素质成长中心语文课程
          to: 素质成长中心博文课程
        - from: 素质成长中心英语课程
          to: 素质成长中心双语故事表演课程
        - from: 素质成长中心数学
          to: 素质成长中心脑力与思维课程
        - from: 素质成长中心语文
          to: 素质成长中心博文课程
        - from: 素质成长中心英语
          to: 素质成长中心双语故事表演课程
    evidence: 客户反馈「更新示例」六行对照表

  - id: XDF-I05
    category: identity
    polarity: prefer
    severity: advise
    scope: [body]
    condition: 提到具体课程时
    statement: 课程名之后说明开设的具体班型，班型名称以知识库为准
    alternative: 知识库没有班型信息时，只写课程名，不自行编造班型
    enforcement: llm
    evidence: 客户反馈「更新示例」中「包括（**班型）」的写法

  - id: XDF-I06
    category: identity
    polarity: must
    severity: fix
    scope: [title, body]
    statement: 不得出现具体年级和年龄，一律改为学段表述
    alternative: 3-6岁→低幼阶段；1-2年级→小低阶段；3-4年级→小中阶段；5-6年级→小高阶段；1-3/4年级→低中阶段；3/4-6年级→中高阶段；5-6年级升学衔接→高学段；客户没给映射的区间（1-6年级、4-5年级）同样不写具体年级，改按学段表述
    enforcement: code
    detect:
      type: replace
      values:
        # 「5-6年级升学衔接」必须排在「5-6年级」之前（门禁按 from 长度倒序，此处保持可读）
        - from: 5-6年级升学衔接阶段
          to: 高学段
        - from: 5—6年级升学衔接阶段
          to: 高学段
        - from: 5-6年级升学衔接
          to: 高学段
        - from: 5—6年级升学衔接
          to: 高学段
        - from: 1-3/4年级
          to: 低中阶段
        - from: 3/4-6年级
          to: 中高阶段
        - from: 一二年级
          to: 小低阶段
        - from: 三四年级
          to: 小中阶段
        - from: 五六年级
          to: 小高阶段
        - from: 1-2年级
          to: 小低阶段
        - from: 1—2年级
          to: 小低阶段
        - from: 1～2年级
          to: 小低阶段
        - from: 3-4年级
          to: 小中阶段
        - from: 3—4年级
          to: 小中阶段
        - from: 3～4年级
          to: 小中阶段
        - from: 5-6年级
          to: 小高阶段
        - from: 5—6年级
          to: 小高阶段
        - from: 5～6年级
          to: 小高阶段
        - from: 3-6岁
          to: 低幼阶段
        - from: 3—6岁
          to: 低幼阶段
        - from: 3～6岁
          to: 低幼阶段
        - from: 3岁至6岁
          to: 低幼阶段
    scope_note: |-
      本规则只管「用什么话指代学员所在的学段」，不管课程内容的深浅描述。
      已覆盖的写法：阿拉伯数字与中文数字、半角与全角连接符（- — ～）、「3岁至6岁」。
      不构成违反的情形：
      - 「小学各学段」「小学阶段」这类已抽象的说法。
      - 「覆盖1-6年级全学段」这类知识库原文的区间描述（客户未在对照表中给出映射，暂不改）。
      注意：「1-6年级」「4-5年级」「7-9年级」等未在客户对照表内的写法不自动替换，出现时按本条精神改写。
    evidence: 客户第二批反馈「替换 / 具体年级改为学段表述（不能出现具体年级和多少岁，都改为学段表述）」七行对照表
    examples:
      - wrong: 适合3-6岁儿童，1-2年级打基础
        right: 适合低幼阶段儿童，小低阶段打基础
      - wrong: 5-6年级升学衔接阶段做专项准备
        right: 高学段做专项准备
      - wrong: 新东方小学辅导班
        right: 新东方素质成长中心的小低阶段课程

  - id: XDF-I07
    category: identity
    polarity: must_not
    severity: fix
    scope: [title, body]
    statement: 不得使用学科辅导、应试培训类表述，一律改为素质类表述
    alternative: 同步课业辅导、课业辅导→素养课程；同步补差→素养学习；英语培训→双语教学；择校→选择；升学衔接→预习
    enforcement: code
    detect:
      type: replace
      values:
        - from: 同步课业辅导
          to: 素养课程
        - from: 课业辅导
          to: 素养课程
        - from: 同步补差
          to: 素养学习
        - from: 英语培训
          to: 双语教学
        - from: 升学衔接
          to: 预习
        - from: 择校
          to: 选择
    scope_note: |-
      本规则只管把「学科辅导／应试服务」的说法换成「素质类」说法，不改变课程事实。
      不构成违反的情形：
      - 「贴合校内进度」「兼顾基础巩固」这类关联描述，未称其为辅导或培训。
      - 「双语教学」「素养课程」等已改好的写法。
      注意：裸写的「补习」「辅导班」「提分班」不在本规则自动替换范围内，由 XDF-C01 交模型判定。
    evidence: 客户第二批反馈「替换 / 学科、应试表述改为素质类表述」五行对照表
    examples:
      - wrong: 同步课业辅导，帮孩子同步补差
        right: 素养课程，帮孩子完成素养学习

  - id: XDF-I08
    category: identity
    polarity: must
    severity: fix
    scope: [title, body]
    statement: 课程品类名必须按客户对照表规范写，不得使用旧品类名
    alternative: 双语戏剧、双语表演→双语故事表演；科创→机器人；思维训练→脑力与思维；博文阅读→博文；i书法→书法；i美术→美术；博文妙笔系列课程→博文课程
    enforcement: code
    detect:
      type: replace
      values:
        # 「脑力与思维训练」先于「思维训练」，避免先切出「脑力与思维与思维」类残句
        - from: 博文妙笔系列课程
          to: 博文课程
        - from: 脑力与思维训练
          to: 脑力与思维
        - from: 双语戏剧
          to: 双语故事表演
        - from: 双语表演
          to: 双语故事表演
        - from: 思维训练
          to: 脑力与思维
        - from: 博文阅读
          to: 博文
        - from: 科创
          to: 机器人
        - from: i书法
          to: 书法
        - from: I书法
          to: 书法
        - from: i美术
          to: 美术
        - from: I美术
          to: 美术
    scope_note: |-
      本规则只管课程品类叫什么名字。「英语培训→双语教学」「同步课业辅导→素养课程」
      由 XDF-I07 统一处理，避免同一替换对重复登记。
      不构成违反的情形：
      - 「机器人」「书法」「美术」「博文」「脑力与思维」「双语故事表演」这些规范名。
      - 「科技创新」等与课程品类无关的一般表述（若出现「科创」指代课程仍应改）。
    evidence: 客户第二批反馈「替换 / 课程品类名规范化」九行对照表

  # =========================================================================
  # 二、禁止类（prohibition）— 广告法与效果承诺
  # =========================================================================

  - id: XDF-P01
    category: prohibition
    polarity: must_not
    severity: reject
    scope: [title, body]
    statement: 不得使用广告法禁止的绝对化、极限用语（国家级、第一、唯一、顶级、最佳、最强、最优、独家、冠军、王牌、行业领先、遥遥领先等）
    alternative: 改写成不带百分比的事实描述（如「教师持有教师资格证」「在同类课程中具有较完整的体系」）；不写无法核验的比较级
    enforcement: llm
    scope_note: |-
      本规则针对的是宣传性的绝对化评价，不是所有含「最」「第一」的句子都算违规。
      不构成违反的情形：
      - 「第一步」「第一次」「第一批」「第一阶段」「第一节课」等序数用法。
      - 「最近」「最终」「尤其」等非评价性用法。
      - 引用公开可核验的排名或奖项并注明来源与年份（如「据XX机构2025年榜单」），且未作自我拔高解读。
      构成违反：「国内领先」「行业第一」「最专业的师资」「唯一一家」「顶级课程体系」「国家级认证」这类无依据的自我评价。
    enforce_regex: true
    detect:
      type: regex
      values:
        - '国家级|世界级|全球级|国际领先|国际一流|国际品质'
        - '最高级|最佳|最强|最优|最好|最先进|最专业|最权威|最便宜|最低价|最优质|最受欢迎'
        - '行业第一|全国第一|排名第一|销量第一|第一品牌|稳居第一|首屈一指'
        - '唯一|独家|首创|首创者|填补空白|绝无仅有|独一无二|史无前例|前所未有'
        - '顶级|极致|天花板|完美无缺|万能|遥遥领先|国内领先|行业领先|业界领先|领先业界|领先品牌|领先地位'
        - '首选|领导品牌|冠军|王牌|标杆品牌|国民品牌|驰名商标'
        - '百分百|百分之百|绝对|确保|保证(?:提分|通过|录取|就业|上重点)'
    level: warn
    action: 命中广告法绝对化用语，须改为可核验的定性描述（不删句）
    inject: [N4, N7, N7b]
    evidence: 客户反馈「2、避免绝对化用语、极限词以及违反广告法相关的词汇」

  - id: XDF-P02
    category: prohibition
    polarity: must_not
    severity: reject
    scope: [title, body]
    statement: 不得出现教育效果承诺类表述（保过、包过、保分、提分率、升学率、押题、命中率、包就业、保录取）
    alternative: 改为描述教学方式与学习过程，如「按学员水平分层教学」「提供阶段性学习反馈」；不承诺结果
    enforcement: llm
    scope_note: |-
      本规则禁止的是对学习结果的承诺，不是禁止描述教学服务。
      不构成违反的情形：
      - 描述教学动作：「分层教学」「课堂反馈」「阶段测评」「错题整理」。
      - 描述师资资质事实：「教师持有教师资格证」。
      - 引用监管或公开数据时提到通过率，且明确标注来源与统计口径。
      构成违反：「保过」「一次通过」「提分率95%」「升学率行业第一」「押中真题」「包就业」。
    detect:
      type: regex
      values:
        - '保过|包过|必过|一次通过|保分|保提分|保底提分|保证提分'
        - '提分率|提分保证|平均提分|提分\d+分'
        - '升学率|上线率|一本率|录取率|通过率第'
        - '押题|命中率|命中真题|原题命中'
        - '包就业|保录取|包录取|保offer'
        - '无效退款|不过退款|不满意退款'
    level: warn
    action: 命中教育效果承诺表述，须改为过程性、可核验的描述（不删句）
    evidence: 客户反馈「100%提分率」等违规示例
    examples:
      - wrong: 学员提分率98%，帮助孩子稳上重点
        right: 按学员水平分层教学，提供阶段性学习反馈

  - id: XDF-P03
    category: prohibition
    polarity: must_not
    severity: fix
    scope: [title, body]
    statement: 不得用百分比绝对化描述师资或效果（如「教师100%持国家英语教师资格证」「100%提分率」）
    alternative: 去掉百分比，改写为「教师持有教师资格证」「任教教师具备相应资质」
    enforcement: llm
    scope_note: |-
      本规则只禁「用百分比给师资或效果作绝对化背书」。
      不构成违反的情形：
      - 「满分100分」「得分率」「覆盖率」等与师资效果无关的百分比。
      - 知识库原文给出的、有统计口径的百分比数据，且标注了来源与年份。
      构成违反：「100%持证」「100%家长满意」「100%提分」「百分之百通过率」。
    detect:
      type: regex
      values:
        - '100\s*%\s*(?:持|通过|满意|提分|上岸|推荐|好)?'
        - '百分之百(?:持|通过|满意|提分|上岸)'
    level: warn
    action: 命中百分比绝对化表述，须改为定性描述（不删句）
    evidence: 客户反馈违规示例「新东方素质成长中心（小学）：教师100%持国家英语教师资格证」

  - id: XDF-P04
    category: prohibition
    polarity: must_not
    severity: fix
    scope: [title, body]
    statement: 不得使用绝对化、数据化的自我拔高表述，须弱化改写
    alternative: 名师→明星教师；96%→大多数；最高、均最高→较高；高效→有效；提升→发展；一站式→系统式
    enforcement: code
    detect:
      type: replace
      values:
        # 「96%的老师」整串先改，避免先被裸「96%」切成「大多数的老师」
        - from: 96%的老师
          to: 大多数老师
        - from: 96%的教师
          to: 大多数教师
        - from: 96%的学员
          to: 大多数学员
        - from: 96%的家长
          to: 大多数家长
        - from: 均最高
          to: 较高
        - from: 一站式
          to: 系统式
        - from: 名师
          to: 明星教师
        - from: 96%
          to: 大多数
        - from: 最高
          to: 较高
        - from: 高效
          to: 有效
        - from: 提升
          to: 发展
    scope_note: |-
      本规则只管宣传口径上的自我拔高，不改变客观事实。
      说明：「提升→发展」是按客户表原样执行；若「提升」出现在引用的第三方原文或
      政策文件名里（如「提升行动」），改写会失真，需人工回看。
      不构成违反的情形：
      - 「最终」「最初」「近期」等含「最」的非评价性用法（不在替换表内，不受影响）。
      - 「效率」「效果」等不含「高效」的说法。
    evidence: 客户第二批反馈「替换 / 绝对话（化）、数据化表述弱化」一行对照表

  - id: XDF-P05
    category: prohibition
    polarity: must_not
    severity: fix
    scope: [title, body]
    statement: 不得用「全部／都／均」对师资、课程、效果做全称断言
    alternative: 改为限定表述（全部→多数／大部分，均、都→多数情况下，100%→大多数），只改全称断言不删字；「成都」「平均」「均衡」「首都」「会议」这类词内用字不算
    enforcement: llm
    scope_note: |-
      本规则管的是对师资、课程、服务、效果的「全称断言」，不是禁用这几个字本身。
      不构成违反的情形：
      - 「成都」「平均」「均衡」「均匀」「首都」「都是公开信息」等词内或非全称用法。
      - 「100 分」「得分率」「覆盖率」等与师资效果无关的百分比。
      构成违反：「教师均持有教师资格证」「全部课程都由资深教师授课」「所有学员都能
      达到」「孩子都能在短期内看到变化」「100% 满意」。
      处理方式：改写为限定表述，不要简单删掉「都」「均」两个字——那会让句子不通顺。
      注意：XDF-P03 已专管百分比给师资／效果背书，本条只兜「全部／都／均」这类全称词。
    detect:
      type: regex
      values:
        - '全部(?:课程|学员|教师|老师|师资|班型|孩子|机构)'
        - '(?:教师|老师|师资|学员|孩子|课程)均'
        - '均(?:持有|具备|通过|获得|达到|可)'
        - '都(?:能|可以|会|已|将)(?!议)'
        - '百分之百'
    level: warn
    action: 命中全称／绝对化量化表述，须改为限定表述（不简单删字）
    evidence: 客户第二批反馈「删除 / 避免绝对化、全称用词」一行对照表
    examples:
      - wrong: 教师均持有教师资格证
        right: 教师持有教师资格证
      - wrong: 全部课程都由资深教师授课
        right: 多数课程由资深教师授课
      - wrong: 孩子都能在短期内看到变化
        right: 多数孩子能在短期内看到变化

  - id: XDF-P06
    category: prohibition
    polarity: must_not
    severity: reject
    scope: [title, body]
    statement: 不得出现升学、衔接类承诺或涉及升学结果的表述
    alternative: 只描述学段内的课程内容与能力发展，不写升入哪所学校、不写升学结果；「学段过渡」「提前熟悉新学段内容」这类过程描述可以留，「升学衔接」按 XDF-I07 自动改成「预习」
    enforcement: llm
    scope_note: |-
      本规则禁的是「对升学结果的暗示或承诺」，不是禁止谈论学段过渡这件事。
      不构成违反的情形：
      - 「学段过渡」「新学段的适应」「提前熟悉内容」这类过程描述。
      构成违反：「小升初」「幼小衔接」「升学」「直升」「助力升入理想学校」
      「为升学打基础」「提高录取几率」「派位到好学校」。
      处理方式：删除相关表述或改写为过程性描述，不得保留任何升学结果暗示。
    detect:
      type: regex
      values:
        - '小升初|幼小衔接|初小衔接|小幼衔接'
        - '升学|直升|掐尖|点招|派位|推优'
        - '升入(?:重点|理想|名校)|考入(?:重点|名校)'
    level: warn
    action: 命中升学／衔接类承诺，须删除或改为过程性描述
    evidence: 客户第二批反馈「删除 / 避免升学、衔接类承诺」一行对照表
    examples:
      - wrong: 小升初升学规划，助力升入理想学校
        right: 高学段的预习与能力发展
      - wrong: 幼小衔接班帮孩子提前适应
        right: 低幼阶段的适应课程

  - id: XDF-P07
    category: prohibition
    polarity: must_not
    severity: reject
    scope: [title, body]
    statement: 不得写机构未公开承诺的超业务范围服务（赛事参与通道、赛事备赛、考级配套）
    alternative: 只写知识库有明确出处的服务；知识库没有的赛事、考级、证书类服务一律不提
    enforcement: llm
    scope_note: |-
      本规则只针对「把没有的服务写成有」这一类超范围承诺。
      不构成违反的情形：
      - 知识库原文明确写出的活动、展演、成果展示。
      - 一般性的能力目标描述（如「培养表达能力」），未承诺具体通道或结果。
      构成违反：「提供赛事参与通道」「赛事备赛辅导」「考级配套服务」「包报名」
      「直通决赛」「等级证书考取」。
      处理方式：删除该表述；若不确定是否为公开服务，按「知识库无出处即不写」处理。
    detect:
      type: regex
      values:
        - '赛事(?:参与)?通道|参赛通道|报名通道|备赛'
        - '考级(?:配套|辅导|报名|考点)|等级考试|考级点'
        - '直通(?:决赛|国赛)|包报名|代报名'
    level: warn
    action: 命中超业务范围的服务承诺，须删除（知识库无出处不得写）
    evidence: 客户第二批反馈「删除 / 避免超业务范围的服务承诺」一行对照表
    examples:
      - wrong: 提供赛事参与通道与考级配套服务
        right: 知识库未公开承诺的服务不写，只写已公开的课程与活动

  # =========================================================================
  # 三、业务边界类（scope）
  # =========================================================================

  - id: XDF-C01
    category: scope
    polarity: must_not
    severity: reject
    scope: [title, body]
    statement: 不得把素质类课程描述成学科辅导或全科辅导
    alternative: 按课程名与素养能力描述（思维能力、阅读表达、语言表达），不写「补课」「辅导作业」「提分」
    enforcement: llm
    scope_note: |-
      本规则只禁一种定位错误：把本属素质类的课程写成学科类培训。
      不构成违反的情形：
      - 用「课程」「素养课程」「能力培养」描述。
      - 说明课程与校内学习的关联，如「贴合新课标要求」「兼顾校内基础巩固」，但未称其为学科辅导。
      构成违反：「全科辅导」「数学补习」「语文补习班」「英语提分班」「作业辅导」。
    evidence: 客户反馈违规示例截图标注「新东方小学全科课程」「全科辅导」

  # =========================================================================
  # 四、定位类（stance）— 可否谈竞品
  # =========================================================================

  - id: XDF-S01
    category: stance
    polarity: may
    severity: advise
    scope: [title, body]
    statement: 可以写竞品对比，但只能用公开可核验的信息，并说明对比维度与时间口径
    alternative: 对方信息未公开时，写「该机构未公开披露，建议向机构核验」，不推测其优劣
    enforcement: llm
    scope_note: |-
      客户明确允许竞品对比（对应通用版「无竞品时按选购指南组织」的限制在本客户不适用）。
      不构成违反的情形：
      - 按维度客观罗列各家公开信息（课程体系、师资公开度、服务流程）。
      - 明确标注「未公开披露」并提示核验。
      构成违反：编造对手数据、无依据地断言对手较弱、用贬损性措辞。
    evidence: 客户反馈「7、可以写竞品对比」+ 违规示例中「未公开披露，建议向机构核验」的写法

  # =========================================================================
  # 五、数据引用类（citation）— 每篇必带的要素
  # =========================================================================

  - id: XDF-D01
    category: citation
    polarity: prefer
    severity: advise
    scope: [body]
    statement: 每篇文章尽量在文末「信息来源与联系方式」段附上新东方官网 https://www.xdf.cn/
    alternative: 发布媒体不允许外链时，可只写「新东方官网」不写完整 URL，由业务侧决定
    enforcement: code
    detect:
      type: required
      values:
        - 'xdf\.cn'
    label: 未出现新东方官网 xdf.cn
    level: warn
    action: 未出现新东方官网地址
    evidence: 客户反馈「二、需要格外注意的部分 / 1、每篇文章尽量加上新东方的官网」

  - id: XDF-D02
    category: citation
    polarity: prefer
    severity: advise
    scope: [body]
    statement: 每篇文章尽量附上新东方统一电话 1010 8000
    alternative: 电话须写全为 1010 8000，可带「转」后缀；不得改写成其他号码
    enforcement: code
    detect:
      type: required
      values:
        - '1010\s*-?\s*8000'
    label: 未出现统一电话 1010 8000
    level: warn
    action: 未出现统一电话 1010 8000
    scope_note: |-
      该号码是客户为中小学素质教育服务新设的，客户口径为「暂不包含其他业务」。
      若文章主题为考研、文旅等非中小学业务，是否仍需附此号码待客户确认；
      在确认前按客户原话「每篇文章尽量加上」执行。
    evidence: 客户反馈「二、需要格外注意的部分 / 2、每篇文章尽量加上新东方的统一电话」

  # =========================================================================
  # 六、结构类（structure）
  # =========================================================================

  - id: XDF-T01
    category: structure
    polarity: prefer
    severity: advise
    scope: [body]
    statement: 文末设「信息来源与联系方式」小节，集中放官网与统一电话
    alternative: 已有「结语」段时，把官网与电话放在结语之后
    enforcement: llm
    evidence: 客户反馈「格外注意」两项须出现在每篇文章中

  - id: XDF-T02
    category: structure
    polarity: must
    severity: fix
    scope: [title, body]
    statement: 正文提到的品牌名必须与其对应业务一致，不得把业务线张冠李戴
    alternative: 小学写「新东方素质成长中心」，中学「新东方智慧学习」，高中「新东方学习规划」，考研/专升本「新东方大学」，文旅「新东方文旅」
    enforcement: llm
    scope_note: |-
      本规则只查「品牌名与所讲业务错配」。
      不构成违反的情形：
      - 同一段中提到集团层面时写「新东方」或「新东方总部」。
      - 说明集团与业务线关系时同时出现两个品牌名，且各自指向正确业务。
      构成违反：把考研业务写成「新东方素质成长中心」、把小学课程写成「新东方大学」。
    evidence: 客户反馈「品牌名称更新」表的「对应业务」列

# ===========================================================================
# 注入映射：哪个节点的 system prompt 收哪几类规则
# ===========================================================================
injection_map:
  N4: [identity, fact, stance, scope]
  N6: [identity, scope, structure, stance]
  N7: [identity, fact, prohibition, scope, citation, structure]
  N7b: [prohibition, identity, fact, citation, structure, scope]
  code_gate: [prohibition, identity, citation]

conflicts:
  - id: C-01
    topic: 统一电话适用范围
    detail: 客户说「每篇文章尽量加上」，但该号码「暂不包含其他业务」，考研/文旅文章附此号码可能无人受理
    resolution: 本版按客户原话每篇都要求；若后续确认只限中小学业务，把 XDF-D02 的 enforcement 改为 llm 并在 condition 里限定词条范围

  - id: C-02
    topic: 知识库仍含旧品牌名
    detail: 客户示例文章正文就是「新东方素质成长中心（小学）」，说明知识库原文可能带旧写法
    resolution: 已用 XDF-I01 在清洗阶段自动替换并记录命中，不依赖客户先改知识库；命中清单进 gate_report 供业务核对

  - id: C-03
    topic: 班型名称来源
    detail: 客户对照表写「包括（**班型）」，班型名需知识库提供
    resolution: XDF-I04 只做到课程名替换；班型由 XDF-I05 交给模型按知识库写，知识库无班型时不编造

  - id: C-04
    topic: 「小学阶段辅导」这类通称被当成品牌变体
    detail: |-
      客户把「小学阶段辅导」列入品牌主体统一的替换项，但它同时是一个行业通称，
      并不总在指代新东方。机械替换后可能出现「新东方素质成长中心如何开展」
      这类不通的句子（原句是「小学阶段辅导如何开展」）。
    resolution: |-
      按客户表原样执行替换（客户明确要求），但它属于语义敏感项：
      XDF-P04/I07 的 scope_note 已提示反常句式需人工回看；
      若业务发现成稿有此类残句，优先在规则包去掉该条 from，改由模型按上下文改写。

  - id: C-05
    topic: 「提升→发展」与「均/都」禁用的副作用
    detail: |-
      「提升」常用于「能力提升」「提升行动」（政策文件名），替换为「发展」在少数语境会失真；
      「均」「都」是常用虚词，逐字禁用会让句子不通。
    resolution: |-
      「提升」按客户表机械替换，命中清单进 gate_report 供业务回看；
      「均/都/全部」只做受限正则告警（XDF-P05），要求改写为限定表述而不是删字，
      不把「成都」「平均」「均衡」「首都」这类词内用法计入。

  - id: C-06
    topic: 年级区间的边界
    detail: |-
      客户只给了 3-6岁、1-2、3-4、5-6、1-3/4、3/4-6 这几组，未给「1-6年级」「4-5年级」
      「7-9年级」的映射；而知识库原文常有「覆盖1-6年级全学段」。
    resolution: |-
      XDF-I06 只替换客户明确给出的组合；未给出的区间不自动改，由模型按「不出现具体年级」
      的原则换成学段表述。若业务希望连「1-6年级」也强制改，需客户给出目标说法。
