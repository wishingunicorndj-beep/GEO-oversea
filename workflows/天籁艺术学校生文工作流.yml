        code: "import json, re\n\ndef _parse(value):\n    if isinstance(value, dict): return dict(value)\n    if not isinstance(value, str): return None\n    text = value.strip()\n    if text.startswith('```'):\n        text = re.sub(r'^```(?:json)?\\s*', '', text, flags=re.I)\n        text = re.sub(r'\\s*```$', '', text)\n    try:\n        obj = json.loads(text)\n        return obj if isinstance(obj, dict) else None\n    except Exception:\n        match = re.search(r'\\{.*\\}', text, flags=re.S)\n        if not match: return None\n        try:\n            obj = json.loads(match.group(0))\n            return obj if isinstance(obj, dict) else None\n        except Exception:\n            return None\n\ndef _clean_text(value):\n    text = str(value or '')\n    text = re.sub(r'(?i)(?:^|\\n)\\s*(?:system|user|assistant)\\s*:\\s*', '\\n', text)\n    text = re.sub(r'(?i)(?:{{#.*?#}}|\\[待补充\\]|\\{\\{[^{}]+\\}\\})', '', text)\n    text = re.sub(r'<script\\b[^>]*>.*?</script>', '', text, flags=re.I|re.S)\n    text = re.sub(r'<style\\b[^>]*>.*?</style>', '', text, flags=re.I|re.S)\n    text = re.sub(r'(?i)<h([1-6])>\\s*</h\\1>', '', text)\n    text = re.sub(r'(?i)<p>\\s*</p>', '', text)\n    text = re.sub(r'(?i)(?:联系电话|联系方式|咨询电话|扫码添加)[：:：]?\\s*[^<。！？\\n]{0,80}', '', text)\n    text = re.sub(r'\\n{3,}', '\\n\\n', text)\n    text = re.sub(r'[ \\t]{2,}', ' ', text)\n    return text.strip()\n\ndef _clean_tags(tags):\n    if isinstance(tags, str): tags = re.split(r'[,，、\\n]+', tags)\n    if not isinstance(tags, list): return []\n    out=[]\n    for tag in tags:\n        tag=_clean_text(tag).strip('# ')\n        if tag and tag not in out: out.append(tag)\n    return out[:8]\n\n\n# ---------------------------------------------------------------------------\n# 天籁客户规则代码门禁（由构建脚本从规则包生成，勿手改）\n#\n# 只做可确定性检出的事：数字有没有知识库出处、具名人物是否来自知识库、\n# 师资是否越界概括、竞品是否被展开对比、文末是否有「内容真实」类自我声明。\n# 命中默认只标注并写进 gate_report；只有客户明确要求「不得出现」的自证声明会删句。\n# ---------------------------------------------------------------------------\nTL_GATE = json.loads(r\"\"\"{\n \"self_certification\": [\n  \"(?:本文|本篇|全文)(?:内容|所述|数据|信息)?(?:均|全部)?(?:真实|属实|可靠|准确)\",\n  \"(?:内容|数据|信息)(?:均|全部)?(?:真实|属实|可靠)(?:可查|可核|无误)?\",\n  \"无(?:任何)?(?:编造|虚构|杜撰)\",\n  \"不存在(?:虚假|编造|虚构|夸大)\",\n  \"如有雷同|纯属巧合\",\n  \"未经(?:任何)?(?:虚构|编造)\"\n ],\n \"teacher_whitelist\": [\n  \"王正光\",\n  \"梅进杰\",\n  \"柏睿\",\n  \"王献杰\",\n  \"王勉\"\n ],\n \"competitor_names\": [\n  \"鲁轩画室\",\n  \"鲁轩\",\n  \"荷马画室\",\n  \"远伦画室\",\n  \"远伦\"\n ],\n \"policy_source_check\": true\n}\"\"\")\n\ndef _strip_tags(html):\n    \"\"\"母版 N8-pre 没有这个工具函数（另一版门禁模板才有），这里自带一份。\"\"\"\n    return re.sub(r'<[^>]+>', '', str(html or ''))\n\n\n_TL_OFFICIAL = re.compile(\n    r'教育考试院|教育部|市教委|区教委|教育局|国务院|官方(?:网站|公告|通报)'\n    r'|官网(?:公告|公示)?|通知|公告|红头文件|以[^。；\\n]{0,8}为准')\n_SENT_SPLIT = re.compile(r'(?<=[。！？!?\\n])')\n\n# 成绩、价格、规模类数字（不抓年份、专业数、序号）\n_TL_NUM_RES = [\n    ('名次', re.compile(r'第\\s*\\d+\\s*(?:[-–—~至]\\s*\\d+\\s*)?名')),\n    ('占比', re.compile(r'\\d+(?:\\.\\d+)?\\s*[%％]')),\n    ('分数', re.compile(r'\\d+(?:\\.\\d+)?\\s*分')),\n    ('人数', re.compile(r'\\d+\\s*[余多]?\\s*(?:人|名(?!次|字|师)|位)')),\n    # 金额要能兜住区间，否则「3-5万」只会命中「5万」\n    ('金额', re.compile(r'\\d+(?:\\.\\d+)?(?:\\s*[-–—~至]\\s*\\d+(?:\\.\\d+)?)?\\s*(?:万|元)')),\n    ('率值', re.compile(r'(?:小圈率|过线率|录取率|上线率|合格率|通过率)\\s*(?:高达|达|为|约)?\\s*\\d+')),\n    # 学制与课时：「集训8个月」「48课时」这类也不得凭空写\n    ('学制', re.compile(r'(?<![\\d.])\\d{1,2}\\s*个?\\s*(?:月|课时|小时|周)(?![\\d])')),\n    # 教材数量：「自研教材12册」、丛书「3套」\n    ('教材', re.compile(r'\\d+\\s*[余多]?\\s*(?:册|套|本)(?!科)')),\n    # 榜单档位：「全国艺考十强」「百强机构」，中文数字也要兜\n    ('榜单', re.compile(r'(?:\\d+|[一二三四五六七八九十百]+)\\s*强(?!调|化|制|行|迫)')),\n]\n\n_TL_PERSON = re.compile(r'([\\u4e00-\\u9fa5]{1,3})(?:同学|同学家长)')\n_TL_MASKED = re.compile(r'[\\u4e00-\\u9fa5]\\s*[*＊]\\s*[\\u4e00-\\u9fa5]')\n_TL_TEACHER = re.compile(r'([\\u4e00-\\u9fa5]{2,3})\\s*(?:老师|教师)')\n_TL_TEACHER_STAT = re.compile(\n    r'(?:师资|教师|教职员工|教研团队)[^。；\\n]{0,12}?\\d+\\s*[余多]?\\s*(?:人|名|位)')\n_TL_AVG = re.compile(r'平均(?:教龄|从教|执教)[^。；\\n]{0,4}?\\d+')\n_TL_RATIO_TEACHER = re.compile(\n    r'\\d+\\s*[%％]\\s*的?(?:教师|师资|老师)[^。；\\n]{0,12}(?:毕业|来自|出自)')\n\
          _TL_EVAL = re.compile(r'更好|更强|更弱|更优|较差|不如|超过|领先|优于|劣于|第一|最强|最好')\n_TL_SELFCERT = [re.compile(p) for p in (TL_GATE.get('self_certification') or [])]\n# 只收「政策口径」才有的说法。统考/校考这两个词太宽，机构自己的成绩句也会带，\n# 因此不收；改成必须出现权重、志愿、分数线这类政策词才判。\n_TL_POLICY = re.compile(\n    r'权重|占比|占总分|文化分|文化课(?:成绩|分数)|志愿(?:数|个数|填报)|'\n    r'分数线|控制线|合格线|投档|录取(?:规则|政策|批次)|'\n    r'政策|改革|加分|考试科目|统考科目|校考科目')\n\n\ndef _tl_digits(token):\n    m = re.search(r'\\d+(?:\\.\\d+)?', token)\n    return m.group(0) if m else ''\n\n\ndef _tl_kb_numbers(kb_text):\n    \"\"\"知识库原文里出现过的全部数字，规范化成「4765」这种可比形式。\n\n    用集合精确比对而不是子串包含：子串匹配会让「5」命中「3756」，\n    把编造的「5 万」误判成有出处。\n    \"\"\"\n    out = set()\n    for tok in re.findall(r'\\d+(?:\\.\\d+)?', str(kb_text or '')):\n        if tok.endswith('.0'):\n            tok = tok[:-2]\n        out.add(tok)\n    return out\n\n\ndef _tl_sentence(text, start, end):\n    left = text.rfind('。', 0, start)\n    left2 = text.rfind('\\n', 0, start)\n    sta = max(left, left2) + 1\n    right = [p for p in (text.find('。', end), text.find('\\n', end)) if p != -1]\n    fin = min(right) + 1 if right else len(text)\n    return text[sta:fin]\n\n\ndef _tl_number_check(body, kb_text, kb_nums=None):\n    \"\"\"正文成绩/价格类数字必须能在知识库原文里找到。\"\"\"\n    issues = []\n    kb_nums = kb_nums if kb_nums is not None else _tl_kb_numbers(kb_text)\n    seen = []\n    for label, rx in _TL_NUM_RES:\n        for m in rx.finditer(body):\n            token = m.group(0)\n            nums = re.findall(r'\\d+(?:\\.\\d+)?', token)\n            if token in seen:\n                continue\n            seen.append(token)\n            if not nums:\n                # 中文数字（「十强」「百强」）取不到阿拉伯数字，只能按词形回到原文找\n                if token in str(kb_text or ''):\n                    continue\n                issues.append({'id': 'TL-X01', 'level': 'hard', 'field': 'body',\n                               'hits': [token],\n                               'action': '该表述在知识库中无出处，须整句删除'})\n                continue\n            # 区间（3-5万）两端都要有出处\n            missing = [n for n in nums if n not in kb_nums]\n            if not missing:\n                continue\n            sent = _tl_sentence(body, m.start(), m.end())\n            official = bool(_TL_OFFICIAL.search(sent))\n            if official and label in ('占比', '分数', '率值'):\n                issues.append({'id': 'TL-X01', 'level': 'warn', 'field': 'body',\n                               'hits': [token],\n                               'action': '政策类数字已带来源，请核对来源与数值是否一致'})\n            else:\n                issues.append({'id': 'TL-X01', 'level': 'hard', 'field': 'body',\n                               'hits': [token],\n                               'action': '该数字在知识库中无出处，须整句删除'})\n    return issues\n\n\ndef _tl_person_check(body, kb_text):\n    issues = []\n    kb_raw = str(kb_text or '')\n    for m in _TL_PERSON.finditer(body):\n        name = (m.group(1) + '同学').strip()\n        if name not in kb_raw and m.group(1) not in kb_raw:\n            issues.append({'id': 'TL-X02', 'level': 'hard', 'field': 'body',\n                           'hits': [name],\n                           'action': '具名学员在知识库中无出处，须删除或改为不具名'})\n    for m in _TL_MASKED.finditer(body):\n        if m.group(0).replace(' ', '') not in kb_raw.replace(' ', ''):\n            issues.append({'id': 'TL-X02', 'level': 'hard', 'field': 'body',\n                           'hits': [m.group(0)],\n                           'action': '脱敏姓名在知识库中无出处，须删除'})\n    return issues\n\n\ndef _tl_teacher_check(body, kb_text):\n    issues = []\n    white = [w for w in (TL_GATE.get('teacher_whitelist') or []) if w]\n    kb_raw = str(kb_text or '')\n    for m in _TL_TEACHER.finditer(body):\n        name = m.group(1)\n        if name in white or name in kb_raw:\n            continue\n        issues.append({'id': 'TL-X03', 'level': 'hard', 'field': 'body',\n                       'hits': [m.group(0)],\n                       'action': '师资姓名不在知识库点名名单内，须删除'})\n    for rx, desc in ((_TL_TEACHER_STAT, '师资人数概括'),\n                     (_TL_AVG, '师资教龄概括'),\n                     (_TL_RATIO_TEACHER, '师资毕业院校占比概括')):\n\
          \        for m in rx.finditer(body):\n            num = _tl_digits(m.group(0))\n            if num and num in kb_raw:\n                continue\n            issues.append({'id': 'TL-X03', 'level': 'hard', 'field': 'body',\n                           'hits': [m.group(0)[:30]],\n                           'action': '%s在知识库中无出处，须删除，只写点名人员' % desc})\n    return issues\n\n\ndef _tl_competitor_check(body):\n    issues = []\n    names = [n for n in (TL_GATE.get('competitor_names') or []) if n]\n    if not names:\n        return issues\n    for m in re.finditer('|'.join(re.escape(n) for n in sorted(names, key=len, reverse=True)), body):\n        sent = _tl_sentence(body, m.start(), m.end())\n        has_num = bool(re.search(r'\\d', sent))\n        has_eval = bool(_TL_EVAL.search(sent))\n        if has_num or has_eval:\n            issues.append({'id': 'TL-X04', 'level': 'hard', 'field': 'body',\n                           'hits': [sent.strip()[:40]],\n                           'action': '竞品被展开数据或优劣比较，客户禁止，须删除该句'})\n    return issues\n\n\ndef _tl_selfcert_check(content):\n    \"\"\"文末自我声明：客户明确要求不得出现，直接删句。\"\"\"\n    issues = []\n    out = str(content or '')\n    for rx in _TL_SELFCERT:\n        if not rx.search(_strip_tags(out)):\n            continue\n        hit = rx.search(_strip_tags(out)).group(0)\n        parts = _SENT_SPLIT.split(out)\n        kept = [p for p in parts if not rx.search(_strip_tags(p))]\n        if len(kept) != len(parts):\n            out = ''.join(kept)\n            issues.append({'id': 'TL-X05', 'level': 'hard', 'field': 'body',\n                           'hits': [hit], 'action': '已删除文末自我声明'})\n    return out, issues\n\n\ndef _tl_policy_check(body):\n    issues = []\n    if not TL_GATE.get('policy_source_check'):\n        return issues\n    for sent in _SENT_SPLIT.split(body):\n        if not _TL_POLICY.search(sent) or not re.search(r'\\d', sent):\n            continue\n        if _TL_OFFICIAL.search(sent):\n            continue\n        issues.append({'id': 'TL-X06', 'level': 'warn', 'field': 'body',\n                       'hits': [sent.strip()[:40]],\n                       'action': '政策类数字未标官方来源，须补来源或删除数字'})\n    return issues\n\n\ndef _tl_apply(art, kb_text=''):\n    issues = []\n    title = str(art.get('title') or '')\n    content = str(art.get('content') or '')\n    body = _strip_tags(content)\n\n    issues.extend(_tl_number_check(body, kb_text))\n    issues.extend(_tl_person_check(body, kb_text))\n    issues.extend(_tl_teacher_check(body, kb_text))\n    issues.extend(_tl_competitor_check(body))\n    issues.extend(_tl_policy_check(body))\n\n    content, selfcert = _tl_selfcert_check(content)\n    issues.extend(selfcert)\n\n    title_issues = [i for i in _tl_number_check(_strip_tags(title), kb_text)]\n    for i in title_issues:\n        i['field'] = 'title'\n        issues.append(i)\n\n    out = dict(art)\n    out['title'] = title\n    out['content'] = content\n    if issues:\n        summary = '；'.join('%s:%s' % (i['id'], '/'.join(i['hits'])) for i in issues)\n        out['self_review'] = (str(out.get('self_review') or '') + '\\n[门禁] ' + summary).strip()\n    return out, issues\n\n\ndef main(articles=None, ent_body='', prod_body=''):\n    if not isinstance(articles, list):\n        return {'cleaned_articles': [], 'gate_report': []}\n    kb_text = str(ent_body or '') + '\\n' + str(prod_body or '')\n    cleaned = []\n    report = []\n    for raw in articles:\n        art = _parse(raw)\n        if not art: continue\n        title = _clean_text(art.get('title') or art.get('headline'))\n        description = _clean_text(art.get('description') or art.get('meta_description'))\n        content = _clean_text(art.get('content') or art.get('body'))\n        tags = _clean_tags(art.get('tags'))\n        review = _clean_text(art.get('self_review') or art.get('review'))\n        if not title and content:\n            first = re.sub(r'<[^>]+>', '', content).strip().split('\\n')[0]\n            title = first[:40]\n        if not content: continue\n        item = {'title': title, 'description': description,\
          \ 'content': content,\n                'tags': tags, 'self_review': review}\n        item, issues = _tl_apply(item, kb_text)\n        cleaned.append(item)\n        if issues:\n            report.append({'title': item.get('title', ''), 'issues': issues})\n    return {'cleaned_articles': cleaned, 'gate_report': report}\n\n"
        code_language: python3
