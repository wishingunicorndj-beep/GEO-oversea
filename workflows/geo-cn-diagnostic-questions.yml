app:
  description: 'V2.4：优化comps_list输出；0821

    V2.3：更新到v4flash模型；0819

    V2.2：优化输出词的稳定性，扩充生词数量；0814

    V2.1：优化词锚定core_keyword，优化变量聚合逻辑；0710

    V2.0：增加生词数量判定，以及补词逻辑；0625

    V1.8：修改t1画像字数，修复t1生词的Maxtoken上限以及代码兜底；0617

    V1.7：修订竞品逻辑，客户输出的不作修改以及按照,和、区分品牌；0610

    V1.6：修改t4输出逻辑，控制特殊字符和代码兜底；0609

    V1.5：优化竞品生成逻辑，强化行业细分、定位以及参考客户输入的竞品；0525

    V1.4：生词改为并行结构；0522下午

    V1.3：修改竞品生成逻辑，规避行业适配问题；0522

    V1.2：修改T1-2兼容query字段，避免生词被隔断；0521

    V1.1：增加竞品输出，修订输出词的数量，优化生词效果，竞品list节点位置；0508

    V1.0：支持T1-T4多个维度生词；0427'
