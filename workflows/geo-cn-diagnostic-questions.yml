            5. **时间节点**：遵循current_date未来60天内有效的规则\n\n## 输出格式\n严格按以下JSON格式返回（不要任何其他内容）：\n\
            ```json\n{\n  \"t1_results\": [\n    {\n      \"scene_name\": \"6-12字场景名\"\
