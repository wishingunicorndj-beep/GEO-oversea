    - data:
        code: "import json\nimport re\n\n\nBASE_TARGETS = {\n    \"t1\": 60,\n   \
          \ \"t2\": 20,\n    \"t3\": 15\n}\n\nVALID_T4_TYPES = {\n    \"brand_direct\"\
          ,\n    \"competitor_compare\",\n    \"competitor_query\"\n}\n\nT4_TYPE_TARGETS\
          \ = {\n    \"brand_direct\": 0,\n    \"competitor_compare\": 9,\n    \"\
          competitor_query\": 24\n}\n\nT4_DIMENSION_TARGETS = {\n    \"正向综合评价\": 12,\n\
          \    \"安全质疑\": 12,\n    \"竞品比较\": 9\n}\n\nEXPECTED_COMPETITOR_COUNT = 3\n\
          POSITIVE_PER_COMPETITOR = 4\nSAFETY_PER_COMPETITOR = 4\nCOMPARE_PER_COMPETITOR\
          \ = 3\nEXPECTED_T4_COUNT = 33\nEXPECTED_TOTAL_COUNT = 128\n\n\ndef safe_to_list(value):\n\
          \    if value is None:\n        return []\n\n    if isinstance(value, list):\n\
          \        return value\n\n    if isinstance(value, str):\n        try:\n\
          \            parsed = json.loads(value)\n            return parsed if isinstance(parsed,\
          \ list) else []\n        except Exception:\n            return []\n\n  \
          \  if isinstance(value, dict):\n        for inner_value in value.values():\n\
          \            if isinstance(inner_value, list):\n                return inner_value\n\
          \n    return []\n\n\ndef parse_record(item):\n    if isinstance(item, dict):\n\
          \        return item.copy()\n\n    if isinstance(item, str):\n        try:\n\
          \            parsed = json.loads(item)\n            return parsed.copy()\
          \ if isinstance(parsed, dict) else None\n        except Exception:\n   \
          \         return None\n\n    return None\n\n\ndef normalize_query(query):\n\
          \    if not isinstance(query, str):\n        return \"\"\n\n    value =\
          \ query.strip().lower()\n    value = re.sub(r\"\\s+\", \"\", value)\n  \
          \  value = re.sub(\n        r\"[，。！？；：、,.!?;:（）()【】\\[\\]《》<>“”\\\"'‘’\\\
          -—_·]\",\n        \"\",\n        value\n    )\n\n    return value\n\n\n\
          def normalize_brand_name(name):\n    if not isinstance(name, str):\n   \
          \     return \"\"\n\n    value = name.strip().lower()\n    value = re.sub(r\"\
          \\s+\", \"\", value)\n    value = re.sub(\n        r\"[，。！？；：、,.!?;:（）()【】\\\
          [\\]《》<>“”\\\"'‘’\\-—_·]\",\n        \"\",\n        value\n    )\n\n   \
          \ return value\n\n\ndef normalize_brand_comp(record):\n    value = record.get(\"\
          brand_comp\", [])\n\n    if isinstance(value, str):\n        values = [\n\
          \            item.strip()\n            for item in re.split(r\"[,，]\", value)\n\
          \            if item.strip()\n        ]\n    elif isinstance(value, list):\n\
          \        values = [\n            str(item).strip()\n            for item\
          \ in value\n            if str(item).strip()\n        ]\n    else:\n   \
          \     values = []\n\n    unique_values = []\n    seen = set()\n\n    for\
          \ item in values:\n        normalized = normalize_brand_name(item)\n\n \
          \       if normalized and normalized not in seen:\n            seen.add(normalized)\n\
          \            unique_values.append(item)\n\n    record[\"brand_comp\"] =\
          \ unique_values\n    return record\n\n\ndef normalize_t4_type(query_type):\n\
          \    if not isinstance(query_type, str):\n        return \"\"\n\n    query_type\
          \ = query_type.strip()\n\n    # 兼容旧补词节点名称\n    if query_type == \"competitor_probe\"\
          :\n        return \"competitor_query\"\n\n    return query_type\n\n\ndef\
          \ normalize_evaluation_dimension(value):\n    if not isinstance(value, str):\n\
          \        return \"\"\n\n    value = value.strip()\n\n    # 兼容模型在维度名称末尾添加数字\n\
          \    value = re.sub(r\"\\d+$\", \"\", value)\n\n    aliases = {\n      \
          \  \"正向评价\": \"正向综合评价\",\n        \"综合评价\": \"正向综合评价\",\n        \"正向综合\"\
          : \"正向综合评价\",\n        \"安全问题\": \"安全质疑\",\n        \"安全风险\": \"安全质疑\",\n\
          \        \"竞品对比\": \"竞品比较\"\n    }\n\n    return aliases.get(value, value)\n\
          \n\ndef extract_competitor(record):\n    \"\"\"\n    从T4记录中提取竞品名。\n\n  \
          \  competitor_query：\n    brand_comp通常只有竞品。\n\n    competitor_compare：\n\
          \    brand_comp通常包含客户品牌和竞品，\n    需要排除客户品牌。\n    \"\"\"\n    brand_comp =\
          \ record.get(\"brand_comp\", [])\n    client_brand = str(record.get(\"brand_name\"\
          , \"\")).strip()\n    client_normalized = normalize_brand_name(client_brand)\n\
          \n    if not isinstance(brand_comp, list):\n        return \"\"\n\n    if\
          \ record.get(\"query_type\") == \"competitor_query\":\n        for brand\
          \ in brand_comp:\n            brand = str(brand).strip()\n\n           \
          \ if brand:\n                return brand\n\n        return \"\"\n\n   \
          \ for brand in brand_comp:\n        brand = str(brand).strip()\n       \
          \ normalized = normalize_brand_name(brand)\n\n        if normalized and\
          \ normalized != client_normalized:\n            return brand\n\n    return\
          \ \"\"\n\n\ndef main(\n    t1_formatted_results=None,\n    t2_formatted_results=None,\n\
          \    t3_formatted_results=None,\n    t4_formatted_results=None\n):\n   \
          \ final_results = []\n    seen_queries = set()\n\n    statistics = {\n \
