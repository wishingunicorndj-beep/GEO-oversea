            \n\n---\n\n\n## 首先基于核心信息提取与判定\n- 核心关键词直接作为问题锚点；\n- 基于品牌名称（brand_name）判定所属行业，并基于产品名判断产品特性，再结合行业属性和产品特性以及核心关键词进行需求判断，针对需求进行生词，确保生词的合理性，且符合C端用户真实需求\n\
            \n\n## 第一部分：品牌直询生词（基于 brand_name）\n针对客户品牌（如香奈儿），生成4个维度的生词：\n\n\n### 维度1：正向综合评价\n\
            **评价词库**：怎么样、好不好用、值得买吗、口碑如何\n**生成规则**：品牌名 + 产品品类词 + 评价词 = 生词\n\n\n**示例**：\n\
            | 品牌 | 产品 | 评价词 | 生词 |\n|------|------|--------|------|\n| 香奈儿 | 香水 |\
            \ 怎么样 | 香奈儿香水怎么样 |\n| 香奈儿 | 香水 | 好不好用 | 香奈儿香水好不好用 |\n| 香奈儿 | 香水 | 值得买吗\
            \ | 香奈儿香水值得买吗 |\n| 香奈儿 | 香水 | 口碑如何 | 香奈儿香水口碑如何 |\n\n\n- 基于品牌名称（brand_name）判定所属行业，并基于产品名判断产品特性，再结合行业属性和产品特性以及核心关键词进行需求判断，针对需求进行生词，确保生词的合理性，且符合C端用户真实需求\n\
            \n\n比如品牌=滴滴租车 ，产品名=滴滴机酒，就不能生词\"滴滴租车值得买吗\"，应该基于租车的实际需求去提问，如改为\"滴滴租车性价比如何\"\
            \n\n\n\n### 维度2：安全质疑\n\n\n**评价词库**：长期用有副作用吗、成分安全吗、孕期可以用吗、有没有致敏成分\n\n\n\
            **⚠️ is_negative_probe = 1**\n\n\n**示例**：\n\n\n| 品牌 | 产品 | 评价词 | 生词 |\n\
            |------|------|--------|------|\n| 香奈儿 | 香水 | 长期用有副作用吗 | 香奈儿香水长期用有副作用吗\
            \ |\n| 香奈儿 | 香水 | 成分安全吗 | 香奈儿香水成分安全吗 |\n| 香奈儿 | 香水 | 孕期可以用吗 | 怀孕期间可以用香奈儿香水吗\
            \ |\n| 香奈儿 | 香水 | 有没有致敏成分 | 香奈儿香水里有没有致敏成分 |\n\n\n注意：需要基于品牌的行业属性和产品的属性选择合适的评价词进行生词，生词要深入分析真实C端用户产生需求时的疑问或疑惑或者担心，基于这个分析进行生词；另外也需要符合中文语法和语序，符合日常表达习惯\n\
            \n\n比如品牌名称=滴滴租车 ，产品名=滴滴机酒，就不能生词\"滴滴租车长期使用安全吗\"，应该基于租车的实际需求去思考用户真实的负面担忧，比如改为\"\
