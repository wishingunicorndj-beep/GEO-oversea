    - data:
        code: "import json\nimport re\nfrom datetime import datetime\n\n\ndef fuzzy_get(item,\
          \ key, default=None):\n    \"\"\"模糊取值\"\"\"\n    if key in item:\n     \
          \   return item[key]\n    for k, v in item.items():\n        if re.sub(r'\\\
          d+$', '', k) == key:\n            return v\n    return default\n\n\ndef\
          \ sanitize_json_string(text):\n    \"\"\"清洗LLM输出中所有非法JSON值\"\"\"\n    if\
          \ not text:\n        return text\n\n    int_fields = ['is_negative_probe',\
          \ 'is_competitor']\n    for field in int_fields:\n        text = re.sub(\n\
          \            rf'\"{field}\"\\s*:\\s*[^0-9\\[{{\"\\]}}]*?(\\d+)\\s*([,}}\\\
          ]])',\n            rf'\"{field}\": \\1\\2',\n            text\n        )\n\
          \        text = re.sub(\n            rf'\"{field}\"\\s*:\\s*[^0-9\"\\'\\\
          [{{{{\\]}}}},]+\\s*([,}}\\]])',\n            rf'\"{field}\": 0\\1',\n  \
          \          text\n        )\n\n    def replace_bare_value(match):\n     \
          \   bare = match.group(1).strip()\n        tail = match.group(2)\n     \
          \   lower = bare.lower()\n        if lower == 'true':\n            return\
          \ f': true{tail}'\n        if lower == 'false':\n            return f':\
          \ false{tail}'\n        if lower in ('null', 'none'):\n            return\
          \ f': null{tail}'\n        return f': 0{tail}'\n\n    text = re.sub(\n \
          \       r':\\s*([A-Za-z—–\\-/]+(?:[A-Za-z0-9—–\\-/])*)\\s*([,}\\]])',\n\
          \        replace_bare_value,\n        text\n    )\n    return text\n\n\n\
          def safe_int(val, default=0):\n    \"\"\"将各种类型安全转为int\"\"\"\n    if isinstance(val,\
          \ bool):\n        return 1 if val else 0\n    if isinstance(val, int):\n\
          \        return val\n    if isinstance(val, str) and val.strip().isdigit():\n\
          \        return int(val)\n    return default\n\n\ndef main(supplement_raw=None,\
          \ task_id='', core_keyword=''):\n    \"\"\"\n    Dify Python代码节点 T4-5 补词解析\n\
          \    输入: supplement_raw (补词LLM的输出), task_id, core_keyword\n    输出: supplement_results\
          \ (Array[String]), supplement_count (Number)\n    \"\"\"\n\n    if supplement_raw\
          \ is None:\n        supplement_raw = []\n\n    # 字符串解析\n    if isinstance(supplement_raw,\
          \ str):\n        _raw = supplement_raw\n        _m = re.search(r'(\\{[\\\
          s\\S]*\\}|\\[[\\s\\S]*\\])', _raw)\n        supplement_raw = _m.group(1)\
          \ if _m else _raw\n        supplement_raw = re.sub(r'^```(?:json)?\\s*',\
          \ '', supplement_raw.strip())\n        supplement_raw = re.sub(r'\\s*```$',\
          \ '', supplement_raw.strip())\n        try:\n            supplement_raw\
          \ = json.loads(supplement_raw)\n        except json.JSONDecodeError:\n \
          \           try:\n                cleaned = sanitize_json_string(supplement_raw)\n\
          \                supplement_raw = json.loads(cleaned)\n            except\
          \ json.JSONDecodeError:\n                supplement_raw = []\n\n    # 提取t4_results\n\
          \    if isinstance(supplement_raw, dict) and \"t4_results\" in supplement_raw:\n\
          \        supplement_raw = supplement_raw.get(\"t4_results\", [])\n\n   \
          \ if not isinstance(supplement_raw, list):\n        supplement_raw = []\n\
          \n    results = []\n\n    for item_index, item in enumerate(supplement_raw):\n\
          \        if isinstance(item, dict):\n            query = fuzzy_get(item,\
          \ 'query', '')\n            query_type = fuzzy_get(item, 'query_type', '')\n\
          \            brand_comp_raw = fuzzy_get(item, 'brand_comp', '')\n      \
          \      evaluation_dimension = fuzzy_get(item, 'evaluation_dimension', '')\n\
          \            target_brand = fuzzy_get(item, 'target_brand', '')\n      \
          \      is_negative_probe = safe_int(fuzzy_get(item, 'is_negative_probe',\
          \ 0), 0)\n            is_competitor = safe_int(fuzzy_get(item, 'is_competitor',\
          \ 0), 0)\n\n            if not isinstance(query, str) or not query.strip():\n\
          \                continue\n\n            # brand_comp 转为数组\n           \
          \ if isinstance(brand_comp_raw, list):\n                brand_comp = [b.strip()\
          \ for b in brand_comp_raw if isinstance(b, str) and b.strip()]\n       \
          \     elif isinstance(brand_comp_raw, str):\n                if brand_comp_raw.strip():\n\
          \                    parts = [b.strip() for b in brand_comp_raw.split(',')\
          \ if b.strip()]\n                    seen = set()\n                    brand_comp\
          \ = []\n                    for b in parts:\n                        if\
          \ b not in seen:\n                            seen.add(b)\n            \
          \                brand_comp.append(b)\n                else:\n         \
          \           brand_comp = []\n            else:\n                brand_comp\
          \ = []\n\n            # 判断 source_keyword 和 source_word_type\n         \
          \   source_keyword = None\n            source_word_type = None\n       \
          \     if is_competitor == 0:\n                if query_type == 'competitor_compare':\n\
          \                    source_keyword = 3\n                    source_word_type\
          \ = 4\n                elif query_type == 'brand_direct':\n            \
          \        source_keyword = 2\n                    source_word_type = 4\n\n\
          \            # evaluation_dimension 值清洗\n            valid_eval_dims = ['正向综合评价',\
          \ '安全质疑', '竞品比较', '负面舆情']\n            final_evaluation_dimension = evaluation_dimension\n\
          \            if isinstance(final_evaluation_dimension, str) and final_evaluation_dimension\
          \ not in valid_eval_dims:\n                cleaned_dim = re.sub(r'\\d+$',\
          \ '', final_evaluation_dimension)\n                if cleaned_dim in valid_eval_dims:\n\
          \                    final_evaluation_dimension = cleaned_dim\n\n      \
          \      obj = {\n                'id': f'AUTO_{int(datetime.now().timestamp())}_T4S_{item_index}',\n\
          \                'task_id': task_id,\n                'brand_name': target_brand,\n\
          \                'query': query.strip(),\n                'core_keyword':\
          \ core_keyword,\n                'source_keyword': source_keyword,\n   \
          \             'source_word_type': source_word_type,\n                'question_type':\
          \ 4,\n                'scene_name': None,\n                'priority_level':\
          \ None,\n                'persona_name': None,\n                'decision_intent_level':\
          \ None,\n                'is_strong_decision': 0,\n                'cognition_dimension':\
          \ None,\n                'evaluation_dimension': final_evaluation_dimension,\n\
          \                'query_type': query_type,\n                'brand_comp':\
          \ brand_comp,\n                'is_competitor': is_competitor,\n       \
          \         'is_negative_probe': int(is_negative_probe),\n               \
          \ 'is_active': 1,\n                'created_at': datetime.now().strftime('%Y-%m-%d\
          \ %H:%M:%S'),\n                'updated_at': datetime.now().strftime('%Y-%m-%d\
          \ %H:%M:%S')\n            }\n\n            results.append(json.dumps(obj,\
          \ ensure_ascii=False))\n\n    return {\n        'supplement_results': results,\n\
          \        'supplement_count': len(results)\n    }\n"
