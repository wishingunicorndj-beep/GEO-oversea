    - data:
        code: "import json\nimport re\n\n\ndef strip_json_wrapper(text):\n    \"\"\
          \"清理单反引号、三反引号、json标记和BOM\"\"\"\n    if not isinstance(text, str):\n    \
          \    return \"\"\n\n    cleaned = text.strip().lstrip(\"\\ufeff\")\n\n \
          \   # 支持：\n    # `json {...} `\n    # ```json {...} ```\n    # ``` {...}\
          \ ```\n    cleaned = re.sub(\n        r\"^\\s*`{1,3}\\s*(?:json)?\\s*\"\
          ,\n        \"\",\n        cleaned,\n        flags=re.IGNORECASE\n    )\n\
          \n    cleaned = re.sub(\n        r\"\\s*`{1,3}\\s*$\",\n        \"\",\n\
          \        cleaned\n    )\n\n    # 兼容没有反引号、但以 json 开头的情况\n    cleaned = re.sub(\n\
          \        r\"^\\s*json\\s*(?=[\\{\\[])\",\n        \"\",\n        cleaned,\n\
          \        flags=re.IGNORECASE\n    )\n\n    return cleaned.strip()\n\n\n\
          def extract_balanced_json(text):\n    \"\"\"\n    从带有说明文字的文本中提取完整JSON对象或数组。\n\
          \    支持嵌套对象、数组、字符串和转义字符。\n    \"\"\"\n    if not isinstance(text, str):\n\
          \        return None\n\n    for start_index, start_char in enumerate(text):\n\
          \        if start_char not in \"{[\":\n            continue\n\n        stack\
          \ = []\n        in_string = False\n        escaped = False\n\n        for\
          \ index in range(start_index, len(text)):\n            char = text[index]\n\
          \n            if in_string:\n                if escaped:\n             \
          \       escaped = False\n                elif char == \"\\\\\":\n      \
          \              escaped = True\n                elif char == '\"':\n    \
          \                in_string = False\n                continue\n\n       \
          \     if char == '\"':\n                in_string = True\n             \
          \   continue\n\n            if char in \"{[\":\n                stack.append(char)\n\
          \                continue\n\n            if char in \"}]\":\n          \
          \      if not stack:\n                    break\n\n                expected_open\
          \ = \"{\" if char == \"}\" else \"[\"\n                if stack[-1] != expected_open:\n\
          \                    break\n\n                stack.pop()\n\n          \
          \      if not stack:\n                    candidate = text[start_index:index\
          \ + 1]\n                    try:\n                        return json.loads(candidate)\n\
          \                    except json.JSONDecodeError:\n                    \
          \    break\n\n    return None\n\n\ndef safe_parse_json(value):\n    \"\"\
          \"安全解析LLM返回的JSON文本\"\"\"\n    if value is None:\n        return None\n\n\
          \    if isinstance(value, (dict, list)):\n        return value\n\n    if\
          \ not isinstance(value, str):\n        return None\n\n    cleaned = strip_json_wrapper(value)\n\
          \n    if not cleaned:\n        return None\n\n    # 直接解析\n    try:\n   \
          \     return json.loads(cleaned)\n    except json.JSONDecodeError:\n   \
          \     pass\n\n    # 从前后带说明文字的文本中提取JSON\n    return extract_balanced_json(cleaned)\n\
          \n\ndef parse_names(value):\n    \"\"\"\n    将数组、JSON数组字符串、逗号/顿号分隔文本转换为品牌名数组。\n\
          \    \"\"\"\n    if isinstance(value, list):\n        values = value\n\n\
          \    elif isinstance(value, str):\n        raw = value.strip()\n\n     \
          \   if not raw:\n            return []\n\n        try:\n            decoded\
          \ = json.loads(raw)\n\n            if isinstance(decoded, list):\n     \
          \           values = decoded\n            elif isinstance(decoded, str):\n\
          \                values = re.split(r\"[,，、]\", decoded)\n            else:\n\
          \                values = [raw]\n\n        except (TypeError, ValueError):\n\
          \            values = re.split(r\"[,，、]\", raw)\n\n    else:\n        return\
          \ []\n\n    result = []\n\n    for item in values:\n        if item is None:\n\
          \            continue\n\n        name = str(item).strip()\n\n        if\
          \ name and name not in result:\n            result.append(name)\n\n    return\
          \ result\n\n\ndef main(\n    llm_output=None,\n    original_comps_list=None,\n\
          \    brand_name=\"\"\n):\n    \"\"\"\n    解析竞品增强LLM输出。\n\n    输入：\n    -\
          \ llm_output：竞品补齐LLM原始输出\n    - original_comps_list：用户原始竞品列表\n    - brand_name：客户品牌\n\
          \n    输出：\n    - comps_list：JSON字符串格式的竞品数组\n    - industry_leader：JSON字符串格式的行业领先品牌\n\
          \    \"\"\"\n\n    parsed = safe_parse_json(llm_output)\n\n    # 兼容传入完整响应对象：\n\
          \    # {\"text\": \"...\", \"usage\": {...}}\n    if (\n        isinstance(parsed,\
          \ dict)\n        and \"comps_list\" not in parsed\n        and isinstance(parsed.get(\"\
          text\"), str)\n    ):\n        nested_parsed = safe_parse_json(parsed.get(\"\
          text\"))\n        if nested_parsed is not None:\n            parsed = nested_parsed\n\
          \n    original = parse_names(original_comps_list)\n\n    if isinstance(parsed,\
          \ dict):\n        model_comps = parse_names(parsed.get(\"comps_list\", []))\n\
          \        leader_raw = parsed.get(\"industry_leader\")\n    else:\n     \
          \   model_comps = []\n        leader_raw = None\n\n    # 将字符串形式的 null 视为空值\n\
          \    if (\n        leader_raw is None\n        or (\n            isinstance(leader_raw,\
          \ str)\n            and leader_raw.strip().lower() in {\"\", \"null\", \"\
          none\"}\n        )\n    ):\n        industry_leader = None\n    else:\n\
          \        industry_leader = str(leader_raw).strip()\n\n    brand = str(brand_name\
          \ or \"\").strip()\n\n    # 原始竞品优先保留，再合并模型补充竞品\n    merged = []\n\n    for\
          \ name in original + model_comps:\n        name = str(name).strip()\n\n\
          \        if not name:\n            continue\n\n        # 不允许把客户品牌作为竞品\n\
          \        if name == brand:\n            continue\n\n        # 去重\n     \
          \   if name in merged:\n            continue\n\n        merged.append(name)\n\
          \n        # 工作流合同：最多保留3个竞品\n        if len(merged) >= 3:\n            break\n\
          \n    return {\n        \"comps_list\": json.dumps(\n            merged,\n\
          \            ensure_ascii=False\n        ),\n        \"industry_leader\"\
          : json.dumps(\n            industry_leader,\n            ensure_ascii=False\n\
          \        )\n    }"
