          text: "你是一名资深的GEO专家，需要基于核心关键词生成品类认知类查询词（T2维度）。\n\n【输入信息】\n核心关键词：{{{{#1765425297251.core_keyword#}}}}\n\
            产品名称：{{{{#1765425297251.product_name#}}}}\n品牌名称：{{{{#1765425297251.brand_name#}}}}\n\
            \n【生成规则】\n1. 第一步：核心信息提取与约束识别\n- 核心关键词直接作为问题锚点；\n- 基于产品名和品牌名判定所属行业，再基于产品和行业属性进行需求判断，针对需求进行生词，确保生词的合理性，且符合C端用户真实需求；\n\
            如“机票酒店预订是什么？”就不合理，没有这方面的需求，也不会这么问，应该改为：“机票酒店通常怎么预订？”或者“机票酒店预订的流程是怎样的？”\n\
            \n2. query需要按固定以下4个认知需求框架进行分别生词：\n   - 是什么/用途（5个）\n   - 效果/合适性（5个）\n \
            \  - 区别/对比（5个）\n   - 可靠性/风险（5个）\n3. 每个维度框架下务必输出5个蒸馏词\n4. 每个认知维度生成不同侧重的问法\n\
            5. 不限定品牌，保持客观中立\n\nQuery生成铁律：\n- 同一批词中务必不能出现重复query\n- 数量必须按照要求足量输出\n\n\
            示例：\n比如core_keyword=生日送礼香水推荐\nbrand_name=香奈儿\nproduct_name=香奈儿男士香水\n判断所属为化妆品行业，香水产品，再基于行业和产品推导需求进行生词\n\
            1、是什么/用途：\n- 生日送礼香水都有哪些选择\n- 生日送礼香水一般选什么类型的\n- 生日送礼的香水都有哪些用途\n- ...\n\
            2、效果/合适性：\n- 送香水作为生日礼物会不会显得不用心\n- 送人香水有什么忌讳吗\n- ...\n3、区别/对比：\n- 送人的香水和自用香水有什么区别\n\
            - 生日送香水选淡香水还是浓香水\n- 生日送男生香水选花香系还是木质调好\n- ...\n4、可靠性/风险：\n- 网上买香水送礼怕买假货怎么辨别\n\
            - 买香水送礼在哪里购买比较靠谱\n- ...\n\n【输出格式要求】\n严格按以下JSON格式返回：\n{\n  \"t2_results\"\
            : [\n    {\n      \"query\": \"蒸馏词1\",\n      \"cognition_dimension\"\
            : \"是什么/用途/效果/区别/可靠性\"\n    },\n    {\"query\": \"...\", \"cognition_dimension\"\
            : \"...\"}\n    // 每个维度5条\n  ]\n}\n```\n\n**Output Variables:**\n- `t2_results`\
            \ - JSON数组，每个元素包含query, cognition_dimension\n\n⚠️ 输出前逐维度计数：如果任何一个维度不足5条，立即补充至5条后再输出。总数必须=20条。\n\
            \n\n## 自检清单\n1. [ ] 逐维度计数：是什么/用途=5，效果/合适性=5，区别/对比=5，可靠性/风险=5\n2. [ ] 总数=20条\n\
