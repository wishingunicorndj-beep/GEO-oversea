            ,\"domain3.com\"],\n  \"qa_risk\":\"\"\n}\n\n\n【逐层赛道定位——禁止跳步】\n先识别已有合格竞品的共同赛道；已有合格竞品是赛道定义的最高权重锚点。若已有品牌无法准确识别，再依次使用topic、product_name、background_info、brand_name、target_audience；corp_name仅作兜底，不得仅凭泛化公司名推断。\n\
            必须输出并据此筛选：sector → category → sub_track → product_form → core_job → target_users。\n\
            sub_track精度不得宽于topic/product_name描述的产品形态。例如企业级AI搜索可见度与AEO平台不得泛化成SEO工具或数字营销软件；创意视频平台不得泛化成全部AI内容工具。\n\
            \n【补充竞品资格】\n先以锁定竞品的共同特征为第一锚点，再结合topic、product_name和background_info。补充项必须同时满足：同一购买集合、同一精确sub_track、同一产品或服务形态、相同核心任务、目标人群显著重叠、市场梯队与客户规模相近、在目标市场真实活跃。优先级：直接替代性\
            \ > 产品形态 > 核心任务 > 目标用户 > 市场梯队 > 细分市场代表性 > 泛行业知名度。\n每个补充项的decision_reason必须明确回答：为什么会与客户品牌进入同一次选型，以及它与已有锁定竞品在哪些产品线或服务、目标人群和市场梯队上可比。不得使用“同属AI、营销或软件行业”等泛理由。\n\
