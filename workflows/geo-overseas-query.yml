          \ right_set = set(right.split())\n\n    jaccard = len(left_set & right_set)\
          \ / max(\n        1,\n        len(left_set | right_set),\n    )\n\n    return\
          \ (\n        left == right\n        or jaccard >= 0.82\n        or (\n \
