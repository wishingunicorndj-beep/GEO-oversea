          \  'questions_empty': 'W_A4_NO_QUESTIONS_FALLBACK_A3',\n        }\n    \
          \    warnings.append(\n            warning_map.get(\n                fallback_reason,\n\
          \                'W_A4_FALLBACK_A3',\n            )\n        )\n\n    for\
          \ question in qs:\n        if not isinstance(question, dict):\n        \
          \    issues.append('E_ITEM')\n            continue\n\n        slot = str(\n\
