            \n【输入】\n- target_audience: {{#1700000000001.target_audience#}}\n- topic:\
            \ {{#1700000000001.topic#}}\n- product_name: {{#1700000000001.product_name#}}\n\
            - brand_name: {{#1700000000001.brand_name#}}\n- target_market: {{#1700000000001.target_market#}}\n\
            - background_info: {{#1700000000001.background_info#}}\n\n【规则】\n1. 先逐项解析target_audience，建立raw_audience_mapping；不得因为表述相近就擅自删除不同角色。\n\
            2. 不足4个时，可按真实购买链路补充使用者、创作者、协作者、审核者、管理员、运营者、采购/决策者；不得补与核心任务无关的泛人群。\n3.\
            \ 超过6个时只合并核心任务、约束和答案边界真正一致的人群，并在mapping中说明。\n4. persona_name必须是稳定、唯一、4–10个英文单词，后续逐字符使用。\n\
            5. 每个persona输出1–3个core_tasks与2–4个selection_constraints，约束必须会影响产品选择。\n\
            6. 不得用年龄、城市等人口统计替代真实工作角色，除非输入明确且会改变选择。\n\n【Few-shot：正确拆分】\n输入：filmmakers,\
            \ independent creators, AI artists, creative teams\n输出应保留Independent Filmmakers、Independent\
            \ Creators、AI Artists，并可将Creative Teams细分或映射到Creative Team Leads/Reviewers；不能全部合并成Content\
            \ Creators，因为多镜头叙事、个人产量和艺术控制的选择边界不同。\n\n【Few-shot：错误合并】\n错误：把filmmakers、social\
            \ media managers、e-commerce marketers全部合并成Marketing Professionals。\n原因：任务与评价因素不同，而且用户可能根本未输入营销人群。\n\
            \n【Few-shot：合理补充】\n若输入只有“creative teams”，可以补充Creative Team Leads和Content\
            \ Reviewers，因为多人审核、版本管理和工作流复用会改变平台选择；不能无依据补充Procurement Directors。\n\n\
