        code: "import json\nimport re\n\ndef expected_count_to_int(article_count):\n\
          \    try:\n        count = int(float(article_count))\n    except Exception:\n\
          \        return 1\n    return max(1, count)\n\ndef split_keywords(keyword_pack):\n\
          \    text = str(keyword_pack or \"\")\n    parts = [x.strip() for x in re.split(r'[\\\
          n,，;；、]+', text) if x.strip()]\n    return parts\n\ndef split_competitors(known_competitors):\n\
          \    text = str(known_competitors or \"\")\n    return [x.strip() for x\
          \ in re.split(r'[、,，;；\\n\\s]+', text) if x.strip() and len(x.strip()) >=\
          \ 2]\n\ndef extract_tasks(data):\n    if isinstance(data, dict):\n     \
          \   for key in [\"任务项\", \"文章任务\", \"轻量任务\", \"article_tasks\", \"tasks\"\
          , \"文章计划\", \"merged_plans\"]:\n            val = data.get(key)\n      \
          \      if isinstance(val, list):\n                return val\n        return\
          \ []\n    if isinstance(data, list) and (not data or isinstance(data[0],\
          \ dict)):\n        return data\n    return []\n\ndef parse_json_string(text):\n\
          \    if not isinstance(text, str):\n        return []\n    raw = text.strip()\n\
          \    if not raw:\n        return []\n    fence = chr(96) * 3\n    if raw.startswith(fence):\n\
          \        raw = re.sub('^' + fence + r'(?:json)?\\s*', '', raw, flags=re.I).strip()\n\
          \        if raw.endswith(fence):\n            raw = raw[:-3].strip()\n\n\
          \    candidates = [raw]\n    m = re.search(r'\\{[\\s\\S]*\\}', raw)\n  \
          \  if m:\n        candidates.append(m.group(0))\n    m = re.search(r'\\\
          [[\\s\\S]*\\]', raw)\n    if m:\n        candidates.append(m.group(0))\n\
          \n    for cand in candidates:\n        try:\n            obj = json.loads(cand)\n\
          \            if isinstance(obj, str):\n                obj = json.loads(obj)\n\
          \            tasks = extract_tasks(obj)\n            if tasks:\n       \
          \         return tasks\n        except Exception:\n            pass\n\n\
          \    found = []\n    decoder = json.JSONDecoder()\n    for i, ch in enumerate(raw):\n\
          \        if ch != '{':\n            continue\n        try:\n           \
          \ obj, _ = decoder.raw_decode(raw[i:])\n            if isinstance(obj, dict):\n\
          \                if any(k in obj for k in [\"文章序号\", \"主关键词\", \"标题方向\"\
          , \"搜索意图\", \"标题\"]):\n                    found.append(obj)\n        except\
          \ Exception:\n            continue\n    return found\n\ndef normalize_competitor_hint(value,\
          \ whitelist):\n    if not whitelist:\n        return []\n    if isinstance(value,\
          \ list):\n        raw_items = [str(x).strip() for x in value]\n    else:\n\
          \        raw_items = [x.strip() for x in re.split(r'[、,，;；\\n\\s]+', str(value\
          \ or \"\")) if x.strip()]\n    allowed = []\n    for item in raw_items:\n\
          \        for comp in whitelist:\n            if item == comp or comp in\
          \ item or item in comp:\n                if comp not in allowed:\n     \
          \               allowed.append(comp)\n    return allowed\n\ndef normalize_tasks(tasks,\
          \ expected_count, keyword_pack, article_type, known_competitors=None, pricing_guard=None):\n\
          \    keywords = split_keywords(keyword_pack)\n    competitor_whitelist =\
          \ split_competitors(known_competitors)\n    pricing_guard = str(pricing_guard\
          \ or \"未提供可核验价格信息；本篇不写具体价格、月均费用或价格区间。\")\n    normalized = []\n\n    for\
          \ idx, item in enumerate(tasks or [], start=1):\n        if not isinstance(item,\
          \ dict):\n            continue\n        task = dict(item)\n        seq =\
          \ len(normalized) + 1\n        kw = task.get(\"主关键词\") or task.get(\"关键词\"\
          ) or task.get(\"keyword\")\n        if not kw and keywords:\n          \
          \  kw = keywords[(seq - 1) % len(keywords)]\n        if not kw:\n      \
          \      kw = \"约牛软件\"\n        task[\"文章序号\"] = seq\n        task[\"主关键词\"\
          ] = str(kw)\n        task.setdefault(\"副关键词\", [])\n        task.setdefault(\"\
          标题方向\", task.get(\"标题\") or f\"{kw}相关内容参考\")\n        task.setdefault(\"\
          搜索意图\", f\"了解{kw}相关信息和选择维度\")\n        task.setdefault(\"目标受众\", \"普通投资者\"\
          )\n        task.setdefault(\"内容角度\", f\"围绕{kw}展开合规、客观的信息参考\")\n        task.setdefault(\"\
          文章类型\", article_type or \"对比排名类\")\n        task[\"竞品提示\"] = []  # 约牛品牌词模式：不生成竞品\n\
          \        task.setdefault(\"资料侧重\", \"结合企业知识库、产品信息、价格来源和GEO画像中的可核验事实\")\n\
          \        task.setdefault(\"合规提示\", \"避免排名、极限词、收益承诺、荐股暗示、自动交易、精准预测和无来源数据\"\
          )\n        task[\"价格信息使用策略\"] = task.get(\"价格信息使用策略\") or pricing_guard\n\
          \        task[\"主体归属校验\"] = task.get(\"主体归属校验\") or \"约牛品牌词模式：围绕约牛品牌、文章主题和约牛产品论述，不主动出现竞品或其他品牌名。\"\
          \n        normalized.append(task)\n        if len(normalized) >= expected_count:\n\
          \            break\n\n    while len(normalized) < expected_count:\n    \
          \    seq = len(normalized) + 1\n        kw = keywords[(seq - 1) % len(keywords)]\
          \ if keywords else \"约牛软件\"\n        normalized.append({\n            \"\
          文章序号\": seq,\n            \"主关键词\": kw,\n            \"副关键词\": [],\n   \
          \         \"标题方向\": f\"{kw}相关内容参考\",\n            \"搜索意图\": f\"了解{kw}相关信息和选择维度\"\
          ,\n            \"目标受众\": \"普通投资者\",\n            \"内容角度\": f\"从用户搜索意图出发，围绕{kw}做客观、合规的信息参考\"\
          ,\n            \"文章类型\": article_type or \"对比排名类\",\n            \"竞品提示\"\
          : [],\n            \"资料侧重\": \"结合企业知识库、产品信息、价格来源和GEO画像中的可核验事实\",\n     \
          \       \"合规提示\": \"避免排名、极限词、收益承诺、荐股暗示、自动交易、精准预测和无来源数据\",\n            \"\
          价格信息使用策略\": pricing_guard,\n            \"主体归属校验\": \"约牛品牌词模式：围绕约牛品牌、文章主题和约牛产品论述，不主动出现竞品或其他品牌名。\"\
          ,\n            \"fallback_generated\": True\n        })\n\n    return normalized[:expected_count]\n\
          \ndef main(plan_json=None, article_count=None, keyword_pack=None, article_type=None,\
          \ known_competitors=None, pricing_guard=None):\n    expected_count = expected_count_to_int(article_count)\n\
          \    tasks = extract_tasks(plan_json)\n    if not tasks:\n        tasks\
          \ = parse_json_string(plan_json)\n    tasks = normalize_tasks(tasks, expected_count,\
          \ keyword_pack, article_type, known_competitors, pricing_guard)\n    return\
          \ {\"merged_plans\": tasks}"
