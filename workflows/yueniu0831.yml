          \            return \"\"\n\n        return paragraph\n\n    content = paragraph_pattern.sub(\n\
          \        replace_paragraph,\n        content,\n    )\n\n    return content\n\
          \n\ndef _clean_empty_html(content):\n    \"\"\"\n    清理删除段落后产生的空标签和孤立符号。\n\
          \    \"\"\"\n    content = str(content or \"\")\n\n    previous = None\n\
          \n    while previous != content:\n        previous = content\n\n       \
          \ content = re.sub(\n            r\"<(p|h2|h3)\\b[^>]*>\\s*</\\1>\",\n \
          \           \"\",\n            content,\n            flags=re.I,\n     \
          \   )\n\n    # 修复类似 </h3><<h3>、</h3> < <p> 的异常结构\n    content = re.sub(\n\
