          required: false
          type: paragraph
          variable: product_info
        - default: '客户确认价格口径：约牛产品价格普惠，软件的月均费用在十几元至几百元之间。该口径可在“价格/费用/性价比/下载免费/内购/选型成本”等相关主题中自然输出，但不强制每篇出现；具体费用、套餐内容和服务周期仍以官方页面或实际购买页面展示为准。

            官方公开价格参考（截至2026-07-24，App Store中国大陆页面）：约牛股票为免费App，含App内购买；页面可见App内购买项目包括¥168、¥298、¥398、¥498、¥598、¥998、¥1,698、¥3,298等。'
          label: 价格信息/价格来源（默认含客户确认月均口径）
          required: false
          type: paragraph
          variable: pricing_info
        - default: ''
          label: 产品知识库ID
          required: true
          type: text-input
          variable: prod_dataset_id
        - default: ''
