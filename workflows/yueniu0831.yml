    - data:
        code: "import json\n\ndef main(cleaned_articles):\n    # 输入类型防御:cleaned_articles\
          \ 可能是 list / dict / str / int / None\n    if cleaned_articles is None:\n\
          \        articles = []\n    elif isinstance(cleaned_articles, list):\n \
          \       articles = cleaned_articles\n    elif isinstance(cleaned_articles,\
          \ dict):\n        # 上游传单个对象 → 包成单元素列表\n        articles = [cleaned_articles]\n\
          \    elif isinstance(cleaned_articles, str):\n        # 上游传 JSON 字符串 → 解析\n\
          \        try:\n            parsed = json.loads(cleaned_articles)\n     \
          \       if isinstance(parsed, list):\n                articles = parsed\n\
          \            elif isinstance(parsed, dict):\n                articles =\
          \ [parsed]\n            else:\n                articles = []\n        except\
          \ Exception:\n            articles = []\n    else:\n        # 其它非预期类型(int/float/bool\
          \ 等) → 视为空\n        articles = []\n\n    titles = []\n    texts = []\n \
          \   tags_all = []\n    articles_json_strs = []\n\n    for art in articles:\n\
          \        # 元素若是 JSON 字符串,先反序列化\n        if isinstance(art, str):\n     \
          \       try:\n                art = json.loads(art)\n            except\
          \ Exception:\n                continue\n        if not isinstance(art, dict):\n\
          \            continue\n        titles.append(str(art.get(\"title\", \"\"\
          ) or \"\"))\n        texts.append(str(art.get(\"content\", \"\") or \"\"\
          ))\n        art_tags = art.get(\"tags\", [])\n        if isinstance(art_tags,\
          \ list):\n            tags_all.extend([str(t) for t in art_tags])\n    \
          \    # 只放纯 HTML content(前端期望此字段是文章正文 HTML,塞整个 JSON 会暴露 title/description/word_count)\n\
          \        articles_json_strs.append(str(art.get(\"content\", \"\") or \"\"\
          ))\n\n    # 去重 tags\n    seen = set()\n    unique_tags = []\n    for t in\
          \ tags_all:\n        if t not in seen and len(t) <= 15:\n            seen.add(t)\n\
          \            unique_tags.append(t)\n\n    # 每篇文章一个质量分,统一成字符串\n    quality_scores_str\
          \ = [\"1.0\"] * len(titles)\n\n    return {\n        \"article_titles\"\
          : titles,                       # Array[String]\n        \"final_article_text\"\
          : texts,                    # Array[String] - 每篇文章一个元素\n        \"generated_articles_list\"\
          : articles_json_strs,  # Array[String] - 每篇文章JSON字符串\n        \"article_tags\"\
          : unique_tags[:10],               # Array[String]\n        \"quality_scores\"\
          : quality_scores_str            # Array[String]\n    }\n"
