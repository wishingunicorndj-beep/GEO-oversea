        type: start
        variables:
        - default: '约牛天龙博弈 中小投资者三大痛点 决策版 机构版 四维共振 龙鳞判市 题材星空 资金排行 排雷工兵 公开数据 资金流向 公募瞭望 私募论剑 龙虎掘金 高管交易榜'
          label: 词包
