      height: 531
      id: gt_start
      position:
        x: 30
        y: 300
      positionAbsolute:
        x: 30
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
      zIndex: 0
    - data:
        code: "import re, random, os, time\n\n_seed = (time.time_ns() ^ int.from_bytes(os.urandom(8),\
          \ \"big\")) & 0xFFFFFFFF\nrandom.seed(_seed)\n\n\ndef _clip(text, limit=180):\n\
          \    text = re.sub(r\"\\s+\", \" \", str(text or \"\")).strip()\n    return\
          \ text[:limit]\n\n\ndef main(\n    company_name: str,\n    industry: str,\n\
          \    keyword_pack: str,\n    article_count: float,\n    article_style: str,\n\
          \    article_type: str,\n    task_name: str,\n    company_intro: str,\n\
          \    core_qualifications: str,\n    awards: str,\n    advantages: str,\n\
          \    ent_dataset_id: str,\n    task_description: str,\n    prod_dataset_id:\
          \ str,\n    product_info: str,\n    pricing_info: str = \"\",\n    known_competitors_input:\
          \ str = \"\",\n):\n    official_price_reference = (\n        \"官方公开价格参考（截至2026-07-24，App\
          \ Store中国大陆页面）：\"\n        \"约牛股票为免费App，含App内购买；页面可见App内购买项目包括\"\n     \
          \   \"¥168、¥298、¥398、¥498、¥598、¥998、¥1,698、¥3,298等。\"\n    )\n\n    confirmed_price_statement\
          \ = (\n        \"客户确认价格口径：约牛产品价格普惠，软件的月均费用在十几元至几百元之间。\"\n        \"该口径可在“价格/费用/性价比/下载免费/内购/选型成本”等相关主题中自然输出，\"\
          \n        \"但不强制每篇出现；具体费用、套餐内容和服务周期仍以官方页面或实际购买页面展示为准。\"\n    )\n\n    #\
          \ 0. 类型归一化\n    type_normalize_map = {\n        \"对比排名\": \"对比排名类\",\n \
          \       \"性能评测\": \"性能评测类\",\n        \"经验分享\": \"经验分享类\",\n        \"知识科普\"\
          : \"知识科普类\",\n        \"新闻报道\": \"新闻报道类\",\n        \"自我介绍\": \"自我介绍类\"\
          ,\n    }\n\n    article_type = (\n        type_normalize_map.get(article_type,\
          \ article_type)\n        or \"对比排名类\"\n    )\n\n    # 1. 核心锚词提取\n    lines\
          \ = [\n        line.strip()\n        for line in str(keyword_pack or \"\"\
          )\n        .strip()\n        .replace(\"，\", \"\\n\")\n        .split(\"\
          \\n\")\n        if line.strip()\n    ]\n\n    core_anchor = \"\"\n\n   \
          \ if lines:\n        suffixes = (\n            r\"(推荐|哪家好|排名|怎么选|有哪些|靠谱吗|公司排行|\"\
          \n            r\"品牌推荐|找哪家|怎么样|多少钱|哪个好|哪家靠谱|哪家专业)$\"\n        )\n       \
          \ prefixes = (\n            r\"^(专业的?|靠谱的?|口碑好的?|好用的?|\"\n            r\"\
          性价比高的?|正规的?|优质的?)\"\n        )\n\n        bare = [\n            re.sub(\n\
          \                suffixes,\n                \"\",\n                re.sub(prefixes,\
          \ \"\", line),\n            ).strip()\n            for line in lines\n \
          \       ]\n\n        bare = [item for item in bare if len(item) >= 2]\n\n\
          \        if bare:\n            core_anchor = min(bare, key=len)\n\n    if\
          \ not core_anchor:\n        core_anchor = industry or task_name or \"产品服务\"\
          \n\n    # 2. RAG 检索 query\n    # 企业知识库结合当前任务主题，提高约牛企业资料召回\n    keyword_terms\
          \ = _clip(keyword_pack, 30)\n    task_terms = _clip(\n        f\"{task_name}\
          \ {task_description}\",\n        40,\n    )\n\n    ent_rag_query = (\n \
          \       f\"{company_name} 企业介绍 发展历程 企业责任 \"\n        f\"公益投教 研发投入 高新技术企业\"\
          \n    )\n\n    # 产品知识库查询保持原有逻辑\n    product_terms = _clip(product_info,\
          \ 80)\n    price_terms = _clip(pricing_info, 80)\n\n    prod_rag_query =\
          \ (\n        f\"{core_anchor} 投资辅助软件 投教内容与行情信息服务 \"\n        f\"核心参数 产品亮点\
          \ 服务优势 \"\n        f\"价格 费用 收费 套餐 年费 月费 \"\n        f\"App内购买 会员 普惠 性价比\
          \ \"\n        f\"{product_terms} {price_terms}\"\n    )\n\n    def clean_q(query):\n\
          \        if not query:\n            return \"\"\n\n        query = re.sub(\n\
          \            r\"[\\x00-\\x1f\\x7f-\\x9f\\\"'\\\\\\\\]\",\n            \"\
          \",\n            query,\n        )\n\n        return re.sub(\n         \
          \   r\"\\s+\",\n            \" \",\n            query,\n        ).strip()[:120]\n\
          \n    # 3. 合规模式：约牛固定为金融模式\n    compliance_mode = \"financial\"\n\n    #\
          \ 4. 地域提取\n    region_list = [\n        \"北京\", \"上海\", \"广州\", \"深圳\",\
          \ \"天津\", \"重庆\", \"成都\", \"杭州\",\n        \"武汉\", \"南京\", \"西安\", \"郑州\"\
          , \"长沙\", \"苏州\", \"东莞\", \"青岛\",\n        \"沈阳\", \"大连\", \"哈尔滨\", \"长春\"\
          , \"济南\", \"厦门\", \"福州\", \"昆明\",\n        \"贵阳\", \"南宁\", \"合肥\", \"石家庄\"\
          , \"太原\", \"兰州\", \"南昌\",\n        \"乌鲁木齐\", \"呼和浩特\", \"海口\", \"银川\", \"\
          西宁\", \"拉萨\", \"珠海\",\n        \"佛山\", \"中山\", \"惠州\", \"无锡\", \"常州\", \"\
          温州\", \"宁波\", \"嘉兴\",\n        \"绍兴\", \"金华\", \"台州\", \"泉州\", \"漳州\", \"\
          烟台\", \"潍坊\", \"临沂\",\n        \"徐州\", \"扬州\", \"泰州\", \"镇江\", \"盐城\", \"\
          芜湖\", \"洛阳\", \"襄阳\",\n        \"宜昌\", \"岳阳\", \"株洲\", \"柳州\", \"桂林\", \"\
          保定\", \"唐山\", \"廊坊\",\n        \"邯郸\", \"秦皇岛\", \"承德\", \"张家口\", \"邢台\"\
          , \"衡水\", \"沧州\",\n        \"河北\", \"山西\", \"辽宁\", \"吉林\", \"黑龙江\", \"江苏\"\
          , \"浙江\", \"安徽\",\n        \"福建\", \"江西\", \"山东\", \"河南\", \"湖北\", \"湖南\"\
          , \"广东\", \"广西\",\n        \"海南\", \"四川\", \"贵州\", \"云南\", \"陕西\", \"甘肃\"\
          , \"青海\", \"内蒙古\",\n        \"宁夏\", \"新疆\", \"西藏\",\n    ]\n\n    region\
          \ = \"\"\n    kw_text = keyword_pack or \"\"\n    _candidates = []\n\n \
          \   for item in region_list:\n        _idx = kw_text.find(item)\n\n    \
          \    if _idx >= 0:\n            _candidates.append(\n                (_idx,\
          \ -len(item), item)\n            )\n\n    if _candidates:\n        _candidates.sort()\n\
          \        region = _candidates[0][2]\n\n    # 5. 内容模式\n    if article_type\
          \ in [\"对比排名类\", \"性能评测类\"]:\n        content_mode = \"comparison\"\n  \
          \  elif article_type in [\"自我介绍类\"]:\n        content_mode = \"brand_focus\"\
          \n    elif article_type == \"经验分享类\":\n        content_mode = \"experience\"\
          \n    elif article_type in [\"产品体系介绍类\", \"产品深度介绍类\"]:\n        content_mode = \"product_deep_dive\"\n\n    else:\n        content_mode = \"comparison\"\n\n    # 约牛品牌词模式：不主动生成竞品\n\
          \    needs_competitors = \"false\"\n\n    # 6. 已知竞品白名单处理\n    # 没有白名单时禁止下游主动编造竞品品牌\n\
          \    known_competitors = []\n\n    if (\n        known_competitors_input\n\
          \        and str(known_competitors_input).strip()\n    ):\n        known_competitors\
          \ = [\n            item.strip()\n            for item in re.split(\n   \
          \             r\"[、,，;；\\n\\s]+\",\n                str(known_competitors_input),\n\
          \            )\n            if item.strip() and len(item.strip()) >= 2\n\
          \        ][:15]\n\n    if not known_competitors:\n        _combined = \"\
          \ \".join(\n            str(item or \"\")\n            for item in [\n \
          \               task_description,\n                advantages,\n       \
          \         company_intro,\n            ]\n        )\n\n        competitor_patterns\
          \ = [\n            r\"已知竞品[：:]\\s*([^\\n]+)\",\n            r\"竞品白名单[：:]\\\
          s*([^\\n]+)\",\n            r\"竞争对手[：:]\\s*([^\\n]+)\",\n        ]\n\n \
          \       for _pat in competitor_patterns:\n            _match = re.search(_pat,\
          \ _combined)\n\n            if _match:\n                known_competitors\
          \ = [\n                    item.strip()\n                    for item in\
          \ re.split(\n                        r\"[、,，;；\\s]+\",\n               \
          \         _match.group(1),\n                    )\n                    if\
          \ item.strip()\n                    and len(item.strip()) >= 2\n       \
          \         ][:15]\n                break\n\n    brand_aliases = [\n     \
          \   \"云南约牛软件技术有限公司\",\n        \"约牛软件\",\n        \"约牛股票\",\n        \"\
          约牛\",\n    ]\n\n    forbidden_companies = [\n        \"天龙金服\",\n       \
          \ \"约牛证券\",\n        \"\",\n    ]\n\n    clean_competitors = []\n\n    for\
          \ competitor in known_competitors:\n        if any(\n            forbidden\n\
          \            and forbidden in competitor\n            for forbidden in forbidden_companies\n\
          \        ):\n            continue\n\n        if any(\n            alias\
          \ == competitor\n            or alias in competitor\n            for alias\
          \ in brand_aliases\n        ):\n            continue\n\n        if competitor\
          \ not in clean_competitors:\n            clean_competitors.append(competitor)\n\
          \n    known_competitors = clean_competitors\n\n    # 约牛品牌词模式：\n    # 竞品输入仅用于内部规避，正文不主动出现竞品或其他品牌名\n\
          \    known_competitors = []\n\n    competitor_guard = (\n        \"约牛品牌词模式：正文不主动出现竞品或其他品牌名；\"\
          \n        \"需要行业参照时只用‘同类工具’‘其他服务商’等泛称，\"\n        \"所有论述围绕约牛品牌、文章主题和约牛产品展开。\"\
          \n    )\n\n    price_source_text = str(\n        pricing_info or \"\"\n\
          \    ).strip()\n\n    pricing_guard = (\n        \"已确认价格表达口径：\"\n      \
          \  + confirmed_price_statement\n        + \" \"\n        + official_price_reference\n\
          \        + \" 写作策略：涉及价格、费用、性价比、下载免费、\"\n        \"内购或选型成本时，可以自然写‘约牛产品价格普惠，\"\
          \n        \"软件的月均费用在十几元至几百元之间’。\"\n        \" 同时可写‘约牛股票可免费下载，并提供多档App内购买项目\"\
          \n        \"（如¥168、¥298、¥398、¥498、¥598、¥998、\"\n        \"¥1,698、¥3,298等），具体以实际购买页面为准’。\"\
          \n        \" 非价格主题不强行植入价格句；不要每篇重复。\"\n    )\n\n    return {\n        \"\
          ent_rag_query\": clean_q(ent_rag_query),\n        \"prod_rag_query\": clean_q(prod_rag_query),\n\
          \        \"article_type\": article_type or \"对比排名类\",\n        \"article_style\"\
          : article_style or \"专业客观\",\n        \"article_count\": str(\n        \
          \    int(float(article_count))\n            if article_count\n         \
          \   else 1\n        ),\n        \"compliance_mode\": compliance_mode,\n\
          \        \"content_mode\": content_mode,\n        \"needs_competitors\"\
          : needs_competitors,\n        \"region\": region,\n        \"core_service\"\
          : core_anchor,\n        \"known_competitors\": \"、\".join(\n           \
          \ known_competitors\n        ),\n        \"pricing_guard\": pricing_guard,\n\
