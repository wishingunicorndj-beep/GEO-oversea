            近X万亿\"）→修正为知识库原文精确表述\n\n\n### C1+. 价格与费用校验\n- 价格、费用、收费、套餐、年费、月费、App内购买、会员价格、月均费用等表述，必须能在知识库、产品信息或价格信息/价格来源中找到对应原文\n\
            - 如果文中写\"月均十几元至几百元\"、\"几十元/月\"、\"价格不贵\"、\"费用门槛低\"等，但上游没有明确价格来源→删除具体价格/判断，改为\"\
            具体费用以官方页面或实际购买页面展示为准\"\n- 只有源文明确为年费或月费时才允许折算月均，并同时保留原价、周期和\"约\"字；不得把一次性内购、课程包或非周期价格折算成月均\n\
            - 发现价格范围被扩大、缩小或混淆不同套餐口径→改回原文口径；无法确认则删除数字\n\n\n### C2. 案例校验\n- 检查文中所有公司名称、合作案例是否来自知识库\n\
            - 发现知识库未提及的公司名称/案例→删除该案例，或替换为知识库中有的案例\n- 检查案例描述是否被夸大（如知识库写\"开展投教内容与行情信息服务相关业务\"\
            ，文中写\"达成深度战略合作\"）→修正为知识库原文措辞\n\n\n### C3. 时间节点校验\n- 知识库写\"截至2025年末\"→文中必须写\"\
