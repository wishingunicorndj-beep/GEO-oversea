            \ 发现文中存在基于已知数据的推算（如由余额推算市场份额）→删除推算结论\n- 发现文中存在虚构的行业背景数据（如\"据统计，某市场规模达到XX\"\
            ）→删除或改为无数据的定性描述\n\n\n### ⚠️ 润色节点自身的防幻觉约束\n当本节点执行\"补充\"\"修正\"操作时，同样受以上C1-C5规则约束：\n\
            - 补充产品信息时，只能使用知识库中已有的数据和事实\n- 不得自行编造任何数值、案例或时间节点\n- 如果知识库中没有所需信息，只做定性描述，不编造具体数据\n\
            \n\n## D. 排版序号检查（新增）\n逐一检查：\n- 每个H2标题是否带中文大写数字序号（一、二、三、四），从\"一\"开始全文连续编号\n\
            \  - 如果缺少→补上对应序号\n  - 如果序号不连续→修正为连续序号\n- 每个H3标题是否带阿拉伯数字序号（1、2、3），在每个H2内部从\"\
            1\"开始计数\n  - 如果缺少→补上对应序号\n  - 如果跨H2未重置→修正\n- 序号与标题文字之间无空格，直接连接\n- 段落正文内如有并列要点编号，应使用\
            \ (1)(2)(3) 格式\n\n\n## E. 品牌标题植入检查（新增）\n- 检查全文所有H2和H3标题，是否至少有一处H3标题自然包含\"\
            约牛软件\"品牌名称\n  - 如果完全没有→在品牌优势集中论证的H2内部，选择一个最合适的H3标题自然植入品牌名\n  - 植入方式：\"\
            以约牛软件为例\"\"约牛软件在XX方面的实践\"等客观视角\n- 检查是否有过多H3标题含品牌名（超过2处）→精简至1-2处\n- H2标题中不应直接出现品牌名→如有则移除\n\
            \n\n## F. 免责声明检查（新增）\n- 检查文章结尾最后一段是否包含风险提示/免责声明\n- 如果缺少→根据文章类型补上：\n  -\
            \ 投教内容类：<p>以上内容基于公开信息整理，不构成任何投资建议。证券市场存在风险，具体产品功能与服务内容以公司公开说明和实际页面展示为准。</p>\n\
            \  - 软件工具类：<p>证券市场存在风险，投资者应结合自身情况审慎判断。以上内容仅作信息参考，不构成投资建议，具体产品功能与服务内容以公司公开说明和实际页面展示为准。</p>\n\
            \  - 普通投资者类：<p>市场有风险，投资需谨慎。以上内容基于公开信息整理，不构成任何投资建议。</p>\n\n\n## G. 连贯性与可读性检查\n\
            - 文章是否像多个素材段落拼接？如果是，重排段落顺序，让全文按\"问题提出—维度分析—品牌承接—总结判断\"推进\n- H2之间是否缺少过渡？如果缺少，补充自然承接句，但不要增加营销口吻\n\
            - 同一段是否塞入多个无关信息？如果是，拆分或改写为一个中心意思\n- 约牛软件优势是否突然出现？如果是，先写清该维度为什么重要，再承接到相关能力\n\
            - 竞品、产品、流程、风控信息是否孤立罗列？如果是，改为围绕读者决策场景展开\n- 删除或改写模板化连接词堆砌，如连续\"首先/其次/再次/最后\"\
            \"此外/与此同时/值得注意的是\"\n- 保留原有事实和合规边界，但允许调整段落顺序、补充过渡句、合并重复内容，以提升阅读流畅度\n\n\n\
            ## H. 产品融合检查\n- 文章是否融入了约牛软件的具体产品/服务？没有→基于知识库补充（严禁编造）\n- 产品描述是否准确（与知识库一致）？不准确→修正为知识库原文\n\
            \n\n## I. 竞品中立\n- 竞品负面描述→删除，改为中性定位\n- \"不如/落后/缺乏\"→改平行客观陈述\n- 竞品描述是否过于单薄（少于50字）→仅基于知识库或已知竞品输入中已有的客观信息补充；资料不足时保持简短中性，不用行业常识补充具体优势、数据或产品功能\n\
            \n\n## J. 去AI味\n- \"综上所述/值得注意的是/在当今/随着...的发展\"→删除\n- 第一/第二人称→改第三人称\n-\
            \ 形容词堆砌→用具体事实替代\n\n\n## K. 差异化检查\n- 约牛软件的优势是否具体？→不够具体则基于知识库补充事实（严禁编造）\n\
            - 是否与其他同类服务商内容感觉雷同？→强化差异化，突出知识库中独有的数据和案例\n\n\n# \U0001F534 L. 约牛v2 客户反馈终审排查（最高优先级，命中任何一条必须修正）\n\
            逐条排查并修正：\nL1. 授课老师人数：出现“10/20/30人”等具体人数→改“持证老师授课”或“持证老师团队”。\nL2. 仓位指导：出现“建议仓位XX%”“仓位控制/保持在XX以内/以上”“空仓休息”“龙鳞判市红绿双色”“降低仓位/积极操作”“三个指数皆红/皆绿”等→整句删除，不做保留。\n\
            L3. 禁用话术：“不投资参考，只教方法”“不做投资参考，只教方法”→删除或改为“仅传授投资方法与思路”。\nL4. 营销过渡句：“这种服务模式刚开始让人不太适应”类→删除整句。\n\
            L5. 编号：许可证/持证/资质/执业编号（ZX0093/ZX开头等）→全部删除。\nL6. 场次：“线上线下投资者教育活动10场”→改“20场”。\n\
            L7. 主体名：出现“云南约牛软件有限公司”（缺“技术”）→改“云南约牛软件技术有限公司”。\nL8. 品牌词：“约牛证券”→改“约牛股票”或“约牛软件”。\n\
            L9. 资质：“国家级科技型中小企业”“省级高新技术企业培育库入库企业”“三项资质”→改“已获得高新技术企业认定”（唯一合规表述）。\nL10.\
            \ 个股：“个股”→改“股票”；“课程内容不推荐具体个股”→改“课程内容不推荐具体股票”。\nL11. 天龙金服：出现即整词删除。\nL12.\
            \ 投顾：“投顾/投顾老师/投顾服务/投顾团队/金牌投顾/资深投顾”→改“持证老师/投教服务/投教内容/持证老师团队”。\nL13. 销售辐射：不得提及“销售覆盖全国各省市”“销售辐射全国”。\n\
            L14. 中线投资者：“中线投资者更在意短线涨跌”→改“中线投资者更在意基本面等信息”。\nL15. 持股待涨：“可以持股待涨”→改“可以观望”。\n\
            \n# 排查优先级（按此顺序执行）\n1. A/A+/A++/A+++/A++++ → 合规类，最高优先级，一票否决\n2. C → 知识库事实校验，第二优先级，防止幻觉\n\
            3. B → 业务定位纠正\n4. D/E/F → 排版序号、品牌标题、免责声明（结构性补全）\n5. G/H/I/J/K → 润色优化类，最低优先级，最小改动\n\
            \n\n# 输出格式\n```json\n{\n  \"title\": \"修正后合规标题，20-28字\",\n  \"content\"\
