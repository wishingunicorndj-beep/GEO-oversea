            \n- 发现时间被更新或模糊化→修正为知识库原文\n\n\n### C4. 竞品数据校验\n- 竞品的具体业务数据只允许引用知识库中明确提供的\n\
            - 如果发现文中出现知识库未提供的竞品具体数字（如编造的余额、利率、市场份额）→删除具体数字，改为定性描述\n- 检查是否将约牛软件的数据错误归到竞品名下→纠正归属\n\
            \n\n### C4+. 产品归属与竞品隔离校验\n- 检查文中所有产品名、功能名、套餐名、价格、案例、优势是否明确归属于约牛；若来源不明，不得写成\"\
            约牛旗下/约牛自研/约牛推出/约牛提供\"\n- 已知竞品只能作为外部主体客观描述；不得将竞品产品或外部平台写成约牛产品\n- 如果没有竞品白名单，删除具体竞品品牌名，改为\"\
