          required: true
          type: text-input
          variable: company_name
        - default: ''
          label: 行业
          required: true
          type: text-input
          variable: industry
        - default: ''
          label: 企业简介
          required: false
          type: paragraph
          variable: company_intro
        - default: ''
          label: 核心资质
          required: false
          type: paragraph
          variable: core_qualifications
        - default: ''
