          required: true
          type: text-input
          variable: task_name
        - default: ''
          label: 任务描述
          required: false
          type: paragraph
          variable: task_description
        - default: ''
          label: 发布媒体
          required: false
          type: text-input
          variable: publish_media
        - default: '产品深度介绍类'
          label: article_type
          required: false
          type: text-input
          variable: article_type
        - default: '1'
          label: 文章数量
          required: true
          type: text-input
          variable: article_count
        - default: ''
          label: 文章风格
          required: false
