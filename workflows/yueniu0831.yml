            标题≤25字，使用以下一种公式：标准式“[价值方向]：[产品名]破解[目标人群][数量]大痛点”；问题式“[目标人群]如何解决[核心难题]？[产品名]给出[数量]大方案”；对比式“从[旧状态]到[新状态]：[产品名]如何体现[核心价值]”。标题必须含约牛或天龙博弈，并点出中小投资者或痛点；不得承诺收益。

            正文3000—4000个中文字符，目标3300—3700字，严格使用五个<h1>一级章节：一、引言；二、中小投资者三大核心痛点；三、决策版：特色指标破解择时与买卖难题；四、机构版：机构数据辅助选股决策；五、结语。第二章含三个<h2>痛点，两个版本以功能<h2>拆解；课程服务只能置于各自版本末尾，不能独立成章。

            全文只按“背景—三大痛点—决策版—机构版—总结”推进。引言引用知识库中可核验的中证登数据后介绍两版产品并预告路径；痛点章末说明需要市场信号、公开信息与机构数据的互补参考；决策版章末引出公开机构数据的补充需求；机构版承接该缺口；结语回收两版关系。每个一级章节开头必须承接上一节结论，禁止在后文重新开启“用户如何选工具”等已完成话题。

            痛点映射必须闭环：市场环境判断→四维共振中的龙鳞判市；成长性方向识别→决策版题材星空、资金排行、排雷工兵、公开数据和机构版资金流向、公募瞭望、私募论剑、龙虎掘金、高管交易榜；损失厌恶→四维共振的波段趋势、短线趋势、冰火量能、多空决策。
            决策版固定顺序：总起→四维共振（含龙鳞判市）→题材星空→资金排行→排雷工兵→公开数据→课程服务。机构版固定顺序：总起→资金流向→公募瞭望→私募论剑→龙虎掘金→高管交易榜→体系小结→课程服务。资金排行、龙虎掘金和高管交易榜是正式功能名称，不得改写。

            按知识库说明功能：题材星空强调板块、热点与气泡图；资金排行说明不同周期资金信息；排雷工兵说明全市场与股票两种风险排查；公开数据作为补充。机构版说明从股票到行业的资金视图，公募瞭望的集中度、抢筹力度、同门基金，私募论剑的监控、筛选、跟踪，龙虎掘金的席位数据，高管交易榜的产业资本信息。知识库仅为内部取证来源，面向读者的标题、正文、摘要和标签不得出现知识库、据知识库、知识库显示等字样。课程名称、时间、案例仅在知识库可核验时使用。

