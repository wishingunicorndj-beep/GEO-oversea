app:
  description: '天龙博弈系列产品深度介绍重构版：固定五段式、决策版与机构版双版本、痛点-功能映射

    保留原有知识库检索与合规输出能力，新增产品深度介绍模式。'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: workflow
  name: V3.1生文-约牛天龙博弈产品深度介绍
  use_icon_as_answer_icon: false
kind: app
version: 0.1.3
