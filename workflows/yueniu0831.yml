            七、虚构官方数据、信源引用错误类\n1、一级禁用词：虚构交易所合作数据、编造机构调研数据、杜撰官方发布内容、信源引用错误、无依据编造市场数据、夸大性表述、违规素材、夸大性描述公司合规合法、私自使用未审核宣传素材。\n\
