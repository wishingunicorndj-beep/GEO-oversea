    - data:
        code: "import json\n\ndef main(ent_body=None, prod_body=None, pricing_info=None):\n\
          \    def extract_content(body):\n        if not body:\n            return\
          \ \"\"\n        try:\n            if isinstance(body, str):\n          \
          \      obj = json.loads(body)\n            else:\n                obj =\
          \ body\n            if isinstance(obj, dict):\n                records =\
          \ obj.get(\"records\", []) or obj.get(\"data\", [])\n                texts\
          \ = []\n                for r in records:\n                    if isinstance(r,\
          \ dict):\n                        seg = r.get(\"segment\", {}) or r\n  \
          \                      if isinstance(seg, dict):\n                     \
          \       t = seg.get(\"content\", \"\") or seg.get(\"text\", \"\")\n    \
          \                    else:\n                            t = str(seg)\n \
          \                   else:\n                        t = str(r)\n        \
          \            if t:\n                        texts.append(t)\n          \
          \      return \"\\n\\n---\\n\\n\".join(texts)\n        except:\n       \
          \     pass\n        return str(body) if body else \"\"\n\n    ent_content\
          \ = extract_content(ent_body)\n    prod_content = extract_content(prod_body)\n\
          \    price_content = str(pricing_info or \"\").strip()\n\n    merged = \"\
          \"\n    if ent_content:\n        merged += \"## 企业知识库\\n\\n\" + ent_content\n\
          \    if prod_content:\n        if merged:\n            merged += \"\\n\\\
          n\"\n        merged += \"## 产品知识库\\n\\n\" + prod_content\n    if price_content:\n\
          \        if merged:\n            merged += \"\\n\\n\"\n        merged +=\
          \ \"## 用户提供的价格信息/价格来源（仅可按原文引用）\\n\\n\" + price_content\n\n    return {\"\
          merged_kb\": merged or \"知识库未检索到内容\"}"
