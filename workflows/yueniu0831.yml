            \n# \U0001F534 V3.2新增：价格普惠、事实证据与AI收录质量规则（最高优先级）\n1. 价格表达可用，但必须有证据。可优先在“多少钱/费用/性价比/如何选择/软件工具评估”等相关主题中自然加入约牛产品价格普惠、费用门槛或多档价格选择；无价格语境时不强行植入。\n\
