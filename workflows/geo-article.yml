          \          break\n            if not is_safe:\n                # 检查后面 15\
          \ 字内是否有\"奖/称号/荣誉/评选\" (奖项固有名称不动)\n                context_ahead = text[i:i+16]\n\
          \                if any(mk in context_ahead for mk in [\"奖\", \"称号\", \"\
