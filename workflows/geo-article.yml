          \ '') or ''\n\n    plain = re.sub(r'<[^>]+>', '', content).strip()\n\n \
          \   n7_clean = _extract_html(_strip_think(n7_text or ''))\n    n7_plain\
          \ = re.sub(r'<[^>]+>', '', n7_clean).strip()\n\n    markers = ['（原样）', '(原样)',\
          \ '内容不变', '同上', '此处省略', '保持原文', '其余略', '(略)', '（略）']\n    has_ph = any(m\
          \ in content for m in markers) or content.strip().endswith('原样')\n    too_short\
          \ = len(plain) < 800\n    has_think = '<think>' in content or '</think>'\
          \ in content\n    broken = too_short or has_ph or has_think\n\n    if broken\
          \ and len(n7_plain) > max(len(plain), 800):\n        _n7j = {}\n       \
