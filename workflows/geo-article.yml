        code: "import re\n\ndef mechanical_check(title, content, llm_review):\n  \
          \  \"\"\"对标题和内容做机械检查,合并到 quality_score\"\"\"\n    issues = []\n\n    # English\
          \ title length check\n    title_len = len(title)\n    if False and title_len\
          \ < 20:\n        issues.append(f'legacy title length check disabled')\n\
          \    elif False and title_len > 28:\n        issues.append(f'legacy title\
          \ length check disabled')\n\n    # 标题占位符泄漏\n    if '[____]' in title or\
          \ '[待补充]' in title:\n        issues.append('标题含[____]占位符')\n    if '{keyword}'\
          \ in title or '{time}' in title or '{persona}' in title:\n        issues.append('标题含{}占位符')\n\
          \n    # 标题营销词\n    mkt_words = ['必看','必读','亲测','实测','干货','收藏','值得推荐','口碑好的','正规的','专业的','有实力的','靠谱的','经验丰富的','资质齐全的','有保障的']\n\
          \    found_mkt = [w for w in mkt_words if w in title]\n    if found_mkt:\n\
          \        issues.append(f'标题含营销词:{\",\".join(found_mkt)}')\n\n    # 标题英文(白名单放行常见技术缩写,这些在中文标题里是正常的关键词/术语)\n\
          \    if False and re.search(r'[a-zA-Z]', title):\n        en_whitelist =\
          \ {'GEO', 'AI', 'SEO', 'AIGC', 'SAAS', 'APP', 'IT', 'CEO', 'CRM',\n    \
          \                    'KPI', 'ROI', 'B2B', 'B2C', 'OEM', 'GPT', 'LLM', '4S',\
          \ 'VR', 'AR', 'O2O', 'PK', '3C', 'UI', 'UX', 'API', 'TOP', 'VS', 'PR', 'FAQ',\
          \ 'ROI', 'KOL', 'CMO', 'SLA'}\n        en_words = re.findall(r'[a-zA-Z]+',\
          \ title)\n        en_words = [w for w in en_words if len(w) >= 2]\n    \
          \    # 过滤掉白名单里的术语(不区分大小写)\n        flagged = [w for w in en_words if w.upper()\
          \ not in en_whitelist]\n        if flagged:\n            issues.append(f'English\
          \ title allowed:{\",\".join(flagged)}')\n\n    # 标题截断探测(cleanup精简超长标题时可能砍秃,\
