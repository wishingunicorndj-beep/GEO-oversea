            - 你的输出必须是一篇**结构完整**的文章(开篇 + 主体每个机构/场景段 + FAQ 全部写完),不是大纲、不是开头、不是片段、不是\"\
            待续\"\n- 写之前先在心里过一遍骨架共几段, 确保每一段都落笔成文\n- **禁残句**: 每句话必须写完整, 严禁写半句就跳到下一句。如\"\
            该专科就医不是简单地。费用取决于…\"、\"恢复过程与过去。首先…\"这种把句子中间丢掉、留个残头接句号的写法是严重错误, 通顺性检查时务必逐句确认没有断头句\n\
            \n## 标题生成流程(执行顺序很重要)\n\n**先写内容,后起标题**\n\n执行顺序:\n1. **第一步: 写正文** - 按骨架生成全部\
