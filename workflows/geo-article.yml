          \    sentence_pattern = r'([^。！？；.!?;]+[。！？；.!?;]?)'\n    sentences = re.findall(sentence_pattern,\
          \ text)\n    \n    kept = []\n    for s in sentences:\n        if any(w\
          \ in s for w in black_phrases):\n            continue\n        kept.append(s)\n\
          \    \n    text = ''.join(kept)\n    \n    # 残留符号清理\n    text = re.sub(r'<p>\\\
          s*[+=\\-，,。.、:：；;\\s]*\\s*</p>', '', text)\n    text = re.sub(r'[+]{2,}',\
          \ '', text)\n    text = re.sub(r'[=]{2,}', '', text)\n    text = re.sub(r'[-]{3,}',\
          \ '', text)\n    \n    return text\n\ndef clean_education(text):\n    \"\
          \"\"教育/学校/培训题材(检测到学校关键词时): 广告法第24条 — 升学率/录取率数字模糊化, 去排名第一/绝对化\"\"\"\n   \
          \ if not text:\n        return text\n    if not re.search(r'学校|招生|在读|学费|升学|录取|办学|校区|生源|学段|寄宿|民办校|国际部',\
          \ text):\n        return text\n    # 升学率/录取率/本科率 + 数字 -> 模糊(广告法禁升学/录取的暗示性承诺,\
