          \ r'加\\s*(?:微信|qq|QQ)[\\s号:：]*\\d{0,}', r'\\s*微信号?\\s*[:：]?\\s*[A-Za-z0-9_]{4,}',\
          \  # 加微信XXX/微信号XXX\n        # 注意:\"优先选择正规机构\"/\"建议选择适合方案\" 是合理建议,不清\n  \
          \  ]\n    for p in cta_patterns:\n        text = re.sub(p, '', text)\n \
          \   # standard模式也清除高危绝对化用语\n    abs_patterns = [\n        # 纯营销词,直接清\n \
