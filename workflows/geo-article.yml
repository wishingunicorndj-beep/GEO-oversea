          \       n2_mode = mv\n                    break\n        if n2_mode:\n \
          \           kw_is_brand = (n2_mode == 'brand_focus')\n        else:\n  \
          \          kw_is_brand = False\n            if company_name and len(company_name)\
          \ >= 2:\n                for name_len in [4, 3, 2]:\n                  \
          \  if len(company_name) >= name_len and company_name[:name_len] in kw:\n\
          \                        kw_is_brand = True\n                        break\n\
          \        \n        # N2 分类有最终话语权\n        if n2_mode == 'brand_focus':\n\
          \            cur_mode = \"brand_focus\"\n        elif n2_mode in ('comparison',\
          \ 'ranking', 'review'):\n            cur_mode = \"comparison\"\n       \
          \ elif kw_is_brand:\n            cur_mode = \"brand_focus\"\n        elif\
          \ content_mode == \"brand_focus\":\n            cur_mode = \"brand_focus\"\
          \n        elif cur_type == \"自我介绍类\":\n            cur_mode = \"brand_focus\"\
          \n        elif cur_type in [\"对比排名类\", \"性能评测类\"]:\n            cur_mode\
          \ = \"comparison\"\n        elif cur_type == \"经验分享类\":\n            cur_mode\
          \ = \"experience\"\n        else:\n            cur_mode = \"knowledge\"\n\
          \        if cur_mode in [\"brand_focus\", \"knowledge\"]:\n            num_comp\
          \ = 0\n        elif cur_mode == \"experience\":\n            num_comp =\
          \ random.choice([0, 1, 2]) if len(comp_names) >= 2 else len(comp_names)\n\
          \        else:\n            num_comp = random.choice([3, 4]) if len(comp_names)\
          \ >= 3 else len(comp_names)  # 标准文≥3竞品\n        if comp_names and num_comp\
          \ > 0:\n            # 均匀分配：优先选还没用过/用得少的竞品，避免每篇都选同样几家\n            sorted_by_usage\
          \ = sorted(comp_names, key=lambda x: (comp_usage.get(x, 0), random.random()))\n\
          \            subset = sorted_by_usage[:min(num_comp, len(comp_names))]\n\
          \            for c in subset:\n                comp_usage[c] = comp_usage.get(c,\
          \ 0) + 1\n            random.shuffle(subset)  # 每篇竞品顺序随机, 避免同批10篇竞品顺序一致\n\
          \        else:\n            subset = []\n\n        # === 为本篇文章随机分配候选变体池\
