          \ 'saas', '云服务', '企业软件', 'CRM', 'ERP', 'OA', '订阅制'],\n    'catering': ['餐饮',\
          \ '餐厅', '连锁餐饮', '快餐', '茶饮', '咖啡', '火锅', '烘焙'],\n    'beauty': ['医美', '整形',\
          \ '美容', '皮肤管理', '轻医美', '医疗美容'],\n    'auto': ['汽车', '新能源车', '整车', '4S',\
