          \ title\n\n# ===================================================================\n\
          # 主清洗管线（顺序很关键）\n# ===================================================================\n\
          \ndef strip_title_labels(title):\n    \"\"\"清洗标题里的结构类型标签前缀(LLM 误添加的内部元数据)\"\
