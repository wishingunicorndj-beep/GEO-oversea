            \ \"{keyword}TOP6深度对比：技术与口碑{suffix}\")\n3. **第三步: 结合\"模板结构 + 正文实际内容\"\
            生成最终标题**\n   - 沿用 title_template 的**句式风格**(TOP榜/盘点/测评/选型指南等)\n   - 填入**正文实际涉及**的关键词/维度/数字\n\
            \   - 替换所有 {占位符}, 不能保留任何 {xxx} 在最终标题里\n   \n   示例: title_template = \"\
