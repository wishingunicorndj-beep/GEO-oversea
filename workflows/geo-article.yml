          s*##\\s*文章\\s*\\d+\\s*</h[1-6]>', '', text)\n    text = re.sub(r'^##\\s*文章\\\
          s*\\d+\\s*$', '', text, flags=re.MULTILINE)\n    text = re.sub(r'文章\\s*\\\
