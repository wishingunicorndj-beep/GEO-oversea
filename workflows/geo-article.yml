          \          i += 1\n                    is_safe = True\n            if not\
          \ is_safe:\n                nxt = text[i+1]\n                if \"一\" <=\
          \ nxt <= \"鿿\":\n                    i += 1\n                else:\n   \
          \                 result.append(text[i])\n                    i += 1\n \
          \       else:\n            result.append(text[i])\n            i += 1\n\
          \    return \"\".join(result)\n\n\ndef neutralize_perfection_numbers(text,\
          \ mode):\n    \"\"\"medical/financial 模式下中性化近完美数字\"\"\"\n    if not text\
          \ or mode == 'standard': return text\n    text = re.sub(r'[≥≧>=]\\s*9[5-9](?:\\\
