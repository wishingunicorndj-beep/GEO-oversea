          \        _cut = title[:28]\n        _p = max([_cut.rfind(s) for s in ['：',\
          \ ':', '，', ',', '、', '；', ';']])\n        title = _cut[:_p].rstrip('：:，,、；;\
          \ ') if _p >= 16 else _cut\n    return title\n\n\ndef strip_marketing_adjectives(text,\
          \ mode='standard', kb_text=''):\n    \"\"\"清除平台敏感的营销形容词\"\"\"\n    if not\
          \ text: return text\n    marketing_words = [\n        # 保留: 真正的\"叫卖式\"营销腔(中性语境几乎不用)\n\
          \        '震撼', '颠覆', '革命性', '秒杀', '吊打', '完爆',\n        '超值', '超划算', '性价比极高',\
