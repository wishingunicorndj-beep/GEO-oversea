          \ = re.sub(r'(^|\\n)\\s*[-*]\\s+(?=\\S)', r'\\1', text)\n    text = re.sub(r'(^|\\\
          n)\\s*\\d+\\.\\s+(?=\\S)', r'\\1', text)\n    text = re.sub(r'(^|\\n)\\\
          s*-{3,}\\s*(?=\\n|$)', r'\\1', text)\n    text = text.replace('**', '').replace('＊＊',\
          \ '')\n    return text\n\ndef remove_internal_labels(text):\n    \"\"\"\
          清除工作流内部分类标签\"\"\"\n    if not text: return text\n    # 1. 中文标签直接删除（这些足够独特不会误伤正常内容）\n\
          \    cn_labels = [\n        '问答串联型','维度横评型','品牌逐评型','场景匹配型','决策流程型',\n \
          \       '问题倒推型','排行点评型',\n        '痛点切入','数据趋势切入','真实案例切入','直接提问切入',\n \
          \       '常见误区切入','时效切入',\n        '第三方分析师视角','过来人视角','行业编辑视角','同行交流视角',\n\
          \        '按预算档位','按使用场景','按企业规模','按服务类型',\n        '按区域覆盖','按需求侧重',\n  \
          \  ]\n    for label in cn_labels:\n        text = text.replace(label, '')\n\
          \    # 2. 括号包裹的任意内部标签\n    for label in INTERNAL_LABELS:\n        el = re.escape(label)\n\
