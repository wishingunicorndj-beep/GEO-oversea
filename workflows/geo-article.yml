          \ strict=False)\n        except Exception:\n            _n7j = {}\n    \
          \    _jc = (_n7j.get('content') or '').strip()\n        if _jc:\n      \
          \      content = _strip_think(_jc)\n            if '<think>' in content\
          \ or '</think>' in content:\n                content = _extract_html(_strip_think(content))\n\
          \        else:\n            content = n7_clean\n        if not title or\
          \ len(title.strip()) < 5:\n            title = (_n7j.get('title') or '').strip()\n\
          \        if not title or len(title.strip()) < 5:\n            m = re.search(r'<h2[^>]*>(.*?)</h2>',\
          \ content, re.S)\n            if m:\n                title = re.sub(r'<[^>]+>',\
          \ '', m.group(1)).strip()\n        if not description:\n            description\
          \ = (_n7j.get('description') or '').strip() or re.sub(r'<[^>]+>', '', content)[:120].strip()\n\
          \        if not tags:\n            _t = _n7j.get('tags') or []\n       \
