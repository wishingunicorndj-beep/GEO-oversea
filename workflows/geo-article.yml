          \            # 标题数字 = 竞品数 + 1(主推品牌) = 实际文章列出的机构总数\n            ranking_structures\
          \ = [\"排行点评型\", \"品牌逐评型\", \"清单型\"]\n            total_institutions = int(competitor_count\
          \ or 0) + 1  # 竞品 + 主推\n            \n            # 数字映射表\n            num_to_exp\
          \ = {\n                2: [\"两家\"],\n                3: [\"三家\", \"TOP3\"\
          , \"三大\"],\n                4: [\"四家\", \"主流\", \"多家\"],\n             \
          \   5: [\"五家\", \"TOP5\", \"五大\"],\n            }\n            \n      \
          \      if dna_str in ranking_structures and total_institutions >= 2:\n \
          \               # 排行/逐评类: 用真实数字\n                exp_options = num_to_exp.get(total_institutions,\
          \ [\"多家\", \"主流\"])\n                num_exp_chosen = random.choice(exp_options)\n\
          \            else:\n                # 其他结构(步骤/场景/对比): 用模糊词\n           \
          \     num_exp_chosen = random.choice([\"多家\", \"主流\", \"几家\", \"头部\"])\n\
          \            try:\n                tt = combo.format(\n                \
          \    time=random.choice(time_variants),\n                    persona=random.choice(persona_variants),\n\
          \                    scene=random.choice(scene_variants),\n            \
          \        keyword=\"{keyword}\",\n                    intent=random.choice(intent_variants),\n\
          \                    number=random.choice(number_variants),\n          \
          \          region_mod=random.choice(region_modifier_pool),\n           \
          \         number_exp=num_exp_chosen,\n                    dim_mod=random.choice(dimension_modifier_pool),\n\
          \                    suffix=random.choice(suffix_pool),\n              \
          \      type_rank=random.choice(type_word_pool[\"rank\"]),\n            \
          \        type_review=random.choice(type_word_pool[\"review\"]),\n      \
          \              type_compare=random.choice(type_word_pool[\"compare\"]),\n\
          \                    type_analyze=random.choice(type_word_pool[\"analyze\"\
          ]),\n                    type_guide=random.choice(type_word_pool[\"guide\"\
          ]),\n                ).replace(\"：：\",\"：\").replace(\"  \",\" \").strip(\"\
          ：， \").strip()\n            except (KeyError, IndexError):\n           \
          \     tt = combo\n        else:\n            raw_tt = shuffled_titles[i\
          \ % len(shuffled_titles)]\n            # 清理描述型模板(形如\"X型：用...组合，如'...'\"\
          ),只保留可填充的纯模板\n            if \"：用\" in raw_tt and (\"组合\" in raw_tt or \"\
          如'\" in raw_tt or \"如\\u2018\" in raw_tt):\n                # 描述型,转成通用安全模板(不泄漏定义)\n\
          \                tt = \"{keyword}选型参考与\" + random.choice([\"选择逻辑\",\"核心维度\"\
          ,\"实用建议\",\"常见问题梳理\"])\n            else:\n                tt = raw_tt\n\
          \n        # === 每个关键词独立判断 content_mode ===\n        # 如果这个关键词含品牌名 → 这篇走\
