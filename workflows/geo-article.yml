          \ {}).get('content', '')\n    if not content:\n        return _empty_result('empty\
          \ content in message')\n\n    content = content.strip()\n    content = _strip_markdown_fence(content)\n\
          \n    competitors_data = None\n    try:\n        competitors_data = json.loads(content)\n\
          \    except json.JSONDecodeError as e:\n        m = re.search(r'\\{[\\s\\\
