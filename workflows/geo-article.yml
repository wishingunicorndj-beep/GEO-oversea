          \       w = max(1, min(5, int(m.group(1))))  # clamp 1-5\n             \
          \   weights[key] = w\n        return weights\n\n    def hamilton_allocate(weights,\
          \ total):\n        \"\"\"Hamilton 余数法：按权重分配整数篇数，总和严格等于 total\"\"\"\n   \
          \     w_sum = sum(weights.values())\n        if w_sum == 0:\n          \
          \  w_sum = 1\n        quotas = {k: v * total / w_sum for k, v in weights.items()}\n\
          \        result = {k: int(q) for k, q in quotas.items()}\n        remainder\
          \ = total - sum(result.values())\n        fractionals = sorted(quotas.keys(),\
          \ key=lambda k: quotas[k] - int(quotas[k]), reverse=True)\n        for i\
          \ in range(remainder):\n            result[fractionals[i]] += 1\n      \
          \  return result\n\n    def diversify_allocation(weights, total):\n    \
          \    \"\"\"优先级轮换填充: 固定优先级 对比排名>选型指南>性能评测>经验分享,\n        按权重降序+固定优先级排序,轮流填充,竞品类型(对比/评测)各≤30%上限\"\
          \"\"\n        import math as _m\n        if total <= 0:\n            return\
          \ {}\n        # 固定优先级(打破权重平局): 数字越小越优先\n        fixed_priority = {\"对比排名类\"\
          : 1, \"选型指南类\": 2, \"性能评测类\": 3,\n                          \"经验分享类\": 4,\
          \ \"知识科普类\": 5, \"自我介绍类\": 6, \"新闻报道类\": 7}\n        # 只保留权重>0的类型,按(权重降序,\
