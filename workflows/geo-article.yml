            \ 维度最多3个、品牌最多4家(主推+3竞品),即矩阵格子≤12;每格只写2-3句(120-180字),绝不每格长篇;若品牌有4家则维度压到2个。优先用\"\
            按品牌分段\"的扁平结构(每个品牌只展开一次),矩阵型只在知识库数据充分时才用**\n   \n   - **量化数据限制(medical/financial)**\n\
            \   - **铺垫段不编造数据**: 开篇类型如果是\"行业数据切入\", medical/financial 模式下改为\"行业趋势定性描述\"\
