    - data:
        code: "import re, json\n\ndef main(n7_text):\n    text = n7_text or ''\n \
          \   # 剥 think 链\n    if '<think>' in text or '</think>' in text:\n     \
          \   text = re.sub(r'<think>.*?</think>', '', text, flags=re.S | re.I)\n\
          \        if '</think>' in text:\n            text = text.split('</think>')[-1]\n\
          \    # 剥代码块\n    text = re.sub(r'^\\s*```[a-zA-Z]*\\s*\\n?', '', text)\n\
          \    text = re.sub(r'\\n?\\s*```\\s*$', '', text)\n    # 抠 JSON（增强：JSON未闭合时尝试修补）\n\
          \    data = {}\n    m = re.search(r'\\{.*\\}', text, re.S)\n    if m:\n\
          \        try:\n            data = json.loads(m.group(0))\n        except\
          \ Exception:\n            data = {}\n    # JSON未闭合兜底：正则直接提取title和content\n\
          \    if not data:\n        _t = _regex_field(text, 'title')\n        _c\
          \ = _regex_field(text, 'content')\n        if _t or _c:\n            data\
          \ = {'title': _t, 'content': _c}\n\n    title = str(data.get('title', '')\
          \ or '')\n    content = str(data.get('content', '') or '')\n\n    issues\
          \ = []\n\n    # ---- 截断检测（新增，最高优先级）----\n    trunc = _detect_truncation(title,\
          \ content, text)\n    if trunc:\n        issues.extend(trunc)\n\n    # ----\
          \ 标题 ----\n    if title:\n        tlen = len(title)\n        if tlen < 20:\n\
          \            issues.append(f'标题过短({tlen}字,要求20-28):从正文提取一个真实角度/数字,扩写到8-14\
          \ English words,不要硬凑')\n        elif tlen > 28:\n            issues.append(f'标题超长({tlen}字,要求20-28):重写精简,绝不从结尾硬砍,裁完必须是完整通顺短语')\n\
          \        if re.search(r'[：:，,、；;]$', title.rstrip()):\n            issues.append('标题以标点结尾(截断):改成完整短语收尾')\n\
          \        else:\n            _t = title.rstrip()\n            _last = _t[-1]\
          \ if _t else ''\n            _bef = _t[-2] if len(_t) >= 2 else ''\n   \
          \         if (_last == '全' and _bef not in '大齐安健保完周两万俱成顾') or _last in '与及或之而和':\n\
          \                issues.append(f'标题结尾是半截词(\"{_t[-2:]}\"):补全成完整词(如\"全攻略\"\
          \"全指南\")或换完整短语收尾,严禁停在单字')\n        if re.search(r'\\[|\\]|\\{|\\}|XX|xx',\
          \ title):\n            issues.append('标题含占位符/XX:替换成正文里的真实内容')\n    else:\n\
          \        issues.append('标题为空:必须生成8-14 English words标题')\n\n    # ---- 正文\
          \ ----\n    # 统计纯文字字数：直接从content的HTML中提取\n    plain = re.sub(r'<[^>]+>',\
          \ '', content)\n    clen = len(plain)\n\n    # 也尝试递归统计（兼容N7输出content+h2嵌套的情况）\n\
          \    full_len = _count_full(data)\n    clen = max(clen, full_len)\n\n  \
          \  if clen == 0:\n        issues.append('正文为空:生文节点输出异常,需要重新生成')\n    elif\
          \ clen < 2500:\n        issues.append(f'正文过短({clen}字,标准文目标3000-3500/稀薄品牌文至少2500):补充真实信息与质量七因子(信息密度、信息增益、原创框架、案例拆解、边界条件、误区澄清、FAQ场景匹配),不要套话凑数')\n\
          \    elif clen > 4200:\n        issues.append(f'正文过长({clen}字,上限4200):精简到3500以内,删冗余不删信息')\n\
          \    if '**' in content:\n        issues.append('正文含 ** 残留(markdown没转<strong>):清理掉**,该加粗的用<strong>')\n\
          \    if re.search(r'\\[(?:内容|此处|待补|填写|XX|xx)[^\\]]*\\]|【(?:内容|此处|待补)】',\
          \ content):\n        issues.append('正文含占位符泄漏:替换成真实内容')\n    if re.search(r'[¥￥]\\\
          s*\\d|\\d+\\s*元(?![档级期度])|\\d+\\s*万元', content):\n        issues.append('正文含价格信息:删除具体价格')\n\
          \    if re.search(r'(?:结束语|closing_phrase|title_style|content_mode|compliance_mode)\\\
          s*[:：]', content):\n        issues.append('正文含内部标签泄漏:删除')\n\n    issues_str\
          \ = '\\n'.join(f'{i+1}. {x}' for i, x in enumerate(issues)) if issues else\
          \ '无明显机械问题'\n    return {'issues': issues_str, 'has_issues': 1 if issues\
          \ else 0, 'content_len': clen}\n\n\ndef _regex_field(raw, field):\n    \"\
          \"\"JSON解析失败时的正则兜底提取\"\"\"\n    if not raw or not field:\n        return\
          \ ''\n    pattern = r'\"%s\"\\s*:\\s*\"((?:\\\\.|[^\"\\\\])*)\"' % re.escape(field)\n\
          \    m = re.search(pattern, raw, re.S)\n    if not m:\n        return ''\n\
          \    val = m.group(1)\n    val = val.replace('\\\\\"', '\"').replace('\\\
          \\\\\\', '\\\\').replace('\\\\n', '\\n').replace('\\\\t', '\\t')\n    return\
          \ val.strip()\n\n\ndef _count_full(art):\n    \"\"\"递归统计全文字数(content + h2[].content\
          \ + h3[].content)\"\"\"\n    total = len(re.sub(r'<[^>]+>', '', str(art.get('content')\
          \ or '')))\n    for h2 in (art.get('h2') or []):\n        if isinstance(h2,\
          \ dict):\n            total += len(re.sub(r'<[^>]+>', '', str(h2.get('content')\
          \ or '')))\n            for h3 in (h2.get('h3') or []):\n              \
          \  if isinstance(h3, dict):\n                    total += len(re.sub(r'<[^>]+>',\
          \ '', str(h3.get('content') or '')))\n    return total\n\n\ndef _detect_truncation(title,\
          \ content, raw):\n    \"\"\"检测内容是否被截断，返回问题列表\"\"\"\n    issues = []\n  \
          \  if not content or not content.strip():\n        issues.append('[截断]正文内容为空,生文节点输出可能被中断:需要重新生成本篇')\n\
          \        return issues\n\n    # 1. HTML标签未闭合（输出在标签中间截断）\n    tail = content.rstrip()\n\
          \    if tail and tail[-1] != '>' and re.search(r'<[^>]*$', tail):\n    \
          \    issues.append('[截断]HTML标签未闭合(输出在标签中间被截断):需要重新生成本篇或由改写节点补全')\n\n   \
          \ # 2. 开闭标签不配对\n    for tag in ['h2', 'h3', 'p']:\n        open_c = len(re.findall(r'<%s[\\\
          s>]' % tag, content, re.I))\n        close_c = len(re.findall(r'</%s>' %\
          \ tag, content, re.I))\n        if open_c > close_c + 1:\n            issues.append(f'[截断]<{tag}>标签不配对(开{open_c}个/闭{close_c}个):输出可能被截断')\n\
          \n    # 3. 标题承诺数量 vs 实际h3数量\n    if title:\n        cn_num = {'两': 2, '二':\
          \ 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9, '十': 10}\n\
          \        promised = 0\n        m_cn = re.search(r'([两二三四五六七八九十])\\s*[家款个大类种条篇位]',\
          \ title)\n        if m_cn:\n            promised = cn_num.get(m_cn.group(1),\
          \ 0)\n        if not promised:\n            m_num = re.search(r'(\\d+)\\\
          s*[家款个大类种条篇位]', title)\n            if m_num:\n                promised\
          \ = int(m_num.group(1))\n        if promised >= 2:\n            actual_h3\
          \ = len(re.findall(r'<h3[^>]*>', content, re.I))\n            if actual_h3\
          \ < promised:\n                issues.append(f'[截断]标题承诺{promised}个条目但正文只有{actual_h3}个h3:内容不完整,需要补全或重新生成')\n\
          \n    # 4. 末尾不是完整HTML标签\n    if content.rstrip() and not re.search(r'</(?:p|ul|ol|h[1-4]|div|table)>\\\
          s*$', content.rstrip(), re.I):\n        issues.append('[截断]正文未以完整HTML标签结尾:输出可能在中间被截断')\n\
          \n    # 5. JSON层面：原始文本花括号不配对\n    if raw:\n        brace_open = raw.count('{')\n\
          \        brace_close = raw.count('}')\n        if brace_open > brace_close\
          \ + 1:\n            issues.append(f'[截断]JSON花括号不配对(开{brace_open}/闭{brace_close}):生文输出JSON未闭合')\n\
          \n    return issues"
