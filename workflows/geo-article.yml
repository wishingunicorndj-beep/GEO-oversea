            \ (含品牌名的原始关键词)提取品牌简称\n  2. 把每个 `[____]` 替换为你认为最合适的创意内容, 可以用:\n     - 用户画像:\
            \ 企业主/市场负责人/采购负责人/运营总监/新手...\n     - 搜索场景: 选型前/预算规划季/大促前/项目启动前/年度采购季...\n\
            \     - 数字钩子: 5大/7项/3个核心/10条/8大关键...\n     - 意图词: 避坑/深度对比/费用盘点/口碑分析/真实评价/干货整理...\n\
            \     - 情感钩子: 不踩坑/省心/不花冤枉钱/靠谱/一文看懂...\n     - 时间: 2026/最新/今年/近期...\n \
            \    - 行业热点: 根据知识库和大纲内容自由发挥\n     - 或者任何你觉得合适的词, 不限于以上角度\n  3. 也可以删掉某个\
