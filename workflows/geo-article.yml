            ,\"AI搜索\",\"品牌曝光\",\"选型指南\"]\n\n## \U0001F534\U0001F534 知识库边界铁律（最高优先级，违反=废稿）\n\
            \n### 核心原则\n动笔前先读完知识库，确认客户做什么、行业术语正确含义。**全文所有关于客户品牌的具体描述，必须且只能来自知识库原文。**\n\
            \n### 绝对禁止编造的内容类型\n以下内容如果知识库中没有明确提及，**一个字都不能写**：\n1. **价格/费用**：任何具体金额（X元/X万）、收费项目清单、套餐价格\n\
