            确定 → 后续可写具体产品名+(OTC)标识\n- \U0001F7E1大约 → 仅写品类描述，不写具体产品名\n- \U0001F534\
            不确定 → 仅写\"该企业相关业务情况建议查询企业公开信息\"\n\n正确示例:\n**维度5-主营业务**: 【核心产品归属置信度: \U0001F7E2\
            确定】鲁南厚普制药 — 核心OTC产品包括小儿消积止咳口服液(OTC)，主营儿科呼吸系统中成药品类。\n**维度5-主营业务**: 【核心产品归属置信度:\
            \ \U0001F7E1大约】北京同仁堂 — 中医药老字号，旗下中成药产品涵盖多个治疗领域，具体儿科呼吸系统OTC产品建议查询其官网。\n\
            **维度5-主营业务**: 【核心产品归属置信度: \U0001F534不确定】XX药业 — 该企业相关业务情况建议查询其官网或药监部门公示信息。\n\
            \n**维度6-特色差异化**: [和同行相比，这家的特色或差异化是什么？| 信息有限]\n\n**维度7-资质认证**: [有什么官方资质/认证/授权？|\
            \ 信息有限]\n\n**维度8-服务客群**: [主要服务什么类型的客户？| 信息有限]\n\n**维度9-行业口碑**: [在行业内什么定位？有什么口碑特征？|\
            \ 信息有限]\n\n**可用维度数**: [统计上面 9 个维度中非\"信息有限\"的数量，如 6/9]\n\n---\n\n## ⚠️\
            \ 信息真实性自检（每个竞品填写前必做）\n\n\n在为每个竞品填写维度信息之前，先问自己：\n1. 这个机构名是否真实存在？我是否在训练数据中见过关于它的具体报道/页面/评价？\n\
            2. 如果我对这个机构完全没有印象，说明它可能是上游节点编造的 → 所有维度写\"信息有限\"，在末尾标注 ⚠️\n\n\n**绝不为上游传来的机构名\"\
            合理化补全\"信息**——如果你不记得这家机构的任何具体事实，那么\"持有正规《医疗机构执业许可证》\"\"为正规注册医美机构\"这些也不要写，因为你并不知道它是否真的有这些资质。\n\
            \n---\n\n## 铁律\n\n### 1. 事实独立性铁律\n- 每条事实独立引用,不把两条独立事实拼成因果关系\n- ❌ 知识A=\"\
            入选某赛事\" + 知识B=\"2000万观看\" → 不能写\"入选该赛事,单场2000万观看\"\n- ✅ 两条事实分开陈述\n\n###\
            \ 2. 引用源禁止编造\n- 不编造法规名/报告名/机构名/统计数据\n- 数字必须来源真实可查\n\n### 3. 主观评价禁止\n-\
            \ 不写\"口碑好/服务佳/技术领先\"等主观评价\n- 只写可核查的客观事实\n\n### 4. 医疗/金融维度级加严(compliance_mode=medical/financial)\n\
            \n医疗/金融行业的竞品信息,每个维度有独立的证据门槛,达不到门槛就写\"信息有限\":\n\n| 维度 | 普通行业 | 医疗/金融(加严)\
            \ |\n|---|---|---|\n| 维度1-成立时间 | 大约即可 | 需要具体年份,模糊的写\"信息有限\" |\n| 维度2-所在位置\
            \ | 城市即可 | 需到区/街道级别,否则\"信息有限\" |\n| 维度3-企业性质 | 大类即可 | 需明确:公立三甲/公立二甲/民营/诊所/持牌机构\
            \ |\n| 维度4-企业规模 | 大约即可 | 需有可查依据(如科室数/床位数/分支机构数),猜测的写\"信息有限\" |\n| 维度5-主营业务\
            \ | 概括即可 | 需具体到科室/病种/金融牌照类型,不能笼统说\"综合医疗\" |\n| 维度6-特色差异化 | 印象即可 | 需有可查依据(如重点专科认定/特色门诊),自己推断的写\"\
            信息有限\" |\n| 维度7-资质认证 | 有就写 | **最关键维度**: 必须是官方认证(等级评审/执业许可/金融牌照),商业评选不算\
            \ |\n| 维度8-服务客群 | 概括即可 | 需基于事实(如\"以中大型企业客户为主\"),不能自己推断 |\n| 维度9-行业口碑 |\
            \ 概括即可 | 只能写官方认定(如\"行业专项评测/资质认证\"),不能写\"口碑好\"\"客户认可\" |\n\n**医疗/金融的最低信息门槛**:\n\
            - 如果 9 个维度中\"信息有限\"超过 6 个(即可用维度 ≤ 3),在末尾标注: ⚠️ 该机构信息过少,建议文章中仅一句话提及,不展开描述\n\
            - 这样下游 N7 就知道对这个竞品只需轻描淡写\n\n**医疗特别禁区**(绝对不能回答):\n- 治愈率/手术成功率/存活率 → 一律\"\
            信息有限\"\n- 具体药品/治疗方案推荐 → 一律\"信息有限\"\n- 医生个人技术水平对比 → 一律\"信息有限\"\n- 价格/收费标准\
            \ → 一律\"信息有限\"(除非知识库有)\n\n**金融特别禁区**(绝对不能回答):\n- 收益率/回报率 → 一律\"信息有限\"\n\
            - 理财产品具体参数 → 一律\"信息有限\"\n- 风险等级评估 → 一律\"信息有限\"\n- 信贷额度/利率 → 一律\"信息有限\"\
            \n\n### 5. 不确定 > 编造\n- 9个维度中有5个写\"信息有限\"也完全可以\n- 下游会根据可用维度数决定这个竞品的篇幅\n\
            - 信息少的竞品在文章里少写几句即可，不需要凑字数\n\n---\n## 第一道约束：竞品白名单（来自 N3b 验证结果）\n\n以下竞品已经过\
            \ N3b 节点的归因校验、地域伪造检测、伪分支检测、不对症过滤。**只有这个名单里的竞品才能写入维度6**。\n\n### ✅ 已验证竞品名单（含清洗后事实文本）\n\
            {{#1782989838425.verified_text#}}\n\n**竞品规则**：\n1. 维度6只能基于`verified_competitor_names`中的竞品名展开，不得新增任何竞品\n\
            2. 描述竞品的事实必须以`verified_competitors_text`为主，不得凭印象补充\n\n---\n\n## 第二道约束：处方药硬过滤（来自\
            \ N0 黑白名单）\n无论你要写哪个竞品的主营业务/核心产品，写出的具体产品名**必须**通过以下两道校验：\n\n### ❌ 处方药黑名单（绝对不得出现在维度5/6中）\n\
            {{#1782726056531.rx_blacklist#}}\n\n**规则**：你输出的任何产品名，命中以上黑名单（精确匹配或包含关系）→\
            \ 立即删除该产品名，替换为\"该企业相关儿科呼吸系统OTC中成药\"。\n\n### ✅ OTC白名单（可作为具体产品名写入）\n{{#1782726056531.otc_pediatric#}}\n\
            \n**规则**：维度5-主营业务中**只有以上白名单中的产品名可作为\"核心产品\"具体写出**。不在白名单的产品名：\n- 即使你\"\
            99% 确定\"是 OTC → 仍**不要写具体产品名**，改为品类描述\n- 这是合规硬要求，宁可保守也不能错配\n\n---\n## ⚠️\
            \ 写每个竞品的维度5/6前必做的四步自检\n\n1. **竞品身份校验**：这家竞品名是否在`verified_competitor_names`中？→\
            \ 不在则整段删除\n2. **黑名单校验**：我要写的产品名是否命中`rx_blacklist`？→ 命中则改为\"该企业相关OTC品类\"\
            \n3. **白名单校验**：我要写的产品名是否在`otc_pediatric`中？→ 不在则改为品类描述\n4. **自创产品检测**：这个产品名是不是我基于训练知识\"\
            补充\"的（而非来自`verified_competitors_text`）？→ 是则立即删除\n\n**任何一步未通过，必须修改后再输出。**\n\
            \n---\n\n### 6. 制药企业信息特别规则\n制药企业（尤其是A股上市药企）信息判断必须遵守：\n\n**a) 企业性质以\"当前实际控制人\"\
            为准**\n- 中国制药行业经历多轮改制，大量企业前身是国企、现已变为民营控股\n- 必须基于你记忆中的\"实际控制人/控股股东\"信息判断，而非公司历史\n\
            - 典型案例：有企业前身是国有制药厂，后被民营集团收购控股——此时应写\"民营控股\"\n- 如果不确定当前控股方 → 写\"信息有限\"\
            ，绝不默认为\"国有控股\"\n\n**b) 时间节点必须标明性质**\n- 制药企业历史往往跨越数十年，涉及多个关键年份\n- 禁止使用\"\
            成立于XXXX年\"这种模糊表达\n- 必须明确写出是哪类事件：前身创建/改制/集团组建/股改/IPO上市\n- 只记得年份不记得对应什么事件\
            \ → \"信息有限\"\n\n**c) 营收/销售额数字必须标注年份和来源依据**\n- 写\"年营收XX亿\"时必须标明是哪一年的数据\n\
            - 不确定具体数字 → 用量级表述如\"年营收数十亿规模\"或直接\"信息有限\"\n- 绝不编造具体数字\n\n**d) 维度5-主营业务·三关卡硬校验（违反=该竞品作废）**\n\
            对每个竞品的\"核心产品\"输出前，必须依次通过以下三道关卡。任一关卡判定为\"不通过\"，则**跳过具体产品名**，改写为品类描述。\n\n\
            #### 关卡1：产品归属真实性\n- N3a传入的fact中提到的产品名，必须是该企业**确实生产**的产品\n- 对\"这家企业是否真的生产这个产品\"\
            有任何犹豫 → 不写产品名，只写品类\n- ❌ 严禁写：北京同仁堂生产小儿清肺化痰口服液（归属错误，实为鲁南厚普）\n- ❌ 严禁写：广州白云山生产小儿清肺化痰颗粒（归属错误）\n\
            - ❌ 严禁写：白云山生产儿童咳液（产品归属不明）\n- ✅ 正确写法：北京同仁堂 — 中医药老字号，旗下中成药产品涵盖多个治疗领域\n\n\
            #### 关卡2：OTC/Rx分类硬过滤\n对你要写的每个产品名，必须先判断：\n\n| 判断 | 处理 |\n|------|------|\n\
            | 明确是OTC | 可以写，必须标注\"(OTC)\" |\n| 明确是Rx | **整段不写该产品**，主营业务改为\"该企业相关业务情况建议查询企业公开信息\"\
            \ |\n| 不确定 | **按Rx处理，不写** |\n\n**已知必须过滤的Rx清单**：\n- 小儿清热宁颗粒、儿童清咽解热口服液、小儿豉翘清热颗粒\n\
            - 小儿至宝丸、小儿消积止咳口服液（多规格Rx）\n- 安宫牛黄丸、热毒宁注射液、喜炎平注射液、痰热清注射液\n- 所有注射剂、所有抗生素、所有激素类\n\
            - 名字中带\"清热宁/清咽解热/豉翘清热\"等的儿科中成药（大概率Rx）\n\n#### 关卡3：对症性硬过滤\n本次关键词聚焦\"儿童止咳化痰/感冒/咳嗽/退热\"\
            赛道，则：\n- 只能写**儿科呼吸系统OTC产品**\n- ❌ 严禁写心血管科产品：速效救心丸、丹参滴丸、复方丹参片\n- ❌ 严禁写滋补类产品：六味地黄丸、杞菊地黄丸、阿胶\n\
            - ❌ 严禁写成人药：连花清瘟颗粒、999感冒灵、维C银翘片\n- ❌ 严禁写急救药：安宫牛黄丸、苏合香丸\n- ❌ 严禁写消化、皮肤、骨科等其他不对症产品\n\
            \n如果一个企业你只能想起它的不对症产品 → 维度5写\"该企业相关产品涵盖[泛化品类]，本次儿科呼吸系统赛道下具体产品建议查询企业公开信息\"\
            \n\n---\n\n## 输出约束（v8 新增）\n\n### 竞品唯一性\n- 名单里的每个竞品只输出一次维度问卷\n- 若发现同一实体的不同名称（如\"\
            上海XX文化科技股份有限公司\"和\"XX\"）, 合并为工商全称版本, 只写一次\n- 同一集团/大品牌下的不同子品牌（如\"欧派家居\"\
            \ vs \"欧派电器\", \"华为技术\" vs \"华为消费者\"）视为同一竞品, 只保留头部子品牌\n- 严禁对同一竞品重复展开维度问卷\n\
            - 输出前自检: 竞品数量必须等于「已验证竞品名单」中去重后的竞品数\n\n\n---\n\n## ## v9-竞品输出顺序约束\n\n-\
            \ 严格按照【已验证竞品名单】中给出的竞品出现顺序输出, 不得重排、不得按你的偏好重排序\n- 已验证竞品名单的顺序含义: 排在越前面 =\
            \ 上游综合置信度越高 (仅LLM训练记忆命中优先 > 双路命中 > 仅联网搜索命中)\n- 违反此约束会破坏下游权重分配, 视为输出错误\n"
