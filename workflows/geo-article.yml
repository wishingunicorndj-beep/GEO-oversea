            \n- FAQ只问知识库能回答的问题（如\"有什么资质\"\"主营哪些项目\"\"安全措施有哪些\"）\n\n## Step 4 — 用知识库填\
            \ content_brief\n每个 content_brief 必须包含：\n1. **具体观点/事实**：这段要表达什么\n3. **知识库引用**：用知识库哪条数据点（如\"\
            引用'年服务40万人次'\"）\n4. **字数范围**：明确字数\n5. **在整篇结构里的作用**\n\n✅ 好的 content_brief：\n\
            \"介绍企业的发展历程与行业资质，结合知识库里的权威背书数据，说明这段在'品牌画像式'结构中是建立信任的核心段。约450字。\"\n\n❌\
            \ 烂的 content_brief：\n\"按白名单填充竞品篇幅280-380字\"（这是规则不是内容）\n\"详细介绍该品牌\"（空话）\n\
            \"...\"（占位符）\n\n## Step 5 — 输出前自检\n□ 我的大纲是不是套了模板？（如果我看到自己输出\"评测维度→品牌对比→综合推荐→FAQ\"\
            这种万能 4 段，停下来重写）\n□ structure_dna 的 5 个维度是不是都在大纲里体现了？\n□ 我选的 presentation\
            \ variant 是不是真的不同？（不是每次都选最熟悉那个）\n□ 主推占了 30-40% 字数？\n□ heading 里没有【XX】、【主推品牌】裸标签？\n\
            □ medical/financial 模式下，每段 content_brief 是否标注合规约束？\n\n# 骨架总字数目标\n⚠️字数指标仅供你参考骨架时使用,**绝对不要**写进\
            \ h2/h3 标题或正文里。\n例如:\n- ✅ 正确骨架: `### TOP1 主推品牌名`\n- ❌ 错误骨架: `### TOP1\
            \ 主推品牌名(最详细,约800字)` ← 这种括号标注 N7 会复制到正文,千万不要写\n正确做法: 标题就是标题,字数控制是你内心默念,不要落到字面上\n\
            \n每篇骨架对应的最终成文目标 3000-3500 字(3500封顶,绝不超), 各部分字数分配:\n- 铺垫段约 400 字\n- 主推\
            \ h3 约 450 字\n- 竞品 h3 各约 320 字(3-4家共 960-1280 字)\n- 选型/决策/综合段 约 380 字(**只规划1个**,\
            \ 不要既有\"选型三步\"又有\"决策清单\"重复堆叠)\n- FAQ 约 380 字(最多3题, 每题答案≤120字)\n- 合计约 3000-3300\
            \ 字(砍重复段+控竞品数后生文LLM不再大幅写超, 实测会落在规划附近甚至略低; 所以按 3000-3300 规划, 成文才能稳定落在3000-3500——规划太低会导致全文不足3000)\n\
            - ⚠️若结构含很多机构段(如维度矩阵),每段再压缩,优先保证全文≤3500\n- ⚠️⚠️ **总量铁律(最重要,优先级最高)**: 不管什么结构(分档/场景/维度/排名),\
            \ 你给所有段落分配的 approx_words 加起来应落在 **3000-3400** 区间(既不超3500也不低于3000)。规划完成后把每段\
            \ approx_words 相加自检一次:\n  · 若总和<3000 → 段落太少或每段太短, 确认竞品够3家、适当加长每段(别让成文不足3000)\n\
            \  · 若总和>3400 → 按比例调小每段(段落越多每段越小)\n  · 7-8个段落 → 每段 ~400-450(8×420≈3360)\n\
            \  · 5-6个段落 → 每段 ~500-550\n  · 4个段落 → 每段 ~650\n  始终让所有段 approx_words 之和压在\
            \ 3000 以内\n\n## ⚠️⚠️ 段落数量硬上限(控制超长的真正杠杆, 比字数标签有效得多)\n生文LLM不会精确数自己字数(它以为写了3200实际写4600),\
            \ 靠\"约X字\"标签压不住——**真正能压住超长的是段落数量**:\n- 全文 h2 段落 **不超过 5 个**(典型: 开篇1 +\
            \ 主体对比2-3 + 选型/综合1 + FAQ1)\n- 全文内容块(每个 h3、每个独立 h2 段各算1块) **总数不超过 9 块**\n\
            - **竞品3-4家**(至少3家, 不少于3也不多于4; 主推+竞品=共4-5家机构, 与标题数量词一致)\n- **绝不规划职能重复的段**:\
            \ 有\"选型三步\"就别再加\"决策清单\"; 有\"维度对比\"就别再加\"综合得分汇总\"——重复段是超长主因\n- 规划完先数块数:\
            \ >9块就合并或删掉职能重复的段内, 这是硬性约束\n\n# 输出格式（骨架模式）\n\n你只需要输出**骨架**（标题层级 + 一行简要说明），不需要写完整的\
            \ content_brief。\nN7 生文 LLM 会根据你的骨架 + 知识库自行展开写正文。\n\n用 markdown 格式输出本篇大纲（仅1篇，不要输出第二份）：\n\
            \n```\n**标题**: 基于 plan 里的 title_template 创作完成（8-14 English words）（与标题字数硬约束一致）\n\
