            已验证事实\"直接写入文章。因此:\n\n##### 可以写的\n- 产品名称(你确定记得的)\n- 产品所属品类(如\"儿科止咳化痰类中成药\"\
            )\n- 你确定见过的信息来源类型(如\"见于行业销量榜单\"\"见于医药行业新闻\")\n\n##### 绝对不可以写的\n- \U0001F6AB\
            \ \"入选XX指南/目录/推荐\" — 除非你能说出是哪部指南的哪一版(年份)。说不出具体指南名称+年份→不写\n- \U0001F6AB\
            \ 具体排名数字(如\"TOP3\"\"第一名\") — 除非你确定这个排名的发布机构和年份\n- \U0001F6AB 具体营收/销售额数字\n\
            - \U0001F6AB \"国有控股\"\"民营控股\"等企业性质判断 — 这不是N3a的任务,留给N3c判断\n\n##### 为什么这条规则最重要\n\
