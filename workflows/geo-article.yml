            \ to Answer Before Buying AI Search Optimization Services\"\n\n**title_style\
            \ = \"review\"(性能评测类)**: 测评风\n- 可用: 测评/评测/能力对比/维度拆解\n- 例: \"Core Capability\
            \ Criteria for GEO Service Providers\"\n\n**title_style = \"knowledge\"\
            (知识科普类)**: 科普风\n- 用: 什么是/趋势/解读/全景\n- 例: \"Key Trends in Generative Search\
            \ Optimization for 2026\"\n\n通用(所有风格): 不含必看/必读/亲测/不踩坑/干货/收藏/攻略 等纯叫卖词\n\
            \n## 标题数量一致性铁律(违反=废稿)\n- 标题中出现的数字/数量词(TOP5/三家/五大等)必须与正文实际列出的机构/竞品数量**完全一致**\n\
