          \ or '').strip()\n    if text.startswith('```'): \n        text = re.sub(r'^```[a-zA-Z]*\\\
          s*', '', text)\n        text = re.sub(r'\\s*```$', '', text)\n    return\
          \ text.strip()\n\ndef _extract_json(text):\n    text = _strip_fence(text)\n\
          \    try:\n        obj = json.loads(text)\n        return obj if isinstance(obj,\
          \ dict) else {}\n    except Exception:\n        pass\n    start = text.find('{')\n\
          \    end = text.rfind('}')\n    if start >= 0 and end > start:\n       \
          \ try:\n            obj = json.loads(text[start:end+1])\n            return\
          \ obj if isinstance(obj, dict) else {}\n        except Exception:\n    \
          \        return {}\n    return {}\n\ndef _as_tags(value):\n    if isinstance(value,\
          \ list):\n        return [str(x) for x in value if str(x).strip()][:5]\n\
          \    if value:\n        return [str(value).strip()][:5]\n    return []\n\
          \ndef main(english_text='', fallback_obj=None):\n    data = _extract_json(english_text)\n\
          \    if not data and isinstance(fallback_obj, dict):\n        data = fallback_obj\n\
          \    title = str(data.get('title') or '').strip()\n    content = str(data.get('content')\
          \ or '').strip()\n    description = str(data.get('description') or '').strip()\n\
