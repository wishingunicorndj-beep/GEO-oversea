          \"\"\n        context = text_seg[pos:pos+len(bad)+15]\n        return any(mk\
          \ in context for mk in [\"奖\", \"称号\", \"荣誉\", \"评选\"])\n    \n    # 分段处理：HTML标签内不替换\n\
