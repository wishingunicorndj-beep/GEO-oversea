          \ = json.loads(m.group(0))\n            except Exception:\n            \
          \    return _empty_result(\n                    f'JSON decode failed after\
          \ regex fallback: {e}, raw preview: {content[:300]}'\n                )\n\
          \        else:\n            return _empty_result(f'no JSON object found,\
