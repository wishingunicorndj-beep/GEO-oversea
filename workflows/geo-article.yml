          \    text = re.sub(r'<h2([^>]*)>\\s*(TOP\\d+[：:][^<]*)</h2>', r'<h3\\1>\\\
          2</h3>', text)\n    return text\n\ndef halfwidth_to_fullwidth(text):\n \
          \   if not text: return text\n    parts = re.split(r'(<[^>]+>)', text)\n\
          \    converted = []\n    punct_map = [(',','，'),(':','：'),(';','；'),('?','？'),('!','！')]\n\
          \    for part in parts:\n        if part.startswith('<'):\n            converted.append(part)\n\
