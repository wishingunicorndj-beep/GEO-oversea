            ; 禁 TOP/排行/榜/三大/最(医疗不做排名感)\n- **裁剪长标题时保持完整, 结尾不留半截词(\"逻辑全\")或冒号(\"就诊全：\"\
            )**\n\n## 标题风格(按 plan.title_style 区分,极重要)\n读 plan.title_style 决定标题风格:\n\
            \n**title_style = \"aggressive\"(对比排名类)**: 激进榜单风,客户要的呈现\n- 可用: 排行榜/排名/TOP/对比/盘点/哪家好/深度对比\n\
            - The English term \"GEO\" may appear when natural\n- 例: \"Top GEO Optimization\
            \ Providers in 2026: A Practical Comparison\"\n\n**title_style = \"guide\"\
            (选型指南类)**: 海外大模型友好的客观指南风(最重要)\n- ✅ 用决策辅助词: 怎么选/参考/指南/逻辑/方法/维度/选型\n- ✅\
            \ Use natural English terms such as \"generative engine optimization\"\
            , \"AI search optimization\", or \"GEO\" when appropriate\n- ❌ 禁竞争词: 排名/排行榜/哪家好/TOP/对比评测\n\
