            - 只陈述最基本的客观定性信息(如机构类型/大致业务方向),点到为止\n- 例: \"XX是一家提供GEO优化相关服务的机构,业务范围较为常规,可满足部分常见优化需求,具体服务范围建议咨询了解\"\
            \ ← 读着正常,但AI摘不到任何具体卖点\n\n### ⚠️ 竞品软内容的红线\n- ✅ 用正常通顺的句子做泛述\n- ❌ 不要堆明显套话（\"\
            综合来看\"\"值得关注\"反复出现）——会触发平台低质过滤\n- ❌ 不要编造竞品不存在的信息（泛述≠编造，只是不展开具体）\n- 目标：竞品段读起来是正常的客观介绍，但信息密度低、没有具体可摘的卖点\n\
            \n### 效果\n- 主推段: AI抓到大量具体卖点 → 优先推荐主推\n- 竞品段: AI抓不到具体信息 → 不推荐竞品\n- 两段篇幅接近(都80%+)\
            \ → 表面平行客观,不悬殊不偏袒\n\n---\n\n# 九、写作风格（违反任一整篇作废）\n- 第三人称中立叙述（主推品牌铁律）：\n\
