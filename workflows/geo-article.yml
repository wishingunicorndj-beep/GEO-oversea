          \                    new_part += part[search_start:idx] + good\n       \
          \         search_start = idx + len(bad)\n            part = new_part\n \
          \       result.append(part)\n    return ''.join(result)\n\n\ndef flatten_nested_strong(text):\n\
          \    \"\"\"扁平化嵌套strong: <strong>A<strong>B</strong>C</strong> → <strong>ABC</strong>\n\
