          def compliance_word_replace(text, mode, kb_text=\"\"):\n    \"\"\"按合规模式替换违禁词。知识库原文中出现的内容不替换\
          \ —— 但下方\"无条件正则\"例外: 医疗/金融的数字类硬性违规即使来自知识库也强制改。\"\"\"\n    if not text: return\
          \ text\n\n    # === 无条件正则(广告法硬性, 不受\"知识库保护\"豁免) ===\n    # 用\"特征\"匹配而非死记词:\
          \ 锚定 数字%/快 等可识别信号, 抓全所有变体, 不堆字符串\n    if mode in ('medical', 'financial'):\n\
          \        # ① 任何\"疗效/准确率/治愈率+数字%\"——断言诊疗效果\n        text = re.sub(r'(?:诊断准确率|治愈率|有效率|好转率|康复率)[在达到约为]*\\\
          s*\\d+\\.?\\d*\\s*%?\\s*以?上?', '积累了较多临床经验', text)\n        # ② 任何\"报销/可报/可达+数字%\"\
          ——医保报销比例夸大\n        text = re.sub(r'(?:报销比例|可按政策报销|可报|报销|可达)[^，。、,；]{0,4}\\\
          d+\\.?\\d*\\s*%', '符合政策的费用可按规定报销', text)\n        # ③ 恢复快/恢复速度(较)快——隐性疗效(含加\"\
          较/相对\"的变体)\n        text = re.sub(r'恢复(?:速度)?[较相对]*快', '恢复时间因人而异', text)\n\
          \n    replacements = list(COMMON_BANNED)\n    if mode == 'medical':\n  \
          \      replacements = list(MEDICAL_BANNED) + replacements\n    elif mode\
          \ == 'financial':\n        replacements = list(FINANCIAL_BANNED) + replacements\n\
          \n    replacements.sort(key=lambda x: len(x[0]), reverse=True)\n\n    #\
          \ 构建知识库白名单：对每个违禁词，找出知识库中包含它的上下文片段\n    kb_protected = set()\n    if kb_text:\n\
          \        for bad, _ in replacements:\n            idx = 0\n            while\
