          \"\"\n    if not text: return text\n    # 统一HTML标签名小写(治 <P>/<H2>/<DIV> 等大写乱码),\
          \ 保留属性\n    text = re.sub(r'<(/?)([a-zA-Z][a-zA-Z0-9]*)', lambda m: '<'+m.group(1)+m.group(2).lower(),\
