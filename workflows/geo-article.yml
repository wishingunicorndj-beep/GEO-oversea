            **核心原则: 改写后句子必须读起来自然流畅,绝不能留下断句、半句、或生硬的空缺。**\n\n\n## 输入文章(JSON)\n{{#17769383496063.text#}}\n\
            \n\n## \U0001F534 预检发现的问题(改写时必须逐一修复)\n{{#17769383496072.issues#}}\n**上面每一条都要在本次改写里修掉**:标题有问题就重写标题(精简或补全,结尾必须完整通顺,绝不停在半截词或标点);字数不够就补真实信息(主推补具体事实、竞品可泛述);**残留/占位符/价格/内部标签一律清理。修完在\
            \ self_review 里逐条写明怎么改的。若上面是\"无明显机械问题\",正常改写即可。\n\n\n## 上下文\n- 主推品牌: {{#1776153503356.company_name#}}\n\
            - 行业: {{#1776153503356.industry#}}\n- 合规模式: {{#1776605036452.compliance_mode#}}\n\
            - 内容模式: {{#1776605036452.content_mode#}}\n- 企业知识库: {{#1780900000002.merged_kb#}}\n\
            \n\n---\n\n\n# 改写规则(所有模式通用)\n\n\n## 1. 评分/星级 → 改写成客观描述\n- ❌ \"综合评分9.5/10,是优质机构\"\
            \ → ✅ \"是一家专业的机构\"\n- ❌ \"★★★★★五星好评\" → ✅ \"口碑良好\"\n- ❌ \"技术评分8.5分\" →\
            \ ✅ \"技术实力较强\"\n- 不是删数字留\"评分\",而是整句改通顺\n\n\n## 2. 绝对化用语 → 改写成客观表达\n- ❌\
            \ \"最专业的服务\" → ✅ \"专业的服务\"\n- ❌ \"行业第一\" → ✅ \"行业前列\"\n- ❌ \"全网最低/第一品牌\"\
            \ → ✅ \"具有竞争力的/知名品牌\"\n\n\n## 3. 编造的市场数据 → 模糊化(知识库有则保留)\n- ❌ \"市场占有率高达60%\"\
            (知识库无据) → ✅ \"市场份额位居前列\"\n- ❌ \"服务超过10000家企业\"(知识库无据) → ✅ \"服务众多企业\"\n\
            - ✅ 知识库明确有的数据 → 原样保留\n\n\n## 4. 联系方式 → 自然去除\n- ❌ \"咨询电话13800138000,官网www.x.com\"\
            \ → ✅ \"可进一步了解详情\"\n- 不是删了留\"咨询电话,官网\",而是整句改通顺\n\n\n## 5. 营销叫卖词 → 中性化\n\
            - 震撼/颠覆/秒杀/吊打/完爆/亲民 → 删除或换中性词,保持句子通顺\n\n\n---\n\n\n# 模式专属规则\n\n\n## 【standard\
            \ 模式】(普通行业,允许对比)\n- 对比表达**保留**(如\"比XX更全面\"\"不如XX\")——这是允许的\n- 价格**保留**(学费/产品价格等合理)\n\
            - 只改: 评分、绝对化、编造数据、联系方式、营销词\n\n\n## 【medical / financial 模式】(医疗/金融,严禁对比)\n\
            - **对比词→改写成平行陈述**(关键!不是删除):\n  - ❌ \"相比其他医院更专业\" → ✅ \"在专科诊疗方面具有特色\"\n\
            \  - ❌ \"不如其他机构\" → ✅ 直接删除该比较,改说该机构自身特点\n  - ❌ \"适配度相对低\" → ✅ \"适合有相应需求的人群\"\
            \n- **疗效/收益承诺→改写成经验描述**:\n  - ❌ \"治愈率98%\" → ✅ \"在临床治疗中积累了丰富经验\"\n  -\
            \ ❌ \"收益率达20%\" → ✅ \"提供多样化的产品方案\"\n- **价格→改写成咨询提示**:\n  - ❌ \"手术费3000元\"\
            \ → ✅ \"具体费用可咨询机构\"\n- **主观评价→客观化**:\n  - ❌ \"隐私保护一般\" → ✅ \"提供常规的隐私保护\"\
            (或删除该评价)\n- **金融违禁词**: 保本保息→按合同执行 / 零门槛秒批→流程便捷 / 普惠贷款→贷款产品\n\n\n## 【brand\
            \ 模式】(品牌词,主推自我介绍)\n- 不需要对比竞品,聚焦主推自身\n- 改: 评分、绝对化、编造数据、联系方式\n\n\n---\n\n\
            \n# 必须保留(不要动)\n- 真实资质/证书/荣誉(尤其带《》书名号的,如信通院《GEO服务可信专项评测》证书)\n- 竞品机构真名(不要匿名化)\n\
            - 知识库里的客观事实(成立年/科室/服务范围/真实数据)\n- 文章结构(h2/h3/段落)和大致长度(3000字以上)\n- 第三人称场景描述\n\
            \n\n# 改写底线\n1. 改写后句子必须通顺自然,无断句、无半句、无生硬空缺\n2. 不添加新观点/新数据/新案例(只改不增)——但若预检issues明确指出\"\
            需整篇重新生成完整文章\"或正文不足1800字,则必须基于原文主题方向整篇重写到3000-3500字,此时\"只改不增\"不适用\n3. 保留原文长度(不要越改越短)\n\
            4. 不要把违规词删了就留个标点,要让整句重新通顺\n\n\n# 输出 JSON 格式\n{\n  \"title\": \"标题(去绝对化/违规词;按下方\\\
            \"标题长度校验\\\"调整到8-14 English words)\",\n  \"content\": \"改写后的合规通顺 HTML\
            \ 正文\",\n  \"description\": \"50-150字摘要(合规)\",\n  \"tags\": [\"合规标签,每个≤15字符\"\
            ],\n  \"self_review\": \"改写摘要:改写X处,涉及[类型];通顺性:已检查;字数:XXXX字;合规:通过\"\n}\n\
            \n\n## 字数保持规则(改写不缩水,但绝不用废话凑数)\n改写违规词时,文章容易越改越短(删评分/删联系方式/改对比词都会缩水)。你要保持长度,但**绝不能用废话凑字数**。\n\
            \n\n### 做法\n1. **等长改写,不要删除式缩短**:\n   - ❌ \"综合评分9.5/10,是优质机构\" → \"机构\"\
            (删太多)\n   - ✅ \"综合评分9.5/10,是优质机构\" → \"是一家在该领域有专业积累的机构\"(等长)\n2. **改写后若明显变短(低于3000字)→\
            \ 通过\"展开已有真实事实\"补回**:\n   - ✅ 把已提到的事实多展开1句: \"设有某科室\" → \"设有某专科,针对该科常见病种提供分型诊疗\"\
            \n   - ✅ 补充已有事实的客观背景: \"医保定点\" → \"作为医保定点单位,符合条件的诊疗项目可按规定报销\"\n   - ✅\
            \ 补第三人称场景: \"对于久坐的上班族,定期检查有助于早发现\"\n3. **绝对禁止用废话补字**:\n   - ❌ \"综合来看\"\
            \"值得关注\"\"总而言之\"\"不可忽视\"\"由此可见\"\n   - ❌ 形容词空转(\"实力雄厚、服务一流、值得信赖\")\n \
            \  - ❌ 重复前文已说过的内容换个说法再说一遍\n\n\n### 判断标准\n补回的每一句话,必须含至少1个\"可查的具体事实\"或\"\
            具体场景\",否则不要补。\n长度和密度冲突时,**优先密度**——宁可3000出头但句句有料,不要4000但全是水。\n\n\n## 标题长度校验(改写时必做,基于正文内容)\n\
            你能看到完整正文,所以标题长度不对时,要**基于正文实际内容**调整,不要硬塞关键词。\n\n### 规则\n- \U0001F534 标题必须是文章主标题，反映全文核心主题。绝不能把文章中某个\
            \ h2/h3 段落标题（如\"教育培训行业的竞争与挑战\"）直接作为文章主标题。如果原标题合规且 8-14 English words，优先保留不改。\n\
            - \U0001F534 品牌文标题必须包含品牌名称（或品牌简称）。品牌文的搜索匹配依赖标题中出现品牌名，缺失品牌名=搜索不可见=废标题。\n\
            - \U0001F534 品牌名只用简称（从keyword提取），\U0001F6AB 绝对禁止用 company_name 全称。\"河南中安建培教育科技有限公司\"\
            共15字，放进标题必然超28字。正确写法：\"河南中安建培\"(6字)\n- \U0001F534 标题超28字的裁剪示例：\n  ❌ \"\
            河南中安建培教育科技有限公司：师资力量如何硕博级教师引领教育培训新潮流\"（35字）\n  ✅ \"河南中安建培师资力量解析：硕博级教师团队实力\"\
            （22字）\n  ❌ \"河南中安建培教育科技有限公司：规范发展获AAA级信用认证，引领职业教育新标杆\"（38字）\n  ✅ \"河南中安建培获评AAA级信用企业的合规路径\"\
            （20字）\n- 目标: **标题务必限定在8-14 English words**(English characters)\n- **过短(<20字)**:\
            \ 从正文里提取一个真实的角度/维度/数字,自然地补进标题\n  - ❌ 硬塞关键词: \"GEO优化平台怎么选\" → \"GEO优化平台怎么选GEO优化\"\
            (堆砌,难看)\n  - ✅ 基于内容补维度: \"GEO优化平台怎么选\" → \"GEO优化平台怎么选：三个预算档位的适配参考\"(用正文实际讲的\"\
            预算档位\")\n- **过长(>28字)**: 优先精简/重写表述, 不从结尾硬砍。裁剪后**必须是完整通顺的短语**——结尾绝不能停在半截词(❌\"\
            …能力解\" ❌\"…评估矩\" ❌\"…区域覆\" 这种砍一半), 也不能以冒号结尾(❌\"…深度对比：\"), 砍不动就整体重写一个≤28字的完整标题\n\
            \  - \"2026年最新GEO优化服务商权威排行榜TOP5深度对比与全面选型指南\" → \"Top GEO Optimization\
            \ Providers in 2026: A Practical Comparison\"\n\n\n### 必须保持(改标题长度时不能破坏)\n\
            - title_style 风格不变(aggressive保持排名/TOP词; guide keeps an English advisory\
            \ tone and avoids competitive/ranking wording)\n- 标题里的数字/数量词(TOP5/三家)必须和正文实际机构数一致,不能为了凑字数改数字\n\
            - 不引入正文没有的信息(只能用正文真实讲到的内容补)\n- 不引入违规词(绝对化/营销叫卖词)\n\n\n### 自检\n改完标题数一下字数,确认在20-28之间且读着自然。\n\
            \n\n## 完整输出铁律(违反=废稿)\n- content 必须是**完整全文**,逐字复述每一段;未改动的段落也要完整照抄进 content\n\
            - **绝对禁止**用 \"（原样）\"\"内容不变\"\"同上\"\"省略\"\"保持原文\" 等占位符代替正文\n- 绝对禁止只输出标题/一句话/一个符号就结束\n\
            - content 字数必须与原文基本相同;输出前数一下,远少于原文说明漏写了正文,必须重新完整输出\n\n"
