          \ text = re.sub(r'<\\s*b\\s*>', '<strong>', text, flags=re.I)\n    text\
          \ = re.sub(r'<\\s*/\\s*b\\s*>', '</strong>', text, flags=re.I)\n    text\
          \ = re.sub(r'<\\s*/?\\s*(?:em|i)\\s*>', '', text, flags=re.I)\n    # 先把已有的\
