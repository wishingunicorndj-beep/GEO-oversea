        code: "import json\nimport re\nfrom typing import Any\n\n\ndef _extract_json_text(text:\
          \ str) -> str:\n    \"\"\"从 LLM 输出中提取合法 JSON 字符串，兼容 markdown code block\
          \ 包裹\"\"\"\n    if not text or not isinstance(text, str):\n        return\
          \ text\n\n    text = text.strip()\n\n    for pattern in [\n        r'```json\\\
          s*(\\{.*\\})\\s*```',\n        r'```\\s*(\\{.*\\})\\s*```',\n    ]:\n  \
          \      m = re.search(pattern, text, re.S)\n        if m:\n            return\
          \ m.group(1)\n\n    cleaned = text.replace(\"```json\", \"\").replace(\"\
          ```\", \"\").strip()\n    if cleaned.startswith(\"{\") or cleaned.startswith(\"\
          [\"):\n        return cleaned\n\n    brace_start = cleaned.find(\"{\")\n\
          \    if brace_start >= 0:\n        depth = 0\n        for i, ch in enumerate(cleaned[brace_start:],\
          \ brace_start):\n            if ch == \"{\":\n                depth += 1\n\
          \            elif ch == \"}\":\n                depth -= 1\n           \
          \     if depth == 0:\n                    return cleaned[brace_start : i\
          \ + 1]\n\n    return text\n\n\ndef _parse_article(text: Any) -> dict:\n\
          \    \"\"\"将单篇文章的 LLM 输出解析为 dict，兼容各种包裹格式\"\"\"\n    if isinstance(text,\
          \ dict):\n        return text\n\n    if not isinstance(text, str) or not\
          \ text.strip():\n        return {\"title\": \"\", \"content\": str(text\
          \ or \"\"), \"tags\": [], \"description\": \"\", \"self_review\": \"\"}\n\
          \n    json_text = _extract_json_text(text)\n\n    try:\n        article\
          \ = json.loads(json_text)\n        if isinstance(article, dict):\n     \
          \       return article\n    except (json.JSONDecodeError, TypeError):\n\
          \        pass\n\n    brace_start = json_text.find(\"{\")\n    if brace_start\
          \ > 0:\n        try:\n            article = json.loads(json_text[brace_start:])\n\
          \            if isinstance(article, dict):\n                return article\n\
          \        except (json.JSONDecodeError, TypeError):\n            pass\n\n\
          \    return {\"title\": \"\", \"content\": text, \"tags\": [], \"description\"\
          : \"\", \"self_review\": \"\"}\n\n\ndef _ensure_list(val: Any) -> list:\n\
          \    \"\"\"确保值为 list，兼容 Dify 传入 int/None/str 等非预期类型\"\"\"\n    if isinstance(val,\
          \ list):\n        return val\n    if isinstance(val, dict):\n        return\
          \ [val]\n    return []\n\n\ndef main(articles: list, merged_plans: list)\
          \ -> dict:\n    \"\"\"\n    合并所有分支的文章输出，通过 merged_plans 回填 compliance_mode。\n\
          \n    输入（仅2个，均始终可用）：\n      - articles: 变量聚合器收集的所有分支文章\n      - merged_plans:\
          \ 分流节点之前的完整计划列表\n    \"\"\"\n    articles = _ensure_list(articles)\n   \
          \ merged_plans = _ensure_list(merged_plans)\n\n    # 构建 keyword → plan 映射，用于回填\
          \ compliance_mode\n    plan_map = {}\n    for p in merged_plans:\n     \
          \   if isinstance(p, dict):\n            kw = p.get(\"keyword\", \"\")\n\
          \            if kw:\n                plan_map[kw] = p\n\n    all_articles\
          \ = []\n    for i, text in enumerate(articles):\n        article = _parse_article(text)\n\
          \n        # 优先：通过 keyword 匹配回填 compliance_mode\n        mode = \"standard\"\
          \n        art_title = article.get(\"title\", \"\")\n        for kw, plan\
          \ in plan_map.items():\n            # 去\"推荐/哪家好\"等后缀取核心词做模糊匹配\n        \
          \    core_kw = re.sub(r\"(推荐|哪家好|哪家值得选|怎么样|好不好)[？??]?$\", \"\", kw).strip()\n\
          \            if core_kw and core_kw in art_title:\n                mode\
          \ = plan.get(\"compliance_mode\", \"standard\")\n                break\n\
          \n        # 兜底：keyword 匹配不到时，按顺序从 merged_plans 分配\n        if mode == \"\
          standard\" and i < len(merged_plans):\n            plan = merged_plans[i]\n\
          \            if isinstance(plan, dict):\n                cm = plan.get(\"\
          compliance_mode\", \"standard\")\n                if cm in (\"medical\"\
          , \"financial\"):\n                    mode = cm\n\n        article[\"_compliance_mode\"\
          ] = mode\n        all_articles.append(article)\n\n    # 全局 compliance_mode：只要有一篇\
          \ medical/financial 就取之\n    global_mode = \"standard\"\n    for p in merged_plans:\n\
          \        if isinstance(p, dict):\n            cm = p.get(\"compliance_mode\"\
          , \"standard\")\n            if cm in (\"medical\", \"financial\"):\n  \
          \              global_mode = cm\n                break\n\n    return {\"\
          all_articles\": all_articles, \"compliance_mode\": global_mode}\n"
