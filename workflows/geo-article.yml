          \ dict):\n            body = body_parsed\n    if isinstance(body, dict)\
          \ and 'choices' in body:\n        choices = body.get('choices') or []\n\
          \        if choices and isinstance(choices, list):\n            content\
          \ = choices[0].get('message', {}).get('content', '')\n            if content:\n\
          \                return _parse_verify_item(content)\n    if 'choices' in\
          \ item and isinstance(item['choices'], list) and item['choices']:\n    \
          \    content = item['choices'][0].get('message', {}).get('content', '')\n\
          \        if content:\n            return _parse_verify_item(content)\n \
          \   return item\n\ndef _array_to_verified(verify_array):\n    kept = []\n\
          \    dropped = []\n    for it in _to_list(verify_array):\n        parsed\
          \ = _extract_content_from_response(_parse_verify_item(it))\n        if not\
          \ isinstance(parsed, dict):\n            continue\n        name = _to_str(parsed.get('name')).strip()\n\
          \        if not name:\n            continue\n        verified = parsed.get('verified')\n\
          \        if verified in (True, 'true', 'True', 1, '1'):\n            fact\
          \ = _to_str(parsed.get('fact')).strip()\n            urls = parsed.get('evidence_urls')\
          \ or []\n            if isinstance(urls, str):\n                urls = [urls]\n\
          \            if not isinstance(urls, list):\n                urls = []\n\
          \            urls = [u for u in urls if isinstance(u, str) and u.startswith('http')]\n\
          \            conf = _to_str(parsed.get('confidence') or 'medium').lower()\n\
          \            evidence_source = _to_str(parsed.get('evidence_source'))\n\
          \            location = _to_str(parsed.get('location'))\n            score\
          \ = parsed.get('score', 0)\n            kept.append({\n                'name':\
          \ name, 'fact': fact, 'urls': urls,\n                'source': evidence_source,\
          \ 'location': location, 'confidence': conf,\n                'score': score,\n\
          \            })\n        else:\n            reason = _to_str(parsed.get('reason')\
          \ or 'verify_failed')\n            dropped.append({'name': name, 'reason':\
          \ reason})\n    return kept, dropped\n\ndef main(verify_array=None, merged_list=None,\n\
          \         region='', keyword_pack='',\n         customer_name='', compliance_mode='standard',\
          \ kb_text='',\n         rx_blacklist=None, otc_whitelist=None,\n       \
          \  off_topic_products=None, rx_patterns=None,\n         known_competitors=''):\n\
          \    verify_array = _to_list(verify_array)\n    merged_list = _to_list(merged_list)\n\
          \    region = _to_str(region)\n    keyword_pack = _to_str(keyword_pack)\n\
          \    customer_name = _to_str(customer_name)\n    compliance_mode = _to_str(compliance_mode)\
          \ or 'standard'\n    kb_text = _to_str(kb_text)\n    rx_blacklist = _to_list(rx_blacklist)\n\
          \    otc_whitelist = _to_list(otc_whitelist)\n    off_topic_products = _to_dict(off_topic_products)\n\
          \    rx_patterns = _to_list(rx_patterns)\n    known_competitors = _to_str(known_competitors)\n\
          \n    verified_kept, verify_dropped = _array_to_verified(verify_array)\n\
          \n    merged_map = {}\n    for c in merged_list:\n        if isinstance(c,\
          \ dict):\n            nm = _to_str(c.get('name'))\n            if nm:\n\
          \                merged_map[nm] = c\n    for k in verified_kept:\n     \
          \   m = merged_map.get(k['name'])\n        if m:\n            if not k['urls']:\n\
          \                m_urls = m.get('evidence_urls') or []\n               \
          \ if isinstance(m_urls, list):\n                    k['urls'] = [u for u\
          \ in m_urls if isinstance(u, str) and u.startswith('http')]\n          \
          \  if not k['fact']:\n                k['fact'] = _to_str(m.get('fact'))\n\
          \            if not k['location']:\n                k['location'] = _to_str(m.get('location'))\n\
          \n    track_source = keyword_pack or kb_text\n    track = detect_track(track_source)\n\
          \    off_topic_set = set(_to_list(off_topic_products.get(track, [])))\n\n\
          \    known_list = []\n    if known_competitors:\n        for x in re.split(r'[、,,;;\\\
          s]+', known_competitors):\n            x = x.strip()\n            if x and\
          \ len(x) >= 2:\n                known_list.append(x)\n\n    brands = {}\n\
          \    for k in verified_kept:\n        conf = k['confidence'] if k['confidence']\
          \ in ('high', 'medium', 'low') else 'medium'\n        brands[k['name']]\
          \ = {\n            'fact': k['fact'],\n            'confidence': conf,\n\
          \            'count': 1,\n            'urls': k['urls'],\n            'source_platform':\
          \ k['source'],\n            'location': k['location'],\n            'score':\
          \ k.get('score', 0),\n        }\n\n    exclude_names = set()\n    if customer_name:\n\
          \        exclude_names.add(customer_name.strip())\n\n    verified = []\n\
          \n    # ==== v9-排序继承: 建立 merge sort_priority 索引 ====\n    _sort_pri_map\
