          \ text)\n    text = re.sub(r'(全球|全国|世界)第一(?!道|个|步|次|时间)', r'\\1前列', text)\n\
          \    return text\n\n\ndef normalize_punctuation(text):\n    \"\"\"清理删除操作留下的双标点/孤立标点\"\
          \"\"\n    if not text: return text\n    text = re.sub(r'[，,]\\s*[，,]+',\
          \ '，', text)\n    text = re.sub(r'[，,]\\s*[。.]', '。', text)\n    text =\
          \ re.sub(r'[。.]\\s*[，,]', '。', text)\n    text = re.sub(r'[，,]{2,}', '，',\
          \ text)\n    text = re.sub(r'[。.]{2,}', '。', text)\n    text = re.sub(r'([，,。.；;])\\\
          s*([，,。.；;]+)\\s*(?=<\\/)', r'\\2', text)\n    text = re.sub(r'(>)\\s*[，,。.；;]+\\\
          s*(<\\/)', r'\\1\\2', text)\n    text = re.sub(r'(?<=>)\\s*[，,；;]+', '',\
          \ text)\n    text = re.sub(r'([：:])\\s*[，,。.；;]+', r'\\1', text)\n    return\
          \ text\n\n\ndef clean_one(text, mode='standard', kb_text=''):\n    if not\
          \ text: return text\n    # 0a. 剥离代码块包裹(```json ... ```)和结尾自检清单泄漏(模型偶发把整段输出当JSON吐出,\
          \ 如#9)\n    text = re.sub(r'^\\s*```[a-zA-Z]*\\s*\\n?', '', text)\n    text\
          \ = re.sub(r'\\n?\\s*```\\s*$', '', text)\n    if re.search(r'符合guide|未编造任何数据|未使用h[1-6]|各段落字数平衡|不含营销词|标题不含营销',\
          \ text):\n        _tags = list(re.finditer(r'</(?:p|h[1-6]|ul|ol|li|strong|blockquote)>',\
          \ text))\n        if _tags:\n            text = text[:_tags[-1].end()] \
          \ # 截到最后一个合法闭合标签, 切掉尾部JSON/自检清单泄漏\n    # 0. 兜底: 剥离模型深度思考链<think>,并从畸形JSON里抠出HTML正文\n\
          \    if '<think>' in text or '</think>' in text:\n        text = re.sub(r'<think>.*?</think>',\
