            \ 从 plan 的 presentation_candidates 中提取，写明本篇从哪个画像/场景/意图角度切入主推介绍\n  - 知识库侧面选取:\
            \ 根据切入角度，从知识库里选取对应的 1-2 个侧面重点展开（不是每篇都把知识库全部信息堆上去）\n  - 示例：画像=市场负责人 → 重点展开服务能力+合规背书；场景=大促前\
