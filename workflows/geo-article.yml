            **排名方式**: ranking_approach（直接排名/维度+综合/场景下排名/区域/预算分档/问答中/决策步骤）\n\n**全文目标字数**:\
            \ 3000-3300字(硬上限3500)。下面每段都要标 (约X字), 必须照填, 且所有段「约X字」之和 ≤3300\n\n### 铺垫段\n\
