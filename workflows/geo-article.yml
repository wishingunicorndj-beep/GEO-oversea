    - data:
        code: "\"\"\"\n节点 7-5a：放在 7-4 LLM清洗之后（\"有问题\"分支）\n输入变量配置：\n  - n7_text → 7-1\
          \ AI生文节点的 text 输出\n  - clean_out → 7-4 LLM清洗节点的 text 输出\n输出变量：structured_output\
          \ (String/Object)\n\"\"\"\n\nimport re\nimport json as _json\n\ndef _strip_think(raw):\n\
          \    if not raw:\n        return ''\n    s = re.sub(r'<think>.*?</think>',\
          \ '', raw, flags=re.S | re.I)\n    if '</think>' in s:\n        s = s.split('</think>')[-1]\n\
          \    if '<think>' in s:\n        s = re.sub(r'<think>.*', '', s, flags=re.S\
          \ | re.I)\n    return s\n\ndef _extract_html(s):\n    if not s:\n      \
          \  return ''\n    m = re.search(r'<(?:p|h[1-4])[\\s>].*</(?:p|ul|ol|h[1-4])>',\
          \ s, flags=re.S | re.I)\n    return m.group(0).strip() if m else s.strip()\n\
          \n\n# === 递归统计全文字数 ===\ndef _count_full_text(article):\n    if not isinstance(article,\
          \ dict):\n        return 0\n    total = len(re.sub(r'<[^>]+>', '', str(article.get('content')\
          \ or '')))\n    for h2 in (article.get('h2') or []):\n        if not isinstance(h2,\
          \ dict):\n            continue\n        total += len(re.sub(r'<[^>]+>',\
          \ '', str(h2.get('content') or '')))\n        for h3 in (h2.get('h3') or\
          \ []):\n            if isinstance(h3, dict):\n                total += len(re.sub(r'<[^>]+>',\
          \ '', str(h3.get('content') or '')))\n    return total\n\n\n# === 把 h2/h3\
          \ 拼成完整 HTML ===\ndef _assemble_full_html(article):\n    if not isinstance(article,\
          \ dict):\n        return ''\n    parts = [article.get('content') or '']\n\
          \    for h2 in (article.get('h2') or []):\n        if not isinstance(h2,\
          \ dict):\n            continue\n        heading = (h2.get('heading') or\
          \ '').strip()\n        if heading:\n            parts.append('<h2>%s</h2>'\
          \ % heading)\n        if h2.get('content'):\n            parts.append(h2['content'])\n\
          \        for h3 in (h2.get('h3') or []):\n            if not isinstance(h3,\
          \ dict):\n                continue\n            h3_heading = (h3.get('heading')\
          \ or '').strip()\n            if h3_heading:\n                parts.append('<h3>%s</h3>'\
          \ % h3_heading)\n            if h3.get('content'):\n                parts.append(h3['content'])\n\
          \    return ''.join(parts)\n\n\n# === 新增：内容截断检测 ===\ndef _detect_truncation(title,\
          \ content, raw):\n    reasons = []\n    if not content or not content.strip():\n\
          \        return True, ['content为空']\n    tail = content.rstrip()\n    if\
          \ tail and tail[-1] != '>' and re.search(r'<[^>]*$', tail):\n        reasons.append('HTML标签未闭合')\n\
          \    for tag in ['h2', 'h3', 'p']:\n        open_c = len(re.findall(r'<%s[\\\
          s>]' % tag, content, re.I))\n        close_c = len(re.findall(r'</%s>' %\
          \ tag, content, re.I))\n        if open_c > close_c:\n            reasons.append(f'<{tag}>标签不配对(开{open_c}/闭{close_c})')\n\
          \    if title:\n        cn_num = {'两': 2, '二': 2, '三': 3, '四': 4, '五': 5,\
          \ '六': 6, '七': 7, '八': 8, '九': 9, '十': 10}\n        promised = 0\n     \
          \   m_cn = re.search(r'([两二三四五六七八九十])\\s*[家款个大类种条篇位]', title)\n        if\
          \ m_cn:\n            promised = cn_num.get(m_cn.group(1), 0)\n        if\
          \ not promised:\n            m_num = re.search(r'(\\d+)\\s*[家款个大类种条篇位]',\
          \ title)\n            if m_num:\n                promised = int(m_num.group(1))\n\
          \        if promised >= 2:\n            actual_h3 = len(re.findall(r'<h3[^>]*>',\
          \ content, re.I))\n            if actual_h3 < promised:\n              \
          \  reasons.append(f'标题承诺{promised}个但只有{actual_h3}个h3')\n    if content.rstrip()\
          \ and not re.search(r'</(?:p|ul|ol|h[1-4]|div|table)>\\s*$', content.rstrip(),\
          \ re.I):\n        reasons.append('未以完整HTML标签结尾')\n    if raw:\n        bo\
          \ = raw.count('{')\n        bc = raw.count('}')\n        if bo > bc:\n \
          \           reasons.append(f'JSON未闭合(开{bo}/闭{bc})')\n    return bool(reasons),\
          \ reasons\n\n\n# === 新增：修复未闭合HTML ===\ndef _fix_unclosed_html(content):\n\
          \    if not content:\n        return content\n    s = content.rstrip()\n\
          \    incomplete = re.search(r'<[^>]*$', s)\n    if incomplete:\n       \
          \ s = s[:incomplete.start()].rstrip()\n    for tag in ['li', 'p', 'ul',\
          \ 'ol', 'h3', 'h2']:\n        oc = len(re.findall(r'<%s[\\s>]' % tag, s,\
          \ re.I))\n        cc = len(re.findall(r'</%s>' % tag, s, re.I))\n      \
          \  if oc > cc:\n            s += ('</%s>' % tag) * (oc - cc)\n    return\
          \ s\n\n\ndef main(n7_text, clean_out):\n    if isinstance(clean_out, str):\n\
          \        try:\n            _cm = re.search(r'\\{.*\\}', _strip_think(clean_out),\
          \ re.S)\n            clean_out = _json.loads(_cm.group(0), strict=False)\
          \ if _cm else {}\n        except Exception:\n            clean_out = {}\n\
          \    if not isinstance(clean_out, dict):\n        clean_out = {}\n\n   \
          \ title = clean_out.get('title', '') or ''\n    content = clean_out.get('content',\
          \ '') or ''\n    description = clean_out.get('description', '') or ''\n\
          \    tags = clean_out.get('tags', []) or []\n    self_review = clean_out.get('self_review',\
          \ '') or ''\n\n    plain = re.sub(r'<[^>]+>', '', content).strip()\n\n \
          \   n7_clean = _extract_html(_strip_think(n7_text or ''))\n    n7_plain\
          \ = re.sub(r'<[^>]+>', '', n7_clean).strip()\n\n    # === 用全文字数（含 h2/h3）替代\
          \ content 单字段字数 ===\n    full_len = _count_full_text(clean_out)\n    n7_article\
          \ = {}\n    try:\n        _mj_count = re.search(r'\\{.*\\}', _strip_think(n7_text\
          \ or ''), re.S)\n        if _mj_count:\n            n7_article = _json.loads(_mj_count.group(0),\
          \ strict=False)\n    except Exception:\n        n7_article = {}\n    n7_full_len\
          \ = _count_full_text(n7_article)\n\n    markers = ['（原样）', '(原样)', '内容不变',\
          \ '同上', '此处省略', '保持原文', '其余略', '(略)', '（略）']\n    has_ph = any(m in content\
          \ for m in markers) or content.strip().endswith('原样')\n    too_short = full_len\
