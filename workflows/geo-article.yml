          \  # 医疗严禁对比(《医疗广告认定指南》第六条三款): 平行并列,各机构独立陈述客观事实,不做优劣对比/排名\n            scoring_choice\
          \ = \"无评分(纯叙述)\"\n            ranking_choice = \"平行并列盘点(主推与真实竞品各自独立成段、只陈述自身客观事实,绝不对比/排名/优劣判断)\"\
