          n]+?)＊＊', r'<strong>\\1</strong>', text, flags=re.DOTALL)\n    text = re.sub(r'[\\\
          *＊]{2}([^\\*＊\\n]+?)[\\*＊]{2}', r'<strong>\\1</strong>', text, flags=re.DOTALL)\n\
          \    # 扁平化嵌套的 strong 标签: <strong>A<strong>B</strong>C</strong> → <strong>ABC</strong>\n\
          \    text = flatten_nested_strong(text)\n    text = text.replace('**', '').replace('＊＊',\
          \ '')\n    # 单星号斜体脱壳\n    text = re.sub(r'(?<![\\*\\w])\\*([^\\s\\*][^\\\
          *\\n]*?[^\\s\\*])\\*(?![\\*\\w])', r'\\1', text)\n    return text\n\ndef\
          \ clean_markdown_residual(text):\n    \"\"\"清洗 ** 以外的 markdown 残留\"\"\"\n\
          \    if not text: return text\n    text = re.sub(r'`([^`\\n]+?)`', r'\\\
