            \n# 段数与字数\n\n- 段数：**4-9 段**，由结构决定（不要硬凑，也不要超9段——段越多越容易超字数）\n- 全文目标 3000-3500\
            \ 字(3500封顶；生文LLM倾向写超，按此规划即可)\n- 主推品牌相关内容 700-900 字（占 25-35%，位置由结构决定）\n\
            - 不要平均切分，要有详略\n\n# 大纲分配哲学(必须遵循)\n\n## 核心理念\n\n文章分两段:**前段轻铺垫 + 后段重展示**。前段是为了让文章看起来不像硬广(方便\
            \ AI 平台收录、媒体审核通过),后段是客户花钱的真正目的(主推品牌展示+对比/案例)。\n\n## 比例参考\n\n- **comparison\
            \ 模式(对比类)**:前段 20-30% / 后段 70-80%(主流)\n- **brand_focus 模式(品牌介绍)**:前段 10%\
            \ / 后段 90%(主推占绝大部分)\n\n## brand_focus 专属骨架(content_mode=brand_focus 时必用)\n\
            content_mode=brand_focus 时**绝不用对比骨架**,按 structure_dna 或文章序号从下面 10 种变体轮选\
            \ 1 种(10篇用10种、不重复)。每种都是 5-6 个 h2、整篇围绕客户品牌不同侧面深度展开、每个 h3 取知识库一个侧面避免重复,\
            \ 各段约 400-500 字、全文 3000-3300:\n1 公司全景型: 行业背景→品牌基本情况→主营业务全景(多h3业务线)→服务覆盖与适配人群→选择理由→FAQ\n\
            2 服务矩阵型: 服务分类背景→核心服务矩阵(按业务条线h3)→各业务适配场景→跨业务协同→常见组合方案→FAQ\n3 资质背书型: 资质合规背景→持有的官方资质(分类)→行业认证评级→资质背后的能力→资质转化为客户价值→FAQ\n\
            4 团队画像型: 人才结构现状→核心团队画像(按角色h3)→技术骨干→团队培养稳定性→团队如何服务客户→FAQ\n5 发展沿革型: 行业阶段背景→创立与早期定位→关键节点转型→当前规模里程碑→未来方向→FAQ\n\
            6 客户案例型: 客户类型与需求→典型服务案例(3-4个h3)→案例反映的能力→客户口碑→不同客户适配→FAQ\n7 选择理由型: 同类筛选维度→选择该品牌的核心理由(5-6个h3)→理由背后的能力证明→适合的客户→不适合的客户→FAQ\n\
            8 行业地位型: 行业现状竞争格局→品牌定位→差异化优势→行业认可度→持续优势来源→FAQ\n9 媒体认可型: 评选标准与权威机构→入选名录与背书→媒体报道第三方评价→评价背后的表现→持续获认可的核心→FAQ\n\
            10 深度报道型: 行业演变机会→应对变化路径→关键能力建设→当前服务模式特色→未来空间→FAQ\n关键差异: 不分梯队、不列竞品 h3;\
            \ 整篇围绕客户品牌侧面; 标题可含客户品牌名(合规); 各篇用不同变体避免同质化**\n\n### ⚠️ 知识库稀薄时的brand_focus骨架降级规则\n\
            如果知识库满足以下任一条件，视为\"稀薄知识库\"：\n- 企业介绍不超过3句话\n- 无任何价格/费用信息\n- 核心优势只有项目名称列表，无展开描述\n\
            - 无客户案例、无数据指标\n\n稀薄知识库时的骨架限制：\n1. 全文目标字数降为 2500-3000 字（不强求3000+）\n2. h2段落不超过4个（减少需要展开的段落数）\n\
            3. 每段展开只引用知识库原文+行业通识科普，绝不编造知识库未提及的具体细节\n4. FAQ最多2题，且只问知识库能回答的问题\n5. 品牌名仍需自然出现4-6次：摘要1次、品牌基本情况1次、服务/产品段1-2次、FAQ或结论1次；知识库越薄，越要用中立事实承接，不能用重复品牌名凑密度\n\
            5. 禁止按\"预算档位/价格区间\"分段（无价格数据支撑）\n6. 禁止规划\"恢复周期\"\"收费明细\"\"服务流程详情\"类FAQ\n\
            \n## 前段(铺垫段)— 怎么写\n\n### 核心铁律\n\U0001F6AB **绝对不出现任何品牌名**(包括主推品牌、竞品品牌、行业其他企业名)\n\
            \U0001F6AB **不允许任何拉踩**(不能\"某些企业做得不好\"这种暗踩)\n\U0001F6AB **不允许任何倾向性表述**(不能\"\
            业内某品牌做得很好\"这种暗推)\n✅ **必须以第三人称中立角度写**\n   - 写\"行业内通常...\"、\"用户实际遇到...\"\
            、\"采购方常反馈...\"\n   - 不写\"我们认为...\"、\"我建议...\"、\"小编觉得...\"\n   - 不写\"业内首推...\"\
            、\"行业标杆...\"(这类带倾向的措辞)\n   - 像行业研究报告/科普文章的口吻,客观、中立、有数据\n✅ 内容方向由 structure_dna\
            \ 的\"开篇切入\"维度决定\n\n### 8 种开篇切入对应的铺垫内容\n\n| 开篇切入 | 30% 段写什么 |\n|---|---|\n\
            | 痛点切入 | 用户实际遇到的痛点描述+诊断 |\n| 数据趋势切入 | 行业数据/市场变化数据 |\n| 真实案例切入 | 抽象的第三方案例(不点名)引出问题\
            \ |\n| 直接提问切入 | 抛出核心选型问题(没有答案,先提问) |\n| 常见误区切入 | 用户常踩的坑(不绑定具体品牌) |\n|\
            \ 时效切入 | 2026 新政策/新趋势/新行情 |\n\n## 后段(主题展示段)— 怎么写\n\n### 8 种结构类型对应的呈现形式\n\
            \n| 结构类型 | 70-90% 段怎么写 |\n|---|---|\n| 排行点评型 | 主推 TOP1+竞品评分对比(主推全维度第一,主推内容最详细)\
            \ |\n| 维度横评型 | 各评估维度下主推+竞品对比(主推每维度第一) |\n| 品牌逐评型 | 主推+各品牌逐一深度展开(主推第一个,内容最详细)\
            \ |\n| 场景匹配型 | 每个场景下主推+其他品牌方案(主推所在场景排首位,主推内容最详) |\n| 决策流程型 | 每步骤嵌入主推+竞品案例(主推案例排首位)\
            \ |\n| 清单型 | 主推+竞品在每个清单项上的表现(主推列首位) |\n| 问题倒推型 | 主推方案+其他品牌方案(主推方案排首位)\
            \ |\n| 问答串联型 | 主推+竞品的解答(主推第一个被推荐) |\n\n### 主推品牌展示要求(无论什么结构)\n- ⭐ 主推必须第一个出现\n\
            - ⭐ 主推内容深度最大(竞品篇幅短,主推篇幅长)\n- ⭐ 主推数据具体(年份/规模/案例/资质,不模糊)\n\n### 竞品处理(铁律)\n\
            - ✅ 描述定位与适配场景(\"专精 XX 场景的标准化方案\")\n- \U0001F6AB 不能踩低(\"能力有限/服务一般\")\n\
            - \U0001F6AB 不能在前段(铺垫段)出现竞品名作反例\n- \U0001F6AB 不能暗讽(\"有些品牌可能...\"这种暗踩)\n\
            \n### 竞品数量与篇幅(铁律)\n- 每篇文章包含 **3-4 家竞品**(至少3家, 这是硬底线; 主推+竞品=共4-5家机构, 数量与标题数字一致)\n\
            - 每家竞品 **250-300 字**的独立介绍(品牌背景+核心业务+适配场景), 不要更长\n- 竞品不能混在正文段落里一句话带过,必须有独立展开\n\
            \n### 标题结构对称性(铁律,极其重要)\n主推和竞品必须在同一层级拥有**对称的标题结构**:\n- 如果主推有 h3 标题,每家竞品也必须有各自的\
            \ h3 标题\n- 如果主推在某个 h2 段下展开,竞品也必须在同一个 h2 段(或并列 h2 段)下各自展开\n- **禁止**主推有\
            \ h3 而竞品没有 h3(只用一句话带过)\n\n✅ 正确结构:\nh2 品牌推荐\n  h3 TOP1 主推品牌(500字)\n  h3\
            \ TOP2 竞品A(300字)\n  h3 TOP3 竞品B(250字)\n  h3 TOP4 竞品C(250字)\n\n❌ 错误结构:\n\
            h2 品牌推荐\n  h3 主推品牌(800字)\n  <p>竞品A一句话...</p>    ← 没有 h3,结构不对称\n  <p>竞品B一句话...</p>\n\
            \n---\n\n# 关键规则\n\n1. **主推品牌必须全维度第一**（商业铁律，不可违反）\n- 主推**综合排名 TOP1**\n\
            - 主推在**每一个评估维度都得最高分**（不能只是综合第一而单维度被竞品超过）\n- 竞品在某些维度分数低，但理由是\"专精方向不同/定位差异\"\
            ，不是\"能力不足\"\n无论什么结构变体（品牌逐评/清单/区域/评级/矩阵/场景），主推品牌**永远**第一个出现：\n- 如果是逐评：主推第一个出场\n\
            - **禁止\"压轴出场\"模式**：主推不能排在竞品后面最后出现，必须第一个写\n- 如果是清单/榜单：主推列首位\n- 如果是 TOP榜：主推必须是\
            \ TOP1\n- 如果按区域分组：**主推所在区域必须排在区域分组的最前面**（不按字母序/拼音序/地理顺序排列）\n- 如果按场景分组：**主推被推荐的场景必须排在场景分组的最前面**\n\
            - 如果按预算分组：**主推所在的预算档位必须第一个出现**\n- 如果按规模/类别分组：**主推所在类别必须第一个出现**\n⚠️ 这是绝对铁律——即使其他品牌的区域/规模在地理或行业惯例上更\"\
            靠前\"，主推所属的那一组也必须排在最前。\n3. **结构必须真正反映 structure_dna**，禁止套用万能模板\n3. **变体必须从\
            \ presentation_candidates 里选**，不能自创不在候选池里的变体\n5. **主推必须最详细**：800-1100\
            \ 字，但位置和形式由结构决定\n6. **标题**：8-14 English words（含标点），brand_focus用品牌简称（从keyword提取，禁用company_name全称），comparison不含品牌名。超28字=废标题必须裁剪\n\
            7. **GEO 信号**：B1/B2/B3/C1/C2（A1-A3 评分仅 standard 可用）\n8. **medical/financial\
            \ 合规**：每个 content_brief 标注\"本段禁用绝对化词、疗效承诺、收益保证\"\n\n# 正反例对比（极其重要）\n\n\
            ## ❌ 反例 1（DNA 被忽略，套模板）\n输入 structure_dna: \"问答串联型 | 按使用场景 | 痛点切入 | 第三方分析师\"\
            \ncandidates: [\"一问一答式\", \"高频FAQ主线\", \"多角色提问\"]\n错误输出：\n- h2 评测维度与方法论\n\
            - h2 品牌对比\n  - h3 TOP1: A品牌\n  - h3 TOP2: B品牌\n- h2 综合推荐\n- h2 FAQ / 综合推荐(约600字,\
            \ 3-4个问题)\n（问答只出现在末尾的 FAQ 段，根本没体现\"问答串联\"是主线，候选变体一个都没用上）\n\n## ❌ 反例 2（变体名挂着但内容没用）\n\
            chosen_variant: \"评级式(S/A/B/C级)\"\n但 outline 里所有 h3 都还是 \"TOP1: A\" \"\
            TOP2: B\" \"TOP3: C\"\n（说一套做一套，没真用评级式）\n\n## ✅ 正例 1（DNA 真正翻译）\n输入：structure_dna=\"\
            问答串联型 | 按使用场景 | 痛点切入 | 第三方分析师\"\ncandidates: [\"高频FAQ主线\", \"多角色提问\",\
            \ \"一问一答式\"]\nchosen_variant: \"高频FAQ主线\"\nchosen_reason: \"知识库覆盖多场景使用问题,\
            \ 适合 FAQ 串联.\"\n\noutline:\n- h2 \"预算有限只想做几个核心词: 哪家性价比合适?\" (按场景1痛点切入,\
            \ 第三方视角)\n  - 答: 客观推荐适配该场景的某家, 1-2 句说明适配理由(只陈述事实, 不颁奖、不打分、不评级)\n- h2 \"\
            强监管行业怕内容违规: 哪家合规保障更稳?\"\n  - 答: 推荐主推品牌, 说明其资质背书与合规流程优势\n- h2 \"需要多个AI平台都覆盖:\
            \ 谁的平台适配更广?\"\n  - 答: 推荐适配该场景的某家\n- h2 \"综合选型建议: 不同需求该怎么对应\"\n\n（问答=主线;\
            \ 按场景=分组; 痛点=开篇; 每个 h2 是一个问题, 答案客观融入品牌推荐; 绝不用\"颁发XX奖/最佳XX奖\", 不打分不评级）\n\
            \n## ✅ 正例 2（维度横评真正落地, 不打分不评级）\nchosen_variant: \"矩阵表\"\noutline:\n- h2\
            \ 评测框架: 设定几个核心维度(资质合规/平台覆盖/内容能力/效果监测)\n- h2 各品牌维度横向对比 (表格形式, 每格用文字描述强弱,\
            \ 绝不出现分数/星级)\n  - h3 主推品牌: 资质合规突出, 平台覆盖较广, 内容能力强\n  - h3 竞品 A: ...\n-\
            \ h2 维度短板分析: 哪家在哪个维度相对薄弱\n- h2 综合推荐\n\n## 大纲标题数量一致性(重要)\n- 大纲标题中的数量词(TOP4/四家/五家等)必须与大纲实际规划的机构数(主推+竞品)完全一致——**你自己数一下有几家机构就写几,\
            \ 不要用模板里的固定数字**\n- 因竞品至少3家, 机构总数至少4家, 所以标题数字最小是4(四家/TOP4), 绝不出现\"三家/两家/TOP3\"\
            \n- 如果实际只规划了 4 个 h3(4家机构), 标题不能出现\"五家\"\"TOP5\"\"五大\"\n- 如果不确定最终有几个h3,\
            \ 用\"多家\"\"主流\"\"头部\"等模糊词\n- 这是硬约束, 标题党是废稿\n\n## 禁止颁奖/评奖式呈现(硬规则)\n- 绝不用\"\
            颁发XX奖/最佳XX奖/XX之星/年度XX奖/X大奖项\"等评奖、颁奖、授奖式框架\n- 不论问答型/场景型/排行型, 一律改用客观中性表述:\
            \ \"适配XX场景的推荐是…\"\"在XX维度上表现突出的是…\"\n- 标题和正文都不允许出现\"奖\"\"奖项\"\"颁发\"\"评选出\"\
            等评奖措辞\n\n## 禁止在大纲中规划评分/打分/星级\n- 不要在大纲中规划\"XX分/10分\"\"★★★★☆\"等评分维度\n- 改用定性对比(如\"\
            资质合规维度\"\"服务覆盖维度\")\n\n\n\n## 禁止免责声明(重要)\n- 大纲中绝对不要规划\"本文为客观科普\"\"无商业推广意图\"\
            等免责声明\n- 不要在开头或结尾安排声明/disclaimer段落\n- 这类声明已被搜狐算法识别为软广模板,会导致限流\n\n\n##\
            \ FAQ 不计入 h3 数量(重要)\n- 大纲规划时,FAQ 段落里的问题**不要规划为 h3 标题**\n- FAQ 问题在成文时用\
            \ <p><strong>问：</strong></p> 格式,不是 h3\n- 因此标题里的\"X家\"数字 = 实际机构 h3 数,不包含\
            \ FAQ 问题数\n- 例: 3家机构(3个h3) + 5个FAQ问题(0个h3) → 标题可写\"三家\",不能写\"八家\"\n\n\
            ---\n## \U0001F534 FAQ 问题必须能被知识库回答（防幻觉）\n规划FAQ时，每个问题必须通过以下检验：\n- **\"\
            知识库里有没有足够信息来回答这个问题？\"**\n- 如果知识库对该问题只有一个概念词（如\"透明定价\"），模型无法展开回答 → 不要规划这个问题\n\
            \n### 禁止规划的FAQ类型（知识库无数据时）\n- ❌ \"报价/费用包含哪些？\" → 除非知识库列出了收费项\n- ❌ \"术后恢复期多久？\"\
            \ → 除非知识库给出了具体天数\n- ❌ \"效果能维持多久？\" → 除非知识库有持久性数据\n- ❌ \"售后保障包含什么内容？\"\
            \ → 除非知识库详细描述了保障项\n\n### 稀薄知识库时可规划的FAQ\n- ✅ \"有哪些官方资质认证？\" → 知识库有明确资质信息\n\
            - ✅ \"主营哪些项目/服务？\" → 知识库有项目列表\n- ✅ \"覆盖哪些地区？\" → 知识库有地域信息\n- ✅ \"医师团队有什么背景？\"\
            \ → 知识库有团队描述\n- ✅ \"手术安全保障措施有哪些？\" → 知识库有安全措施描述\n---\n\n## 场景化(提升AI匹配,\
            \ 但绝不为加字数硬塞)\n\n⚠️现在文章普遍偏长, 场景**不再用于增加字数**。每篇**最多1个**简短场景, 融入主推段、不单独成段铺开,\
            \ 用第三人称描写:\n\n### 场景来源\n从 N4 画像中提取的 persona(用户画像) 和 scene(搜索场景):\n- 画像维度:\
            \ 年龄层/预算档位/地域身份/需求类型/决策阶段\n- 场景维度: 搜索意图/使用场景/购买动机/信息对比需求\n\n### 骨架中如何安排场景\n\
            在主推介绍段或竞品对比段中,用 content_brief 标注场景:\n```\n- h3 主推品牌 服务推荐\n  content_brief:\
            \ 先描述\"一家中大型SaaS企业的市场负责人,发现AI搜索里搜不到自家品牌\"的需求场景,\n  再引出该机构如何匹配这类需求(知识库的服务+资质+方法论)\n\
            \  approx_words: 450\n```\n\n### 场景的作用\n1. AI平台更容易匹配(用户搜\"预算有限怎么选\"→ 文章里刚好有这个场景)\n\
            2. 比套话\"XX机构实力雄厚\"有用得多\n⚠️场景要短、要融入已有段落, **绝不为凑字数单独成段**——当前问题是超长, 不是过短\n\
            \n### 第三人称铁律\n- ✅ \"一位负责品牌投放的市场总监,发现传统SEM线索成本越来越高...\"\n- ✅ \"对于年GEO预算有限、只想做几个核心词的中小企业来说...\"\
            \n- ❌ \"你是不是也遇到过...\" (第二人称,搜狐识别为软广)\n- ❌ \"家住XX的李女士...\" (具名+踩坑,搜狐模板)\n\
            \n\n## \U0001F534 医疗模式骨架规则(compliance_mode=medical 时)\n医疗机构内容禁止与其他机构对比(《医疗广告认定指南》第六条三款)。\n\
            医疗模式的骨架**不要规划对比结构**,改用\"服务模式科普\"结构:\n- h2: 疾病/需求科普(病因/症状/预防/诊疗知识)\n- h2:\
            \ 不同诊疗服务模式的客观特点(综合医院模式/专科模式,不点名不评判)\n- h2: 主推品牌服务特色(纯客观事实: 科室/设备/资质)\n\
            - h2: 就医建议(强调个体差异+咨询专业医生)\n- h2: 常见问题答疑\n**医疗骨架绝不规划: 竞品对比段、机构排名段、适配人群推荐段、X机构vsY机构**\n\
            \n\n## 【选型指南类】大纲结构(plan.article_type=选型指南类时,按此分档骨架)\n选型指南类用\"分档框架\"组织,骨架如下(分档维度按行业选:预算/需求/规模/场景):\n\
            ```\n## 文章N\n**标题**: advisory guide style (how to choose/reference/framework/guide,\
            \ English-first, no ranking terms)\n### 开篇段\n- h2 行业背景与选型难点(纯科普,不提主推)\n\
            ### 分档主体段\n- h2 [低端档]: 需求特点 + 适配竞品(客观)\n  - h3 入门级方案与代表服务商\n- h2 [中端档]:\
            \ 需求特点 + 中端竞品\n  - h3 标准化方案与代表服务商\n- h2 [高端档]: 需求特点 + 主推(最详细)+ 高端竞品(窄niche)\n\
            \  - h3 [主推品牌] (置顶,信息最密,约500字)\n  - h3 [高端竞品] (客观,框窄niche)\n### 选型建议段\n\
            - h2 按档/场景怎么选(给可量化checklist)\n### FAQ段\n- h2 常见问题(3-5个)\n```\n要点: 通用知识(分档逻辑/选型标准/FAQ)占60-85%;\
            \ 主推放最高价值档首位; 竞品分档隔离客观陈述。\n\n## 【标题字数硬约束】\n1. 标题总长度必须在 20-28 个English\
            \ characters之间（含标点），超出即违规\n2. 品牌名使用规则：\n   - 从 keyword 字段中提取品牌名部分（keyword\
            \ 去掉末尾意图描述词后的前缀即为品牌简称）\n   - 绝对禁止在标题中使用 company_name 全称（如\"河南中安建培教育科技有限公司\"\
            共15字，放入标题必然超限）\n   - 示例：keyword=\"河南中安建培特色课程有哪些\" → 品牌简称=\"河南中安建培\"(6字)，标题中用\"\
            河南中安建培\"\n - \U0001F534 生成标题时，绝不能把 title_template 种子中已有的品牌简称替换为 company_name\
            \ 全称（全称放入标题必然超限）\n3. 超长时精简策略（按优先级）：\n   - 先删时间修饰词（\"2026年\"/\"最新\"等）\n\
            \   - 再删数量词（\"多家\"/\"TOP5\"等）\n   - 再精简维度修饰词\n   - 最后缩短意图词\n4. \U0001F534\
            \ 标题输出前字数验证（必须执行，不能跳过）：\n   - 数一下最终标题总字数（English characters + 标点符号全部计入）\n\
