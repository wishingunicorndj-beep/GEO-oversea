          \    # 1. 切入角度/开篇类型 标签\n    text = re.sub(r'\\*?\\*?(本篇切入角度|本篇开篇类型|切入角度|开篇类型|本篇画像|本篇场景|本篇意图|知识库侧面|主推切入|选用变体|排名方式|标题)\\\
