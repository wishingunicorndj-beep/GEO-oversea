          \ def _sanitize(s):\n        \"\"\"把任意输入清洗为 JSON-Body 安全的 String\"\"\"\n\
          \        if s is None:\n            return ''\n        if not isinstance(s,\
          \ str):\n            s = str(s)\n\n        # 顺序关键：反斜杠必须最先转，否则后续的 \\\\\"\
          \ 会被再次转义\n        s = s.replace('\\\\', '\\\\\\\\')\n        s = s.replace('\"\
          ', '\\\\\"')\n        s = s.replace('\\n', '\\\\n')\n        s = s.replace('\\\
          r', '\\\\r')\n        s = s.replace('\\t', ' ')\n\n        # 剔除控制字符（ASCII\
          \ 0-31，除了已处理的 \\\\n \\\\r \\\\t）\n        s = ''.join(c for c in s if ord(c)\
          \ >= 32)\n\n        return s.strip()\n\n    # 清洗 6 个字段\n    company_name_safe\
          \ = _sanitize(company_name)\n    region_safe = _sanitize(region)\n    industry_safe\
          \ = _sanitize(industry)\n    customer_detail_safe = _sanitize(customer_detail)\n\
          \    product_names_safe = _sanitize(product_names)\n    keyword_pack_safe\
