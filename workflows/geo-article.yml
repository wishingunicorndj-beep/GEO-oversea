          \        # 开篇类型分配(每篇不同,避免模板化)\n        opening_types = [\n            \"\
          行业趋势切入：用行业发展的大方向/趋势定性描述切入(不引用具体数据/报告名)\",\n            \"行业规范切入：用行业规范化/标准化的总体趋势切入(不引用具体法规名称)\"\
          ,\n            \"市场现象切入：用近期可观察的市场现象/趋势切入(不编造具体统计数据)\",\n            \"通用知识科普：先讲行业基础知识/原理,自然过渡\"\
          ,\n            \"决策维度引出：先抛出选购决策需要看的核心维度\",\n            \"需求分类切入：按不同需求人群的差异化关注点切入\"\
          ,\n            \"行业演变回顾：用行业近年的发展变化定性描述切入(不编造具体年份/事件)\",\n            \"\
          对比标准建立：先讲对比应该看什么标准,再展开\",\n        ]\n        # 严禁的开篇模式(搜狐识别为软广)\n     \
          \   # ❌ \"本文为客观科普...\"免责声明开头\n        # ❌ \"很多人/不少人...踩了坑\"用户踩坑经历\n    \
