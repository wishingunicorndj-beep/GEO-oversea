          \ xxx\n    text = re.sub(r'<strong>\\s*(本篇切入角度|本篇开篇类型|切入角度|开篇类型|本篇画像|本篇场景|本篇意图|知识库侧面|主推切入|选用变体|排名方式|标题)\\\
          s*</strong>\\s*[:：][^\\n<]{0,80}', '', text)\n    # 2. 骨架段落名独立成行\n    text\
          \ = re.sub(r'<h[1-6][^>]*>\\s*(铺垫段|主题段|主体段)\\s*[:：]?[^<]*</h[1-6]>', '',\
