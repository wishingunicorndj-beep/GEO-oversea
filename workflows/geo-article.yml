          \    def parse_type_weights(text):\n        \"\"\"从画像分析报告中提取文章类型权重\"\"\"\
          \n        weights = {\"对比排名类\": 4, \"选型指南类\": 4, \"性能评测类\": 3, \"经验分享类\"\
