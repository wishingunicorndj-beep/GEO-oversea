    - data:
        code: "\"\"\"\n节点 7-5b：放在 7-3\"无问题\"分支之后\n输入变量配置：\n  - n7_text → 7-1 AI生文节点的\
          \ text 输出\n输出变量：structured_output (String/Object) —— 与 7-5a 结构完全一致\n\"\"\
          \"\n\nimport re\nimport json as _json\n\ndef _strip_think(raw):\n    if\
          \ not raw:\n        return ''\n    s = re.sub(r'<think>.*?</think>', '',\
          \ raw, flags=re.S | re.I)\n    if '</think>' in s:\n        s = s.split('</think>')[-1]\n\
          \    if '<think>' in s:\n        s = re.sub(r'<think>.*', '', s, flags=re.S\
          \ | re.I)\n    return s\n\ndef _extract_html(s):\n    if not s:\n      \
          \  return ''\n    m = re.search(r'<(?:p|h[1-4])[\\s>].*</(?:p|ul|ol|h[1-4])>',\
          \ s, flags=re.S | re.I)\n    return m.group(0).strip() if m else s.strip()\n\
          \n# === N7 JSON 崩坏时的字段兜底正则提取 ===\ndef _regex_extract_field(raw, field):\n\
          \    \"\"\"从原始文本里用正则直接抽 \"field\": \"value\"(应对 LLM 输出畸形 JSON)\"\"\"\n \
          \   if not raw or not field:\n        return ''\n    pattern = r'\"%s\"\\\
          s*:\\s*\"((?:\\\\.|[^\"\\\\])*)\"' % re.escape(field)\n    m = re.search(pattern,\
          \ raw, re.S)\n    if not m:\n        return ''\n    val = m.group(1)\n \
          \   val = val.replace('\\\\\"', '\"').replace('\\\\\\\\', '\\\\').replace('\\\
          \\n', '\\n').replace('\\\\t', '\\t')\n    return val.strip()\n\n\n# ===\
          \ 新增：内容截断检测 ===\ndef _detect_truncation(title, content, raw):\n    \"\"\"\
          检测内容是否被截断，返回 (is_truncated: bool, reasons: list[str])\"\"\"\n    reasons\
          \ = []\n    if not content or not content.strip():\n        return True,\
          \ ['content为空']\n\n    # 1. HTML标签未闭合\n    tail = content.rstrip()\n   \
          \ if tail and tail[-1] != '>' and re.search(r'<[^>]*$', tail):\n       \
          \ reasons.append('HTML标签未闭合(输出在标签中间截断)')\n\n    # 2. 开闭标签不配对\n    for tag\
          \ in ['h2', 'h3', 'p']:\n        open_count = len(re.findall(r'<%s[\\s>]'\
          \ % tag, content, re.I))\n        close_count = len(re.findall(r'</%s>'\
          \ % tag, content, re.I))\n        if open_count > close_count:\n       \
          \     reasons.append(f'<{tag}>开标签{open_count}个但闭标签只有{close_count}个')\n\n\
          \    # 3. 标题承诺数量 vs 实际数量\n    if title:\n        cn_num_map = {'两': 2, '二':\
          \ 2, '三': 3, '四': 4, '五': 5,\n                      '六': 6, '七': 7, '八':\
          \ 8, '九': 9, '十': 10}\n        promised = 0\n        m_cn = re.search(r'([两二三四五六七八九十])\\\
          s*[家款个大类种条篇位]', title)\n        if m_cn:\n            promised = cn_num_map.get(m_cn.group(1),\
          \ 0)\n        if not promised:\n            m_num = re.search(r'(\\d+)\\\
          s*[家款个大类种条篇位]', title)\n            if m_num:\n                promised\
          \ = int(m_num.group(1))\n        if promised >= 2:\n            actual_h3\
          \ = len(re.findall(r'<h3[^>]*>', content, re.I))\n            if actual_h3\
          \ < promised:\n                reasons.append(f'标题承诺{promised}个条目但正文只有{actual_h3}个h3段落')\n\
          \n    # 4. 末尾完整性\n    if content.rstrip() and not re.search(r'</(?:p|ul|ol|h[1-4]|div|table)>\\\
          s*$', content.rstrip(), re.I):\n        reasons.append('内容未以完整HTML标签结尾')\n\
          \n    # 5. JSON花括号不配对\n    if raw:\n        brace_open = raw.count('{')\n\
          \        brace_close = raw.count('}')\n        if brace_open > brace_close:\n\
          \            reasons.append(f'JSON花括号未闭合(开{brace_open}/闭{brace_close})')\n\
          \n    return bool(reasons), reasons\n\n\n# === 新增：修复未闭合HTML ===\ndef _fix_unclosed_html(content):\n\
          \    \"\"\"截掉末尾残片标签，补全未关闭的块级标签\"\"\"\n    if not content:\n        return\
          \ content\n    s = content.rstrip()\n    # 截掉不完整的标签残片\n    incomplete =\
          \ re.search(r'<[^>]*$', s)\n    if incomplete:\n        s = s[:incomplete.start()].rstrip()\n\
          \    # 闭合未关闭的块级标签\n    for tag in ['li', 'p', 'ul', 'ol', 'h3', 'h2']:\n\
          \        open_c = len(re.findall(r'<%s[\\s>]' % tag, s, re.I))\n       \
          \ close_c = len(re.findall(r'</%s>' % tag, s, re.I))\n        diff = open_c\
          \ - close_c\n        if diff > 0:\n            s += ('</%s>' % tag) * diff\n\
          \    return s\n\n\ndef main(n7_text):\n    _n7j = {}\n    raw = _strip_think(n7_text\
          \ or '')\n    try:\n        _mj = re.search(r'\\{.*\\}', raw, re.S)\n  \
          \      if _mj:\n            _n7j = _json.loads(_mj.group(0), strict=False)\n\
          \    except Exception:\n        _n7j = {}\n\n    title = (_n7j.get('title')\
          \ or '').strip()\n    content = (_n7j.get('content') or '').strip()\n  \
          \  description = (_n7j.get('description') or '').strip()\n    tags = _n7j.get('tags')\
          \ or []\n    self_review = (_n7j.get('self_review') or '').strip()\n\n \
          \   if not isinstance(tags, list):\n        tags = []\n\n    # === N7 经常输出畸形\
          \ JSON,正则兜底 ===\n    _t = _regex_extract_field(raw, 'title')\n    if _t\
          \ and len(_t) >= 5 and len(_t) > len(title):\n        title = _t\n    _d\
          \ = _regex_extract_field(raw, 'description')\n    if _d and len(_d) > len(description):\n\
          \        description = _d\n    _sr = _regex_extract_field(raw, 'self_review')\n\
          \    if _sr and len(_sr) > len(self_review):\n        self_review = _sr\n\
          \    if not tags:\n        _tm = re.search(r'\"tags\"\\s*:\\s*\\[([^\\]]*)\\\
          ]', raw, re.S)\n        if _tm:\n            _tag_items = re.findall(r'\"\
          ((?:\\\\.|[^\"\\\\])*)\"', _tm.group(1))\n            if _tag_items:\n \
          \               tags = [t.strip() for t in _tag_items if t.strip()]\n\n\
          \    if not content:\n        content = _extract_html(raw)\n    else:\n\
          \        if '<think>' in content or '</think>' in content:\n           \
          \ content = _extract_html(_strip_think(content))\n\n    if not title or\
          \ len(title.strip()) < 5:\n        m = re.search(r'<h2[^>]*>(.*?)</h2>',\
          \ content, re.S)\n        if m:\n            title = re.sub(r'<[^>]+>',\
          \ '', m.group(1)).strip()\n\n    if not description:\n        description\
          \ = re.sub(r'<[^>]+>', '', content)[:120].strip()\n\n    # === 新增：截断检测 &\
          \ 修复 ===\n    is_truncated, trunc_reasons = _detect_truncation(title, content,\
          \ raw)\n\n    if is_truncated:\n        content = _fix_unclosed_html(content)\n\
          \        trunc_msg = '[截断警告]生文输出不完整: ' + '; '.join(trunc_reasons)\n    \
          \    self_review = trunc_msg\n\n    if not self_review:\n        self_review\
          \ = '[守护]合规预检通过,无需清洗,直接采用N7原文(已去思考链)'\n\n    return {'structured_output':\
          \ {\n        'title': title, 'content': content, 'description': description,\n\
          \        'tags': tags, 'self_review': self_review,\n        'is_truncated':\
          \ is_truncated\n    }}"
