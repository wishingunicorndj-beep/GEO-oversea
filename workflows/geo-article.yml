            主营儿科呼吸系统OTC中成药\"这种品类描述,\n也**不要冒险**写一个你不能100%确认归属+OTC+对症的具体产品名。\n\n----\n\
            \n### \U0001F7E1 中置信机构(记得这个名字出现过,但具体信息模糊)\n- [机构工商全称] (alias: [品牌简称])\
