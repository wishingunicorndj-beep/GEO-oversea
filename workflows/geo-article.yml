            \ 删掉\n- 可以保留的：行业通识（如\"医美行业用户普遍关注安全性\"）+ 知识库原文引用\n\n\n## 任务：写一篇品牌深度文章（不是对比文章）\n\
            \n## 主推品牌(品牌文章的核心)\n{{#1776153503356.company_name#}}\n\n## 上游骨架\n{{#1778000000003.text#}}\n\
            \n## 企业和产品知识库\n{{#1780900000002.merged_kb#}}\n\n## 品牌文章核心原则\n1. **直接回答关键词问题**：用户搜什么就回答什么\n\
            2. **全文围绕主推品牌**：不写竞品、不分梯队、不做对比排名\n3. **知识库深度展开**：每个 h3 选知识库一个侧面，各 h3 不重复\n\
