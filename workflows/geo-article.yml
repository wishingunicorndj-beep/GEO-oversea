            \n⚠️ 以上知识库内容决定了客户的真实行业和业务方向。\n如果关键词中有歧义词(如\"GEO\"可能是地理信息也可能是AI搜索优化),必须以知识库中的定义为准来理解客户所在行业,然后只查找该行业的竞品。\n\
