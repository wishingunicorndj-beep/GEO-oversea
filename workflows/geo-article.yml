    - data:
        code: "\"\"\"\nN3nb 竞品校验 v6.1 (双路召回+迭代校验版, 修复入参类型鲁棒性 + 去重前缀碰撞)\n===================================\n\
          相对 v6 只做 2 处最小改动：\n  【改动 1】_core_brand_n：新增地域前缀剥离 + 阈值收紧\n  【改动 2】v8 去重块：子串/core\
          \ 阈值收紧 + 合并按信息完整度择优 + 追踪丢弃者进 rejected\n\n其余代码与 v6 完全一致。\n\"\"\"\n\nimport\
          \ re\nimport json\n\nNATIONAL_CHAIN_BRANDS = {\n    '雍禾', '大麦', '碧莲盛', '熙朵',\
