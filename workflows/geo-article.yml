          \        # 这些词在中性语境太常用(如\"基础扎实/全面发展/时间充足/首选方案/科技巨头\")\n        # 已移除避免误伤\n\
          \    ]\n    for w in marketing_words:\n        text = text.replace(w, '')\n\
          \    # 清除 [____] [待补充] 残留\n    text = text.replace('[____]', '').replace('[待补充]',\
