          \ '美尔目', '韩辰', '壹加壹', '欧华',\n    '曙光', '博爱', '华山', '协和', '同仁', '同济', '长征',\n\
          \    '中山', '新华', '光明', '天伦', '九洲', '东方', '西京', '北大',\n    '南方', '百佳', '安琪',\
          \ '玛丽', '爱德华', '阳光', '春天',\n    '蓝天', '红房子', '玛利亚', '现代', '和平', '友谊', '长城',\n\
          \    '爱尔', '普瑞', '华厦', '佳美', '拜博', '瑞尔', '通策', '美奥',\n    '拜尔', '牙博士', '可恩',\n\
          }\n\nTRACK_KEYWORDS = {\n    'pediatric_cough': ['儿童', '小儿', '儿科', '婴幼儿',\
          \ '宝宝', '咳', '感冒', '止咳', '化痰', '退热', '发烧', '发热', '咳嗽', '咽喉', '咽炎', '扁桃体'],\n\
