          \ '', text)\n    return text\n\n\ndef clean_financial_forbidden_words(text,\
          \ compliance_mode):\n    \"\"\"金融话术黑化词机械清洗(只清无歧义的雷区话术,语境敏感词由 LLM 清洗节点处理)\"\
          \"\"\n    if compliance_mode != 'financial':\n        return text\n    \n\
          \    # 只清\"话术黑化词\"(无歧义,机械可清)\n    black_phrases = [\n        '无息贴息', '贴息贷',\
          \ '扶持补贴贷',\n        '零门槛秒批', '零门槛', '秒批',\n        '无视征信',\n        '过桥垫资',\
          \ '过桥', '调头', '垫资',\n        '内盘', '内部额度', '内部理财',\n        '保本保息', '刚性兑付',\
