          \ = '[守护]预检无问题,跳过改写直接采用N7原文(已去思考链/抠正文)'\n        else:\n            reason\
          \ = '占位符' if has_ph else ('残留思考链' if has_think else '过短')\n            self_review\
          \ = '[守护]cleanup异常(%s),已回退N7原文(已去思考链/抠正文)' % reason\n    else:\n       \
          \ if has_think:\n            content = _extract_html(_strip_think(content))\n\
