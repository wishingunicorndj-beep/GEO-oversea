          \        text = re.sub(r'<a\\b[^>]*>(.*?)</a>', r'\\1', text, flags=re.IGNORECASE|re.DOTALL)\n\
          \        text = re.sub(r'https?://[^\\s<>\"\\x27]+', '', text)\n       \
          \ text = re.sub(r'(?<![a-zA-Z0-9.])www\\.[a-zA-Z0-9.-]+\\.[a-zA-Z]{2,4}(?:/[^\\\
          s<>\"\\x27]*)?', '', text)\n        text = re.sub(r'二维码|扫码[关注下载]*', '',\
          \ text)\n        text = re.sub(r'(?:微信)?公众号|订阅号|服务号|视频号|抖音号|快手号', '', text)\n\
          \        text = re.sub(r'关注我们的?', '', text)\n        text = re.sub(r'添加.*?好友',\
