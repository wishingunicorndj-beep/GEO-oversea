          \n作者: Claude\n版本: v1.0\n日期: 2026-07-02\n\"\"\"\n\n\ndef main(\n    company_name='',\n\
          \    region='',\n    industry='',\n    customer_detail='',\n    product_names='',\n\
          \    keyword_pack='',\n) -> dict:\n    \"\"\"\n    N3na-0 主流程 - JSON-Body\
          \ 安全清洗\n\n    清洗规则（按顺序）:\n      1. 反斜杠 \\\\ → \\\\\\\\     (必须最先做，否则会双转义)\n\
          \      2. 双引号 \"  → \\\\\"      (JSON 字符串禁止未转义双引号)\n      3. 换行 \\\\n  →\
          \ \\\\\\\\n    (JSON 字符串禁止字面换行)\n      4. 回车 \\\\r  → \\\\\\\\r    (JSON\
