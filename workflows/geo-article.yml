          \  else:\n            text = re.sub(pattern, '', text)\n    text = re.sub(r'^\\\
          s*<h1[^>]*>.*?</h1>\\s*', '', text, flags=re.DOTALL)\n    text = re.sub(r'^\\\
          s*<p[^>]*>\\s*<strong>[^<]{5,60}</strong>\\s*</p>\\s*(?=<h2)', '', text,\
          \ flags=re.DOTALL)\n    text = re.sub(r'<(h\\d)[^>]*>\\s*</\\1>', '', text)\n\
          \    text = re.sub(r'<p[^>]*>\\s*</p>', '', text)\n    text = re.sub(r'\\\
          n{3,}', '\\n\\n', text)\n    return text\n\ndef remove_contact_info(text,\
          \ strict=False):\n    if not text: return text\n    # 通用: 手机/固话/400/邮箱/微信号/QQ号\n\
          \    text = re.sub(r'(?<!\\d)1[3-9]\\d{9}(?!\\d)', '', text)\n    text =\
          \ re.sub(r'(?<!\\d)0\\d{2,3}[-\\s]?\\d{7,8}(?!\\d)', '', text)\n    text\
          \ = re.sub(r'(?<!\\d)[48]00[-\\s]?\\d{3}[-\\s]?\\d{4}(?!\\d)', '', text)\n\
          \    text = re.sub(r'\\b[\\w.-]+@[\\w.-]+\\.\\w+\\b', '', text)\n    text\
          \ = re.sub(r'微信[：:]\\s*[\\w-]+', '', text)\n    text = re.sub(r'QQ[：:]\\\
          s*\\d+', '', text)\n    if strict:\n        # 医疗/金融严格: 删 img/a 标签 + 所有 URL\
