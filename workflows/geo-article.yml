    - data:
        code: "import re, random\n\ndef main(company_name: str, industry: str, keyword_pack:\
          \ str,\n         article_count: float, article_style: str, article_type:\
          \ str,\n         task_name: str, company_intro: str, core_qualifications:\
          \ str,\n         awards: str, advantages: str, ent_dataset_id: str, task_description:\
          \ str,\n         prod_dataset_id: str, known_competitors_input: str = \"\
          \"):\n\n    # 0. 输入归一化：兼容\"对比排名\"和\"对比排名类\"两种写法\n    type_normalize_map\
          \ = {\n        \"对比排名\": \"对比排名类\", \"性能评测\": \"性能评测类\",\n        \"经验分享\"\
          : \"经验分享类\", \"知识科普\": \"知识科普类\",\n        \"新闻报道\": \"新闻报道类\", \"自我介绍\"\
          : \"自我介绍类\",\n    }\n    article_type = type_normalize_map.get(article_type,\
          \ article_type) or \"对比排名类\"\n\n    # 1. 核心锚词提取\n    lines = [l.strip()\
          \ for l in keyword_pack.strip().replace('，','\\n').split('\\n') if l.strip()]\n\
          \    core_anchor = \"\"\n    if lines:\n        suffixes = r'(推荐|哪家好|排名|怎么选|有哪些|靠谱吗?|公司排行|品牌推荐|找哪家|怎么样|多少钱|哪个好|哪家靠谱|哪家专业)$'\n\
          \        prefixes = r'^(专业的?|靠谱的?|口碑好的?|好用的?|性价比高的?|正规的?|优质的?)'\n      \
          \  bare = [re.sub(suffixes, '', re.sub(prefixes, '', l)).strip() for l in\
          \ lines]\n        bare = [b for b in bare if len(b) >= 2]\n        if bare:\n\
          \            core_anchor = min(bare, key=len)\n    if not core_anchor:\n\
          \        core_anchor = industry or task_name or \"产品服务\"\n\n    # 2. RAG\
          \ 检索 query\n    ent_rag_query = f\"{company_name} 企业简介 品牌荣誉 行业认证 服务优势\"\n\
          \    prod_rag_query = f\"{core_anchor} 核心参数 产品亮点 服务优势 技术特点\"\n\n    def\
          \ clean_q(q):\n        if not q: return \"\"\n        q = re.sub(r'[\\x00-\\\
          x1f\\x7f-\\x9f\"\\'\\\\]', '', q)\n        return re.sub(r'\\s+', ' ', q).strip()[:60]\n\
          \n    # 3. 合规模式识别\n    medical_kw = ['医院','医疗','诊所','医美','药品','保健','口腔','整形',\n\
          \                  '眼科','体检','齿科','门诊','制药','医师','康复','护理']\n    financial_kw\
          \ = ['银行','保险','金融','理财','基金','证券','股票','贷款',\n                    '信用卡','支付','期货','信托','私募','投顾','征信']\n\
          \    text_for_check = (industry or \"\") + \" \" + (company_intro or \"\"\
          )\n    if any(k in text_for_check for k in medical_kw):\n        compliance_mode\
          \ = \"medical\"\n    elif any(k in text_for_check for k in financial_kw):\n\
          \        compliance_mode = \"financial\"\n    else:\n        compliance_mode\
          \ = \"standard\"\n\n    # 4. 地域提取\n    region_list = [\n        '北京','上海','广州','深圳','天津','重庆','成都','杭州','武汉','南京',\n\
          \        '西安','郑州','长沙','苏州','东莞','青岛','沈阳','大连','哈尔滨','长春',\n        '济南','厦门','福州','昆明','贵阳','南宁','合肥','石家庄','太原','兰州',\n\
          \        '南昌','乌鲁木齐','呼和浩特','海口','银川','西宁','拉萨','珠海','佛山',\n        '中山','惠州','无锡','常州','温州','宁波','嘉兴','绍兴','金华','台州',\n\
          \        '泉州','漳州','烟台','潍坊','临沂','徐州','扬州','泰州','镇江','盐城',\n        '芜湖','洛阳','襄阳','宜昌','岳阳','株洲','柳州','桂林','保定','唐山',\n\
          \        '廊坊','邯郸','秦皇岛','承德','张家口','邢台','衡水','沧州',\n        '河北','山西','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建',\n\
          \        '江西','山东','河南','湖北','湖南','广东','广西','海南','四川',\n        '贵州','云南','陕西','甘肃','青海','内蒙古','宁夏','新疆','西藏',\n\
          \    ]\n    region = \"\"\n    kw_text = keyword_pack or \"\"\n    # 全量匹配后取最早出现+最长的，防止\"\
          海口\"误匹配\"珠海口腔\"\n    _candidates = []\n    for r in region_list:\n     \
          \   _idx = kw_text.find(r)\n        if _idx >= 0:\n            _candidates.append((_idx,\
          \ -len(r), r))\n    if _candidates:\n        _candidates.sort()  # 先按位置升序，再按长度降序\n\
          \        region = _candidates[0][2]\n\n    # 5. 内容模式判定 — 品牌词检测(放宽,支持核心名/品牌意图词)\n\
          \    def detect_brand_keyword():\n        if not (company_name and keyword_pack):\n\
          \            return False\n        # 1) 完整字面\n        if company_name in\
          \ keyword_pack:\n            return True\n        # 2) 去除公司类型后缀提取核心名\n \
          \       core = company_name\n        for suf in ['股份有限公司','有限责任公司','集团有限公司','科技有限公司',\n\
          \                    '科技股份有限公司','股份公司','有限公司','科技公司','公司','集团']:\n     \
          \       core = core.replace(suf, '')\n        core = core.strip()\n    \
          \    if len(core) < 2:\n            return False\n        if core in keyword_pack:\n\
          \            return True\n        # 3) 核心名子串 + 品牌意图词\n        brand_intent\
          \ = ['怎么样','怎么选','靠谱吗','好不好','是什么','介绍','简介',\n                        '官网','地址','电话','位置','招聘','多少钱','官方','旗下',\n\
          \                        '总部','创始人','成立时间','上市','融资']\n        lines = [l.strip()\
          \ for l in keyword_pack.replace('，','\\n').replace(',','\\n').split('\\\
          n') if l.strip()]\n        if not lines:\n            return False\n   \
          \     substrs = [core[i:i+2] for i in range(max(1, len(core)-1))]\n    \
          \    brand_signal = 0\n        for line in lines:\n            if any(s\
          \ in line for s in substrs) and any(p in line for p in brand_intent):\n\
          \                brand_signal += 1\n        return brand_signal / len(lines)\
          \ >= 0.3\n    \n    is_self_promo = detect_brand_keyword()\n    if is_self_promo:\n\
          \        content_mode = \"brand_focus\"\n    elif article_type == \"自我介绍类\"\
          :\n        content_mode = \"brand_focus\"\n    elif article_type in [\"\
          对比排名类\", \"性能评测类\"]:\n        content_mode = \"comparison\"\n    elif article_type\
          \ == \"经验分享类\":\n        content_mode = \"experience\"\n    elif article_type\
          \ in [\"知识科普类\", \"新闻报道类\"]:\n        content_mode = \"knowledge\"\n   \
          \ else:\n        # article_type 为空或未识别 → 交给 N4 智能选型，暂设 auto\n        content_mode\
          \ = \"auto\"\n    needs_competitors = content_mode in [\"comparison\", \"\
          experience\", \"auto\"]\n\n\n    # ---- 已知竞品白名单提取(优先专门输入字段, 读不到再从自由文本里抠)\
          \ ----\n    known_competitors = []\n    if known_competitors_input and known_competitors_input.strip():\n\
          \        known_competitors = [x.strip() for x in re.split(r'[、,，;；\\n\\\
          s]+', known_competitors_input) if x.strip() and len(x.strip()) >= 2][:15]\n\
          \    if not known_competitors:\n        _combined = ' '.join([str(x or '')\
          \ for x in [task_description, advantages, company_intro]])\n        for\
          \ _pat in [r'已知竞品[：:]\\s*([^\\n]+)', r'竞品白名单[：:]\\s*([^\\n]+)', r'竞争对手[：:]\\\
          s*([^\\n]+)']:\n            _m = re.search(_pat, _combined)\n          \
          \  if _m:\n                known_competitors = [x.strip() for x in re.split(r'[、,，;；\\\
          s]+', _m.group(1)) if x.strip() and len(x.strip()) >= 2][:15]\n        \
          \        break\n\n    return {\n        \"ent_rag_query\":  clean_q(ent_rag_query),\n\
          \        \"prod_rag_query\": clean_q(prod_rag_query),\n        \"article_type\"\
          :   article_type or \"对比排名类\",\n        \"article_style\":  article_style\
          \ or \"专业客观\",\n        \"article_count\":  str(int(article_count) if article_count\
          \ else 1),\n        \"compliance_mode\": compliance_mode,\n        \"content_mode\"\
          : content_mode,\n        \"needs_competitors\": \"true\" if needs_competitors\
          \ else \"false\",\n        \"region\": region,\n        \"core_service\"\
          : core_anchor,\n        \"known_competitors\": \"、\".join(known_competitors),\n\
          \    }\n"
