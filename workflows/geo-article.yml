          \     text = text.split('</think>')[-1]\n        if '<think>' in text:\n\
          \            text = re.sub(r'<think>.*', '', text, flags=re.S | re.I)\n\
          \        _m = re.search(r'<h[1-4][\\s>].*</(?:p|ul|ol|h[1-4])>', text, flags=re.S\
          \ | re.I)\n        if _m:\n            text = _m.group(0)\n    text = strip_marketing_adjectives(text,\
          \ mode, kb_text)\n    text = clean_education(text)  # 教育题材广告法第24条(gated)\n\
          \    # 1. 先处理 prompt 泄露和内部标签\n    text = remove_prompt_leakage(text)\n \
          \   text = remove_internal_labels(text)\n    text = remove_source_section(text)\n\
          \    # 2. 联系方式删除\n    text = remove_contact_info(text, strict=(mode in (\"\
          medical\",\"financial\")))\n    text = clean_empty_paragraphs(text)\n  \
          \  # 3. Markdown → HTML（必须在 cap_strong 之前）\n    text = markdown_bold_to_html(text)\n\
          \    text = clean_markdown_residual(text)\n    # 4. 合规词替换（在 strong 截断之前，因为替换可能改变内容长度）\n\
          \    text = clean_financial_forbidden_words(text, mode)\n    text = compliance_word_replace(text,\
          \ mode, kb_text)\n    text = strip_absolute_superlatives(text, mode)\n \
          \   text = neutralize_perfection_numbers(text, mode)\n    text = remove_scoring(text,\
          \ mode)  # 评分清洗(仅医疗/金融,标准保留)\n    text = remove_fabricated_stats(text, kb_text)\
          \  # 市占率/客户数(KB-aware)\n    # 5. Strong 标签上限\n    text = cap_strong_tags(text,\
          \ max_count=8)\n    # 6. 标题层级修复\n    text = fix_heading_hierarchy(text)\n\
          \    # 7. 政治合规\n    text = political_compliance(text)\n    # 8. 标点全角化\n\
          \    text = halfwidth_to_fullwidth(text)\n    text = normalize_punctuation(text)\
          \  # 清双标点\n    # 兜底: 清除替换操作后留下的空标签/碎片标签(如<strong>、</strong>)\n    text =\
          \ re.sub(r'<strong>\\s*[、，,。.；;]*\\s*</strong>', '', text)\n    text = re.sub(r'<strong>\\\
          s*</strong>', '', text)\n    text = flatten_nested_strong(text)  # 再扁平化一次,清孤立标签\n\
          \    text = normalize_punctuation(text)  # 再清一次标点\n    # 规范化HTML空白: 去标签间裸换行/空白(跳改写文章保留了N7原文的\\\
          n, 平台转载会显示成空行/字面\\n); HTML靠标签分段,换行非语义\n    text = re.sub(r'>\\s+<', '><',\
          \ text)\n    text = re.sub(r'[\\r\\n]+', '', text).strip()\n    return text\n\
          \n\ndef remove_fabricated_stats(text, kb_text=''):\n    \"\"\"清除无据的市占率/绝对化市场claim(广告法风险),KB有则保留\"\
          \"\"\n    if not text: return text\n    kb = kb_text or ''\n    def _num_in_kb(num_str,\
          \ suffix=''):\n        \"\"\"精确检查数字是否在KB(用边界,避免60匹配360)\"\"\"\n        if\
          \ not num_str: return False\n        # 检查 \"数字+后缀%家名\" 形式,或数字前后非数字\n   \
          \     pat = r'(?<!\\d)' + re.escape(num_str) + re.escape(suffix)\n     \
          \   return bool(re.search(pat, kb))\n    # 市场占有率/市占率 + 百分比\n    def _mkt(m):\n\
          \        s = m.group(0)\n        num = re.search(r'\\d+\\.?\\d*', s)\n \
          \       if num and _num_in_kb(num.group(0), '%'):\n            return s\n\
          \        return '市场份额位居前列'\n    text = re.sub(r'市(?:场占有率|占率)\\s*(?:高达|达|约|超过)?\\\
          s*\\d+\\.?\\d*%', _mkt, text)\n    # 服务/覆盖 + 大客户数 - 仅清\"明显吹嘘\"(万级 或 4位数+\
          \ 且必须企业/客户/用户/家庭noun)\n    def _cust(m):\n        s = m.group(0)\n     \
          \   num = re.search(r'\\d+', s)\n        if num and _num_in_kb(num.group(0)):\n\
          \            return s\n        return re.sub(r'(?:超过|超|逾|累计|达|突破|已为?)?\\\
          s*\\d+\\s*万?\\s*', '众多', s)\n    # 模式A: 带\"万\"的(服务超10万家企业)\n    text = re.sub(r'(?:服务|覆盖|服务过|累计服务|惠及|已为)\\\
          s*(?:超过|超|逾|累计|达|突破)?\\s*\\d+\\s*万\\s*(?:家|名|位)?(?:企业|客户|用户|家庭|商家|品牌)',\
          \ _cust, text)\n    # 模式B: 4位数以上(服务超过10000家企业) - 必须有企业/客户类noun\n    text\
          \ = re.sub(r'(?:服务|覆盖|服务过|累计服务|惠及|已为)\\s*(?:超过|超|逾|累计|达|突破)?\\s*\\d{4,}\\\
          s*(?:家|名|位)?\\s*(?:企业|客户|用户|家庭|商家|品牌)', _cust, text)\n    return text\n\n\
          def remove_scoring(text, mode='standard'):\n    \"\"\"清除编造的评分/星级/打分。标准模式保留(排名文章需要),仅医疗/金融清除\"\
          \"\"\n    if not text: return text\n    if mode not in (\"medical\", \"\
          financial\"):\n        return text  # 标准/品牌: 保留评分(排名呈现需要)\n    # X/10 X/100\
          \ 评分\n    text = re.sub(r'(?:综合)?(?:评分|得分|打分|评价)?\\s*[:：]?\\s*\\d+\\.?\\\
          d*\\s*/\\s*(?:10|100)\\s*分?', '', text)\n    # 星级 ★☆\n    text = re.sub(r'[★☆]{1,5}',\
          \ '', text)\n    # \"综合评分9.2\" \"评分:8.5\"\n    text = re.sub(r'(?:综合)?(?:评分|得分|打分)\\\
          s*[:：]?\\s*\\d+\\.?\\d*\\s*分?', '', text)\n    # \"X分(满分10/100)\"\n    text\
          \ = re.sub(r'\\d+\\.?\\d*\\s*分\\s*[（(]\\s*满分\\s*\\d+\\s*[）)]', '', text)\n\
          \    # \"9.2分\"独立(避免误删\"5分钟\"\"分析\")\n    text = re.sub(r'(?<![钟够])\\b\\\
          d+\\.\\d+\\s*分(?![钟析类])', '', text)\n    # 雷达图/评分维度/评分体系\n    text = re.sub(r'雷达图|评分维度|打分表|评分卡',\
          \ '', text)\n    text = re.sub(r'满分\\d+分的?(?:评价体系|评分体系|打分体系)?', '', text)\n\
          \    text = re.sub(r'(?:百分制|十分制|五分制|\\d+分制)(?:评分|评价)?', '', text)\n    #\
          \ 清理残留的\"评分：\"空标签\n    text = re.sub(r'(?:综合)?评分\\s*[:：]\\s*(?=[，。；,;<\\\
          s])', '', text)\n    return text\n\ndef clean_medical_comparison(text, compliance_mode):\n\
          \    \"\"\"医疗/金融模式: 清洗对比/评价词(《医疗广告认定指南》)\"\"\"\n    if compliance_mode not\
          \ in (\"medical\", \"financial\"):\n        return text\n    replacements\
          \ = [\n        (r'不如[^，。；,;]*?(?=[，。；,;])', ''),\n        (r'相比[^，。；,;]*?(?=[，。；,;])',\
          \ ''),\n        (r'与其他[^，。；,;]*?(?=[，。；,;])', ''),\n        (r'比[^，。；,;]{0,8}(?:医院|机构|诊所|银行|券商)[^，。；,;]*?(?=[，。；,;])',\
          \ ''),\n        (r'(?:更|最)(?:专业|优秀|领先|权威|可靠|出色|强|好|优)', '具有专业能力'),\n   \
          \     (r'适配度相对?[高低][一些]*', '需结合个体情况'),\n        (r'适配度(?:更)?[高低]', '需结合个体情况'),\n\
          \        (r'相对更?[低高]', '存在差异'),\n        (r'(?:明显|显著)?(?:领先|优于|强于|胜过)(?:同行|其他|同类)?',\
          \ '具有特色'),\n        (r'(隐私保护|服务态度|就诊体验|私密性|诊疗体验)(?:程度|水平)?[一般有限较差好]+', r'\\\
          1因机构而异'),\n        (r'(?<![一健])一般(?=[，。；,;）)])', '因情况而异'),\n    ]\n    for\
          \ pat, repl in replacements:\n        text = re.sub(pat, repl, text)\n \
          \   return text\n\n\ndef main(articles, compliance_mode: str = \"standard\"\
          , ent_body: str = \"\", prod_body: str = \"\"):\n    if not isinstance(articles,\
          \ list):\n        return {\"cleaned_articles\": []}\n\n    global_mode =\
          \ compliance_mode or \"standard\"\n    cleaned = []\n    for art in (articles\
          \ or []):\n        if not isinstance(art, dict):\n            continue \
          \ # 跳过 None/非字典项, 不再原样传给下游(否则 N8结果合并 item.get 崩 NoneType)\n\n        # 关键:\
          \ 用每篇自己的 _compliance_mode(articles-merge已标), 而非全局模式\n        # 否则混批(标准+医疗)时,\
          \ 全局medical会把标准文的主推\"第一\"/评分误删\n        mode = art.get('_compliance_mode')\
          \ or global_mode\n\n        title = str(art.get('title', ''))\n        description\
          \ = str(art.get('description', ''))\n        content = str(art.get('content',\
          \ ''))\n        tags = art.get('tags', [])\n        self_review = str(art.get('self_review',\
          \ ''))\n\n        kb_combined = (ent_body or '') + '\\n' + (prod_body or\
          \ '')\n        new_title = fix_title_xx(clean_one(title, mode, kb_combined))\n\
          \        new_desc = clean_one(description, mode, kb_combined)\n        new_content\
          \ = clean_one(content, mode, kb_combined)\n        new_content = clean_medical_comparison(new_content,\
          \ mode)  # 医疗对比词清洗\n        new_content = normalize_punctuation(new_content)\
          \  # 对比词删除后再清标点\n        new_review = clean_self_review(self_review)\n\n\
          \        if isinstance(tags, list):\n            new_tags = []\n       \
          \     for t in tags:\n                t = political_compliance(str(t))\n\
          \                # 医疗/金融: 删tag里的对比/排名词\n                if mode in (\"medical\"\
          , \"financial\"):\n                    t = re.sub(r'对比|排名|排行|PK|vs|VS|榜单?|TOP\\\
          d*|第一|最佳|最好', '', t)\n                t = t.strip('，,、。.；; 　')\n       \
          \         # 长度截断到15字符\n                if len(t) > 15:\n               \
          \     t = t[:15]\n                if t:\n                    new_tags.append(t)\n\
          \        else:\n            new_tags = tags\n\n        cleaned.append({\n\
          \            'title': new_title,\n            'description': new_desc,\n\
          \            'content': new_content,\n            'tags': new_tags,\n  \
          \          'self_review': new_review,\n        })\n\n    return {\"cleaned_articles\"\
          : cleaned}\n"
