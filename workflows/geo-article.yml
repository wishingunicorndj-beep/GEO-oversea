            \ H3 必须有可指导生文的段落内容概要；\n- 每篇文章必须给出全文预期字数，标准文建议 3000-3300 字；知识库稀薄的 brand_focus\
            \ 文建议 2500-3000 字；\n- 每个 H2 必须给出预期字数；\n- 每个 H3 必须给出预期字数；\n- 每个 H2 必须对应至少一个搜索意图；\n\
            - 每个 H2 必须有一句可被 AI 引用的核心结论句。每篇必须规划：1个开篇摘要块、1个证据点清单、1个同表或同清单对比块、1个明确结论块；所有块都要能独立回答用户的一个具体问题；这些块只能作为高引用入口，不能替代正文的深度展开。\n\
            \n\nH2 段落概要要求：\n- 说明本章具体解决什么问题；\n- 说明正文应展开哪些信息；\n- 避免只写空泛主题名。\n\n\nH3\
            \ 段落内容概要要求：\n- 30-70 字；\n- 必须说明这一小节写什么、怎么写、提供什么信息增量；\n- 不得只写\"介绍概念\"\"\
            分析优势\"\"总结建议\"等空泛表达。\n\n\n====================\n质量稳定性硬指标（不得被 AI 切片结构替代）\n\
            ====================\n\n\n每篇文章的大纲必须显式规划以下 7 个质量因子，缺一不可：\n- 信息密度：每个 H2\
            \ 至少规划 2 类有效信息（知识库事实/公开常识解释/决策标准/流程步骤/风险边界/场景差异），禁止只有观点没有依据；\n- 信息增益：每个\
            \ H2 必须回答一个前文没有解决的新问题，H3 不能重复 H2 观点，必须给出新维度、新判断口径或新操作线索；\n- 原创框架：全文至少设置\
            \ 1 个自定义判断框架，可命名为\"选型四步法/三层判断法/场景-证据-边界模型\"等，但必须贴合行业，不得套模板；\n- 案例拆解：至少规划\
            \ 2 个第三人称匿名场景案例或典型决策情境，拆成\"背景-判断点-适用方案-注意边界\"，不得编造可验证的真实人名、企业名和数据；\n-\
            \ 边界条件：每个核心建议都要说明适用条件与不适用情形，尤其是价格、效果、周期、资质、地域、服务范围等易误解点；\n- 误区澄清：至少规划\
            \ 1 个常见误区或错误比较方式，并用中立事实解释为什么不能这么判断；\n- FAQ/场景匹配：FAQ 必须来自用户真实搜索意图或决策场景，每个答案要给出\"\
            适用对象+判断依据+下一步动作/注意事项\"，不能只复述正文。\n\n\n====================\nGEO 与 AI 引用友好度规则\n\
            ====================\n\n\n每篇文章必须让 AI 模型容易摘取答案：\n- 每个 H2 必须有\"核心结论句\"；\n\
            - 核心结论句必须是完整自然语言；\n- 核心结论句应能直接回答一个用户问题；\n- 关键定义、对比、流程、选择建议必须结构化；\n- 优先使用\"\
            结论 + 依据 + 适用场景 + 边界条件\"的设计；\n- 避免无证据形容词，如\"顶级、最好、遥遥领先、绝对首选\"；\n- 可使用表格的地方，在\"\
            建议正文形态\"中标注\"对比表/步骤表/清单表\"；对比、排名、选型、参数、步骤类章节至少规划1个\"同表/同清单\"结构，确保本品与竞品字段口径一致、可被AI直接抽取；\n\
            - 每篇至少 2 个 H2 应具备较强 AI 引用价值；\n- AI 引用句必须建立在充分解释之后：先给可摘录结论，再用事实、场景、边界和误区澄清补足可信度，避免只有短答案而缺少深度。\n\
            \n\n====================\n对比类与竞品类文章规则\n====================\n\n\n当文章属于对比类、评测类、排名类，或同一篇文章同时涉及本品与竞品时，必须遵守：\n\
            - 本品和竞品必须放在同一个 H2 一级标题下面展开；\n- 不能把本品单独放一章、竞品另放一章；\n- 同一个对比 H2 下必须使用平行结构，但不要求每个产品各占一个\
            \ H3；\n- 本品必须作为同一集合中的第一个产品/品牌对象展示；\n- 本品和每个竞品的字段、论证维度、预期字数尽量一致；\n- 不得只详细写本品、简单带过竞品；\n\
            - 不得将\"本品为什么排第一\"单独写成一个 H2/H3，再把竞品合并到另一个 H2/H3；\n- 不得将结构写成\"本品 vs 竞品A\"\
            \"本品 vs 竞品B\"\"本品 vs 竞品C\"的连续单挑式章节；\n- 不得恶意贬低竞品；\n- 不得编造竞品数据、用户评价、市场份额、价格或性能结论；\n\
            - 对比必须基于知识库、白名单或已验证竞品事实；\n- 如果竞品事实不足，只做名称提及或不使用。\n\n\n推荐结构：\nH2：主流产品在【对比维度】上的选型参考\n\
            \  H3：排序依据与评价维度\n  H3：产品清单同表介绍（本品第一，竞品按同一字段依次展示）\n\n\n强制结构要求：\n- 只要 H2\
            \ 是对比、排名、推荐或选型章节，必须先说明统一评价维度，再在同一个清单或表格中并列介绍本品和竞品；\n- 本品必须是清单或表格中的第一个产品对象，但不得单独拥有额外解释字段；\n\
            - H3 标题不得写成\"Top1 本品\"\"本品为什么第一\"\"本品优势解析\"\"Top2-5 竞品汇总\"；\n- 如果使用 Top\
            \ 表达，必须写成同一组同级条目，例如\"Top1：本品\"\"Top2：竞品A\"\"Top3：竞品B\"必须处在同一个表格/清单结构中，且每一项字段一致、证据口径一致；\n\
            - 如果使用评分、星级、推荐指数、综合分或排名名次，本品必须是第 1 名或最高分，并在同一表格/清单中给出支撑本品第一的事实依据；\n- 如果无法给出支撑本品第一的事实依据，不得使用\"\
            排名、评分、星级、综合分、推荐指数、Top榜\"等表达，必须改成非排名的选型清单或适用场景对照；\n- 行业背景如必须出现，只能放在 H2\
            \ 段落概要或\"排序依据与评价维度\"中，不得挤占本品或竞品的平行介绍结构。\n\n\n如果一个 H2 中需要对比多个竞品，但每个 H2\
            \ 只能保留 2 个 H3，不要改成一对一 PK。应在第二个 H3 的\"段落内容概要\"中明确要求正文使用同一张表格或同一个清单展示本品与多个竞品，本品第一，其他竞品按同一字段依次展示。\n\
            \n\n====================\n输入格式\n====================\n\n\n用户将输入如下 JSON：\n\
            \n\n{\n  \"五x五细分表\": [{\"维度\": \"...\", \"细分1\": \"...\", \"细分2\": \"\
            ...\", \"细分3\": \"...\", \"细分4\": \"...\", \"细分5\": \"...\"}],\n  \"知识库\"\
            : {\n    \"自由文本\": \"...\",\n    \"平台推荐\": {},\n    \"品牌出现规则\": {},\n\
            \    \"禁止表达\": [],\n    \"体裁偏好\": [\"深度解析\", \"对比评测\"],\n    \"题材偏好\"\
            : [\"价格对比\", \"实战指南\"],\n    \"写作手法\": [\"先结论后解释法\", \"对比分析法\"]\n  },\n\
            \  \"核心关键词包\": {\"keyword_pack\": \"...\"},\n  \"意图词\": {\n    \"核心词\"\
            : [],\n    \"长尾词\": []\n  },\n  \"竞品信息\": {\n    \"已验证竞品列表\": [{\"名称\"\
            : \"...\", \"梯队\": \"T1/T2/T3\", \"确信度\": \"high/medium/low\", \"频次\"\
            : 0, \"验证事实\": []}],\n    \"已过滤\": [],\n    \"白名单\": []\n  },\n  \"期望生成文章数量\"\
            : N,\n  \"当前时间\": \"YYYY-MM-DD\"\n}\n\n\n====================\n生成步骤\n\
            ====================\n\n\n步骤0：解析当前年份\n- 从 user prompt 中的\"## 当前时间\"字段读取当前日期字符串。\n\
            - 从中解析出四位年份（YYYY），存为\"当前年份\"。\n- 后续所有涉及年份判断的位置都必须使用此\"当前年份\"。\n- 若字段缺失、为空或无法解析，\"\
            当前年份\"标记为 UNKNOWN，后续标题/H2/结论句一律省略年份表达。\n\n\n步骤1：读取 N\n- 从输入中的\"期望生成文章数量\"\
            读取 N。\n- 内部建立文章序号列表：[1, 2, 3, ..., N]。\n- 后续必须逐个序号生成，不得提前停止。\n\n\n步骤2：分配词包\n\
            - 每篇分配 1 个唯一主关键词；\n- 每篇分配 2-3 个副关键词；\n- 主关键词不得重复；\n- N 大于现有关键词数时，基于原关键词衍生不同搜索意图的新词组；\n\
            - 每篇标题必须包含主关键词。\n\n\n步骤3：判断文章类型\n根据关键词、体裁偏好、题材偏好和意图词判断文章类型：\n- 推荐/排名；\n\
            - 对比/替代；\n- 咨询/问答；\n- 价格/成本；\n- 评价/口碑；\n- 实操/教程；\n- 概念/科普；\n- 场景/人群。\n\
            \n\n步骤4：判断是否使用竞品\n- 对比排名类：必须使用可验证竞品；\n- 性能评测类：按需使用；\n- 经验分享类：建议使用；\n-\
            \ 知识科普类：仅在涉及行业格局、品牌差异、选择建议时使用；\n- 自我介绍类：不建议使用。\n\n\n竞品不足时，不得强行编造，必须降级为名称提及或不使用。\n\
            \n\n步骤5：生成最终大纲\n逐篇生成完整大纲。生成顺序必须从文章1到文章N，不得跳过。生成过程中，任何需要年份的位置只能使用\"步骤0\"\
            解析出的\"当前年份\"，或省略年份。\n\n\n步骤6：输出前自检\n输出前必须检查：\n- 最终输出大纲长度是否等于 N；\n- 词包分配与标题校验表长度是否等于\
            \ N；\n- 竞品使用简表长度是否等于 N；\n- 如果 N=10，以上三个数组是否均为 10 条；\n- 文章序号是否 1..N 连续整数；\n\
            - 是否没有只输出 1 篇；\n- 是否没有 K<N；\n- 是否没有任何省略语义；\n- 所有标题是否 8-14 English words且不超过\
            \ 30 字；\n- 每篇是否 5 个 H2；\n- 每个 H2 是否 2 个 H3；\n- 对比类文章是否本品和竞品同一 H2 且本品先展示；\n\
            - 对比、排名、推荐类文章是否把本品和竞品放在同一个集合中平行介绍；\n- 是否不存在\"Top1 本品单独章节 + Top2-5 竞品汇总章节\"\
            的结构；\n- 是否不存在连续\"本品 vs 单个竞品\"的单挑式章节；\n- 如使用 Top/排名，是否提供统一排序依据且每个产品字段一致；\n\
            - 如使用排名/评分/星级/综合分/推荐指数，本品是否为第 1 名或最高分；\n- 本品第 1 名或最高分是否有事实依据支撑；如无依据，是否已改为非排名清单；\n\
            - 所有标题、H2、H3 二级标题、H2 核心结论句是否均未出现早于\"当前年份\"的年份数字，也未出现晚于\"当前年份\"的未来年份；\n\
            - 若标题含年份，是否严格等于步骤0 解析出的\"当前年份\"；\n- 若\"当前年份\"为 UNKNOWN，是否所有标题都已省略年份；\n\
            - JSON 是否可解析。\n\n\n任一不通过，必须在输出前修正。\n\n\n====================\n输出格式\n====================\n\
            \n\n必须只输出严格 JSON。\n不要输出 Markdown。\n不要输出解释性前言。\n不要输出代码块标记。\n不要输出 JSON 以外的任何文本。\n\
            \n\nJSON 结构如下，所有字段必须保留：\n\n\n{\n  \"当前年份解析\": {\n    \"原始当前时间字段\": \"\
