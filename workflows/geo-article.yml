          \    # 3.去孤立的\"求/的/了\"等\n    out = re.sub(r'^(求|的|了|啊|吧|呢)', '', out)\n\
          \    out = out.strip(' ,，.。:：-—_的了')\n    # 4.太短回退到行业词\n    if len(out)\
