          , \"最多\", \"最少\"]\n    result = []\n    i = 0\n    while i < len(text):\n\
          \        if text[i] == \"最\" and i + 1 < len(text):\n            is_safe\
          \ = False\n            for prefix in safe_starts:\n                if text[i:i+len(prefix)]\
          \ == prefix:\n                    result.append(prefix)\n              \
