          \    'ecommerce': ['电商', '跨境电商', '直播带货', '零售电商'],\n}\n\ndef _to_str(v):\n\
          \    if v is None:\n        return ''\n    if isinstance(v, (list, dict)):\n\
          \        try:\n            return json.dumps(v, ensure_ascii=False)\n  \
          \      except Exception:\n            return str(v)\n    return str(v)\n\
          \ndef _to_list(v):\n    if v is None:\n        return []\n    if isinstance(v,\
          \ list):\n        return v\n    if isinstance(v, tuple):\n        return\
          \ list(v)\n    if isinstance(v, str):\n        s = v.strip()\n        if\
          \ not s:\n            return []\n        try:\n            j = json.loads(s)\n\
          \            if isinstance(j, list):\n                return j\n       \
          \ except Exception:\n            pass\n        return [x.strip() for x in\
          \ re.split(r'[、,,;;\\s]+', s) if x.strip()]\n    return []\n\ndef _to_dict(v):\n\
          \    if v is None:\n        return {}\n    if isinstance(v, dict):\n   \
          \     return v\n    if isinstance(v, str):\n        s = v.strip()\n    \
          \    if not s:\n            return {}\n        try:\n            j = json.loads(s)\n\
          \            return j if isinstance(j, dict) else {}\n        except Exception:\n\
          \            return {}\n    return {}\n\nINVALID_NAMES_SET = {'候选名', '候选竞品',\
          \ '待校验', 'XX', 'xx', '某某', '<name>', 'name', '未知', 'unknown'}\n\ndef _fix_echoed_name(name):\n\
          \    n = str(name or '').strip()\n    if not n:\n        return ''\n   \
          \ if n in INVALID_NAMES_SET:\n        return ''\n    if '候选' in n or '{'\
          \ in n or '}' in n or '\\\"name\\\"' in n:\n        return ''\n    return\
          \ n\n\ndef _norm_name(s):\n    return re.sub(r'[\\s\\(\\)()\\-·,，。.]+',\
          \ '', str(s or '').lower())\n\n# ============================================================\n\
          # 【改动 1】_core_brand_n：新增地域前缀剥离 + 阈值收紧\n# ============================================================\n\
          _LOC_PREFIXES = (\n    '上海', '北京', '广州', '深圳', '杭州', '南京', '苏州',\n    '成都',\
          \ '武汉', '重庆', '天津', '西安', '青岛', '大连',\n    '厦门', '宁波', '无锡', '合肥', '长沙',\
          \ '郑州', '济南',\n    '福州', '东莞', '佛山', '中国',\n)\n\ndef _strip_loc_prefix(k):\n\
          \    if not k:\n        return ''\n    for p in _LOC_PREFIXES:\n       \
          \ if k.startswith(p) and len(k) > len(p):\n            return k[len(p):]\n\
          \    return k\n\ndef _core_brand_n(k):\n    \"\"\"v6.1: 先剥离地域前缀, 剥离后 >=3\
          \ 字符才启用; 取前 4 字符\"\"\"\n    if not k:\n        return ''\n    stripped =\
          \ _strip_loc_prefix(k)\n    if len(stripped) < 3:\n        return ''\n \
          \   return stripped[:4]\n# ============================================================\n\
          \ndef detect_track(keyword_text):\n    kt = _to_str(keyword_text)\n    if\
          \ not kt:\n        return 'unknown'\n    for kw in TRACK_KEYWORDS['pediatric_cough']:\n\
          \        if kw in kt:\n            return 'pediatric_cough'\n    for kw\
          \ in TRACK_KEYWORDS['cardiovascular']:\n        if kw in kt:\n         \
          \   return 'cardiovascular'\n    for kw in TRACK_KEYWORDS['adult_cold']:\n\
          \        if kw in kt:\n            return 'adult_cold'\n    best_track =\
          \ 'unknown'\n    best_hits = 0\n    for track_name in ('decoration', 'exhibition',\
          \ 'education', 'saas',\n                       'catering', 'beauty', 'auto',\
          \ 'realestate', 'ecommerce'):\n        hits = sum(1 for kw in TRACK_KEYWORDS[track_name]\
          \ if kw in kt)\n        if hits > best_hits:\n            best_hits = hits\n\
          \            best_track = track_name\n    return best_track\n\ndef classify_product(product_name,\
          \ rx_blacklist, otc_whitelist, rx_patterns, off_topic_set):\n    for rx\
          \ in rx_blacklist:\n        if rx and rx in product_name:\n            return\
          \ 'rx_blacklist'\n    for ot in off_topic_set:\n        if ot and ot in\
          \ product_name:\n            return 'off_topic'\n    for pat in rx_patterns:\n\
          \        try:\n            if re.match(pat, product_name):\n           \
          \     return 'rx_pattern'\n        except re.error:\n            continue\n\
          \    for otc in otc_whitelist:\n        if otc and (otc in product_name\
          \ or product_name in otc):\n            return 'otc_confirmed'\n    return\
          \ 'unknown'\n\nPRODUCT_NAME_PATTERN = re.compile(\n    r'([一-龥]{2,12}(?:颗粒|口服液|糖浆|片|丸|胶囊|散|膏|散剂|合剂|滴丸|注射液|注射剂))'\n\
          )\n\ndef extract_and_classify_products(fact_text, rx_blacklist, otc_whitelist,\
          \ rx_patterns, off_topic_set):\n    products = PRODUCT_NAME_PATTERN.findall(fact_text\
          \ or \"\")\n    classification = {'rx_blacklist': [], 'rx_pattern': [],\
          \ 'off_topic': [], 'otc_confirmed': [], 'unknown': []}\n    for p in set(products):\n\
          \        cat = classify_product(p, rx_blacklist, otc_whitelist, rx_patterns,\
          \ off_topic_set)\n        classification[cat].append(p)\n    return classification\n\
          \ndef clean_fact(fact_text, rx_blacklist, otc_whitelist, rx_patterns, off_topic_set,\
          \ track='unknown'):\n    if not fact_text:\n        return \"\", {'rx_blacklist':\
          \ [], 'rx_pattern': [], 'off_topic': [], 'otc_confirmed': [], 'unknown':\
          \ []}\n    cleaned = fact_text\n    classification = extract_and_classify_products(fact_text,\
          \ rx_blacklist, otc_whitelist, rx_patterns, off_topic_set)\n    to_delete\
          \ = classification['rx_blacklist'] + classification['rx_pattern'] + classification['off_topic']\n\
          \    for name in to_delete:\n        pattern = r'[,,、]?[^,,、。]*?' + re.escape(name)\
          \ + r'[^,,、。]*'\n        cleaned = re.sub(pattern, '', cleaned)\n    category_desc\
          \ = {\n        'pediatric_cough': '儿科呼吸系统OTC中成药',\n        'adult_cold':\
          \ '成人感冒OTC药品',\n        'cardiovascular': '心血管OTC品类',\n        'unknown':\
          \ '相关OTC产品',\n    }.get(track, '相关OTC产品')\n    for name in classification['unknown']:\n\
          \        cleaned = cleaned.replace(name, category_desc)\n    remove_patterns\
          \ = [\n        r'[,,、]?\\s*入选多?版?[^,,、。]*?(?:指南|目录|推荐)[^,,、。]*',\n     \
          \   r'[,,、]?\\s*(?:荣获|被评为|获评|获得)[^,,、。]*?(?:奖|称号|荣誉)[^,,、。]*',\n       \
          \ r'[,,、]?\\s*(?:年销售额|年营收|销售额|营收)[^,,、。]*?\\d+[^,,、。]*',\n        r'[,,、]?\\\
          s*(?:市场份额|排名|位列|位居)[^,,、。]*?(?:第|TOP|前)\\s*\\d+[^,,、。]*',\n        r'[,,、]?\\\
          s*国有控股[^,,、。]*',\n    ]\n    for pattern in remove_patterns:\n        cleaned\
          \ = re.sub(pattern, '', cleaned)\n    cleaned = re.sub(r'^[,,、\\s]+', '',\
          \ cleaned)\n    cleaned = re.sub(r'[,,、\\s]+$', '', cleaned)\n    cleaned\
          \ = re.sub(r'[,,、]{2,}', ',', cleaned)\n    cleaned = cleaned.strip()\n\
          \    if to_delete:\n        if len(cleaned) < 10:\n            cleaned =\
          \ \"该机构主营业务建议查询其官网或药监部门公示信息(注:核心产品归属待核实)\"\n        else:\n            cleaned\
          \ += \"(注:核心产品归属待核实)\"\n    if not cleaned or len(cleaned) < 4:\n      \
          \  cleaned = \"该机构为本行业已知品牌\"\n    return cleaned, classification\n\nADDRESS_KEYWORDS\
          \ = {'路', '街', '号', '大道', '栋', '广场', '层', '楼', '弄', '巷', '胡同', '里', '苑',\
          \ '小区'}\n\ndef _has_address(fact_text):\n    return bool(fact_text) and\
          \ any(kw in fact_text for kw in ADDRESS_KEYWORDS)\n\ndef is_vague_description(fact):\n\
          \    if not fact:\n        return True\n    vague_patterns = [\n       \
          \ r'正规注册', r'正规.*机构', r'具备.*资质', r'覆盖.*需求',\n        r'可提供.*服务', r'可满足.*需求',\
          \ r'可开展.*项目',\n        r'本地.*机构', r'连锁.*品牌', r'全国连锁',\n        r'综合.*机构',\
          \ r'主流.*项目', r'常规.*服务',\n        r'口碑较好', r'口碑不错', r'本地口碑',\n        r'印象中',\
          \ r'疑似', r'待核实', r'暂未核实',\n        r'具体.*模糊', r'具体.*信息.*有限', r'细节.*模糊',\n\
          \    ]\n    cleaned = fact\n    for p in vague_patterns:\n        cleaned\
          \ = re.sub(p, '', cleaned)\n    cleaned = re.sub(r'[\\s,,。、;;::(()()\\-——]',\
          \ '', cleaned)\n    return len(cleaned) < 10\n\ndef is_fake_region(name,\
          \ fact, region):\n    if not region or len(region) < 2:\n        return\
          \ False\n    region_core = region.rstrip('市区县省')\n    if len(region_core)\
          \ < 2:\n        region_core = region\n    if region not in name and region_core\
          \ not in name:\n        return False\n    if _has_address(fact):\n     \
          \   return False\n    if fact and not is_vague_description(fact):\n    \
          \    return False\n    return True\n\ndef is_fake_branch(name, fact):\n\
          \    if not any(x in name for x in ['分院', '分店', '分部', '分所', '分中心']):\n \
          \       return False\n    return not _has_address(fact)\n\ndef is_likely_chain_fabrication(name,\
          \ fact, region):\n    if not region or len(region) < 2:\n        return\
          \ False\n    region_core = region.rstrip('市区县')\n    if len(region_core)\
          \ < 2:\n        region_core = region\n    for brand in NATIONAL_CHAIN_BRANDS:\n\
          \        if brand in name and (region in name or region_core in name):\n\
          \            if _has_address(fact):\n                return False\n    \
          \        return True\n    return False\n\ndef _parse_verify_item(item):\n\
          \    if isinstance(item, dict):\n        return item\n    if isinstance(item,\
          \ str):\n        s = item.strip()\n        if s.startswith('```'):\n   \
          \         s = re.sub(r'^```(?:json)?\\s*', '', s)\n            s = re.sub(r'\\\
          s*```$', '', s)\n        try:\n            return json.loads(s)\n      \
          \  except Exception:\n            m = re.search(r'\\{[\\s\\S]*\\}', s)\n\
          \            if m:\n                try:\n                    return json.loads(m.group(0))\n\
          \                except Exception:\n                    return {}\n    return\
          \ {}\n\ndef _extract_content_from_response(item):\n    if not isinstance(item,\
          \ dict):\n        return item\n    if 'name' in item and 'verified' in item:\n\
          \        return item\n    body = item.get('body')\n    if isinstance(body,\
