          \ > 0]\n        if not active:\n            active = [\"对比排名类\"]\n     \
          \   active.sort(key=lambda t: (-weights.get(t, 0), fixed_priority.get(t,\
          \ 99)))\n        # 竞品类型上限(各≤30%, 10篇=各3)\n        comp_cap = max(1, round(total\
          \ * 0.3))\n        caps = {\"对比排名类\": comp_cap, \"性能评测类\": comp_cap}\n \
          \       # 无上限的\"溢出接收\"类型(选型指南优先, 其次经验/科普)\n        overflow_order = [\"\
          选型指南类\", \"经验分享类\", \"知识科普类\", \"自我介绍类\"]\n        alloc = {t: 0 for t in\
          \ active}\n        guard = 0\n        while sum(alloc.values()) < total\
          \ and guard < 1000:\n            guard += 1\n            placed = False\n\
          \            for t in active:\n                if sum(alloc.values()) >=\
