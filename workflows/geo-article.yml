            2. **服务范围型**：详解能提供的具体服务和处理方式\n3. **流程介绍型**：逐步详解服务/办案/操作流程\n4. **口碑评价型**：第三方视角多维度评价\n\
            5. **特色服务型**：深度介绍独有方法/技术/模式\n6. **专项能力型**：聚焦某细分领域的专业能力\n\n\n## 事实独立性铁律（防止拼接造假）\n\
            知识库的每条事实必须**独立引用**，**绝对不能**拼接两条独立事实造成误导：\n\n❌ 错误示例：\n- 知识库A=\"入选 2026\
