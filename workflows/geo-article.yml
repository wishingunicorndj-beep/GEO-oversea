            \ 也别凑到6家里混进张冠李戴或纯臆测的。客户若提供了「已知竞品」, 以客户的为准。\n\n## 输出格式\n\n按以下格式输出,**按置信度分级**:\n\
            \n### \U0001F7E2 高置信机构(你在训练数据中明确见过这家机构的具体信息——如地址/科室/医生/新闻报道等,不是只见过品牌名)\n\
