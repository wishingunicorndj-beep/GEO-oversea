    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\n节点 7-5a：数据处理代码节点（最终修复版）\n\n关键修复：\n\
          1. THINK 标签写正确（<think>...</think> 而非 <!think>）\n2. 简化逻辑：clean_out 有效就直接用，不做不必要的\"\
          重建\"\n3. markers 占位符仅匹配明确的占位符，不误伤正常文章\n4. 解析 JSON 时优先剥 markdown 围栏（```json\
          \ ... ```）\n5. content 有效性阈值收紧（标准文>=2500字，低于阈值视为短文并回退/重写）\n6. JSON 畸形/截断时从原始文本直接提取\
          \ HTML 正文兜底\n\"\"\"\nimport re\nimport json\n\nMAX_INPUT_LEN = 200_000\n\
          \ndef _clamp(val):\n    if isinstance(val, str) and len(val) > MAX_INPUT_LEN:\n\
          \        return val[:MAX_INPUT_LEN]\n    return val\n\ndef _strip_think(raw):\n\
          \    \"\"\"剥离 <think>...</think> 思考链\"\"\"\n    if not raw or not isinstance(raw,\
          \ str):\n        return raw or ''\n    s = re.sub(r'<think>.*?</think>',\
          \ '', raw, flags=re.S | re.I)\n    if '</think>' in s:\n        s = s.split('</think>',\
          \ 1)[-1]\n    if '<think>' in s:\n        s = re.sub(r'<think>.*', '', s,\
          \ flags=re.S | re.I)\n    return s\n\ndef _parse_json(text):\n    \"\"\"\
          从字符串中提取并解析 JSON 对象，宽容处理 markdown 围栏\"\"\"\n    if not text or not isinstance(text,\
          \ str):\n        return {}\n    s = _strip_think(text).strip()\n    # 剥\
          \ markdown 围栏\n    m = re.search(r'```(?:json)?\\s*(\\{[\\s\\S]*\\})\\s*```',\
          \ s, re.S)\n    if m:\n        s = m.group(1)\n    # 直接解析\n    try:\n  \
          \      obj = json.loads(s, strict=False)\n        if isinstance(obj, dict):\n\
          \            return obj\n    except Exception:\n        pass\n    # 兜底：抠出第一个\
          \ { 到最后一个 } 的范围\n    start = s.find('{')\n    end = s.rfind('}')\n    if\
          \ start >= 0 and end > start:\n        try:\n            obj = json.loads(s[start:end\
          \ + 1], strict=False)\n            if isinstance(obj, dict):\n         \
          \       return obj\n        except Exception:\n            pass\n    # ===\
          \ 新增：JSON 截断(无闭合 })时尝试补全后解析 ===\n    if start >= 0 and (end < 0 or end <=\
          \ start):\n        _block = s[start:].rstrip().rstrip(',')\n        _suffixes\
          \ = ['\"' + '}', '\"]}', '\"' + '}]']\n        for suffix in _suffixes:\n\
          \            try:\n                obj = json.loads(_block + suffix, strict=False)\n\
          \                if isinstance(obj, dict):\n                    return obj\n\
          \            except Exception:\n                continue\n    return {}\n\
          \ndef _extract_html(s):\n    \"\"\"从可能的畸形 JSON 包裹里抠出 HTML 正文,容忍末尾标签未闭合\"\
          \"\"\n    if not s:\n        return ''\n    # === 修改：从第一个 HTML 标签起抓到原文末尾,容忍末尾标签未闭合(LLM\
          \ 偶发截断) ===\n    m = re.search(r'<(?:p|h[1-6])[\\s>][\\s\\S]*', s, flags=re.I)\n\
          \    if m:\n        html = m.group(0).strip()\n        # 清理末尾可能混入的安全拒答话术(模型审查截断)\n\
          \        html = re.sub(r'(?:您好|你好)[，,](?:虽然)?我(?:无法|不能)[\\s\\S]*$', '',\
          \ html).rstrip()\n        return html\n    return ''\n\n# === 新增：JSON 畸形/截断时从原始文本正则抽字段\
          \ ===\ndef _regex_extract_field(raw, field):\n    \"\"\"从原始文本里直接抽 \"field\"\
          : \"value\"(应对 LLM 输出畸形/截断 JSON)\"\"\"\n    if not raw or not field:\n \
          \       return ''\n    pattern = r'\"%s\"\\s*:\\s*\"((?:\\\\.|[^\"\\\\])*)\"\
          ' % re.escape(field)\n    m = re.search(pattern, raw, re.S)\n    if not\
          \ m:\n        return ''\n    val = m.group(1)\n    val = val.replace('\\\
          \\\"', '\"').replace('\\\\\\\\', '\\\\').replace('\\\\n', '\\n').replace('\\\
          \\t', '\\t')\n    return val.strip()\n\ndef _to_plain(html):\n    return\
          \ re.sub(r'<[^>]+>', '', html or '').strip()\n\nPLACEHOLDER_MARKERS = [\n\
          \    '（原样）', '(原样)', '此处省略', '其余略', '(略)', '（略）', '内容不变同上',\n]\n\ndef _check_broken(content_html,\
          \ content_plain):\n    \"\"\"判定内容是否异常，返回异常原因（空字符串表示正常）\n\n    安全网：只要纯文本长度\
          \ >= 2500，才直接判定为可用；低于2500视为短文风险，\n    避免任何 marker 子串误伤正常长文。\n    \"\"\"\n\
          \    if not content_html or not content_plain:\n        return '为空'\n  \
          \  if '<think>' in content_html or '</think>' in content_html:\n       \
          \ return '残留思考链'\n    # 安全网：长度充足时直接放行，不再检查任何 marker\n    if len(content_plain)\
          \ < 2500:\n        return f'正文过短({len(content_plain)}字,标准文目标3000-3500/稀薄品牌文至少2500):疑似截断或展开不足,必须回退改写/重写,不得直接采用'\n\
          \    return ''\n    # 短文本才检查占位符\n    for mk in PLACEHOLDER_MARKERS:\n  \
          \      if mk in content_html:\n            return '占位符'\n    if content_plain.endswith('原样'):\n\
          \        return '占位符'\n    return '过短(%d字)' % len(content_plain)\n\n\n#\
          \ === 新增：从原始文本全量提取内容(JSON 完全解析失败时的终极兜底) ===\ndef _rescue_from_raw(raw_text):\n\
          \    \"\"\"当 _parse_json 返回空 dict 时,尝试从原始文本直接抢救出文章内容\"\"\"\n    if not raw_text\
          \ or not isinstance(raw_text, str):\n        return '', '', '', [], ''\n\
          \    cleaned = _strip_think(raw_text)\n    # 提取 HTML 正文\n    content = _extract_html(cleaned)\n\
          \    if not content:\n        return '', '', '', [], ''\n    # 正则抽 title\n\
          \    title = _regex_extract_field(cleaned, 'title')\n    if not title or\
          \ len(title) < 5:\n        m = re.search(r'<h2[^>]*>(.*?)</h2>', content,\
          \ re.S | re.I)\n        if m:\n            title = re.sub(r'<[^>]+>', '',\
          \ m.group(1)).strip()\n    # 正则抽 description\n    description = _regex_extract_field(cleaned,\
          \ 'description')\n    if not description:\n        description = _to_plain(content)[:120]\n\
          \    # 正则抽 tags\n    tags = []\n    tm = re.search(r'\"tags\"\\s*:\\s*\\\
          [([^\\]]*)\\]', cleaned, re.S)\n    if tm:\n        tags = [s.strip() for\
          \ s in re.findall(r'\"([^\"]+)\"', tm.group(1)) if s.strip()]\n    # 正则抽\
          \ self_review\n    self_review = _regex_extract_field(cleaned, 'self_review')\n\
          \    return title, content, description, tags, self_review\n\n\ndef main(n7_text,\
          \ clean_out):\n    n7_text = _clamp(n7_text)\n    clean_out = _clamp(clean_out)\n\
          \n    # ========= 解析 clean_out =========\n    if isinstance(clean_out, dict):\n\
          \        c = clean_out\n    else:\n        c = _parse_json(clean_out)\n\
          \    if not isinstance(c, dict):\n        c = {}\n\n    c_title = (c.get('title')\
          \ or '').strip()\n    c_content = c.get('content') or ''\n    c_desc = (c.get('description')\
          \ or '').strip()\n    c_tags = c.get('tags') or []\n    c_review = (c.get('self_review')\
          \ or '').strip()\n\n    if c_content and isinstance(c_content, str):\n \
          \       if '<think>' in c_content or '</think>' in c_content:\n        \
          \    c_content = _strip_think(c_content)\n\n    c_plain = _to_plain(c_content)\n\
          \    c_reason = _check_broken(c_content, c_plain)\n\n    # === 新增：clean_out\
          \ JSON 解析失败但原始文本含 HTML 时,从原文抢救 ===\n    if c_reason and isinstance(clean_out,\
          \ str) and '<h2' in clean_out:\n        _rc_title, _rc_content, _rc_desc,\
          \ _rc_tags, _rc_review = _rescue_from_raw(clean_out)\n        _rc_plain\
          \ = _to_plain(_rc_content)\n        _rc_reason = _check_broken(_rc_content,\
          \ _rc_plain)\n        if not _rc_reason and len(_rc_plain) > len(c_plain):\n\
          \            c_title = _rc_title or c_title\n            c_content = _rc_content\n\
          \            c_desc = _rc_desc or c_desc\n            c_tags = _rc_tags\
          \ or c_tags\n            c_review = _rc_review or c_review\n           \
          \ c_plain = _rc_plain\n            c_reason = ''\n\n    # ========= 解析 n7_text\
          \ =========\n    if isinstance(n7_text, dict):\n        n = n7_text\n  \
          \  else:\n        n = _parse_json(n7_text)\n    if not isinstance(n, dict):\n\
          \        n = {}\n\n    n_title = (n.get('title') or '').strip()\n    n_content\
          \ = n.get('content') or ''\n    n_desc = (n.get('description') or '').strip()\n\
          \    n_tags = n.get('tags') or []\n\n    if n_content and isinstance(n_content,\
          \ str):\n        if '<think>' in n_content or '</think>' in n_content:\n\
          \            n_content = _strip_think(n_content)\n\n    n_plain = _to_plain(n_content)\n\
          \    n_reason = _check_broken(n_content, n_plain)\n\n    # === 新增：n7_text\
          \ JSON 解析失败但原始文本含 HTML 时,从原文抢救 ===\n    if n_reason and isinstance(n7_text,\
          \ str) and '<h2' in n7_text:\n        _rn_title, _rn_content, _rn_desc,\
          \ _rn_tags, _rn_review = _rescue_from_raw(n7_text)\n        _rn_plain =\
          \ _to_plain(_rn_content)\n        _rn_reason = _check_broken(_rn_content,\
          \ _rn_plain)\n        if not _rn_reason and len(_rn_plain) > len(n_plain):\n\
          \            n_title = _rn_title or n_title\n            n_content = _rn_content\n\
          \            n_desc = _rn_desc or n_desc\n            n_tags = _rn_tags\
          \ or n_tags\n            n_plain = _rn_plain\n            n_reason = ''\n\
          \n    # ========= 选择最终输出 =========\n    if not c_reason:\n        # clean_out\
          \ 正常，直接用\n        title = c_title\n        content = c_content\n       \
          \ description = c_desc\n        tags = c_tags\n        self_review = c_review\
          \ or '[守护]clean_out正常,直接采用'\n    elif not n_reason:\n        # clean_out\
          \ 异常，回退 N7\n        title = n_title or c_title\n        if not title or\
          \ len(title) < 5:\n            m = re.search(r'<h2[^>]*>(.*?)</h2>', n_content,\
          \ re.S | re.I)\n            if m:\n                title = re.sub(r'<[^>]+>',\
          \ '', m.group(1)).strip()\n        content = n_content\n        description\
          \ = n_desc or c_desc or _to_plain(content)[:120]\n        tags = n_tags\
          \ or c_tags\n        self_review = '[守护]clean_out异常(%s),已回退N7原文' % c_reason\n\
          \    else:\n        # 两边都异常，尽量保留有内容的一边\n        if len(c_plain) >= len(n_plain):\n\
          \            title = c_title or n_title\n            content = c_content\n\
          \            description = c_desc or n_desc\n            tags = c_tags or\
          \ n_tags\n        else:\n            title = n_title or c_title\n      \
          \      content = n_content\n            description = n_desc or c_desc\n\
          \            tags = n_tags or c_tags\n        self_review = '[守护]clean_out(%s)和N7(%s)均异常,保留较长一份'\
          \ % (c_reason, n_reason)\n\n    if not isinstance(tags, list):\n       \
          \ tags = []\n\n    return {'structured_output': {\n        'title': title,\n\
          \        'content': content,\n        'description': description,\n    \
          \    'tags': tags,\n        'self_review': self_review,\n    }}\n"
