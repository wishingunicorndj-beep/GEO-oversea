    - data:
        code: "import re\n\ndef _text(value):\n    return str(value or '').strip()\n\ndef _first_int(value, default=1, minimum=1, maximum=100):\n    match = re.search(r'\\d+', _text(value))\n    if not match:\n        return default\n    return max(minimum, min(maximum, int(match.group(0))))\n\ndef _normalize_type(value):\n    value = _text(value)\n    aliases = {\n        '对比排名': 'comparison', '对比排名类': 'comparison', '对比': 'comparison',\n        '性能评测': 'review', '性能评测类': 'review', '测评': 'review',\n        '经验分享': 'experience', '经验分享类': 'experience',\n        '知识科普': 'knowledge', '知识科普类': 'knowledge', '科普': 'knowledge',\n        '新闻报道': 'news', '新闻报道类': 'news',\n        '自我介绍': 'brand_intro', '自我介绍类': 'brand_intro',\n        '产品介绍': 'product_intro', '产品介绍类': 'product_intro',\n        '使用指南': 'how_to', '教程': 'how_to', '案例': 'case_study',\n    }\n    return aliases.get(value, value)\n\ndef _infer_mode(article_type, keyword_pack, product_info, task_description):\n    article_type = _normalize_type(article_type)\n    if article_type in {'comparison','review'}:\n        return 'comparison'\n    if article_type in {'brand_intro','product_intro'}:\n        return 'brand_focus'\n    if article_type in {'experience','case_study'}:\n        return 'experience'\n    if article_type in {'knowledge','news','how_to'}:\n        return 'knowledge'\n    text = ' '.join([_text(keyword_pack), _text(product_info), _text(task_description)])\n    if re.search(r'对比|比较|区别|哪个更好|怎么选|排名|推荐', text):\n        return 'comparison'\n    if re.search(r'品牌|产品介绍|是什么|企业介绍', text):\n        return 'brand_focus'\n    if re.search(r'案例|体验|经历|实测', text):\n        return 'experience'\n    return 'knowledge'\n\ndef main(company_name=None, product_info=None, industry=None, keyword_pack=None,\n         article_count=None, article_style=None, article_type=None, task_name=None,\n         company_intro=None, task_description=None, target_audience=None,\n         publish_media=None, compliance_profile=None, competitor_policy=None,\n         customer_rules=None):\n    company_name = _text(company_name)\n    product_info = _text(product_info)\n    industry = _text(industry)\n    keyword_pack = _text(keyword_pack)\n    task_description = _text(task_description)\n    keywords = [x.strip() for x in re.split(r'[\\n,，;；]+', keyword_pack) if x.strip()]\n    anchor = product_info or (keywords[0] if keywords else '') or company_name or industry or '目标主题'\n    topic = ' '.join(keywords[:8])\n    ent_query = ' '.join(x for x in [company_name, industry, company_intro, task_description, topic,\n                                      '企业介绍 主营业务 品牌 资质 案例 服务优势 客户'] if _text(x))\n    prod_query = ' '.join(x for x in [product_info, industry, task_description, topic,\n                                       '产品介绍 服务内容 核心功能 使用场景 优势 限制 参数'] if _text(x))\n    profile = _text(compliance_profile).lower()\n    if profile in {'medical','financial','game','education','standard'}:\n        compliance_mode = profile\n    else:\n        text = ' '.join([industry, product_info, task_description, customer_rules or ''])\n        if re.search(r'医疗|药品|医院|医美|保健|医疗器械', text):\n            compliance_mode = 'medical'\n        elif re.search(r'金融|银行|保险|证券|基金|期货|贷款|支付', text):\n            compliance_mode = 'financial'\n        elif re.search(r'游戏|手游|端游|主机|电竞|赛事', text):\n            compliance_mode = 'game'\n        elif re.search(r'教育|培训|学校|课程|留学', text):\n            compliance_mode = 'education'\n        else:\n            compliance_mode = 'standard'\n    normalized_type = _normalize_type(article_type)\n    content_mode = _infer_mode(normalized_type, keyword_pack, product_info, task_description)\n    policy = _text(competitor_policy).lower() or 'auto'\n    needs_competitors = content_mode == 'comparison' and policy != 'disabled'\n    region_terms = ['北京','上海','广州','深圳','杭州','成都','南京','武汉','西安','重庆','天津','苏州','浙江','江苏','广东','福建','山东','四川','湖北','湖南','河北','河南']\n    region = next((x for x in region_terms if x in ' '.join([company_intro or '', task_description, keyword_pack])), '')\n    ent_query = re.sub(r'[\\\
          x00-\\x1f\\x7f]+', ' ', ent_query).replace('\\\\', ' ').replace(chr(34), ' ')\n    prod_query = re.sub(r'[\\x00-\\x1f\\x7f]+', ' ', prod_query).replace('\\\\', ' ').replace(chr(34), ' ')\n    return {\n        'ent_rag_query': re.sub(r'\\s+', ' ', ent_query)[:100],\n        'prod_rag_query': re.sub(r'\\s+', ' ', prod_query)[:100],\n        'article_count': str(_first_int(article_count)),\n        'article_style': _text(article_style) or '专业、客观、清晰',\n        'article_type': normalized_type,\n        'compliance_mode': compliance_mode,\n        'content_mode': content_mode,\n        'needs_competitors': 'true' if needs_competitors else 'false',\n        'region': region,\n        'core_service': anchor,\n        'main_brand': product_info or company_name or anchor,\n    }"
