    - data:
        code: "import re, random\n\ndef _items(value):\n    return [x.strip() for x in re.split(r'[\\n,，;；]+', str(value or '')) if x.strip()]\n\ndef _weights(text):\n    defaults = {'brand_intro': 2, 'product_intro': 2, 'comparison': 2, 'review': 2, 'knowledge': 3, 'how_to': 3, 'experience': 2, 'news': 1}\n    text = str(text or '')\n    for key in defaults:\n        match = re.search(rf'{re.escape(key)}\\s*[|｜:]\\s*(\\d)', text)\n        if match:\n            defaults[key] = max(1, min(5, int(match.group(1))))\n    return defaults\n\ndef _pick(pool, key, index):\n    \"\"\"按 (类型, 序号) 确定性取池项，保证同批不撞车、跨批次可复现。\"\"\"\n    if not pool:\n        return ''\n    h = sum(ord(c) for c in str(key or ''))\n    return pool[(h + index) % len(pool)]\n\ndef _allocate(weights, total):\n    total = max(1, int(total or 1))\n    raw = {k: v * total / sum(weights.values()) for k, v in weights.items()}\n    result = {k: int(v) for k, v in raw.items()}\n    left = total - sum(result.values())\n    for k in sorted(raw, key=lambda x: raw[x] - int(raw[x]), reverse=True)[:left]:\n        result[k] += 1\n    return result\n\ndef main(profile_text=None, keyword_pack=None, article_count=None, article_type=None,\n         article_style=None, company_name=None, product_info=None, ent_body=None,\n         prod_body=None, compliance_mode=None, region=None, content_mode=None,\n         whitelist_names=None, task_description=None, target_audience=None,\n         publish_media=None, customer_rules=None):\n    keywords = _items(keyword_pack) or ['产品或服务介绍']\n    count = max(1, min(100, int(re.search(r'\\d+', str(article_count or '1')).group(0)) if re.search(r'\\d+', str(article_count or '1')) else 1))\n    main_brand = str(product_info or '').strip() or str(company_name or '').strip() or '主推主体'\n    requested = str(article_type or '').strip()\n    allowed = {'brand_intro','product_intro','comparison','review','knowledge','how_to','experience','news','case_study'}\n    if requested not in allowed:\n        requested = ''\n    brand_only = bool(keywords) and all(main_brand and main_brand in k for k in keywords)\n    if requested:\n        types = [requested] * count\n    elif brand_only:\n        types = ['brand_intro'] * count\n    else:\n        allocation = _allocate(_weights(profile_text), count)\n        types = [k for k,v in allocation.items() for _ in range(v)]\n        random.shuffle(types)\n    structures = {\n        'brand_intro':['定位—能力—场景—证据','问题—方案—产品—行动'],\n        'product_intro':['产品定位—核心功能—适用场景—边界','用户问题—解决路径—产品证据'],\n        'comparison':['评价维度—候选对比—选择建议','用户场景—方案分层—综合建议'],\n        'review':['评测维度—实际表现—适用人群—结论','问题提出—证据分析—优缺点—建议'],\n        'knowledge':['概念解释—行业背景—关键判断—案例','常见问题—方法拆解—风险提示—结论'],\n        'how_to':['问题诊断—步骤说明—注意事项—检查清单','目标—准备—执行—复盘'],\n        'experience':['需求背景—选择过程—使用体验—建议','场景问题—实践过程—结果边界—总结'],\n        'news':['事件概述—事实进展—行业影响—后续关注','时间线—主体动作—影响分析—信息来源'],\n        'case_study':['客户背景—问题—方案—结果—启示','场景—实施过程—证据—复盘'],\n    }\n    focus_pool = ['核心定位与差异化','目标用户与适用场景','关键功能或服务流程','选择维度与决策方法','真实案例与证据','常见问题与风险边界','行业趋势与变化','使用步骤与注意事项']\n    faq_pool = ['适合谁','怎么选择','有哪些限制','如何使用','如何验证效果','常见误区','与其他方案的区别']\n    titles = ['场景切入型','问题解决型','维度拆解型','趋势观察型','清单指南型','案例复盘型','问答解释型','选择建议型']\n    competitors = _items(whitelist_names)\n    plans=[]\n    for i in range(count):\n        t = types[i] if i < len(types) else 'knowledge'\n        mode = 'brand_focus' if t in {'brand_intro','product_intro'} else ('comparison' if t in {'comparison','review'} else ('experience' if t in {'experience','case_study'} else 'knowledge'))\n        comp = []\n        if mode == 'comparison' and competitors:\n            comp = competitors[:2]\n        plans.append({\n            'keyword': keywords[i % len(keywords)],\n            'structure_dna': _pick(structures.get(t, structures['knowledge']), t, i),\n            'title_template': _pick(titles, t, i),\n            'faq_required': t not in {'news'} or i % 2 == 0,\n            'content_focus': focus_pool[i % len(focus_pool)],\n            'faq_theme': faq_pool[i % len(faq_pool)],\n            'competitor_names':\
          \ '、'.join(comp),\n            'company_name': company_name or '',\n            'product_info': main_brand,\n            'main_brand': main_brand,\n            'article_type': t,\n            'article_style': article_style or '专业、客观、清晰',\n            'content_mode': mode,\n            'compliance_mode': compliance_mode or 'standard',\n            'region': region or '',\n            'target_audience': target_audience or '',\n            'publish_media': publish_media or '',\n            'task_description': task_description or '',\n            'customer_rules': customer_rules or '',\n            'ent_body': ent_body or '',\n            'prod_body': prod_body or '',\n            'batch_size': count,\n            'batch_index': i + 1,\n            'batch_types': '、'.join(sorted(set(types))),\n        })\n    return {'plan': plans}"
