是否正确、文档是否已完成索引】\"\n    else:\n        status = \"empty_result\"\n        merged = \"【知识库未检索到相关内容，本文只能使用客户确认口径中的事实】\"\n\n    return {\n        \"content\": merged,\n        \"record_count\": len(content_list),\n        \"status\": status,\n        \"top_score\": round(max(scores), 3) if scores else 0,\n    }\n\n\n"
