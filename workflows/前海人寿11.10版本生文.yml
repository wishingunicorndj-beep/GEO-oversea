        code: "import json\n\ndef main(body=None):\n    \"\"\"解析知识库检索结果，拼接所有 segment 的 content。\n\n    检索接口在异常时返回 {\"code\":..., \"message\":...}（没有 records 字段），\n    与\"真的没检索到\"（records=[]）看起来一样。这里显式区分两者，\n    把失败信息带进 content，避免下游拿到空知识库却毫无察觉。\n    \"\"\"\n    if body is None:\n        return {\"content\": \"【知识库检索无响应】\", \"record_count\": 0, \"status\": \"no_response\", \"top_score\": 0}\n\n    if isinstance(body, str):\n        try:\n            data = json.loads(body)\n        except json.JSONDecodeError:\n            return {\"content\": \"【知识库检索返回非JSON】\" + body[:200],\n                    \"record_count\": 0, \"status\": \"bad_json\", \"top_score\": 0}\n    else:\n        data = body\n\n    if not isinstance(data, dict):\n        return {\"content\": \"【知识库检索返回格式异常】\", \"record_count\": 0, \"status\": \"bad_shape\", \"top_score\": 0}\n\n    # 接口级错误：没有 records，只有 code/message\n    if \"code\" in data and \"records\" not in data:\n        return {\"content\": \"【知识库检索失败】%s %s\" % (\n                    data.get(\"status\", \"\"), data.get(\"message\", \"\")),\n                \"record_count\": 0, \"status\": \"api_error\", \"top_score\": 0}\n\n    records = data.get(\"records\") or []\n    content_list = []\n    scores = []\n    for record in records:\n        if not isinstance(record, dict):\n            continue\n        segment = record.get(\"segment\") or {}\n        if not isinstance(segment, dict):\n            continue\n        if isinstance(record.get(\"score\"), (int, float)):\n            scores.append(float(record[\"score\"]))\n        content = segment.get(\"content\") or \"\"\n        if content:\n            content_list.append(content.strip())\n\n    if content_list:\n        status = \"ok\"\n        merged = \"\\n\\n\".join(content_list)\n    elif data.get(\"empty_type\") or \"命中空查询\" in str(data.get(\"strategy\", \"\")):\n        # 请求成功但没有可检索文档：多半是 dataset_id 不对或库还没索引完\n        status = \"empty_dataset\"\n        merged = \"【知识库未检索到任何内容：请确认知识库ID是否正确、文档是否已完成索引】\"\n    else:\n        status = \"empty_result\"\n        merged = \"【知识库未检索到相关内容，本文只能使用客户确认口径中的事实】\"\n\n    return {\n        \"content\": merged,\n        \"record_count\": len(content_list),\n        \"status\": status,\n        \"top_score\": round(max(scores), 3) if scores else 0,\n    }\n\n\n"
