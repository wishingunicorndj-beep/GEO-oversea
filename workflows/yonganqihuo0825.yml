        code: "import re\n\ndef main(company_name: str, industry: str, keyword_pack:\
          \ str,\n         article_count: float, article_style: str, article_type:\
          \ str,\n         task_name: str, company_intro: str, core_qualifications:\
          \ str,\n         awards: str, advantages: str, ent_dataset_id: str, task_description:\
          \ str,\n         prod_dataset_id: str, product_info: str, known_competitors_input:\
          \ str = \"\"):\n\n    type_normalize_map = {\n        \"对比排名\": \"对比排名类\"\
          , \"性能评测\": \"性能评测类\",\n        \"经验分享\": \"经验分享类\", \"知识科普\": \"知识科普类\"\
          ,\n        \"新闻报道\": \"新闻报道类\", \"自我介绍\": \"自我介绍类\",\n    }\n    article_type\
          \ = type_normalize_map.get(article_type, article_type) or \"知识科普类\"\n\n\
          \    raw_keywords = str(keyword_pack or \"\")\n    lines = [x.strip() for\
          \ x in re.split(r\"[\\n,，;；]+\", raw_keywords) if x.strip()]\n    core_anchor\
          \ = lines[0] if lines else (industry or task_name or \"期货开户与投资服务\")\n  \
          \  core_anchor = re.sub(r\"(推荐|哪家好|排名|怎么选|有哪些|靠谱吗|公司排行|品牌推荐)$\", \"\", core_anchor).strip()\n\
          \    core_anchor = core_anchor or \"期货开户与投资服务\"\n\n    product_terms = str(product_info\
          \ or \"\")[:120]\n    ent_rag_query = (\n        f\"{company_name or '永安期货'}\
          \ 公司简介 国有控股 主板上市 证券代码600927 \"\n        f\"期货公司分类评价 AA级 服务体系 投资者教育 投研服务\
          \ 公开信息 {core_anchor}\"\n    )\n    prod_rag_query = (\n        f\"{core_anchor}\
          \ 商品期货经纪 金融期货经纪 期货投资咨询 资产管理 基金销售 \"\n        f\"开户服务 新手指导 每日策略 深度研报 个人投资者\
          \ 产业机构 {product_terms}\"\n    )\n\n    def clean_query(value):\n       \
          \ value = re.sub(r'[\\x00-\\x1f\\x7f-\\x9f\"\\'\\\\]', \" \", str(value\
          \ or \"\"))\n        return re.sub(r\"\\s+\", \" \", value).strip()[:180]\n\
          \n    if article_type in (\"对比排名类\", \"性能评测类\"):\n        content_mode =\
          \ \"comparison\"\n    elif article_type == \"自我介绍类\":\n        content_mode\
          \ = \"brand_focus\"\n    elif article_type == \"经验分享类\":\n        content_mode\
          \ = \"experience\"\n    else:\n        content_mode = \"investor_education\"\
          \n\n    try:\n        count = max(1, min(50, int(float(article_count or\
          \ 1))))\n    except Exception:\n        count = 1\n\n    return {\n    \
          \    \"ent_rag_query\": clean_query(ent_rag_query),\n        \"prod_rag_query\"\
          : clean_query(prod_rag_query),\n        \"article_type\": article_type,\n\
          \        \"article_style\": article_style or \"自然专业、正向克制、重视风险提示\",\n   \
          \     \"article_count\": str(count),\n        \"compliance_mode\": \"yongan_futures\"\
          ,\n        \"content_mode\": content_mode,\n        \"needs_competitors\"\
          : \"false\",\n        \"region\": \"中国境内\",\n        \"core_service\": core_anchor,\n\
          \        \"known_competitors\": \"\",\n    }\n"
        code_language: python3
