app:
  description: 'V2.5：去除输入项：answer_html；0827，20:50

    V2.5：优化markdown解析对排名的影响；0826

    V2.4.2：优化举例类排名，0825

    V2.4：优化品牌词提及和排名逻辑，非品牌词提及和排名问题；0820

    V2.3：模型有v4flash切到qwen3.7plus；0819

    V2.2：精简token消耗，修改提及和排名按照独立推荐实体进行判定；0818

    V2.1：修改模型为v4-flash；0817

    V2.1：修改提及-准确性-代码节点效果；0814

    V2.0：增加中正率，优化整体流程和架构v8；0811

    V1.13：切到v4pro模型；

    V1.12：把references改为非必填字段，爬虫字段为空数据照样调接口；0603

    V1.11：把brand_detected和rankpos指向节点2；0515

    V1.10：修改合并节点代码确保输出数据准确性，因为v4pro模型资源紧张切换v3.2，中间修改competitor_mentions丢掉了后两个字段，后修复；0514

    V1.9：增加典型特征词，约束brand归于保留地域属性，切到v4pro模型；0512

    V1.8：增加竞品情感倾向信息；0430

    V1.7：放开brand_name限制到500；

    V1.6：只使用代码正则进行排序判断，删除限定行数，如果模型回答中有序号则排名取序号，如果没有则按照品牌排序给排名；调整情感评价阈值和区间；调整is_ranking等逻辑；0414

    V1.5：支持按照品牌名称、企业名其中之一命中就算提及，支持多个品牌名输入，排名超出两位算是无提及，0401；

    V1.4：加强竞品排名避免排名并列，归一竞品品牌抽取，增加key_tags，0326

    V1.3：把使用company_name进行品牌比对改为brand_name；0324

    V1.2：新增summary字段，0323；

    V1.1 ：新增情感分析和竞品数据指标，0317；

    V1.0：支持品牌可见性以及排名等基础指标，0120；'
