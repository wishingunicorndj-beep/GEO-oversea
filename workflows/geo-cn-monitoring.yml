          block_type\"), \"P\")\n        if code == \"P\" and re.match(r\"^\\s*(?:[一二三四五六七八九十]+[、.．]|第[一二三四五六七八九十0-9]+(?:部分|章|类|模块))\"\
          , text):code = \"H\"\n        llm_catalog.append([x[\"id\"], code, text])\n\
