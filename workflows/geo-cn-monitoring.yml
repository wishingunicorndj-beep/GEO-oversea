          \        close_paren=max(line.rfind(\")\",0,m.start()),line.rfind(\"）\",0,m.start()))\n\
          \        if open_paren>close_paren and re.search(r\"[A-Za-z\\u4e00-\\u9fff]\",line[open_paren+1:m.start()]):continue\n\
