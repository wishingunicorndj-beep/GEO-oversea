            【一、分析对象】

            输入竞品格式为[{id,name,aliases,target,rank,membership,module,anchor}]。只分析清单中已校验的ordered_choice、independent_subject或无排名回答中明确标为同业竞品的comparison_only实体。name与aliases用于原文归属，id是唯一输出键；不得输出清单外品牌，也不得把目标品牌、来源标题或相关视频作为竞品。comparison_only竞品的rank固定为0，不因无排名而删除。

            参数、价格数字、内核、配置、成立时间、地址等没有评价语义时属于C中性，不进入pos/neg。排名只作上下文，排名第一不自动正向，排名靠后不自动负向。


            【二、A-E极性与分数】

            【二点一、正向/负向句的定义与切分】

            正向句必须包含对当前竞品的明确优势、推荐、适配或胜出评价；负向句必须包含对当前竞品的明确缺点、不足、限制、风险、不推荐或比较落败评价；名称、参数、香调/内核、价格数字、适用标签和排名序号本身均为中性。优先按句号、问号、感叹号、分号（。！？!?；;）、换行、Markdown标题/编号项/项目符号、表格单元以及“香调：/气质：/适合：/优点：/缺点：/✅/⚠️/❌”字段切分；“但/然而/不过/反而/却”通常从后半句切分。逗号、顿号、冒号不是强制边界，除非构成独立评价分句。一个pos/neg元素只能对应一个最小sentence_id，多句必须逐组输出；禁止跨产品、跨标题、跨模块或跨预算建议拼接大段，同一id不得同时进入pos和neg。

            A强正向：唯一/强烈推荐、最佳、首选、领先、行业标杆、顶级、显著优于、全面超越、完胜、天花板；

            B一般正向：稳定、可靠、便捷、专业、成熟、体验好、性价比高、值得考虑、自然、清晰、准确、适合；

            C中性：名称、事实、参数、并列出现、无明确褒贬；

            D一般负向：较贵/偏高、不足、限制、不便、速度慢、体验欠佳、不稳定、不适合、仍有差距、需要改进；

            E强负向：严重故障、欺诈、投诉集中、重大安全/质量风险、强烈不推荐。

            否定词必须改变极性：“并不领先、不值得、尚不成熟、没有更好、不够稳定”属于负向，不能因含正向词根判正。明确比较中胜方可为正、败方必须为负。

            score范围[-1,1]：A主导且几乎无负面0.8~1；明确正向0.5~0.799；轻正或正负并存0.1~0.499；正负抵消或仅C为-0.099~0.099；负向区间对称。必须综合该实体全文全部A/B/D/E证据，不能只看最强一句。


            【三、逐实体穷举】

            输入目录格式为[sentence_id,H/T/L/P,逐字符原文]。对每个id完整扫描全部目录，建立候选证据全集，再逐条判positive、negative或neutral；所有明确A/B/D/E句都必须返回，不能每个实体只摘1-3条代表句。

            目录中的每个sentence_id已经是最小证据单元；一个pos/neg元素只能对应一个sentence_id，严禁跨ID拼接相邻产品、标题或模块。多句证据必须逐组输出，不能用一条大段text代替。

            按“实体名：描述”、标题、编号项、表格行列和局部作用域归属。实体标签后的描述可继承，遇到下一个同级品牌、公司、产品、表格列头、列表项或并列项目，上一实体作用域立即终止。代词/省略主语只有在局部唯一明确时继承。

            表格必须按行头/列头还原归属，禁止把相邻列评价串给当前实体。同一句出现多个品牌时，按主谓、比较方向、冒号标签或列头确定对象；只有多个名称而评价对象不明时按C。

            若转折已拆成多个sentence_id，分别判断；若“虽然贵但服务好”仍在同一ID，只按转折后重点和整体主导方向放入pos或neg之一。同一实体内同一sentence_id只能出现一次，pos/neg必须互斥。同一句可因明确比较方向分别归属不同实体。


            【四、原文精确与完整输出】

            keywords必须逐字符复制对应sentence_id的text，禁止修改标点、空格、大小写或同义改写。不要返回整句文本，后置代码会按ID回填原文。无明确评价的实体仍必须保留该id且数组为空。

            【五、易错示例】

            示例A：“Edge内存比Chrome省15%”可作为Edge正向，同时对Chrome形成明确负向；同一句可分别出现在两个实体结果中，但每个实体内部只能出现一次。

            示例B：“Chrome兼容性最强，但多标签极度吃内存”若目录拆成两个ID，前句归正、后句归负；若仍为一个ID，按转折后重点和整体主导方向选一侧，禁止同一ID同时进入pos/neg。

            示例C：实体标题“2. QQ浏览器”后的优缺点归QQ，遇到“3. 小智双核浏览器”立即终止；不能把小智的“广告少”继承给QQ。

            示例D：“适合重度QQ/微信用户”是条件性正向；“内核：Chromium+IE”只是参数事实，不进入正向。排序名次本身也不是情感证据。

            示例E：清单有10个id时必须输出10条sentiments。某实体只有名称无评价，也要输出对应id、score=0和空数组，不能省略。


            仅输出严格紧凑JSON：{"sentiments":[{"id":"E001","score":0.5,"pos":[["S0001",["关键词"]]],"neg":[["S0002",["关键词"]]]}]}

