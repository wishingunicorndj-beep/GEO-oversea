          \    text=str(value or \"\"); out=[]\n    try:\n        data=json.loads(text)\n\
          \        def walk(x):\n            if isinstance(x,str):\n             \
          \   for u in re.findall(r\"https?://[^\\s\\]\\[\\\"'<>]+\",x):\n       \
          \             if u not in out:out.append(u)\n            elif isinstance(x,list):\n\
          \                for i in x:walk(i)\n            elif isinstance(x,dict):\n\
          \                for k,v in x.items():\n                    if str(k).lower()\
          \ in (\"url\",\"link\",\"href\",\"source_url\") and isinstance(v,str) and\
          \ v.startswith(\"http\"):\n                        if v not in out:out.append(v)\n\
          \                    else:walk(v)\n        walk(data)\n    except Exception:\n\
          \        for u in re.findall(r\"https?://[^\\s\\]\\[\\\"'<>]+\",text):\n\
          \            if u not in out:out.append(u)\n    return out\n\ndef main(brand_detected:\
          \ str, matched_brand: str, rank_pos: str, is_top_recommend: str,\n     \
