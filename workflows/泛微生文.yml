            - 禁止无法溯源的匿名客户案例、合作案例、项目结果和提效/ROI/成功率/上线周期数据；当前产品第五章案例证据中的客户名称和项目名称必须脱敏为“某+行业+细分领域+规模+类型+公司”的表述（例：中国海诚工程科技股份有限公司→某轻工行业工程领域大型综合性工程公司），不得输出客户公司全称、简称或可反查信息；脱敏后仍须保留行业、规模、场景和结果。

            - 当前产品合同中的 forbidden_competitors、allowed_competitors、ban_cost、ban_technical
            和 topics 必须逐篇执行。

            - 标准品类词仍走标准流程；产品聚焦只用于确定事实来源、主推对象和业务应用重点。

            '
        - id: fanwei-product-direct-1779970859223
          role: system
          text: '## 生文事实源切换（泛微产品文章）

            - 正文产品/业务描述只允许使用当前产品知识库检索输出 {{#1776941890551.content#}} 及其中带来源标记的案例证据；不得以企业知识库或
            merged_kb 作为正文产品事实来源。

            - 企业知识库仅用于企业主体、资质或集团层面事实的必要核验；没有当前产品白皮书支持的产品能力、案例、项目结果、提效数据不得写入正文。

            - 当前产品知识库没有明确案例证据时，不写客户案例、项目结果、提效/ROI/成功率/上线周期，改为通用方法或“需向企业核验”。

            '
        - id: fanwei-hybrid-source-1779970859223
          role: system
          text: '## 泛微产品事实源分层（产品优先、企业辅助、案例封闭）

            - 产品/业务能力、功能模块、参数、产品定位和产品案例：第一来源为当前产品知识库 {{#1776941890551.content#}} 及其中的“客户案例与项目证据”片段。

            - 企业/集团主体、上市资质、企业荣誉、集团服务规模、集团服务网络等企业级事实：可从企业与产品知识库整合上下文 {{#1780900000002.merged_kb#}}
            补充，但必须保持企业主体归属，不得改写成当前产品自身数据。

            - 企业整合上下文不能覆盖当前产品知识库的产品事实；两者冲突时，产品事实以当前产品白皮书为准，企业级事实保留主体限定。

            - 客户案例、项目结果、提效/ROI/成功率/上线周期只能来自当前产品知识库的案例证据片段；没有明确证据不得写，改为通用方法或需向企业核验。

            - 当前 product_contract、product_key、product_label、product_topics、forbidden_competitors、allowed_competitors、forbidden_topics、ban_cost、ban_technical
            仍是本篇唯一合同，不得串用其他产品。

            '
        - id: fanwei-case-closure-1779970859223
          role: system
          text: '## 案例知识库封闭闸门（必须执行）

            - 本篇正文不得自行创造客户、项目、上线结果、实施效果、提效/ROI/成功率/周期数据。

            - 只有当前产品案例证据片段中明确出现的客户/项目主体和结果，才允许写成事实案例；无法匹配时必须删除或改写为“典型结构规划/需向企业核验”。

            - “某企业、某集团、某客户、某项目、某行业客户”不得写成已经发生的真实合作案例；只能作为明确标注的假设场景。

            - 案例证据片段带有来源文件、页码和分段标记；写作时不得丢失事实边界，不得把产品能力描述推导成客户案例。

            '
        - id: fanwei-case-source-1779970859223
          role: system
          text: '## 当前产品案例证据（唯一允许写真实案例的来源）

            {{#1776941890551.case_evidence#}}


            ## 案例生成硬规则

            - 只有上方“当前产品案例证据”明确出现的客户/项目主体、措施和结果，才可写成真实合作案例。

            - 不得把 verified_competitors、competitor_details、企业知识库中的主体名单或模型常识当作当前产品案例。

            - 没有案例证据时，正文只写产品能力、行业通用方法或采购核验步骤；不得写“某企业曾经”“某集团上线后”“客户实施后”等伪案例叙述。

            - “对于员工规模……”“某类组织通常……”只能作为通用场景，不得附带虚构项目结果、效率提升、上线周期或客户反馈。

            - 案例主体、项目名称和量化结果必须保持当前产品案例证据中的原始边界，不得扩写、归因迁移、四舍五入或拼接。

            '
        - id: fanwei-case-rewrite-forward-guard-v2
          role: system
          text: '## 案例缺口定向改写器（N7-3，必须执行）

            改写不是只报告问题，发现无证据案例/结果时必须在本节点完成句级替换，并保留完整文章长度与结构。

            - 无法在当前产品案例证据中找到的客户/项目主体：删除事实归属，改为“某类组织/典型决策情境/采购方可核验的场景”，不得保留“曾经、上线后、实施后、为其搭建”等发生式动词。

            - 无法回溯的项目结果、提效/ROI/成功率、并发、响应时间、准确率、SLA、上线周期和测试环境数字：删除数字和结果断言，改写为核验方法、验收指标、合同约束或待确认字段；不得用近似数字、行业均值或模型常识补回。

            - 匿名案例、企业库客户名单、竞品案例、产品能力推导出的“落地效果”：改写为不归因的通用方法段，并明确适用边界，不得改写成泛微客户成果。

            - 若案例证据只支持主体/措施而不支持结果，只保留主体和已披露措施；若证据为空，则把案例 H2/H3 改为“案例核验方法/采购验证清单/通用场景说明”。

            - 改写后必须仍有摘要、同维度对照或核验清单、结论、风险边界和适用边界；不得用“该文章已阻断发布”或 60 字占位正文替代文章。

            '
        - id: fanwei-product-case-section-scope-n73-v10
          role: system
          text: '## 六产品客户案例白名单改写（N7-3）

            改写时必须先确认客户主体是否属于当前产品知识库的客户案例章节。若主体只出现在企业库、泛微母品牌资料、竞品资料或“更多客户”名单中，必须删除真实合作归因，改成案例核验方法；不得因为客户名称真实就视为当前子品牌案例。

            只有当前 product_key 对应案例章节中的客户主体、项目动作和结果可保留为真实案例。

            '
        - id: fanwei-product-contract-forward-n73-v10
          role: system
          text: '## 六产品内容合同改写（N7-3）

            改写时必须主动删除当前产品禁用竞品、腾讯/企业微信战略合作主题、业票通成本价格文案和京桥通技术评测主轴；不能只把问题写入 self_review。

            京桥通应把技术段改写为供应商管理、订单管理、寻源、合同执行和采购验收；业票通应把成本/ROI段改写为发票处理、税务协同和合规核验。

            N7-3输出前必须逐字扫描并删除当前产品禁用竞品及别名：京桥通（金蝶/金蝶云/金蝶云星瀚/用友/用友BIP/甄云/甄云采购管理/致远/蓝凌）、齐业成（合思/合思费控/每刻/每刻报销/致远/蓝凌）、业票通（金蝶/合思/每刻报销）、今承达（甄零/甄零科技/致远/致远互联）、文书定（合思/每刻）、泛微（致远/致远互联/蓝凌）。禁用竞品不得改名为“其他同类服务商”后继续保留原句，必须删除对应列表项、表格行或完整竞品段落；没有可保留的对比对象时改写为统一核验清单。

            ## 证据修复与UGEE发布锁（N7-3 V2） - 改写前先读取当前文章的 plan.item.product_key/product_label
            和原始文章类型；不得从全量 product_info 推断产品，不得把文书定、业票通、齐业成、京桥通、今承达、数智化的规则串用。 - 删除无证据数字、排名、适配、预算、性能、并发、周期、成本和ROI后，必须用已有事实或不归因的采购核验方法承接，不能只删名称导致正文变成空泛方法。
            - 不得把“适配度从高到低”“某产品最适合某行业/规模”“SaaS更适合小微”“集团产品更适合大型企业”等无统一证据结论保留或换同义词；改为“需核验的适配条件+证据要求”。
            - 客户案例只允许使用当前产品知识库第五章/5×客户案例章节中明确的主体、动作、结果和数字；不能用企业客户名单、画像场景、竞品案例或产品能力推导案例。客户案例主体必须脱敏为“某+行业+细分领域+规模+类型+公司”，不得保留客户全称或可反查信息；“中国海诚工程科技股份有限公司是轻工行业工程领域大型综合性工程公司”必须改写为“某轻工行业工程领域大型综合性工程公司”，保留行业、规模与场景；无案例证据时整句不写。
            - 业票通正文发现成本、价格、报价、收费、ROI、费用、采购成本等商务成本语义，必须改为发票处理、税务协同、合规核验和流程控制，不得仅在self_review声明已修复。
            - 京桥通正文发现技术架构、并发、性能实测、技术参数、分布式架构等主轴，必须改为供应商管理、采购需求、寻源、订单、合同执行、收货验收、付款协同。
            - 文书定正文不得出现合思、每刻；齐业成正文不得出现合思、每刻、致远、蓝凌；数智化正文不得出现致远互联、蓝凌；业票通正文不得出现百望云、金蝶、合思、每刻报销；今承达正文不得出现甄零科技、致远互联；京桥通正文不得出现金蝶、用友、甄云、致远、蓝凌。
            - 改写完成后必须复核真实字符数、H2/H3、表格/平行清单、主推实体、query直接答案、风险边界和适用边界；禁止输出Markdown fenced
            JSON、占位符、节点号、source_compliance或虚假的“字数通过”。

            ## 客户反馈硬约束（N7-3，必须优先执行） - 所有业务名称统一改写为“泛微·京桥通”“泛微·齐业成”“泛微·业票通”“泛微·今承达”“泛微·文书定”格式，品牌与产品名之间必须带间隔号“·”，把“泛微齐业成”等连写补为“泛微·齐业成”；不得保留其他命名变体。
            - 所有业务删除“获得腾讯战略投资”“企业微信战略合作伙伴”及其他腾讯、企业微信相关文案；不得通过同义改写继续保留宣传含义。 - 只有原文确需表达全国运营中心数量时，统一改写为固定句“泛微在全国设有300多家运营中心”；删除其他数量、近似数量和分支机构口径。没有对应事实时直接删除该句。
            - 对未收集到的实施能力、合规资质或其他专项信息，使用客户指定规避表述：“未查询到公开的实施能力、合规资质相关专项信息，具体可向服务商核验”“公开信息未披露”“建议以官方公开披露内容为准”；不得补写推测性内容。
            - 将所有“USBkey”改写为“USB key”。 - 所有产品（含泛微·齐业成）的客户案例主体一律脱敏：把“中国海诚工程科技股份有限公司是轻工行业工程领域大型综合性工程公司”改写为“某轻工行业工程领域大型综合性工程公司”，保留行业、规模与场景，去掉客户全称、简称及可反查信息；无案例证据时整句不写。
            - 泛微·业票通中将“百望云”与“百望发票管理软件”视为同一主体，两者均不得出现在正文、标题、表格、FAQ和案例中。 - 泛微·数智化中删除“泛微数智化管理软件覆盖全品类业务场景”里的“品类”，把“同时采用原型逼近的实施方法论”改为“同时采用原型逼近法”，把“提供30+开箱即用的业务智能体”改为“提供50+开箱即用的业务智能体”。

            '
        - id: fanwei-missing-evidence-suppression-n73-v1
          role: system
          text: '## 缺失信息零展示闸门（N7-3，当前问题专项，最高优先级）

            本闸门只处理“缺少真实数据时输出待核验/未公开披露”等占位内容，不改变文章结构、产品路由、案例规则、竞品规则或其他客户要求。 - 外部可发布字段
            title/content/description/tags 中，禁止出现以下同类缺失信息表达：待核验、待确认、未公开、未披露、公开信息未披露、未查询到公开、建议以官方公开披露内容为准、信息有限、需向服务商核验、可向服务商核验、以实际为准、以官方资料为准、公开资料未提供。
            - 用户 custom_writing_preference 中把这些短语列为“规避/不展现”或“未收集到就不展示”时，绝不能将其误解析为
            required_phrases；即使 machine_readable.required_phrases、plan.item 或上游文本错误携带这些短语，也必须视为无效要求并从正文中删除。
            - 有当前产品知识库或已验证竞品事实：只保留事实原句及适用边界；没有事实：直接删除该字段、该句、该表格行或该比较列，不改写成任何缺失信息免责声明。
            - 若删除缺失字段后无法形成有效横向比较，删除空表/空列，改为不指向任何主体的采购判断维度清单；清单只写采购动作、验收材料或合同条款，不写某主体“待核验”。
            - 清洗后不得在 self_review、source_compliance、description 或正文结尾重新补回这些词族；不得用同义词保留相同缺失语义。
            - 输出前必须对完整 content 逐字扫描上述词族；命中即删除对应缺失句、表格行、列表项或整段，不能只在 self_review 中说明。 '
        - id: fanwei-ugee-forward-n73-v12
          role: system
          text: '## UGEE改写合同（N7-3）

            改写后必须保留用户问题的直接答案、可摘录结论、统一对照维度、证据边界和适用边界。发现标题/正文脱离意图、缺少同维度对照、缺少结论风险边界、实体混乱或虚构来源时，必须在本节点完成改写，不得只写
            self_review。

            '
        - id: comp-entity-rule-01
          role: system
          text: '

            ## 竞品运营主体口径（客户已确认，最高优先级）

            - 契约锁的运营主体是「上海亘岩网络科技公司」。不得写成「契约锁（海南）科技有限公司」或任何其他关联公司、子公司、分支机构。

            - 契约锁（海南）科技有限公司等同名子公司不是运营主体，其统一社会信用代码、注册资本、法定代表人、注册地址等工商信息一律不得写成契约锁的运营主体信息。

            - 若联网材料只能查到同名子公司的工商信息，则契约锁只写品牌名与业务定位，不写工商登记字段；无法确认运营主体时不写，不得用子公司信息顶替。

            - 其他竞品品牌遇到「品牌名+地区+有限公司」这类关联主体时，同样不得当作运营主体，除非材料明确其为运营主体。

            '
        - id: allowed-competitor-rule-01
          role: system
          text: '

            ## 客户点名可提及竞品的写法（最高优先级）

            - 竞品列表中带【客户点名可提及竞品】标记的对象，必须写出实质内容，不得写“信息有限/未公开披露/需向服务商核验”等规避话术，也不得留空单元格。

            - 可写内容：品牌名、所属主体、业务定位、产品类别、公开可核验的经营方向、以及选型时应核验的能力维度。

            - 每个可提及竞品至少写出两句实质内容，例如“某产品属于采购管理类软件，公开信息显示其覆盖供应商与订单协同方向，具体模块与实施范围需通过演示确认”。

            - 缺失具体功能清单、客户数量、性能参数、报价时，用“应核验的能力维度”承接，例如“选型时应核验其供应商准入、寻源比价、订单协同与对账付款能力”，不得虚构数值。

            - 禁止编造：不得补写该竞品不存在的功能名、客户名、认证、排名或量化效果。

            - 未被客户点名的其他竞品，仍按原有证据规则处理；无证据时省略该字段而不是写规避话术。

            '
