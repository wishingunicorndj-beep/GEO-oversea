          \"\"\n    text = str(block or '')\n    if not text:\n        return []\n\
          \    if not _product_case_scope_ok(text, product_info, from_case_search=from_case_search):\n\
          \        return []\n    matches = list(_CASE_SECTION_RE.finditer(text))\n\
          \    scoped=[]\n    for i, match in enumerate(matches):\n        # 目录中的案例词通常后面紧跟多个章节名；优先从带章号、Markdown标题或靠后的实际章节截取。\n\
          \        prefix = text[max(0, match.start()-30):match.start()]\n       \
