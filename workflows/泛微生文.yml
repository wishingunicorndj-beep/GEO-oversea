        - id: fanwei-product-case-section-scope-v10
          role: system
          text: '## 六产品客户案例范围（N6-1）

            当前产品客户案例只允许来自当前产品知识库中明确标注的“客户案例/成功案例/标杆客户/行业客户案例/客户实践/案例介绍”等章节。

            - 京桥通只认其采购管理客户案例章节；齐业成只认其智能报账成功案例和行业客户案例章节；文书定只认其档案管理客户案例章节；今承达只认其数智合同客户案例和更多行业客户章节；业票通只认其数电票客户案例章节；其他产品按同样的当前产品案例章节规则执行。

            - “更多客户”名单、企业知识库客户名单、泛微母公司客户总量、竞品客户、产品能力章节、行业覆盖数字均不能自动变成当前产品客户案例。

            - 案例白名单必须同时绑定当前 product_key、客户主体、项目动作和原始案例章节；跨子品牌、跨知识库、跨主体拼接一律禁止。

            '
