          \    r'Case\\s+Introduction|Customer\\s+Cases?)', re.I)\n_NEXT_CHAPTER_RE\
          \ = re.compile(r'\\n\\s*(?:#{1,3}\\s*)?第[一二三四五六七八九十百0-9]+章|\\n\\s*(?:#{1,3}\\\
