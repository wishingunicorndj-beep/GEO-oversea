          \    safe = boundaries[1:-1] if len(boundaries) > 2 else boundaries[:-1]\n\
          \    count = min(len(chosen), len(safe))\n    if not count:\n        return\
          \ text, []\n    positions = sorted(random.sample(safe, count), reverse=True)\n\
          \    used = chosen[:count]\n    for pos, image in zip(positions, reversed(used)):\n\
          \        text = text[:pos] + _image_text(image, True) + text[pos:]\n   \
          \ return text, used\n\ndef _insert_markdown_images(text, chosen):\n    parts\
          \ = text.split('\\n\\n')\n    safe, fenced = [], False\n    for j, part\
