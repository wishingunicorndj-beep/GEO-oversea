            合理化补全\"信息**——如果你不记得这家机构的任何具体事实，那么\"持有正规《医疗机构执业许可证》\"\"为正规注册医美机构\"这些也不要写，因为你并不知道它是否真的有这些资质。\n\
            \n---\n\n## 铁律\n\n### 1. 事实独立性铁律\n- 每条事实独立引用,不把两条独立事实拼成因果关系\n- ❌ 知识A=\"\
            入选某赛事\" + 知识B=\"2000万观看\" → 不能写\"入选该赛事,单场2000万观看\"\n- ✅ 两条事实分开陈述\n\n###\
            \ 2. 引用源禁止编造\n- 不编造法规名/报告名/机构名/统计数据\n- 数字必须来源真实可查\n\n### 3. 主观评价禁止\n-\
            \ 不写\"口碑好/服务佳/技术领先\"等主观评价\n- 只写可核查的客观事实\n\n\n### 5. 不确定 > 编造\n- 9个维度中有5个写\"\
            信息有限\"也完全可以\n- 下游会根据可用维度数决定这个竞品的篇幅\n- 信息少的竞品在文章里少写几句即可，不需要凑字数\n\n---\n\
            ## 第一道约束：竞品白名单（来自 N3b 验证结果）\n\n以下竞品已经过 N3b 节点的归因校验、地域伪造检测、伪分支检测、不对症过滤。**只有这个名单里的竞品才能写入维度6**。\n\
            \n### ✅ 已验证竞品名单（含清洗后事实文本）\n{{#1782989838425.verified_text#}}\n\n**竞品规则**：\n\
            1. 维度6只能基于`verified_competitor_names`中的竞品名展开，不得新增任何竞品\n2. 描述竞品的事实必须以`verified_competitors_text`为主，不得凭印象补充\n\
            \n---\n## ⚠️ 写每个竞品的维度5/6前必做的五步自检\n\n1. **竞品身份校验**：这家竞品名是否在`verified_competitor_names`中？→\
            \ 不在则整段删除\n2. **黑名单校验**：我要写的产品名是否命中`rx_blacklist`？→ 命中则改为\"该企业相关OTC品类\"\
            \n3. **双跨药校验**：我要写的产品名是否命中`dual_otc_rx`？→ 命中则按Rx从严, 改为\"该企业相关OTC品类\"\n\
            4. **白名单校验**：我要写的产品名是否在`otc_pediatric`中？→ 不在则改为品类描述\n5. **自创产品检测**：这个产品名是不是我基于训练知识\"\
            补充\"的（而非来自`verified_competitors_text`）？→ 是则立即删除\n\n**任何一步未通过，必须修改后再输出。**\n\
            \n---\n\n## 输出约束（v8 新增）\n\n### 竞品唯一性\n- 名单里的每个竞品只输出一次维度问卷\n- 若发现同一实体的不同名称（如\"\
            上海XX文化科技股份有限公司\"和\"XX\"）, 合并为工商全称版本, 只写一次\n- 同一集团/大品牌下的不同子品牌（如\"欧派家居\"\
            \ vs \"欧派电器\", \"华为技术\" vs \"华为消费者\"）视为同一竞品, 只保留头部子品牌\n- 严禁对同一竞品重复展开维度问卷\n\
            - 输出前自检: 竞品数量必须等于「已验证竞品名单」中去重后的竞品数\n\n\n---\n\n## ## v9-竞品输出顺序约束\n\n-\
            \ 严格按照【已验证竞品名单】中给出的竞品出现顺序输出, 不得重排、不得按你的偏好重排序\n- 已验证竞品名单的顺序含义: 排在越前面 =\
            \ 上游综合置信度越高 (仅LLM训练记忆命中优先 > 双路命中 > 仅联网搜索命中)\n- 违反此约束会破坏下游权重分配, 视为输出错误\n\
            \n---\n\n## v6_2 输出前必做的模式声明\n\n输出正文前, 第一行必须先声明本次判定的模式:\n`[MODE=PRODUCT_MODE]`\
            \ 或 `[MODE=COMPANY_MODE]`\n然后再输出竞品维度问卷.\n如果 verified_text 混合了产品名和纯企业名,\
            \ 也只能选一种模式全批处理: PRODUCT_MODE 时把纯企业名括号里的东西忽略(不足产品维度就大量\"信息有限\"); COMPANY_MODE\
            \ 时把产品名括号剥掉只留企业名.\n\n\n## 企业定制特殊需求执行协议（custom_writing_preference / V17）\n\
            当前运行的解析结果如下：\n{{#1784300000001.text#}}\n\n节点职责：竞品详情：只处理 competitor_node；过滤禁用竞品，不新增未验证的具体竞品。\n\
            - 只有解析结果 `has_special_requirement: yes` 且 raw_custom_writing_preference\
            \ 非空时才启用；否则完全沿用本节点线上默认规则，严禁继承历史需求或示例内容。\n- 原始 custom_writing_preference\
            \ 是唯一事实源；解析文本用于分发，若二者冲突，以当前原文及当前 plan.item 为准。\n- 对迭代内单篇任务，必须逐条执行 plan.item.custom_writing_instruction、custom_contract_summary、custom_article_group、custom_required_competitors、custom_faq_required、custom_comparison_targets；未分配给本篇的要求不得跨篇串用。\n\
            - 客户硬约束优先于普通风格偏好，但不得突破法律合规、事实真实性和禁止编造红线。医疗/金融的绝对化、疗效或收益承诺必须改为合规等价表达，并在自评说明冲突。\n\
            - 输出只能包含本节点规定的业务结果，严禁向标题、正文、标签泄漏 custom_* 字段名、解析过程、任务单、占位符或“根据客户要求”等元说明。\n\
            - 交付前逐项自检：数量/类型、字数、FAQ/表格、必现句、禁用词、竞品数量与禁竞品、竞品跨篇差异、指定重点、正文完整性。\n"
        - id: shengyi-competitor-evidence-guard-v1
          role: system
          text: '## 竞品事实发布闸门（2026-08-25，优先级高于旧版维度问卷）

            本节点输出会被批量文章直接引用，必须把“内部路由信息”和“可发布事实”彻底分离。


            1. 唯一事实源：竞品名称、业务、产品、服务、客群、规模、资质、口碑、排名只能来自当前 `verified_text` 中该竞品条目的明确原文或证据字段。模型记忆、常识、注册资本、注册地址、经营范围和企业名称都不能补全事实。

            2. 内部标签禁出：`T1/T2/T3`、梯队、候选得分、赛道排序、置信度路由、内部评分只能用于流程选取，不得输出到维度6/8/9，也不得被改写成“行业排名”“头部/腰部”“第一梯队”等文章事实。没有可核验公开来源时，维度9必须写“信息有限”。

            3. 客群与适配禁推：除非 verified_text 明确逐字给出服务对象或产品适用范围，否则不得输出“适合/适配中小微企业、初创企业、100人以下企业、大中型企业、集团企业、预算有限企业、单一报销/差旅场景”等判断；不得从注册资本或经营范围推导这些结论。缺证据就写“信息有限”。

            4. 负面与相对判断禁出：不得输出“轻量化工具、复杂功能不足、适配度低/较低、支撑能力不足、仅适合、只能、缺乏、短板、劣势、能力有限”等竞品贬损或相对能力判断。没有证据时删除，不得用委婉词替代。

            5. 维度6只能写可核验的产品/服务/资质事实；维度8只能写 verified_text 明确出现的服务对象；维度9只能写带来源的公开认证/评测/荣誉。全部缺失时保留“信息有限”。

            6. 输出前逐条检查：每个数字、客群、梯队和能力描述都能在对应竞品条目中定位；定位不到即删除。下游不得把“信息有限”扩写为任何优势、短板、推荐或不推荐结论。

            '
        - id: shengyi-competitor-evidence-density-v2
          role: system
          text: '## N3c 竞品事实完整性修复（2026-08-26）

            - 事实闸门不是“全部写信息有限”。先读取 verified_text 中该竞品的完整条目，再逐维度提取所有明确事实；有事实就写事实，无事实才写“信息有限”。

            - 对普通商务服务/企业软件竞品，注册地址、注册资本、经营范围只能作为基础工商事实；若 verified_text 同时提供业务类别、产品/服务、客户类型、资质、案例、区域覆盖或公开荣誉，必须分别放入对应维度，不能只保留工商三件套。

            - 不得让所有竞品的多个维度使用同一句“公开信息待核验”。“信息有限”只允许出现在缺失的单个维度，不能成为整家企业的统一摘要。

            - 输出维度时避免机械套句“其他业务相关信息建议查询企业公开披露内容”；缺失项直接写“信息有限”，已有事实直接陈述。下游文章会自然跳过缺失项。

            - 竞品事实按主体分别组织，不能把一家企业的业务、客户或资质迁移给另一家；也不能为了形成对比而给事实较少的企业补齐同样字段。

            '
        - id: shengyi-competitor-entity-name-v5
          role: system
          text: '## 非医药产品/服务竞品唯一命名规则（2026-08-26，最高优先级）

            当前关键词和行业若属于金融服务、软件、SaaS、企业服务或其他非医药领域，禁止套用药品模板“通用名+生产企业”，也禁止把行业品类直接当成每家竞品的唯一名称。


            ### 命名目标

            同一篇文章中，每个竞品必须一眼可区分；不同主体不得都显示为“智能股票软件”“费控系统”“财务报销系统”等相同品类名。


            ### 显示名生成顺序

            1. 如果验证材料明确给出该主体名下的具体产品/品牌名，使用：`具体产品名（主体：企业全称）`。例如：`某产品（主体：某企业全称）`。不得把未验证的产品名补给主体，也不得只写主体简称。

            2. 如果没有明确的具体产品/品牌名，使用：`企业全称 + 品类名称`。例如：`某企业全称+品类名称`、`北京中方信富投资管理咨询有限公司智能股票软件`。不要输出成“智能股票软件（企业全称）”。

            3. 如果验证材料只提供主体简称，首次显示使用已验证的主体全称；只有材料明确给出简称时，后文才可使用简称。

            4. 如果具体产品名本身就是关键词品类或泛化词（如“智能股票软件”“股票软件”“费控系统”“报销系统”），视为没有具体产品名，回退到规则2。

            5. 主体与产品绑定必须来自同一条验证材料或明确的主体—产品关系；不得把同赛道其他公司的产品名迁移给当前主体。


            ### 输出位置

            - N3c 的 `###` 标题、正式名称字段、规范化名称必须使用上述唯一显示名。

            - 下游 N6/N7/N8 只能沿用 N3c 生成的唯一显示名，不得重新把所有对象改回同一个品类词。

            - 文章标题、H2/H3、表格第一列和正文首次出现处必须使用唯一显示名；后文可使用已验证简称或“该产品/该主体”，但不能造成主体混淆。


            ### 非医药产品模式输出模板

            第一行仍输出 `[MODE=PRODUCT_MODE]`，但将维度解释为产品/服务模式：

            - `规范显示名`：按上述规则生成

            - `具体产品/品牌`：有证据写具体名称；没有写“未提供具体产品名”，不要写“通用名为智能股票软件”

            - `所属主体`：企业全称或验证材料明确的主体

            - `产品/服务类别`：关键词品类，例如智能股票软件

            - 其他维度：功能模块、技术/数据来源、服务方式、资质、客户类型、收费/交付边界等，只能写验证材料明确事实；没有则留空，不要重复套药品字段


            ### 强制自检

            - 检查所有 `###` 标题去重：不能有两个或以上完全相同的“智能股票软件”“费控系统”等泛化标题。

            - 如果出现重复泛化标题，立即改为“主体全称+品类名称”或“具体产品名（主体：企业全称）”，不得继续输出。

            '
        - id: shengyi-nonmedical-product-mode-v6
          role: system
          text: '## 非医药行业模式覆盖规则（N3c，优先于旧版药品问卷）

            - 当 `industry` 属于金融服务、商务服务、企业服务、软件/SaaS，或关键词包含“软件、平台、系统、工具、服务商、机构、公司”时，按非医药产品/服务模式解析；旧版
            PRODUCT_MODE 中的“通用名、商品名、生产企业、剂型、适应症、OTC/Rx、批准文号、用法用量、禁忌、包装规格”字段不再作为输出模板。

            - 为兼容下游，第一行可继续保留 `[MODE=PRODUCT_MODE]`，但正文维度必须改为：`规范显示名`、`具体产品/品牌`、`所属主体`、`产品/服务类别`、`已验证功能/业务`、`已验证资质/认证`、`已验证服务对象/区域`、`交付或收费边界`、`信息缺口`。

            - “智能股票软件”“财务报销系统”“差旅费控系统”等仅是品类词，不得作为具体产品名；若验证材料没有独立产品/品牌名，`具体产品/品牌` 必须写“未提供具体产品名”，并将
            `规范显示名` 生成为“主体全称+品类名称”。

            - 不得为了填满旧版 P1-P9 而反复输出“信息有限”。缺失维度直接省略或合并到一次性“信息缺口”，已有事实必须按主体分别展开。

            - 输出前检查：每个实体的 `规范显示名` 与 `###` 标题唯一；下游可直接读取该字段，不得再根据关键词重命名。

            - COMPANY_MODE 下，`规范显示名` 默认使用验证材料中的企业全称；“用友、致远互联、每刻科技”等简称只能作为同一实体首次全称出现后的后文简称，不能在开头总括、标题、H3或表格首列单独使用。

            '
        - id: shengyi-competitor-evidence-tier-v7
          role: system
          text: '## 竞品证据等级与可发布用途（N3c，覆盖工商三件套误用）

            对每个非医药竞品先在内部判定证据等级，并在输出中给出 `证据等级` 与 `可发布用途`，供 N5/N6/N7 读取：

            - A级：验证材料明确同时给出产品/服务名称或功能、所属主体关系，并有资质、客户、案例、部署或其他业务事实中的至少一项。可用于“已验证产品/服务信息”“公开事实摘要”，不得自动改写为“优势”“更适合”或“推荐”。

            - B级：验证材料明确给出主体的业务定位、产品线或服务类别，但缺少足够的产品能力/客户/交付证据。可用于“业务定位/主体信息摘要”，不得写成“品牌核心优势”“适配场景”“口碑”或排名依据。

            - C级：只有注册地址、注册资本、法定代表人、经营范围等工商登记字段，或产品与主体关系无法确认。只能用于主体识别和一次性采购核验清单；不得进入“品牌优势盘点”“推荐理由”“适配人群”“性能/技术/服务对比”主体段。

            - D级：主体真实性、赛道归属或产品关系无法确认。不得进入文章竞品名单；不得用“某品牌/某公司”占位替代。

            - 经营范围中的“软件开发、技术服务、企业管理咨询、票务代理”等仅是登记范围，不能改写成“已提供财务报销系统/具备某项产品能力”。必须标注为“工商范围事实，不等同于已验证产品能力”。

            - 证据等级不是行业排名，不得输出 T1/T2/T3、头部、腰部、第一梯队等内部路由标签。缺证据时不输出“建议查询企业公开信息”作为每家固定结尾；统一由下游在文章末尾生成一次核验边界。

            - 只要存在明确产品名，必须同时核验“产品名—主体”绑定；绑定不清时按 C 级处理，不得把同赛道其他主体的产品名迁移过来。

            '
        - id: custom-v18-competitor-detail
          role: system
          text: '## CUSTOM_COMPETITOR_EVIDENCE_V18

            本次特殊需求解析：{{#1784300000001.text#}}

            - 竞品详情只基于上游已验证名单和可核验材料；custom可指定重点对比维度、产品/企业主体口径和逐篇轮换需求，但不能授权补写未经验证的数据、资质、价格、案例或评价。

            - 匿名/xx企业是文章展示策略，不应破坏内部证据主体映射；输出事实仍需能被N5/N6绑定到真实已验证对象。

            - 禁竞品任务可减少无用展开；无特殊需求时按默认竞品证据流程，不继承历史名单。

            '
        - id: n3-usr-v2
          role: user
          text: '## 客户点名可提及竞品（这些对象允许写，必须给实质内容，禁用规避话术）

            {{#1776605036452.allowed_competitors#}}


            ## 客户定制要求原文（含禁用竞品等口径）

            {{#1776153503356.custom_writing_preference#}}


            请根据已验证的竞品名单补充详情。'
        - id: comp-entity-rule-01
          role: system
          text: '

            ## 竞品运营主体口径（客户已确认，最高优先级）

            - 契约锁的运营主体是「上海亘岩网络科技公司」。不得写成「契约锁（海南）科技有限公司」或任何其他关联公司、子公司、分支机构。

