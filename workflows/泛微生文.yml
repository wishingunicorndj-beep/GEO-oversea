          \    )\n\ndef _image_text(image, html_mode):\n    desc = str(image.get('description')\
          \ or image.get('vlm') or image.get('core') or '相关图片')[:80]\n    if html_mode:\n\
          \        return '<figure><img src=\"%s\" alt=\"%s\" loading=\"lazy\" /></figure>'\
          \ % (\n            escape(str(image['url']), quote=True), escape(desc, quote=True))\n\
