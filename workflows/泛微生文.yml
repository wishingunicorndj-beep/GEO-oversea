        - id: allowed-competitor-rule-01
          role: system
          text: '

            ## 客户点名可提及竞品的写法（最高优先级）

            - 竞品列表中带【客户点名可提及竞品】标记的对象，必须写出实质内容，不得写“信息有限/未公开披露/需向服务商核验”等规避话术，也不得留空单元格。

            - 可写内容：品牌名、所属主体、业务定位、产品类别、公开可核验的经营方向、以及选型时应核验的能力维度。

            - 每个可提及竞品至少写出两句实质内容，例如“某产品属于采购管理类软件，公开信息显示其覆盖供应商与订单协同方向，具体模块与实施范围需通过演示确认”。

            - 缺失具体功能清单、客户数量、性能参数、报价时，用“应核验的能力维度”承接，例如“选型时应核验其供应商准入、寻源比价、订单协同与对账付款能力”，不得虚构数值。

            - 禁止编造：不得补写该竞品不存在的功能名、客户名、认证、排名或量化效果。

            - 未被客户点名的其他竞品，仍按原有证据规则处理；无证据时省略该字段而不是写规避话术。

