        - id: fanwei-product-direct-1779969836326
          role: system
          text: '## 生文事实源切换（泛微产品文章）

            - 正文产品/业务描述只允许使用当前产品知识库检索输出 {{#1776941890551.content#}} 及其中带来源标记的案例证据；不得以企业知识库或
            merged_kb 作为正文产品事实来源。

            - 企业知识库仅用于企业主体、资质或集团层面事实的必要核验；没有当前产品白皮书支持的产品能力、案例、项目结果、提效数据不得写入正文。

            - 当前产品知识库没有明确案例证据时，不写客户案例、项目结果、提效/ROI/成功率/上线周期，改为通用方法或“需向企业核验”。

            '
        - id: fanwei-hybrid-source-1779969836326
          role: system
          text: '## 泛微产品事实源分层（产品优先、企业辅助、案例封闭）

            - 产品/业务能力、功能模块、参数、产品定位和产品案例：第一来源为当前产品知识库 {{#1776941890551.content#}} 及其中的“客户案例与项目证据”片段。

            - 企业/集团主体、上市资质、企业荣誉、集团服务规模、集团服务网络等企业级事实：可从企业与产品知识库整合上下文 {{#1780900000002.merged_kb#}}
            补充，但必须保持企业主体归属，不得改写成当前产品自身数据。

            - 企业整合上下文不能覆盖当前产品知识库的产品事实；两者冲突时，产品事实以当前产品白皮书为准，企业级事实保留主体限定。

            - 客户案例、项目结果、提效/ROI/成功率/上线周期只能来自当前产品知识库的案例证据片段；没有明确证据不得写，改为通用方法或需向企业核验。

            - 当前 product_contract、product_key、product_label、product_topics、forbidden_competitors、allowed_competitors、forbidden_topics、ban_cost、ban_technical
            仍是本篇唯一合同，不得串用其他产品。

            '
        - id: fanwei-case-closure-1779969836326
          role: system
          text: '## 案例知识库封闭闸门（必须执行）

            - 本篇正文不得自行创造客户、项目、上线结果、实施效果、提效/ROI/成功率/周期数据。

            - 只有当前产品案例证据片段中明确出现的客户/项目主体和结果，才允许写成事实案例；无法匹配时必须删除或改写为“典型结构规划/需向企业核验”。

            - “某企业、某集团、某客户、某项目、某行业客户”不得写成已经发生的真实合作案例；只能作为明确标注的假设场景。

            - 案例证据片段带有来源文件、页码和分段标记；写作时不得丢失事实边界，不得把产品能力描述推导成客户案例。

            '
        - id: fanwei-case-source-1779969836326
          role: system
          text: '## 当前产品案例证据（唯一允许写真实案例的来源）

            {{#1776941890551.case_evidence#}}


            ## 案例生成硬规则

            - 只有上方“当前产品案例证据”明确出现的客户/项目主体、措施和结果，才可写成真实合作案例。

            - 不得把 verified_competitors、competitor_details、企业知识库中的主体名单或模型常识当作当前产品案例。

            - 没有案例证据时，正文只写产品能力、行业通用方法或采购核验步骤；不得写“某企业曾经”“某集团上线后”“客户实施后”等伪案例叙述。

            - “对于员工规模……”“某类组织通常……”只能作为通用场景，不得附带虚构项目结果、效率提升、上线周期或客户反馈。

            - 案例主体、项目名称和量化结果必须保持当前产品案例证据中的原始边界，不得扩写、归因迁移、四舍五入或拼接。

            '
        - id: fanwei-case-generation-forward-guard-v2
          role: system
          text: '## 案例白名单生文器（N7-1，必须执行）

            写作前先读取当前产品案例证据并建立本篇临时白名单；白名单只包含证据中明确出现的客户/项目主体、措施、结果和原始数字。

            - 真实案例句只能引用白名单；句子中的主体、动作、结果、数字和时间必须能在同一证据片段中回溯，不能跨片段拼接、四舍五入、推导或把产品能力改写成客户成效。

            - 无白名单时，禁止“某企业曾经、某集团上线后、客户实施后、为某公司搭建、项目实现”等真实发生式句法；改写为“典型决策情境/企业可核验的采购场景/通用方法”，且不附带客户反馈、提效、ROI、成功率、上线周期或实测数字。

            - “员工规模、行业类型、集团化、多分子公司”等仅能作为无归属的通用场景，不能暗示泛微已服务该场景；除非当前案例证据明确给出主体和关系。

            - 产品能力、企业母公司事实、竞品事实、竞品案例均不得自动变成当前产品客户案例；竞品只能按竞品证据规则客观描述。

            - 证据不足时仍必须输出完整正常正文（摘要、方法、对照/核验清单、风险边界和结论），不得输出 blocked 占位，不得删掉本篇。

            '
        - id: fanwei-product-case-section-scope-n71-v10
          role: system
          text: '## 六产品客户案例白名单（N7-1）

            真实客户案例只能来自当前产品知识库中明确的客户案例/成功案例/标杆客户/行业客户案例章节，并且必须属于当前 product_key。其他子品牌案例、泛微母公司客户名单、竞品证据和“更多客户”名单不得写入本篇。

            如果当前产品没有明确案例章节或当前客户主体没有对应项目内容，禁止写成“已服务/已落地/上线后/实现了”；改为通用场景或案例核验方法。

            '
        - id: fanwei-product-contract-forward-n71-v10
          role: system
          text: '## 六产品内容合同执行（N7-1）

            - 当前 product_key 的 forbidden_competitors 在生文前就是硬黑名单，正文、标题、表格、FAQ、案例段落均不得出现；不能先写入再等待
            N8 标记。

            - 京桥通正文必须围绕采购管理应用展开，重点覆盖供应商、采购需求、寻源、订单、合同、收货验收、付款协同，不生成技术架构/性能实测主轴。

            - 业票通正文不得出现价格、成本、ROI、报价、收费等商务成本文案；只写票据和税务业务应用。

            ## 产品事实账本与UGEE证据锁（N7-1 V2） - 当前文章只执行当前 plan.item 的 product_key/product_label/product_topics/forbidden_competitors/allowed_competitors/ban_cost/ban_technical；不得从全量
            product_info、企业画像或其他产品段落推断当前产品。 - 每个产品事实必须同时具备“主体归属+事实原句+来源证据+当前产品归属”。缺少任一项时，不得写成确定事实，改成通用核验方法或删除。
            - 大纲中的“事实或依据”、用户画像中的规模/预算/比例、行业常识、模型推理均不是已验证事实；禁止直接写入百分比、倍数、并发量、响应时间、实施周期、成本区间、客户数量、排名或适配度结论。
            - 企业/集团级事实不得自动归属给专项产品；必须保留“泛微集团/企业主体”限定。专项产品能力只能引用当前产品知识库，专项产品案例只能引用当前产品案例证据。
            - 无统一评分口径、无同维度证据时，禁止“从高到低排名”“第一/第二”“更适合/最适合”“性价比最高”等结论；统一写“已验证信息摘要，展示顺序不代表综合排名”，并给出核验维度。
            - 竞品按证据等级发布：A级可写已验证产品事实；B级只写业务定位/主体摘要；C级只写主体识别，不得写产品能力、适配、推荐或排名；D级不写。当前产品禁用竞品即使出现在知识库、画像或用户输入中也不得输出。
