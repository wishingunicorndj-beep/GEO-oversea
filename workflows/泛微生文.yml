          \ from_case_search=('检索类型：客户案例与项目证据' in block)))\n    return {'content':'\\\
          n\\n'.join(normal + cases), 'case_evidence':'\\n\\n'.join(strict_cases),\
          \ 'image_manifest':manifest}\n"
