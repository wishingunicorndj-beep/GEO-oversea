          \ from_case_search:\n            continue\n        start = match.start()\n\
          \        tail = text[match.end():]\n        next_chapter = _NEXT_CHAPTER_RE.search(tail)\n\
          \        end = match.end() + next_chapter.start() if next_chapter else len(text)\n\
          \        section = text[start:end].strip()\n        if len(section) >= 20\
          \ and (not from_case_search or _DETAILED_CASE_SIGNAL.search(section)):\n\
          \            scoped.append(section)\n    # 案例专用检索返回的分段可能从案例正文中部开始；只有分段自身仍包含明确案例标题时才接收。\n\
          \    if not scoped and from_case_search and _DETAILED_CASE_SIGNAL.search(text)\
          \ and re.search(r'客户案例|成功案例|行业客户案例|典型案例|项目案例|客户实践|客户故事', text, re.I):\n\
          \        return [text.strip()]\n    return scoped\n\ndef _extract_images(content,\
