          1. THINK 标签写正确（<think>...</think> 而非 <!think>）\n2. 简化逻辑：clean_out 有效就直接用，不做不必要的\"\
          重建\"\n3. markers 占位符仅匹配明确的占位符，不误伤正常文章\n4. 解析 JSON 时优先剥 markdown 围栏（```json\
          \ ... ```）\n5. content 有效性阈值：合规正文低于2000字才视为短文并回退/重写；2000-2500字为有效范围\n6.\
          \ JSON 畸形/截断时从原始文本直接提取 HTML 正文兜底\n\"\"\"\nimport re\nimport json\n\nMAX_INPUT_LEN\
          \ = 200_000\n\ndef _clamp(val):\n    if isinstance(val, str) and len(val)\
          \ > MAX_INPUT_LEN:\n        return val[:MAX_INPUT_LEN]\n    return val\n\
          \ndef _strip_think(raw):\n    \"\"\"剥离 <think>...</think> 思考链\"\"\"\n  \
          \  if not raw or not isinstance(raw, str):\n        return raw or ''\n \
          \   s = re.sub(r'<think>.*?</think>', '', raw, flags=re.S | re.I)\n    if\
          \ '</think>' in s:\n        s = s.split('</think>', 1)[-1]\n    if '<think>'\
          \ in s:\n        s = re.sub(r'<think>.*', '', s, flags=re.S | re.I)\n  \
          \  return s\n\ndef _parse_json(text):\n    \"\"\"从字符串中提取并解析 JSON 对象，宽容处理\
          \ markdown 围栏\"\"\"\n    if not text or not isinstance(text, str):\n   \
          \     return {}\n    s = _strip_think(text).strip()\n    # 剥 markdown 围栏\n\
          \    m = re.search(r'```(?:json)?\\s*(\\{[\\s\\S]*\\})\\s*```', s, re.S)\n\
          \    if m:\n        s = m.group(1)\n    # 直接解析\n    try:\n        obj =\
          \ json.loads(s, strict=False)\n        if isinstance(obj, dict):\n     \
          \       return obj\n    except Exception:\n        pass\n    # 兜底：抠出第一个\
          \ { 到最后一个 } 的范围\n    start = s.find('{')\n    end = s.rfind('}')\n    if\
          \ start >= 0 and end > start:\n        try:\n            obj = json.loads(s[start:end\
