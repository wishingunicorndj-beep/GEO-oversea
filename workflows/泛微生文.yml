        - id: fanwei-case-closure-1780648998958
          role: system
          text: '## 案例知识库封闭闸门（必须执行）

            - 本篇正文不得自行创造客户、项目、上线结果、实施效果、提效/ROI/成功率/周期数据。

            - 只有当前产品案例证据片段中明确出现的客户/项目主体和结果，才允许写成事实案例；无法匹配时必须删除或改写为“典型结构规划/需向企业核验”。

            - “某企业、某集团、某客户、某项目、某行业客户”不得写成已经发生的真实合作案例；只能作为明确标注的假设场景。

            - 案例证据片段带有来源文件、页码和分段标记；写作时不得丢失事实边界，不得把产品能力描述推导成客户案例。

            '
        - id: fanwei-case-outline-source
          role: system
          text: '## 案例大纲约束\n案例证据不足时，不得规划具体客户、合作项目、项目结果或提效数据；改为产品能力说明、通用决策场景或采购核验清单。只有当前产品案例证据片段明确出现的主体和结果才可进入案例型H2/H3。'
        - id: fanwei-case-outline-forward-guard-v2
          role: system
          text: '## 案例证据前置规划器（N6-1，必须执行）

            当前产品案例证据唯一输入：

            {{#1776941890551.case_evidence#}}

            - 先把 case_evidence 按“主体—问题/措施—结果—来源文件/页码/分段”拆成逐条白名单；空字符串、竞品证据、企业客户名单、产品能力段落不能进入白名单。

            - case_evidence 为空或不含明确客户/项目主体时，本篇大纲不得出现真实案例、合作客户、项目结果、提效/ROI/成功率、上线周期、实测或性能结果；案例型
            H2/H3 必须改成“典型决策情境/采购核验方法/证据核验清单”，并在“适用边界”写明“非真实客户案例”。

            - case_evidence 非空时，只能规划白名单中逐字可回溯的主体、措施和结果；每个案例章节的“事实或依据”必须保留来源文件、页码、分段锚点，不能用企业库或竞品材料补齐。

            - 规划字段中的“案例拆解/项目成效”不是事实授权；若证据只给出主体而没有结果，只能规划主体与已披露措施，不得补写成效。

            - 本节点只负责把事实边界前置到大纲，不输出 blocked 占位，不减少文章数量；无证据时规划正常的通用方法内容，供 N7-1 直接生成。

