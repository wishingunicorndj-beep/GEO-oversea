          role: system
          text: '## 六产品内容合同前置约束（N6-1）

            - 京桥通：禁止规划技术架构、技术参数、并发、SLA、性能实测类文章；必须把篇幅优先放在采购需求、供应商管理、需求管理、寻源管理、订单管理、合同执行、收货验收和采购应用流程。

            - 业票通：禁止规划价格、成本、ROI、报价、收费、投入产出等内容；改为发票采集、验真查重、开票、红冲、票审、归档、税务协同和业财票税档应用。

            - 齐业成、文书定、今承达、泛微：产品禁用竞品和禁用主题必须在大纲中排除，不能留到终稿才拦截。

            '
