          \ doc, page, part, text.strip()))\n        _extract_images(text, manifest,\
          \ seen)\n    return out\n\ndef main(body, case_body='', product_info=''):\n\
          \    manifest=[]; seen=set()\n    normal=[]; cases=[]\n    for block in\
          \ _records(body, '能力与产品信息', manifest, seen):\n        cases.append(block)\
          \ if _CASE_TERMS.search(block) else normal.append(block)\n    cases.extend(_records(case_body,\
          \ '客户案例与项目证据', manifest, seen))\n    strict_cases=[]\n    for block in cases:\n\
