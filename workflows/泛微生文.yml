    - data:
        code: "import re\nimport json\n\ndef main(\n    candidate_name='',\n    is_company='false',\n\
          \    request_ready='false',\n    body=None,\n    status_code=None,\n   \
          \ entity_query_name='',\n    department_or_service='',\n    entity_split_reason=''\n\
          ) -> dict:\n    name = str(candidate_name or '').strip()\n    query_name\
          \ = str(entity_query_name or candidate_name or '').strip()\n    company_flag\
          \ = str(is_company).lower() == 'true'\n    ready_flag = str(request_ready).lower()\
          \ in ('true', '1')\n    result = {\n        'name': name,\n        'display_name':\
          \ name,\n        'query_name': query_name,\n        'entity_query_name':\
          \ query_name,\n        'department_or_service': str(department_or_service\
          \ or '').strip(),\n        'entity_split_reason': str(entity_split_reason\
          \ or '').strip(),\n        'entity_type': 'company' if company_flag else\
          \ 'non_company',\n        'checked': 'false',\n        'found': 'unknown',\n\
          \        'status': 'skipped_non_company' if not company_flag else 'degraded',\n\
          \        'company': {},\n        'evidence': '',\n        'error': ''\n\
          \    }\n\n    if not company_flag:\n        return {'result': result}\n\
          \    if not ready_flag:\n        result['status'] = 'skipped_missing_secret'\n\
          \        result['error'] = 'missing_secret_configuration'\n        return\
          \ {'result': result}\n\n    def _first(*vals):\n        for v in vals:\n\
          \            s = str(v or '').strip()\n            if s:\n             \
          \   return s\n        return ''\n\n    def _normalize_company(raw):\n  \
          \      if not isinstance(raw, dict):\n            return {}\n        normalized\
          \ = dict(raw)\n        mappings = {\n            'company_name': ['companyName',\
          \ 'name', 'entName', 'ent_name'],\n            'name': ['companyName', 'name',\
          \ 'entName', 'ent_name'],\n            'legal_person': ['legalPerson', 'oper_name',\
          \ 'fr_name'],\n            'reg_capital': ['capital', 'regCapital', 'reg_capital'],\n\
          \            'address': ['companyAddress', 'address', 'regLocation', 'reg_location'],\n\
          \            'business_scope': ['businessScope', 'scope', 'business_scope'],\n\
          \            'status': ['companyStatus', 'regStatus', 'reg_status', 'corp_status'],\n\
          \            'credit_no': ['creditNo', 'credit_code', 'unifiedSocialCreditCode'],\n\
          \            'company_type': ['companyType'],\n            'company_code':\
          \ ['companyCode'],\n            'authority': ['authority'],\n          \
          \  'province': ['province'],\n            'city': ['city'],\n          \
          \  'district': ['district'],\n            'alias': ['alias', 'shortName',\
          \ 'short_name', 'usedName', 'used_name', 'formerName', 'former_name'],\n\
          \        }\n        for target, keys in mappings.items():\n            normalized[target]\
          \ = _first(*[raw.get(k) for k in keys])\n        alias_values = []\n   \
          \     for key in ('alias', 'aliases', 'shortName', 'short_name', 'usedName',\
          \ 'used_name', 'formerName', 'former_name', 'historyNames', 'history_names'):\n\
          \            v = raw.get(key)\n            if isinstance(v, list):\n   \
          \             alias_values.extend([str(x).strip() for x in v if str(x or\
          \ '').strip()])\n            elif str(v or '').strip():\n              \
          \  alias_values.append(str(v).strip())\n        seen_alias = []\n      \
          \  for a in alias_values:\n            if a and a not in seen_alias:\n \
          \               seen_alias.append(a)\n        normalized['aliases'] = seen_alias\n\
          \        return normalized\n\n\n    def _compact(v):\n        return re.sub(r'[\\\
          s\\u200b\\u200c\\u200d\\ufeff]+', '', str(v or '')).strip().replace('（',\
          \ '(').replace('）', ')')\n\n    def _is_public_hospital_entity(query_name,\
          \ company):\n        q = str(query_name or '').strip()\n        hit_name\
          \ = _first(company.get('company_name'), company.get('companyName'), company.get('name'))\n\
          \        ctype = _first(company.get('company_type'), company.get('companyType'))\n\
          \        scope = _first(company.get('business_scope'), company.get('businessScope'))\n\
          \        hospital_markers = ('医院', '卫生院', '妇幼保健院', '中医医院', '人民医院', '附属医院')\n\
          \        public_types = ('事业单位', '民办非企业', '社会组织')\n        enterprise_suffixes\
          \ = ('有限公司', '有限责任公司', '股份有限公司', '集团有限公司', '门诊部有限公司', '诊所有限公司', '医院有限公司')\n\
          \        if not q or not hit_name:\n            return False\n        if\
          \ any(x in hit_name for x in enterprise_suffixes):\n            return False\n\
          \        return any(x in q for x in hospital_markers) and (any(x in ctype\
          \ for x in public_types) or '为人民身体健康提供医疗' in scope or '医疗与护理' in scope)\n\
          \n    def _same_company_name(query_name, company):\n        hit_name = _first(company.get('company_name'),\
          \ company.get('companyName'), company.get('name'))\n        q = _compact(query_name)\n\
          \        h = _compact(hit_name)\n        if q and q == h:\n            return\
          \ True\n        if q and h and _is_public_hospital_entity(query_name, company):\n\
          \            return bool(re.fullmatch(re.escape(q) + r'\\([^()]+\\)', h))\n\
          \        return False\n\n    def _active_company_status(company):\n    \
          \    status = _first(company.get('status'), company.get('companyStatus'))\n\
          \        bad_words = ('注销', '吊销', '撤销', '迁出', '停业', '歇业', '清算', '撤消')\n\
          \        good_words = ('存续', '在营', '开业', '在册', '正常', '有效')\n        if not\
          \ status:\n            return True\n        if any(w in status for w in\
          \ bad_words):\n            return False\n        if any(w in status for\
          \ w in good_words):\n            return True\n        return False\n\n \
          \   try:\n        http_code = int(status_code) if str(status_code or '').strip().isdigit()\
          \ else None\n        if http_code in (401, 403):\n            result['status']\
          \ = 'unauthorized'\n            result['error'] = 'http_unauthorized'\n\
          \            return {'result': result}\n        if http_code == 429:\n \
          \           result['status'] = 'rate_limited'\n            result['error']\
          \ = 'http_rate_limited'\n            return {'result': result}\n       \
          \ if http_code and http_code >= 500:\n            result['status'] = 'server_error'\n\
          \            result['error'] = 'http_server_error'\n            return {'result':\
          \ result}\n\n        obj = body\n        if isinstance(obj, str):\n    \
          \        obj = json.loads(obj)\n        if not isinstance(obj, dict):\n\
          \            result['status'] = 'invalid_json'\n            result['error']\
          \ = 'body_not_object'\n            return {'result': result}\n\n       \
          \ result['checked'] = 'true'\n        code = obj.get('statusCode', obj.get('code',\
          \ obj.get('status')))\n        msg = str(obj.get('statusMessage') or obj.get('message')\
          \ or obj.get('error') or '')\n        data = obj.get('data', obj.get('result'))\n\
          \        if isinstance(data, list):\n            data = data[0] if data\
          \ else {}\n\n        success_code = code in (1, '1')\n        compatible_success_code\
          \ = code in (0, 200, '0', '200', None)\n        not_found_msg = any(x in\
          \ msg for x in ('查询无结果', '无查询结果', '查无结果', '未查询到', '未查到', '无结果', '不存在'))\n\
          \        empty_data = data in ({}, [], None, '')\n        if not_found_msg:\n\
          \            result['found'] = 'false'\n            result['status'] = 'not_found'\n\
          \            result['error'] = msg[:200]\n        elif success_code and\
          \ isinstance(data, dict) and data:\n            company = _normalize_company(data)\n\
          \            result['company'] = company\n            evidence_parts = []\n\
          \            cname = _first(company.get('company_name'), company.get('companyName'),\
          \ name)\n            credit = _first(company.get('credit_no'), company.get('creditNo'))\n\
          \            status = _first(company.get('status'), company.get('companyStatus'))\n\
          \            address = _first(company.get('address'), company.get('companyAddress'))\n\
          \            scope = _first(company.get('business_scope'), company.get('businessScope'))\n\
          \            if cname:\n                evidence_parts.append('水滴企业主体校验命中：'\
          \ + cname)\n            if credit:\n                evidence_parts.append('统一社会信用代码：'\
          \ + credit)\n            if status:\n                evidence_parts.append('经营状态：'\
          \ + status)\n            if address:\n                evidence_parts.append('注册地址/地址：'\
          \ + address)\n            if scope:\n                evidence_parts.append('经营范围：'\
          \ + scope[:180])\n            result['evidence'] = '；'.join(evidence_parts)\
          \ or cname\n            if not _same_company_name(query_name, company):\n\
          \                result['found'] = 'false'\n                result['status']\
          \ = 'name_mismatch'\n                result['error'] = ('水滴返回主体名称不一致：' +\
          \ cname)[:200]\n            elif not _active_company_status(company):\n\
          \                result['found'] = 'false'\n                result['status']\
          \ = 'inactive'\n                result['error'] = ('水滴返回主体经营状态非有效：' + status)[:200]\n\
          \            else:\n                result['found'] = 'true'\n         \
          \       result['status'] = 'found'\n        elif success_code:\n       \
          \     result['found'] = 'false'\n            result['status'] = 'not_found'\n\
          \            result['error'] = msg[:200]\n        elif compatible_success_code\
          \ and isinstance(data, dict) and data:\n            company = _normalize_company(data)\n\
          \            result['company'] = company\n            result['evidence']\
          \ = _first(company.get('company_name'), company.get('name'), query_name,\
          \ name)\n            cname = _first(company.get('company_name'), company.get('name'))\n\
          \            status = _first(company.get('status'), company.get('companyStatus'))\n\
          \            if not _same_company_name(query_name, company):\n         \
          \       result['found'] = 'false'\n                result['status'] = 'name_mismatch'\n\
          \                result['error'] = ('水滴返回主体名称不一致：' + cname)[:200]\n    \
          \        elif not _active_company_status(company):\n                result['found']\
          \ = 'false'\n                result['status'] = 'inactive'\n           \
          \     result['error'] = ('水滴返回主体经营状态非有效：' + status)[:200]\n            else:\n\
          \                result['found'] = 'true'\n                result['status']\
          \ = 'found'\n        elif compatible_success_code:\n            result['found']\
          \ = 'false'\n            result['status'] = 'not_found'\n            result['error']\
          \ = msg[:200]\n        else:\n            result['status'] = 'request_error'\n\
          \            result['error'] = msg[:200]\n    except json.JSONDecodeError:\n\
