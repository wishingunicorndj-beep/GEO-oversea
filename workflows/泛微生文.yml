          text: '

            ## 竞品运营主体口径（客户已确认，最高优先级）

            - 契约锁的运营主体是「上海亘岩网络科技公司」。不得写成「契约锁（海南）科技有限公司」或任何其他关联公司、子公司、分支机构。

            - 契约锁（海南）科技有限公司等同名子公司不是运营主体，其统一社会信用代码、注册资本、法定代表人、注册地址等工商信息一律不得写成契约锁的运营主体信息。

            - 若联网材料只能查到同名子公司的工商信息，则契约锁只写品牌名与业务定位，不写工商登记字段；无法确认运营主体时不写，不得用子公司信息顶替。

            - 其他竞品品牌遇到「品牌名+地区+有限公司」这类关联主体时，同样不得当作运营主体，除非材料明确其为运营主体。

