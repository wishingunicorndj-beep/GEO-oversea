    - data:
        code: "import json\nimport re\n\n\ndef main(http_body) -> dict:\n    \"\"\"\
          \n    解析 360 API 返回的 JSON, 抽取竞品列表 (正式版, 去 DEBUG)\n    修复: 自适应剥壳, 兼容 http_body\
          \ 被 Dify 多包一层 {'http_body':...}/{'body':...} 的情况\n    \"\"\"\n    resp =\
          \ _unwrap_to_choices(http_body)\n    if not isinstance(resp, dict):\n  \
          \      return _empty_result(f'unexpected body type: {type(http_body).__name__}')\n\
          \n    if isinstance(resp.get('error'), dict) or ('error' in resp and resp.get('choices')\
          \ is None):\n        return _empty_result(f\"api error: {json.dumps(resp.get('error'),\
          \ ensure_ascii=False)}\")\n\n    choices = resp.get('choices', [])\n   \
          \ if not choices:\n        return _empty_result('empty choices in response')\n\
          \n    content = choices[0].get('message', {}).get('content', '')\n    if\
          \ not content:\n        return _empty_result('empty content in message')\n\
          \n    content = content.strip()\n    content = _strip_markdown_fence(content)\n\
          \n    competitors_data = None\n    try:\n        competitors_data = json.loads(content)\n\
          \    except json.JSONDecodeError as e:\n        m = re.search(r'\\{[\\s\\\
          S]*\\}', content)\n        if m:\n            try:\n                competitors_data\
          \ = json.loads(m.group(0))\n            except Exception:\n            \
          \    return _empty_result(\n                    f'JSON decode failed after\
          \ regex fallback: {e}, raw preview: {content[:300]}'\n                )\n\
          \        else:\n            return _empty_result(f'no JSON object found,\
          \ raw preview: {content[:300]}')\n\n    if not isinstance(competitors_data,\
          \ dict):\n        return _empty_result('parsed content is not a dict')\n\
          \n    competitors = competitors_data.get('competitors', [])\n    if not\
          \ isinstance(competitors, list):\n        return _empty_result('competitors\
          \ field is not a list')\n\n    # 抽取 web_search_records (若 API 返回)\n    web_records\
          \ = []\n    try:\n        ctx = resp.get('context') or {}\n        rec =\
          \ ctx.get('web_search_records') or resp.get('web_search_records') or []\n\
          \        if isinstance(rec, list):\n            web_records = rec\n    except\
          \ Exception:\n        pass\n\n    return {\n        'competitors_json':\
          \ competitors_data,\n        'competitors_list': competitors,\n        'competitors_count':\
          \ len(competitors),\n        'search_log': competitors_data.get('search_log',\
          \ []),\n        'web_search_records': web_records,\n        'raw_content':\
          \ content,\n        'error': '',\n    }\n\n\ndef _strip_markdown_fence(content:\
          \ str) -> str:\n    content = content.strip()\n    m = re.search(r'```json\\\
          s*([\\s\\S]*?)```', content)\n    if m:\n        return m.group(1).strip()\n\
          \    m = re.search(r'```\\s*([\\s\\S]*?)```', content)\n    if m:\n    \
          \    return m.group(1).strip()\n    return content\n\n\ndef _coerce_to_obj(raw):\n\
          \    \"\"\"把入参归一化成 dict; 字符串则尝试 json.loads, 失败再正则抠 {...}\"\"\"\n    if isinstance(raw,\
          \ dict):\n        return raw\n    if isinstance(raw, str):\n        s =\
          \ raw.strip()\n        try:\n            return json.loads(s)\n        except\
          \ Exception:\n            m = re.search(r'\\{[\\s\\S]*\\}', s)\n       \
          \     if m:\n                try:\n                    return json.loads(m.group(0))\n\
          \                except Exception:\n                    return None\n  \
          \          return None\n    return None\n\n\ndef _unwrap_to_choices(raw,\
          \ max_depth=6):\n    \"\"\"自适应剥壳: 当前层无 choices 但含 http_body/body/data 等包装键时,\
          \ 自动钻入内层再找 choices, 最多 max_depth 层防死循环\"\"\"\n    wrap_keys = ('http_body',\
          \ 'body', 'data', 'result', 'output', 'response', 'text')\n    obj = _coerce_to_obj(raw)\n\
          \    depth = 0\n    while isinstance(obj, dict) and depth < max_depth:\n\
          \        if obj.get('choices') is not None:\n            return obj\n  \
          \      if isinstance(obj.get('error'), dict):\n            return obj\n\
          \        nxt = None\n        for k in wrap_keys:\n            if k in obj\
          \ and obj[k] is not None:\n                nxt = obj[k]\n              \
          \  break\n        if nxt is None:\n            break\n        obj = nxt\
          \ if isinstance(nxt, dict) else _coerce_to_obj(nxt)\n        depth += 1\n\
          \    return obj if isinstance(obj, dict) else {}\n\n\ndef _empty_result(reason:\
          \ str) -> dict:\n    return {\n        'competitors_json': {'competitors':\
          \ [], 'search_log': [], 'competitors_note': reason},\n        'competitors_list':\
          \ [],\n        'competitors_count': 0,\n        'search_log': [],\n    \
          \    'web_search_records': [],\n        'raw_content': '',\n        'error':\
          \ reason,\n    }\n"
