    - data:
        code: "import re, random\n\ndef main(company_name: str, industry: str, keyword_pack:\
          \ str,\n         article_count: float, article_style: str, article_type:\
          \ str,\n         task_name: str, company_intro: str, core_qualifications:\
          \ str,\n         awards: str, advantages: str, ent_dataset_id: str, task_description:\
          \ str,\n         prod_dataset_id: str, known_competitors_input: str = \"\
          \",\n         custom_writing_preference: str = \"\", product_info: str =\
          \ \"\"):\n\n    # 0. 输入归一化：兼容\"对比排名\"和\"对比排名类\"两种写法。\n    # 空 article_type\
          \ 表示“自动混排”，不能用“对比排名类”作为默认值，否则会把整批文章锁死为排名/对比。\n    _article_type_explicit\
          \ = bool(str(article_type or '').strip())\n    type_normalize_map = {\n\
          \        \"对比排名\": \"对比排名类\", \"性能评测\": \"性能评测类\",\n        \"经验分享\": \"\
          经验分享类\", \"知识科普\": \"知识科普类\",\n        \"新闻报道\": \"新闻报道类\", \"自我介绍\": \"\
          自我介绍类\",\n    }\n    article_type = type_normalize_map.get(article_type,\
          \ article_type) if _article_type_explicit else \"\"\n\n    # 1. 核心锚词提取\n\
          \    # 关键词包同时兼容中英文逗号；英文逗号未拆分会让整包词被当成一个 query，\n    # 也会使后续地域识别在竞品全称内部误命中。\n\
          \    lines = [l.strip() for l in re.split(r'[，,\\n]+', keyword_pack or '')\
          \ if l.strip()]\n    core_anchor = \"\"\n    if lines:\n        suffixes\
          \ = r'(推荐|哪家好|排名|怎么选|有哪些|靠谱吗?|公司排行|品牌推荐|找哪家|怎么样|多少钱|哪个好|哪家靠谱|哪家专业)$'\n \
          \       prefixes = r'^(专业的?|靠谱的?|口碑好的?|好用的?|性价比高的?|正规的?|优质的?)'\n       \
          \ bare = [re.sub(suffixes, '', re.sub(prefixes, '', l)).strip() for l in\
          \ lines]\n        bare = [b for b in bare if len(b) >= 2]\n        if bare:\n\
          \            core_anchor = min(bare, key=len)\n    if not core_anchor:\n\
          \        core_anchor = industry or task_name or \"产品服务\"\n\n    # 2. RAG\
          \ 检索 query\n    ent_rag_query = f\"{company_name} 企业简介 品牌荣誉 行业认证 服务优势\"\n\
          \    prod_rag_query = f\"{core_anchor} 核心参数 产品亮点 服务优势 技术特点\"\n\n    def\
          \ clean_q(q):\n        if not q: return \"\"\n        q = re.sub(r'[\\x00-\\\
          x1f\\x7f-\\x9f\"\\'\\\\]', '', q)\n        return re.sub(r'\\s+', ' ', q).strip()[:60]\n\
          \n    # 3. 合规模式识别：显式 industry 是主事实源，仅允许 company_name 在行业缺失/泛化时兜底。\n    #\
          \ 禁止用“药品柜”“医疗器械配套”等单个业务词覆盖“装修装饰”等明确行业。\n    medical_industry_kw = ['医院','医疗','诊所','医美','医药','药品','保健','口腔','整形',\n\
          \                           '眼科','体检','齿科','门诊','制药','医师','康复','护理']\n \
          \   financial_industry_kw = ['银行','保险','金融','理财','基金','证券','股票','贷款',\n\
          \                             '信用卡','支付','期货','信托','私募','投顾','征信']\n   \
          \ generic_industries = {'', '其他', '其它', '未分类', '通用', '综合', '未知', '暂无'}\n\
          \    industry_text = re.sub(r'\\s+', '', str(industry or ''))\n    company_text\
          \ = str(company_name or '')\n\n    if any(k in industry_text for k in medical_industry_kw):\n\
          \        compliance_mode = 'medical'\n    elif any(k in industry_text for\
          \ k in financial_industry_kw):\n        compliance_mode = 'financial'\n\
          \    elif industry_text not in generic_industries:\n        compliance_mode\
          \ = 'standard'\n    else:\n        # 公司名兜底只接受能说明主营属性的高置信短语，不接受简介、产品或经营范围中的业务词。\n\
          \        medical_intro_patterns = [\n            r'医院', r'诊所', r'门诊部', r'医疗机构',\
          \ r'医疗服务',\n            r'口腔(?:医疗|门诊|诊疗)', r'医美(?:机构|服务|项目)',\n        \
          \    r'整形(?:医院|机构)', r'眼科(?:医院|诊所|门诊)',\n            r'体检(?:中心|机构|服务)',\
          \ r'药品(?:生产|研发|销售|批发|零售)',\n            r'制药(?:企业|公司|厂)', r'康复(?:医疗|诊疗|护理)',\
          \ r'护理(?:服务|机构)',\n        ]\n        financial_intro_patterns = [\n   \
          \         r'银行(?:业务|服务|机构)', r'保险(?:公司|经纪|代理|服务)',\n            r'金融(?:机构|服务|业务)',\
          \ r'证券(?:公司|业务|服务)',\n            r'基金(?:管理|销售|服务)', r'期货(?:公司|业务)', r'信托(?:公司|业务)',\n\
          \            r'贷款(?:服务|业务)', r'投顾(?:服务|业务)', r'征信(?:服务|业务)',\n        ]\n\
          \        if any(re.search(p, company_text) for p in medical_intro_patterns):\n\
          \            compliance_mode = 'medical'\n        elif any(re.search(p,\
          \ company_text) for p in financial_intro_patterns):\n            compliance_mode\
          \ = 'financial'\n        else:\n            compliance_mode = 'standard'\n\
          \n    # 4. 严格语义地域提取 V23：全国词、实体排除、地方业务意图按固定优先级判定。\n    def _strict_region_v23(keyword_pack,\
          \ upstream_region=\"\"):\n        \"\"\"REGION_INTENT_V23：按显式全国、实体排除、地方业务意图的固定优先级判定地域。\"\
          \"\"\n        text = str(keyword_pack or \"\")\n        lines = [x.strip()\
          \ for x in re.split(r'[，,、\\n]+', text) if x.strip()]\n        national_markers\
          \ = (\n            '全国', '全国性', '全国范围', '面向全国', '覆盖全国', '全中国',\n       \
          \     '不限地区', '不限地域', '不限定地区', '不限定地域',\n        )\n        if any(x in\
          \ text for x in national_markers):\n            return '全国', 'explicit_national',\
          \ 'high'\n    \n        regions = [\n            '内蒙古自治区','广西壮族自治区','西藏自治区','宁夏回族自治区','新疆维吾尔自治区',\n\
          \            '北京市','天津市','上海市','重庆市',\n            '黑龙江省','吉林省','辽宁省','河北省','山西省','江苏省','浙江省','安徽省','福建省','江西省','山东省','河南省','湖北省','湖南省','广东省','海南省','四川省','贵州省','云南省','陕西省','甘肃省','青海省',\n\
          \            '华东地区','华南地区','华北地区','华中地区','东北地区','西北地区','西南地区','长三角地区','珠三角地区','京津冀地区','粤港澳大湾区','环渤海地区','成渝地区',\n\
          \            '内蒙古','广西','西藏','宁夏','新疆','北京','天津','上海','重庆','河北','山西','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','海南','四川','贵州','云南','陕西','甘肃','青海',\n\
          \            '广州','深圳','成都','杭州','武汉','南京','西安','郑州','长沙','苏州','东莞','青岛','沈阳','大连','哈尔滨','长春','济南','厦门','福州','昆明','贵阳','南宁','合肥','石家庄','太原','兰州','南昌','乌鲁木齐','呼和浩特','海口','银川','西宁','拉萨','珠海','佛山','中山','惠州','无锡','常州','温州','宁波','嘉兴','绍兴','金华','台州','泉州','漳州','烟台','潍坊','临沂','徐州','扬州','泰州','镇江','盐城','芜湖','洛阳','襄阳','宜昌','岳阳','株洲','柳州','桂林','保定','唐山','廊坊','邯郸','秦皇岛','承德','张家口','邢台','衡水','沧州',\n\
          \            '香港','澳门','台湾','港澳台','华东','华南','华北','华中','东北','西北','西南','长三角','珠三角','京津冀','大湾区','环渤海','成渝',\n\
          \        ]\n        regions = sorted(set(regions), key=len, reverse=True)\n\
          \        # 业务词分为生产采购类、本地服务类、门店交易类；“推荐/排名/对比”等仅为意图修饰，不单独触发地域。\n        business_re\
          \ = re.compile(r'(?:厂家|供应商|生产商|制造商|服务商|经销商|代理商|加工(?:厂|商|服务)?|采购|批发|零售|报价|选型|维修|安装|施工|培训|机构|平台|中心|回收|收购|店铺|门店|实体店|商家|门店|鉴定|估价|寄售|典当行|二手|上门|同城|维修店|服务店|展厅|营业厅|网点|租赁|家政|搬家|保洁|培训机构|医院|诊所|律师事务所|旅行社)')\n\
          \        # “对比/和/与/还是”等连接词会切断地域与业务的修饰关系。\n        boundary_re = re.compile(r'(?:和|与|还是|对比|比较|相比|相较|PK|pk|VS|vs|，|,|、|；|;|。|！|？|\\\
          n)')\n        prefix_re = re.compile(r'(?:面向|覆盖|服务于|服务|在|本地|当地|针对|来自|位于|采购于)\\\
          s*$')\n        # 识别不带“有限公司”的企业简称；仅在实体后紧接结束/比较问法时排除。\n        entity_short_re\
          \ = re.compile(\n            r'^[^和与、，,；;。！？\\n]{1,16}'\n            r'(?:有限公司|股份有限公司|集团|研究院|研究所|工厂|厂)(?!家)'\n\
          \        )\n        entity_brand_re = re.compile(\n            r'^[\\u4e00-\\\
          u9fff]{2,10}(?:科技|化工|石化|新材料|实业|集团|品牌)'\n            r'(?:有限公司|股份有限公司|集团|公司)?'\n\
          \        )\n    \n        hits = []\n        for line_order, line in enumerate(lines):\n\
          \            for region in regions:\n                start = 0\n       \
          \         while True:\n                    pos = line.find(region, start)\n\
          \                    if pos < 0:\n                        break\n      \
          \              start = pos + len(region)\n                    left = line[max(0,\
          \ pos - 12):pos]\n                    rest = line[pos + len(region):]\n\
          \                    if entity_short_re.match(rest) or entity_brand_re.match(rest):\n\
          \                        continue\n                    # 业务串可包含“广州回收二手包店铺”这类多个词；连接词只在竞品比较边界处截断。\n\
          \                    right_segment = boundary_re.split(rest, maxsplit=1)[0][:24]\n\
          \                    # 直接修饰：地域后 0~10 字内必须出现业务主体/动作，单有“推荐/排名/对比”无效。\n   \
          \                 direct_match = business_re.search(right_segment)\n   \
          \                 direct = bool(direct_match and direct_match.start() <=\
          \ 10)\n                    # 介词修饰仍要求右侧出现业务词，避免“在浙江皇马科技任职”等误命中。\n       \
          \             prep = bool(prefix_re.search(left)) and bool(business_re.search(right_segment))\n\
          \                    # 后置地域：业务词 + 在/于/面向/覆盖 + 地域。\n                    trailing_pattern\
          \ = business_re.pattern + r'[^，,、；;。！？\\n]{0,10}(?:在|于|面向|覆盖)' + re.escape(region)\n\
          \                    trailing = bool(re.search(trailing_pattern, line))\n\
          \                    if direct or prep or trailing:\n                  \
          \      source = 'keyword_intent' if direct or prep else 'keyword_trailing_intent'\n\
          \                        confidence = 'high' if direct or prep else 'medium'\n\
          \                        # 固定优先级：直接/介词业务意图 > 后置地域；同级更长地域 > 词包先出现。\n    \
          \                    hits.append((0 if (direct or prep) else 1, -len(region),\
          \ line_order, pos, region, source, confidence))\n        if not hits:\n\
          \            return '全国', 'default_national', 'default'\n        # 混合地域词包可能同时包含多个城市/区域检索词。\n\
          \        # 不把任一地域（如呼和浩特）按名称长度强行提升为整批主地域；\n        # 只有单一地域意图时才返回 regional，否则按全国/多地域任务处理。\n\
          \        distinct_regions = []\n        for candidate in sorted({h[4] for\
          \ h in hits}, key=len, reverse=True):\n            if not any(candidate\
          \ in kept or kept in candidate for kept in distinct_regions):\n        \
          \        distinct_regions.append(candidate)\n        if len(distinct_regions)\
          \ > 1:\n            return '全国', 'mixed_region_fallback', 'high'\n     \
          \   hits.sort()\n        hit = hits[0]\n        return hit[4], hit[5], hit[6]\n\
          \    region, region_source, region_confidence = _strict_region_v23(keyword_pack)\n\
          \n    # 5. 内容模式判定 — 品牌词检测(放宽,支持核心名/品牌意图词)\n    def detect_brand_keyword():\n\
          \        if not (company_name and keyword_pack):\n            return False\n\
          \        # 1) 完整字面\n        if company_name in keyword_pack:\n         \
          \   return True\n        # 2) 去除公司类型后缀提取核心名\n        core = company_name\n\
          \        for suf in ['股份有限公司','有限责任公司','集团有限公司','科技有限公司',\n            \
