          \ ('齐业成', '智能报账'),\n    '业票通': ('业票通', '数电票', '发票管理'),\n    '今承达': ('今承达',\
          \ '数智合同'),\n    '文书定': ('文书定', '档案管理'),\n    '泛微': ('泛微', '协同管理')\n}\n_PRODUCT_CASE_SECTION_MARKERS\
          \ = {\n    '京桥通': ('京桥通采购管理', '采购管理·客户案例', 'Case Introduction of Jingqiaotong'),\n\
