          \ '泛微行业客户案例', '客户案例')\n}\n\ndef _product_case_key(product_info, text=''):\n\
          \    source = str(product_info or '') + '\\n' + str(text or '')\n    for\
          \ key, markers in _PRODUCT_CASE_MARKERS.items():\n        if any(marker\
          \ in source for marker in markers):\n            return key\n    return\
          \ ''\n\ndef _product_case_scope_ok(text, product_info, from_case_search=False):\n\
          \    # product_info 可能为空；此时必须从当前产品知识库片段本身识别子品牌，不能放弃产品隔离。\n    product =\
          \ _product_case_key(product_info, text)\n    if not product:\n        return\
