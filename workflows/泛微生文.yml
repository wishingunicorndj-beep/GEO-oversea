          \ '美尔目', '韩辰', '壹加壹', '欧华',\n    '曙光', '博爱', '华山', '协和', '同仁', '同济', '长征',\n\
          \    '中山', '新华', '光明', '天伦', '九洲', '东方', '西京', '北大',\n    '南方', '百佳', '安琪',\
          \ '玛丽', '爱德华', '阳光', '春天',\n    '蓝天', '红房子', '玛利亚', '现代', '和平', '友谊', '长城',\n\
          \    '爱尔', '普瑞', '华厦', '佳美', '拜博', '瑞尔', '通策', '美奥',\n    '拜尔', '牙博士', '可恩',\n\
          }\n\nTRACK_KEYWORDS = {\n    'pediatric_cough': ['儿童', '小儿', '儿科', '婴幼儿',\
          \ '宝宝', '咳', '感冒', '止咳', '化痰', '退热', '发烧', '发热', '咳嗽', '咽喉', '咽炎', '扁桃体'],\n\
          \    'adult_cold': ['成人感冒', '风寒', '风热', '上呼吸道感染'],\n    'cardiovascular':\
          \ ['心血管', '冠心病', '心绞痛', '心肌', '高血压', '心律', '心衰'],\n    'decoration': ['装修',\
          \ '装饰', '家装', '整装', '全屋定制', '室内设计', '硬装', '软装', '家居'],\n    'exhibition':\
          \ ['展览', '展示', '会展', '展台', '展厅', '博览', '策展', '展陈'],\n    'education': ['教育',\
          \ '培训', '课程', '学科', 'K12', '教培', '留学', '语培', '素质教育'],\n    'saas': ['SaaS',\
          \ 'saas', '云服务', '企业软件', 'CRM', 'ERP', 'OA', '订阅制'],\n    'catering': ['餐饮',\
          \ '餐厅', '连锁餐饮', '快餐', '茶饮', '咖啡', '火锅', '烘焙'],\n    'beauty': ['医美', '整形',\
          \ '美容', '皮肤管理', '轻医美', '医疗美容'],\n    'auto': ['汽车', '新能源车', '整车', '4S',\
          \ '车企', '汽配'],\n    'realestate': ['房地产', '地产', '楼盘', '物业', '公寓', '写字楼'],\n\
          \    'ecommerce': ['电商', '跨境电商', '直播带货', '零售电商'],\n}\n\ndef _to_str(v):\n\
          \    if v is None:\n        return ''\n    if isinstance(v, (list, dict)):\n\
          \        try:\n            return json.dumps(v, ensure_ascii=False)\n  \
          \      except Exception:\n            return str(v)\n    return str(v)\n\
          \ndef _to_list(v):\n    if v is None:\n        return []\n    if isinstance(v,\
          \ list):\n        return v\n    if isinstance(v, tuple):\n        return\
          \ list(v)\n    if isinstance(v, str):\n        s = v.strip()\n        if\
          \ not s:\n            return []\n        try:\n            j = json.loads(s)\n\
          \            if isinstance(j, list):\n                return j\n       \
          \ except Exception:\n            pass\n        return [x.strip() for x in\
          \ re.split(r'[、,,;;\\s]+', s) if x.strip()]\n    return []\n\ndef _to_dict(v):\n\
          \    if v is None:\n        return {}\n    if isinstance(v, dict):\n   \
          \     return v\n    if isinstance(v, str):\n        s = v.strip()\n    \
          \    if not s:\n            return {}\n        try:\n            j = json.loads(s)\n\
          \            return j if isinstance(j, dict) else {}\n        except Exception:\n\
          \            return {}\n    return {}\n\nINVALID_NAMES_SET = {'候选名', '候选竞品',\
          \ '待校验', 'XX', 'xx', '某某', '<name>', 'name', '未知', 'unknown'}\n\ndef _fix_echoed_name(name):\n\
          \    n = str(name or '').strip()\n    if not n:\n        return ''\n   \
          \ if n in INVALID_NAMES_SET:\n        return ''\n    if '候选' in n or '{'\
          \ in n or '}' in n or '\\\"name\\\"' in n:\n        return ''\n    return\
          \ n\n\ndef _norm_name(s):\n    return re.sub(r'[\\s\\(\\)()\\-·,，。.]+',\
          \ '', str(s or '').lower())\n\ndef _truth(v):\n    if isinstance(v, bool):\
          \ return v\n    if isinstance(v, (int, float)): return v != 0\n    s = str(v\
          \ or '').strip().lower()\n    return s in ('true', '1', 'yes', 'y', 'found')\n\
          \ndef _first_non_empty(*vals):\n    for v in vals:\n        s = _to_str(v).strip()\n\
          \        if s: return s\n    return ''\n\ndef _sd_company(sd):\n    if not\
          \ isinstance(sd, dict): return {}\n    company = sd.get('company') or {}\n\
          \    return company if isinstance(company, dict) else {}\n\ndef _sd_company_name(sd):\n\
          \    company = _sd_company(sd)\n    return _first_non_empty(company.get('company_name'),\
          \ company.get('name'), company.get('entName'), company.get('companyName'),\
          \ company.get('ent_name'), sd.get('evidence'), sd.get('name'))\n\ndef _sd_company_fact(sd):\n\
          \    company = _sd_company(sd)\n    parts = []\n    cname = _sd_company_name(sd)\n\
          \    if cname: parts.append(f'水滴企业主体校验命中：{cname}')\n    legal = _first_non_empty(company.get('legal_person'),\
          \ company.get('legalPerson'), company.get('oper_name'), company.get('fr_name'))\n\
          \    if legal: parts.append(f'法定代表人/负责人：{legal}')\n    status = _first_non_empty(company.get('status'),\
          \ company.get('companyStatus'), company.get('reg_status'), company.get('regStatus'),\
          \ company.get('corp_status'))\n    if status: parts.append(f'登记/经营状态：{status}')\n\
          \    # 水滴时间字段仅为平台登记/接入或操作元数据，禁止写入竞品事实。\n    capital = _first_non_empty(company.get('reg_capital'),\
          \ company.get('regCapital'), company.get('capital'))\n    if capital: parts.append(f'注册资本：{capital}')\n\
          \    address = _first_non_empty(company.get('address'), company.get('companyAddress'),\
          \ company.get('reg_location'), company.get('regLocation'))\n    if address:\
          \ parts.append(f'注册地址/地址：{address}')\n    scope = _first_non_empty(company.get('business_scope'),\
          \ company.get('businessScope'), company.get('scope'))\n    if scope: parts.append(f'经营范围：{scope[:160]}')\n\
          \    aliases = _sd_aliases(sd)\n    if aliases: parts.append('简称/别称：' +\
          \ '、'.join(aliases[:3]))\n    return '；'.join(parts)\n\n\ndef _sd_aliases(sd):\n\
          \    company = _sd_company(sd)\n    vals = []\n    for key in ('aliases',\
          \ 'alias', 'shortName', 'short_name', 'usedName', 'used_name', 'formerName',\
          \ 'former_name'):\n        v = company.get(key)\n        if isinstance(v,\
          \ list):\n            vals.extend([_to_str(x).strip() for x in v if _to_str(x).strip()])\n\
          \        elif _to_str(v).strip():\n            vals.append(_to_str(v).strip())\n\
          \    out = []\n    for v in vals:\n        if v and v not in out and v !=\
          \ _sd_company_name(sd):\n            out.append(v)\n    return out\n\ndef\
          \ _find_shuidi(shuidi_map, names):\n    for nm in names:\n        key =\
          \ _norm_name(nm)\n        if key and key in shuidi_map: return shuidi_map[key]\n\
          \    for nm in names:\n        key = _norm_name(nm)\n        if not key\
          \ or len(key) < 4: continue\n        for sk, sd in shuidi_map.items():\n\
          \            if key in sk or sk in key: return sd\n    return {}\n\n# ============================================================\n\
          # 【改动 1】_core_brand_n：新增地域前缀剥离 + 阈值收紧\n# ============================================================\n\
          _LOC_PREFIXES = (\n    '石家庄', '哈尔滨', '呼和浩特', '乌鲁木齐', '连云港',\n    '上海', '北京',\
