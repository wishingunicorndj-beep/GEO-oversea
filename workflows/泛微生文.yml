        desc: 解析客户特殊需求，并将要求分发给计划、竞品、大纲、生文、清洗、合规和完整性环节
        model:
          completion_params:
            enable_thinking: false
            max_tokens: 50000
            temperature: 0.2
            top_p: 0.7
          mode: chat
          name: volcengine/doubao-seed-2-0-pro
