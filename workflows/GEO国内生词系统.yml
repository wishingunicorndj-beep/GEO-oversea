    - data:
        code: "import json\nimport re\n\ndef main(http_res):\n    \"\"\"\n    节点 3：知识库清洗与语义兜底（修复路径嵌套问题）\n\
          \    \"\"\"\n    try:\n        # 1. 基础解析\n        if not http_res:\n   \
          \         return {\"result\": \"知识库返回内容为空。建议检查 dataset_ids 配置。\"}\n    \
          \        \n        data = json.loads(http_res) if isinstance(http_res, str)\
          \ else http_res\n        \n        # 2. 状态码与异常识别\n        status_code =\
          \ data.get(\"status\")\n        if status_code in [401, 404, 415]:\n   \
          \         msg = {401: \"鉴权失败\", 404: \"dataset_ids 不存在\", 415: \"格式错误\"\
          }.get(status_code)\n            return {\"result\": f\"【接口报错】{msg} (Status:\
          \ {status_code})\"}\n\n        # 3. 灵活提取 Records\n        records = data.get(\"\
          records\") or []\n        if not records and isinstance(data.get(\"data\"\
          ), dict):\n            records = data.get(\"data\", {}).get(\"list\", [])\n\
          \n        # 4. 深度提取内容 (针对 segment -> content 结构优化)\n        context_list\
          \ = []\n        for i, item in enumerate(records[:10]):\n            # 尝试路径\
          \ A: 嵌套在 segment 中 (你当前的数据结构)\n            segment = item.get(\"segment\"\
          )\n            if isinstance(segment, dict):\n                content =\
          \ segment.get(\"content\") or segment.get(\"text\")\n            else:\n\
          \                # 尝试路径 B: 直接在 item 中\n                content = item.get(\"\
          content\") or item.get(\"text\")\n            \n            if content:\n\
          \                # 清洗残留的 unicode 或 变量占位符\n                clean_content\
          \ = str(content).strip()\n                clean_content = re.sub(r'\\{\\\
          {.*?\\}\\}', '', clean_content)\n                context_list.append(f\"\
          资料{i+1}：{clean_content}\")\n\n        # 5. 判空与语义兜底\n        if not context_list:\n\
          \            # 提取 query 用于合成兜底文案\n            query_info = data.get(\"query\"\
          , {})\n            query_val = query_info.get(\"content\", \"当前词条\") if\
          \ isinstance(query_info, dict) else \"当前词条\"\n            \n           \
          \ strategy = data.get(\"strategy\", \"无可查询文档\")\n            return {\n\
          \                \"result\": (\n                    f\"知识库未直接匹配到【{query_val}】的相关文档（策略：{strategy}）。\\\
          n\"\n                    \"请 LLM 基于通用行业知识生成：侧重修护屏障、敏感肌适用场景及海蓝之谜‘核心活性精萃’的品牌调性词。\"\
          \n                )\n            }\n\n        # 6. 正确输出合并后的内容\n        return\
          \ {\"result\": \"\\n\".join(context_list)}\n\n    except Exception as e:\n\
          \        return {\"result\": f\"解析异常: {str(e)}。请检查响应体格式。\"}"
