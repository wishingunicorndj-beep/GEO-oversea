    - data:
        code: "import json\nimport re\n\ndef main(res_llm=\"\", search_recommend=\"\
          \", company_name=\"\", keyword_type=\"\"):\n    active_type = str(keyword_type\
          \ or \"\").strip()\n    full_company = str(company_name or \"\").strip()\n\
          \    \n    # 提取公司核心简称\n    brand_core = full_company.replace(\"有限公司\", \"\
          \").replace(\"网络科技\", \"\").replace(\"上海\", \"\")\n    \n    # ── Step 1:\
          \ 解析 LLM 原始数据 ──\n    def parse_raw(raw):\n        if not raw: return []\n\
          \        match = re.search(r'\\[.*\\]', str(raw), re.DOTALL)\n        if\
          \ match:\n            try:\n                data = json.loads(match.group())\n\
          \                if isinstance(data, list): return [str(w).strip() for w\
          \ in data if w]\n            except: pass\n        return [re.sub(r'^[\\\
          d\\.\\-、\\s]+', '', l).strip() for l in re.split(r'[\\n，,]', str(raw)) if\
          \ len(l.strip()) >= 4]\n\n    # ── Step 2: 深度解析 API 结构 ──\n    def parse_api_deep(api_raw):\n\
          \        if not api_raw: return []\n        try:\n            data = json.loads(api_raw)\
          \ if isinstance(api_raw, str) else api_raw\n            results = []\n \
          \           def extract_titles(obj):\n                if isinstance(obj,\
          \ dict):\n                    for k, v in obj.items():\n               \
          \         if k == 'title' and isinstance(v, str): results.append(v)\n  \
          \                      else: extract_titles(v)\n                elif isinstance(obj,\
          \ list):\n                    for item in obj: extract_titles(item)\n  \
          \          extract_titles(data)\n            return results\n        except:\
          \ return []\n\n    # ── Step 3: 解析 LLM 过滤结果 ──\n    # 假设LLM过滤节点输出格式：{\"\
          filtered_keywords\": [...], \"rejected_keywords\": [...]}\n    def parse_llm_filter_output(llm_filter_output):\n\
          \        if not llm_filter_output: return [], []\n        try:\n       \
          \     parsed = json.loads(llm_filter_output)\n            return parsed.get(\"\
          filtered_keywords\", []), parsed.get(\"rejected_keywords\", [])\n      \
          \  except:\n            return [], []\n\n    # ── Step 4: 解析原始输入数据 ──\n\
          \    llm_source = parse_raw(res_llm)\n    api_source = parse_api_deep(search_recommend)\n\
          \    \n    # 从LLM过滤节点获取安全词\n    filtered_keywords, _ = parse_llm_filter_output(res_llm)\n\
          \    \n    # ── Step 5: 优化后的质检逻辑 ──\n    def is_qualified(w, seen_sets):\n\
          \        # 1. 长度校验\n        if not (4 <= len(w) <= 50): \n            return\
          \ False\n        \n        # 2. 排除促销词\n        forbidden = [\"最好\", \"最专业\"\
          , \"了解一下\", \"第一\", \"顶尖\"]\n        if any(f in w for f in forbidden):\n\
          \            return False\n        \n        # 3. 语义重复度\n        norm_w\
          \ = re.sub(r'[^\\w]', '', w)\n        if norm_w in seen_sets:\n        \
          \    return False\n        \n        # 4. 专项业务规则修正\n        if active_type\
          \ == \"品牌词\":\n            # 品牌词：包含公司名或品牌核心词即通过\n            if len(full_company)\
          \ > 10 and (brand_core in w or \"明日方舟\" in w):\n                return True\n\
          \            if full_company and full_company in w:\n                return\
          \ True\n            # LLM来源放宽：只要字数≥6，视为品牌相关\n            if len(w) >= 6:\n\
          \                return True\n            return False\n            \n \
          \       elif active_type == \"搜索词\":\n            # 搜索词：包含公司名且过短 = 不是关键词\n\
          \            if full_company and full_company in w and len(w) < 10:\n  \
          \              return False\n            if len(w) < 5:\n              \
          \  return False \n        return True\n\n    # ── Step 6: 执行分层排序 ──\n  \
          \  final_keywords = []\n    seen_norm = set()\n    \n    # 优先级1：LLM过滤后的关键词（最高优先级）\n\
          \    for word in filtered_keywords:\n        clean_w = word.replace('\"\
          ', '').replace(\"'\", \"\").strip()\n        if is_qualified(clean_w, seen_norm):\n\
          \            final_keywords.append(clean_w)\n            seen_norm.add(re.sub(r'[^\\\
          w]', '', clean_w))\n    \n    # 优先级2：原始LLM生成词（次高优先级）\n    for word in llm_source:\n\
          \        clean_w = word.replace('\"', '').replace(\"'\", \"\").strip()\n\
          \        if is_qualified(clean_w, seen_norm):\n            final_keywords.append(clean_w)\n\
          \            seen_norm.add(re.sub(r'[^\\w]', '', clean_w))\n    \n    #\
          \ 优先级3：API原始词（最低优先级，仅作为补充）\n    for word in api_source:\n        clean_w\
          \ = word.replace('\"', '').replace(\"'\", \"\").strip()\n        if is_qualified(clean_w,\
          \ seen_norm):\n            final_keywords.append(clean_w)\n            seen_norm.add(re.sub(r'[^\\\
          w]', '', clean_w))\n\n    return {\n        \"final_keywords\": final_keywords[:80],\n\
          \        \"total_count\": len(final_keywords[:80]),\n        \"intent_coverage\"\
          : f\"类型:{active_type} | LLM输入:{len(llm_source)} | API输入:{len(api_source)}\
          \ | LLM过滤安全词:{len(filtered_keywords)} | 最终产出:{len(final_keywords[:80])}\"\
          \n    }"
        code_language: python3
