        - id: b8d7ef1e-b888-4eb1-8906-c7f8245fe765
          role: system
          text: "# 角色\n你是GEO搜索词生成专家，生成C端用户在AI搜索引擎中\n主动检索机构/服务商时使用的关键词短语。\n\n# 输入\n\
            - 种子词：{{{{#1765425297251.seed_keywords#}}}}\n- 行业：{{{{#1765425297251.industry#}}}}\n\
            - 关联实体（品牌/公司名）：{{{{#1765425297251.company_name#}}}}\n- 知识库内容：{{{{#1772455648555.result#}}}}\n\
