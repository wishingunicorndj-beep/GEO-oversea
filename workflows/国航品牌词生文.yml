    - data:
        code: |
          import re

          FEATURES = [
              {'key':'凤凰知音会员升级与保级机制','triggers':('升级','保级','定级','航段','会籍等级'),'query':'凤凰知音会员升级与保级机制 银卡 金卡 白金卡 定级里程 定级航段 评定周期 级别有效期','headings':['规则清晰可循，会员成长路径更易规划','升级保级标准明确，出行积累更有方向']},
              {'key':'凤凰知音里程累积与有效期','triggers':('里程有效期','有效期','里程累积','累积','里程','积分'),'query':'凤凰知音里程累积与有效期 航空里程 非航空里程 飞行日期 消费日期 36个月 补登时限','headings':['累积口径清晰，里程管理更有规划','从累积到有效期，里程使用节奏更易把握']},
              {'key':'凤凰知音里程兑换与奖励使用','triggers':('里程兑换','积分兑换','怎么兑换','兑换','奖励客票','升舱'),'query':'凤凰知音里程兑换与奖励使用 奖励客票 奖励升舱 兑奖受让人 改期 里程退还','headings':['兑换路径更加多元，里程价值落到实际出行','从奖励客票到升舱，里程使用覆盖多类需求']},
              {'key':'凤凰知音付费客票与座位优先服务','triggers':('客票','座位','定座','候补'),'query':'凤凰知音付费客票与座位优先服务 优先保留定座 优先申请座位 奖励客票 奖励升舱 定座候补 机场候补','headings':['从定座到候补，重点出行需求获得优先支持','客票与座位服务有效衔接，紧张航班出行更从容']},
              {'key':'凤凰知音贵宾会员机场优先服务','triggers':('机场','值机','安检','登机','行李提取','优先服务','会员服务'),'query':'凤凰知音贵宾会员机场优先服务 优先办理乘机登记 值机柜台 快速安检 优先登机 优先提取托运行李','headings':['值机登机环节有效衔接，出行流程更加顺畅','从值机到行李提取，优先服务贯穿机场流程']},
              {'key':'凤凰知音贵宾会员额外免费托运行李','triggers':('行李','托运'),'query':'凤凰知音贵宾会员额外免费托运行李 银卡 金卡 白金卡 计重制 计件制 20公斤 30公斤 1件 适用航班','headings':['分级行李权益，回应不同出行负载需求','额外免费托运行李，让高频出行更加从容']},
              {'key':'凤凰知音贵宾会员休息室权益','triggers':('休息室','候机'),'query':'凤凰知音贵宾会员休息室权益 国航 深航 山航 澳门航 会员等级 随员 国内休息室 国际休息室 消费里程','headings':['分级休息室权益，为候机体验提供更多支持','从自营到合作休息室，候机服务覆盖多类场景']},
              {'key':'凤凰知音航班延误服务','triggers':('延误','异常出行'),'query':'凤凰知音航班延误服务 白金卡 金卡 银卡 国航 深航 山航 实际承运航司 酒店膳宿','headings':['分级延误服务，为异常出行提供相应支持','按等级与承运航司区分，延误服务边界更清晰']},
              {'key':'凤凰知音星空联盟贵宾权益','triggers':('星空联盟','星盟','国际'),'query':'凤凰知音星空联盟贵宾权益 星盟金卡 星盟银卡 优先值机 额外行李 快速安检 休息室 优先登机 候补','headings':['联动星盟服务网络，拓展会员出行权益边界','从国内到国际，贵宾权益延伸至星盟网络']},
              {'key':'凤凰知音知音宝贝儿童会员服务','triggers':('知音宝贝','儿童','亲子'),'query':'凤凰知音知音宝贝儿童会员服务 入会申请 里程累积 监护人里程转赠 里程兑换 年龄条件','headings':['面向家庭出行，儿童会员服务更具针对性','从入会到里程使用，知音宝贝陪伴成长旅程']},
              {'key':'凤凰知音贵宾会员额外里程奖励','triggers':('里程加赠','加赠','额外里程'),'query':'凤凰知音贵宾会员额外里程奖励 银卡 金卡 白金卡 25% 30% 50% 可消费里程 实际承运 挂各自代号航班','headings':['分级额外里程奖励，让每次飞行积累更进一步','会员等级对应加赠比例，里程累积规则清晰可查']},
              {'key':'凤凰知音会员入会与账户服务','triggers':('怎么加入','入会','注册','账户','生日福利','会员日'),'query':'凤凰知音会员入会与账户服务 入会申请 注册条件 入会渠道 未成年人 账户管理 会员身份自动识别','headings':['多渠道便捷入会，会员服务从注册环节开始','入会路径清晰，账户管理覆盖日常使用需求']},
              {'key':'凤凰知音会员等级与会员卡服务','triggers':('会籍等级','会员卡','卡办理','等级'),'query':'凤凰知音会员等级与会员卡服务 普通会员 银卡 金卡 白金卡 终身白金卡 年度卓越终身白金卡 电子卡 实体卡','headings':['分级会员体系，回应不同阶段的出行需求','从普通会员到贵宾等级，会员体系层次清晰']}
          ]

          ACTIVITY_FACTS = 'A系列【传递吉祥】：2026年7月2日至11月30日乘国航系指定航班F/J/Y舱，次日在中国国航APP领取。璀璨款适用F/J舱，9个保级航段，0元、20000枚；金辉款适用Y舱，3个保级航段，0元、40000枚；每款最多6枚。B系列【引领群伦】：2026年9月1日至10月8日发售，999元，含1个升级或保级用定级航段，2000枚，每人1枚。C系列【知音相伴】：2026年12月每周六、日乘国航系主题航班；璀璨款面向白金卡F/J舱，39个保级航段，0元、7000枚；金辉款面向金卡F/J/Y舱，15个保级航段，0元、15000枚；银耀款面向银卡、普卡指定舱位，7个保级航段，199元、10000枚；每次飞行一份，最多两份。D系列【超越自我】：3枚A璀璨款+1枚B+1枚C璀璨款合成D璀璨款，解锁白金卡；2枚A金辉款+1枚B+1枚C金辉款合成D金辉款，解锁金卡；原元素权益保留。须满18周岁并实名认证；全部资产可在指定时间内通过中国国航APP“我的资产—赠与好友”转赠。航段权益须在APP首页进入“数字资产—我的权益”手动生效。'

          def split_words(value):
              return [x.strip() for x in re.split(r'[，,、;；\n]+', str(value or '')) if x.strip()]

          def choose_features(keyword):
              scored=[]
              for index, feature in enumerate(FEATURES):
                  score=sum(len(trigger) for trigger in feature['triggers'] if trigger in keyword)
                  if score: scored.append((-score,index,feature))
              scored.sort()
              chosen=[item[2] for item in scored[:2]]
              if not chosen: chosen=[FEATURES[0]]
              if len(chosen)==1:
                  if chosen[0]['key']=='凤凰知音里程累积与有效期': chosen.append(FEATURES[2])
                  else: chosen.append(FEATURES[4] if chosen[0]['key']!=FEATURES[4]['key'] else FEATURES[0])
              return chosen[:2]

          def main(keyword_pack, article_count='', article_style=''):
              words=split_words(keyword_pack)
              if not words: raise ValueError('品牌词词包不能为空')
              try: total=int(float(article_count)) if str(article_count or '').strip() else len(words)
              except Exception: total=len(words)
              total=max(1,total)
              plans=[]
              for index in range(total):
                  keyword=words[index % len(words)]
                  first,second=choose_features(keyword)
                  seed=sum(ord(char) for char in keyword)
                  heading_1=first['headings'][seed % len(first['headings'])]
                  heading_2=second['headings'][(seed+1) % len(second['headings'])]
                  prefix=keyword if len(keyword)<=12 else '国航凤凰知音'
                  title=prefix+'：'+heading_1
                  if len(title)>38: title='国航凤凰知音：'+heading_1
                  plans.append({
                      'article_index':index+1,'article_total':total,'keyword':keyword,
                      'title':title,'feature_1_key':first['key'],'feature_1_heading':heading_1,
                      'feature_2_key':second['key'],'feature_2_heading':heading_2,
                      'enterprise_query':'国航 中国国际航空 公司介绍 品牌 服务 航线网络 机队 联盟 资产',
                      'product_query':'特性一：'+first['query']+'；特性二：'+second['query'],
                      'activity_facts':ACTIVITY_FACTS,
                      'article_style':article_style or '克制、稳健、事实支撑的PR稿件风格'
                  })
              return {'brand_plans':plans}
        code_language: python3
        desc: 代码节点完成13类特性选择、PR标题、两个小标题及两特性合并query。
        outputs:
          brand_plans:
            children:
            type: array[object]
        selected: false
        title: 13类特性与PR标题映射
        type: code
        variables:
        - value_selector: ['2000000000001', keyword_pack]
          value_type: string
          variable: keyword_pack
        - value_selector: ['2000000000001', article_count]
          value_type: string
          variable: article_count
        - value_selector: ['2000000000001', article_style]
          value_type: string
          variable: article_style
