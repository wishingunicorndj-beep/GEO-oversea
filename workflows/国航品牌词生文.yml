        code: |
          import json,re,html
          BOUNDS=[(200,250),(500,600),(500,600),(600,700),(400,500)]
          def parse(raw):
              text=re.sub(r'<think>.*?</think>','',str(raw or ''),flags=re.S|re.I).strip()
              fence=re.fullmatch(r'```(?:json)?\s*([\s\S]*?)\s*```',text,re.I)
              if fence: text=fence.group(1)
              return json.loads(text)
          def main(validation_text, article):
              issues=[]
              try:
                  report=parse(validation_text)
                  model_issues=report.get('issues',[]) if isinstance(report,dict) else []
                  if not bool(report.get('pass')) or model_issues: issues.extend(model_issues or [{'type':'事实校验','reason':'校验未通过'}])
              except Exception:
                  issues.append({'type':'校验协议','reason':'校验节点未返回合法JSON'})
              content=str(article.get('content','')) if isinstance(article,dict) else ''
              title=str(article.get('title','')) if isinstance(article,dict) else ''
              sections=re.findall(r'<h2\b[^>]*>[\s\S]*?(?=<h2\b|\Z)',content,re.I)
              if not 20<=len(title)<=38: issues.append({'type':'标题长度','reason':'标题必须20-38字'})
              if len(sections)!=5: issues.append({'type':'结构','reason':'正文必须且只能有5个h2部分'})
              for index,(section,bound) in enumerate(zip(sections,BOUNDS),1):
                  section_body=re.sub(r'<h2\b[^>]*>[\s\S]*?</h2>','',section,count=1,flags=re.I)
                  visible=html.unescape(re.sub(r'<[^>]+>','',section_body))
                  length=len(re.sub(r'\s+','',visible))
                  if length<bound[0] or length>bound[1]: issues.append({'type':'分段字数','reason':'第{}部分{}字，要求{}-{}字'.format(index,length,bound[0],bound[1])})
              return {'has_issues':1 if issues else 0,'issues':json.dumps(issues,ensure_ascii=False),'content_len':len(re.sub(r'\s+','',re.sub(r'<[^>]+>','',content)))}
