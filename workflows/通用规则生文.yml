        code: "import re\n\ndef main(known_competitors='', competitor_policy='auto', needs_competitors='true', customer_rules=''):\n    policy = str(competitor_policy\
          \ or 'auto').strip().lower()\n    raw = str(known_competitors or '').strip()\n    names = []\n    for item in re.split(r'[\\n,，;；、]+', raw):\n        item\
          \ = re.sub(r'^[\\s\\-•·\\d.]+', '', item).strip()\n        if item and item not in names and len(item) <= 80:\n            names.append(item)\n    if policy\
          \ == 'disabled' or str(needs_competitors).lower() != 'true':\n        names = []\n    elif policy == 'whitelist' and not names:\n        names = []\n  \
          \  text = '## 竞品使用策略\\n'\n    text += f'- 模式：{policy}\\n'\n    if names:\n        text += '- 已知竞品（仅可使用这些名称）：\\n' + '\\n'.join(f'  - {x}' for x in names)\
          \ + '\\n'\n    else:\n        text += '- 当前没有可直接使用的已知竞品；不得凭空编造竞品。\\n'\n    text += '- 竞品事实必须有知识库或可靠来源支撑；不确定信息写成定性描述或不写。\\n'\n    if customer_rules:\n  \
          \      text += '- 客户规则中涉及竞品的限制优先执行。\\n'\n    return {\n        'verified_competitors_text': text,\n        'verified_competitor_names': '\\n'.join(names),\n\
          \        'competitor_count': len(names),\n        'rejected_count': 0,\n    }"
