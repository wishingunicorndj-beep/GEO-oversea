    - data:
        code: |
          import json

          def _load(value):
              if isinstance(value, dict):
                  return value
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      return parsed if isinstance(parsed, dict) else None
                  except Exception:
                      return None
              return None

          def _join(values, limit=None):
              if not isinstance(values, list):
                  return ''
              items = [str(x).strip() for x in values if str(x).strip()]
              if limit:
                  items = items[:limit]
              return '、'.join(items) or '无'

          def main(body=None, status_code=None, fanwen_id='', fanwen_url=''):
              data = _load(body)
              if not isinstance(data, dict):
                  raise ValueError('fanwen-service 返回不是合法 JSON')
              if data.get('ok') is not True:
                  code = data.get('code') or ('http_' + str(status_code) if status_code else 'service_error')
                  message = data.get('message') or '范文因子服务调用失败'
                  raise ValueError('范文因子服务失败 [%s] %s' % (code, message))
              contract = data.get('contract')
              if not isinstance(contract, dict):
                  raise ValueError('范文因子服务缺少 contract')
              diagnostics = data.get('diagnostics') or {}
              gate = diagnostics.get('gate') or {}
              gate_status = str(gate.get('status') or 'passed').lower()
              if gate_status == 'rejected':
                  raise ValueError('范文不合格，无法提取可用结构：%s' % str(gate.get('reason') or '服务判定 rejected'))
              forbid = contract.get('forbid') or {}
              role_sequence = contract.get('role_sequence') or []
              anchors = contract.get('anchors') or []
              block = '\n'.join([
                  '【范文参考（仅作软约束）】',
                  '结构顺序：%s（不要照抄标题文字）' % (' → '.join(str(x) for x in role_sequence) or '无结构化骨架'),
                  '骨架来源：%s' % str(contract.get('skeleton_source') or 'none'),
                  '开头方式：%s' % str(contract.get('opening_type') or '未识别'),
                  '段落节奏：每段约%s字，全文约%s段，段长带%s' % (
                      str(contract.get('para_avg') or '未识别'),
                      str(contract.get('para_count') or '未识别'),
                      str(contract.get('para_band') or '未识别'),
                  ),
                  '文风锚点（只模仿句式、节奏、语气，不得复述事实）：',
                  '\n'.join('%d. %s' % (i + 1, str(value)) for i, value in enumerate(anchors[:3])) or '无',
                  '【禁止迁移】',
                  '数字：%s' % _join(forbid.get('numbers'), 20),
                  '认证/标准：%s' % _join(forbid.get('certs')),
                  '品牌：%s' % _join(forbid.get('brands')),
                  '营销句：%s' % _join(forbid.get('marketing'), 6),
                  '优先级：合规规则 > 客户事实与写作规则 > 当前任务知识库 > 范文结构与文风。',
                  '当前文章只能使用当前任务知识库和客户规则中的事实，严禁迁移范文数字、认证、品牌和营销主张。',
              ])
              warning = str(gate.get('reason') or '') if gate_status == 'warning' else ''
              factor = {
                  'fanwen_prompt_block': block,
                  'fanwen_list': [{'fanwen_id': str(fanwen_id), 'fanwen_url': str(fanwen_url)}],
                  'fanwen_status': gate_status,
                  'fanwen_warning': warning,
              }
              return dict(factor, fanwen_factor=factor)
        code_language: python3
        desc: '解析契约、保留软约束并阻止范文事实迁移'
        outputs:
