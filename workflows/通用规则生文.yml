    - data:
        code: |
          import re

          _CATEGORY_GROUPS = [
              {'瓷砖', '岩板', '陶瓷', '大板', '薄板'},
              {'品牌', '牌子', '口碑', '推荐', '排名', '哪个好', '怎么选', '选哪个'},
              {'产品', '服务', '方案', '企业', '公司'},
          ]

          def _text(value):
              return str(value or '').strip()

          def _terms(text):
              value = _text(text)
              return {term for group in _CATEGORY_GROUPS for term in group if term in value}

          def _alignment(item, fanwen_prompt_block):
              block = _text(fanwen_prompt_block)
              if not block or '本批次未提供范文' in block:
                  return {
                      'level': 'none',
                      'mode': 'none',
                      'structure_hint': '',
                      'guidance': '本批次未提供范文，不使用范文结构或文风约束。',
                  }

              task_text = ' '.join(_text(item.get(key)) for key in (
                  'keyword', 'product_info', 'main_brand', 'article_type',
                  'content_mode', 'task_description', 'customer_rules',
              ))
              task_terms = _terms(task_text)
              ref_terms = _terms(block)
              selection_terms = {'品牌', '牌子', '口碑', '推荐', '排名', '哪个好', '怎么选', '选哪个'}
              task_intent = bool(task_terms & selection_terms)
              ref_intent = bool(ref_terms & selection_terms)
              exact_category = bool(task_terms & ref_terms & {'瓷砖', '岩板', '陶瓷', '大板', '薄板'})
              related_category = bool(task_terms & {'瓷砖', '岩板', '陶瓷', '大板', '薄板'}) and bool(
                  ref_terms & {'瓷砖', '岩板', '陶瓷', '大板', '薄板'}
              )
              structure_match = re.search(r'结构顺序：([^（\n]+)', block)
              structure_hint = structure_match.group(1).strip() if structure_match else ''

              if exact_category and task_intent and ref_intent:
                  level, mode = 'high', 'full_structure'
                  guidance = (
                      '当前任务与范文的品类和搜索意图高度匹配。可参考范文的宏观章节顺序、问题拆解、段落节奏和FAQ位置；'
                      '当前任务知识库、客户规则和主体事实优先，严禁迁移范文事实。'
                  )
              elif related_category and task_intent and ref_intent:
                  level, mode = 'partial', 'adapted_structure'
                  guidance = (
                      '当前任务与范文属于相近品类或搜索意图，但并非完全一致。只借鉴痛点开头、读者问题导向、信息组织节奏和FAQ表达；'
                      '不要直接套用范文的品牌条目、榜单顺序、产品参数或竞品结构，章节必须围绕当前关键词和主体重新规划。'
                  )
              else:
                  level, mode = 'low', 'style_only'
                  guidance = (
                      '当前任务与范文主题或搜索意图不匹配。范文仅用于参考句式、段落长度和表达节奏；'
                      '不使用范文章节顺序、品牌结构、榜单结构或FAQ主题。'
                  )
              return {
                  'level': level,
                  'mode': mode,
                  'structure_hint': structure_hint,
                  'guidance': guidance,
              }

          def main(plan=None, fanwen_prompt_block=''):
              items = plan if isinstance(plan, list) else []
              enriched = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  current = dict(item)
                  alignment = _alignment(current, fanwen_prompt_block)
                  current['fanwen_alignment'] = alignment['level']
                  current['fanwen_usage_mode'] = alignment['mode']
                  current['fanwen_structure_hint'] = alignment['structure_hint']
                  current['fanwen_guidance'] = alignment['guidance']
                  if alignment['mode'] == 'adapted_structure':
                      current['structure_dna'] = '范文读者路径（仅借鉴问题引入和方法拆解）—当前任务主体与证据—FAQ—结论'
                  elif alignment['mode'] == 'style_only':
                      current['structure_dna'] = '当前任务问题—判断方法—主体证据—适用边界—FAQ—结论'
                  current['fanwen_prompt_block'] = str(fanwen_prompt_block or '')
                  enriched.append(current)
              return {'plan': enriched}
