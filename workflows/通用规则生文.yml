            竞品策略：{{#1777000000002.verified_competitors_text#}}

            企业知识库：{{#17769420852870.content#}}

            产品知识库：{{#1776941890551.content#}}


            请输出完整文章 JSON。'
        - id: generic-draft-fanwen-001
          role: user
          text: |
            {{#1800000000006.fanwen_prompt_block#}}

            以文章计划中的fanwen_alignment、fanwen_usage_mode和fanwen_guidance为准使用范文：high/full_structure可适配宏观结构；partial/adapted_structure仅借鉴读者问题路径、开头和节奏，章节围绕本篇关键词重写；low/style_only只借鉴语言节奏，不沿用范文章节、品牌条目、榜单和FAQ主题。匹配未知时按style_only处理，不报错、不改变生文数量。
            严格执行大纲各节的写作任务和approx_words篇幅预算，不因企业资料多而逐项堆砌资质、奖项和产品系列。选购类先回答怎么选、如何验证，再用主体证据说明，不退化为企业宣传册；有明确客户文章类型时服从客户要求。
            句式学习只借鉴口语程度、长短句组合、提问和转折，不复述锚点原句，不冒充亲历者。严禁迁移范文中的数字、认证、品牌、营销主张；相同名称或数字只有当前任务独立证据支持时才可使用。
            当前任务知识库、客户规则、关键词和文章类型优先。正文只输出原约定文章JSON，不能出现匹配等级、内部分析、范文因子或工作流规则。
