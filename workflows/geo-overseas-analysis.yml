            # 执行步骤

            1. 解析目标规范身份与 aliases（以 target_entity_json 为准），按 `||` 拆分 brand_name/company_name
            并逐个做完整词法边界匹配，记录最早合法命中与 matched_brand。

            2. 在正文中寻找合法字面证据；同一规范品牌无论出现多少次，brand_mentions均只计1。target_evidence_spans可保留多条逐字证据。brand_pattern_hint
            只作 pattern 参考，与可见目标语义冲突时可重新判定；允许使用全称中真实存在的安全简称、全大写缩写和去法定后缀形式。

            3. 分类 P1–P6 品牌模式。

            4. 全量梳理正文中的目标和非目标品牌。优先读取回答中的显式序号；没有序号时按各规范品牌第一次提及顺序统一排名，再定位目标。

            5. 按 system 规则确定 rank_type 与单个整数 rank_pos。

            6. 输出 length_ratio、weighted_score 与 sentiment_emotion_score；品牌未提及时相关值归零。

            7. 输出 description_text，以及简短的 brand_recognition_chain 和 ranking_analysis。


            只输出纯 JSON，不要 Markdown 包装。'
