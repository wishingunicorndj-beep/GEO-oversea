    - data:
        code: "import json\nimport re\nimport unicodedata\nfrom typing import Any,\
          \ List\n\nGENERIC_STANDALONE = {\n    \"ai\", \"artificial intelligence\"\
          , \"seo\", \"geo\", \"crm\", \"erp\", \"saas\",\n    \"software\", \"platform\"\
          , \"tool\", \"tools\", \"app\", \"application\", \"technology\",\n    \"\
          tech\", \"company\", \"brand\", \"product\", \"service\", \"solution\",\
          \ \"solutions\"\n}\nLEGAL_SUFFIX_RE = re.compile(r\"(?:,?\\s+)(incorporated|inc|corporation|corp|company|co|limited|ltd|llc|plc)\\\
          .?$\", re.I)\n\ndef clean_text(text: Any) -> str:\n    text = unicodedata.normalize(\"\
          NFKC\", str(text or \"\")).strip()\n    text = text.replace(\"　\", \" \"\
          )\n    text = re.sub(r\"[ \\t]+\", \" \", text)\n    text = re.sub(r\"\\\
          n{3,}\", \"\\n\\n\", text)\n    return text\n\ndef parse_name_list(value:\
          \ Any) -> List[str]:\n    if value is None:\n        return []\n    if isinstance(value,\
          \ list):\n        raw = value\n    elif isinstance(value, str):\n      \
          \  s = value.strip()\n        if not s:\n            return []\n       \
          \ try:\n            parsed = json.loads(s)\n            if isinstance(parsed,\
          \ list):\n                raw = parsed\n            else:\n            \
          \    raw = [s]\n        except Exception:\n            raw = re.split(r\"\
          \\s*(?:\\|\\||[;；、\\n])\\s*\", s)\n    else:\n        raw = [value]\n  \
          \  out = []\n    seen = set()\n    for item in raw:\n        if isinstance(item,\
          \ dict):\n            item = item.get(\"name\") or item.get(\"brand\") or\
          \ item.get(\"canonical_name\") or \"\"\n        name = clean_text(item).strip(\"\
          \ ,;|/\")\n        if not name:\n            continue\n        key = normalize_name(name)\n\
          \        if not key or key in GENERIC_STANDALONE or key in seen:\n     \
          \       continue\n        seen.add(key)\n        out.append(name)\n    return\
          \ out\n\ndef normalize_name(name: Any) -> str:\n    s = unicodedata.normalize(\"\
          NFKC\", str(name or \"\")).casefold()\n    s = s.replace(\"&\", \" and \"\
          )\n    s = LEGAL_SUFFIX_RE.sub(\"\", s)\n    s = re.sub(r\"[^a-z0-9]+\"\
          , \" \", s)\n    return re.sub(r\"\\s+\", \" \", s).strip()\n\ndef canonical_key(name:\
          \ Any) -> str:\n    key = normalize_name(name)\n    if key.endswith(\" ai\"\
          ):\n        base = key[:-3].strip()\n        if base and base not in GENERIC_STANDALONE\
          \ and len(base) >= 3:\n            return base\n    return key\n\ndef build_entity(brand_names,\
          \ company_names):\n    aliases = []\n    seen = set()\n    for name in list(brand_names)\
          \ + list(company_names):\n        key = normalize_name(name)\n        if\
          \ not key or key in GENERIC_STANDALONE:\n            continue\n        if\
          \ key not in seen:\n            seen.add(key)\n            aliases.append(name)\n\
          \    aliases.sort(key=lambda x: (-len(normalize_name(x).split()), -len(x),\
          \ x.casefold()))\n    display = brand_names[0] if brand_names else (company_names[0]\
          \ if company_names else \"\")\n    return {\n        \"display_name\": display,\n\
          \        \"canonical_key\": canonical_key(display),\n        \"aliases\"\
          : aliases,\n        \"normalized_aliases\": [normalize_name(x) for x in\
          \ aliases],\n        \"matchable_aliases\": aliases,\n    }\n\ndef alias_pattern(alias:\
          \ str):\n    parts = re.findall(r\"[A-Za-z0-9]+\", alias)\n    if not parts:\n\
          \        return None\n    return re.compile(r\"(?<![A-Za-z0-9])\" + r\"\
          [\\s\\W_]*\".join(map(re.escape, parts)) + r\"(?![A-Za-z0-9])\", re.I)\n\
          \ndef find_alias(text: str, aliases):\n    hits = []\n    for alias in aliases:\n\
          \        p = alias_pattern(alias)\n        if not p:\n            continue\n\
          \        for m in p.finditer(text):\n            actual = m.group(0)\n \
          \           norm = normalize_name(alias)\n            if len(norm) <= 2\
          \ and actual != actual.upper():\n                continue\n            hits.append((m.start(),\
          \ m.end(), alias, actual))\n    return sorted(hits)\n\ndef clean_answer_raw(text:\
          \ Any) -> str:\n    text = str(text or \"\").replace(\"\\r\\n\", \"\\n\"\
          ).replace(\"\\r\", \"\\n\")\n    text = re.sub(r\"```[\\w-]*\\n?\", \"\"\
          , text)\n    text = text.replace(\"```\", \"\").replace(\"`\", \"\")\n \
          \   text = re.sub(r\"!\\[([^\\]]*)\\]\\(([^)]+)\\)\", r\"\\1\", text, flags=re.S)\n\
          \    text = re.sub(r\"\\[([^\\]]+)\\]\\(([^)]+)\\)\", r\"\\1\", text)\n\
          \    text = re.sub(r\"https?://\\S+\", \"\", text)\n    text = re.sub(r\"\
          <[^>]+>\", \"\", text)\n    text = re.sub(r\"^\\s{0,3}#{1,6}\\s*\", \"\"\
          , text, flags=re.M)\n    text = re.sub(r\"^\\s{0,3}>\\s?\", \"\", text,\
          \ flags=re.M)\n    text = text.replace(\"**\", \"\").replace(\"__\", \"\"\
          ).replace(\"_\", \"\")\n    text = re.sub(r\"[ \\t]+$\", \"\", text, flags=re.M)\n\
          \    return re.sub(r\"\\n{3,}\", \"\\n\\n\", text).strip()\n\ndef detect_pattern_hint(text:\
          \ str) -> str:\n    low = text.casefold()\n    rules = [\n        (\"P-平台生态\"\
          , [\"ecosystem\", \"marketplace\", \"platform suite\", \"cloud platform\"\
          ]),\n        (\"P-品牌屋\", [\"parent company\", \"subsidiary\", \"portfolio\
          \ of brands\", \"owned by\"]),\n        (\"P-多产品线\", [\"product line\",\
          \ \"product family\", \"series\", \"models\"]),\n        (\"P-组织即品牌\", [\"\
          agency\", \"clinic\", \"hospital\", \"university\", \"law firm\", \"consultancy\"\
          ]),\n    ]\n    for label, terms in rules:\n        if any(t in low for\
          \ t in terms):\n            return label\n    return \"P-单一实体\"\n\ndef main(answer_raw:\
          \ str, brand_name: str, company_name: str = \"\", query: str = \"\") ->\
          \ dict:\n    ar = clean_answer_raw(answer_raw)\n    bn = parse_name_list(brand_name)\n\
          \    cn = parse_name_list(company_name)\n    entity = build_entity(bn, cn)\n\
          \    hits = find_alias(ar, entity[\"matchable_aliases\"])\n    desc = \"\
          \"\n    if hits:\n        s = max(0, hits[0][0] - 160)\n        e = min(len(ar),\
          \ hits[0][1] + 240)\n        desc = ar[s:e]\n    return {\n        \"answer_raw\"\
          : ar,\n        \"brand_name_list\": bn,\n        \"company_name_list\":\
          \ cn,\n        \"query\": clean_text(query),\n        \"answer_total_len\"\
          : max(len(re.findall(r\"\\b[\\w'-]+\\b\", ar)), 1),\n        \"brand_pattern_hint\"\
          : detect_pattern_hint(ar),\n        \"target_desc_text\": desc,\n      \
          \  \"target_entity_json\": json.dumps(entity, ensure_ascii=False),\n   \
          \ }\n"
