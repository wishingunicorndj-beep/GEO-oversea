    - data:
        code: "import json\nimport re\n\ndef main(raw: str) -> dict:\n    def parse_json(s):\n\
          \        s = (s or \"\").strip()\n        if \"---\" in s:\n           \
          \ s = s.rsplit(\"---\", 1)[-1].strip()\n        s = re.sub(r\"^```(?:json)?\\\
          s*\", \"\", s, flags=re.I)\n        s = re.sub(r\"\\s*```$\", \"\", s).strip()\n\
          \        try:\n            return json.loads(s)\n        except Exception:\n\
          \            pass\n        starts=[i for i,c in enumerate(s) if c in \"\
          [{\"]\n        for start in starts:\n            opening=s[start]; closing=\"\
          ]\" if opening==\"[\" else \"}\"\n            depth=0; in_str=False; esc=False\n\
          \            for i in range(start,len(s)):\n                ch=s[i]\n  \
          \              if in_str:\n                    if esc: esc=False\n     \
          \               elif ch==\"\\\\\": esc=True\n                    elif ch=='\"\
          ': in_str=False\n                else:\n                    if ch=='\"':\
          \ in_str=True\n                    elif ch==opening: depth+=1\n        \
          \            elif ch==closing:\n                        depth-=1\n     \
          \                   if depth==0:\n                            try: return\
          \ json.loads(s[start:i+1])\n                            except Exception:\
          \ break\n        raise ValueError(\"invalid json\")\n    try:\n        obj=parse_json(raw)\n\
          \        return {\"summary_overview\":json.dumps(obj,ensure_ascii=False)}\n\
          \    except Exception:\n        return {\"summary_overview\":'{\"title\"\
          :\"数据解析异常\",\"points\":[\"数据解析异常\",\"数据解析异常\",\"数据解析异常\"],\"conclusion\"\
          :\"\"}'}"
        code_language: python3
