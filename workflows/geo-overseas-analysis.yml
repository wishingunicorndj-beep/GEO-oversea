    - data:
        code: "import re\n\ndef cjk_count(value):\n    return len(re.findall(r\"[\\\
          u3400-\\u4dbf\\u4e00-\\u9fff]\", str(value or \"\")))\n\ndef nonempty_lines(value):\n\
          \    return len([line for line in str(value or \"\").splitlines() if line.strip()])\n\
          \ndef normalized_short(value):\n    return re.sub(r\"[\\s.!。！,，;；:_-]+\"\
          , \"\", str(value or \"\")).casefold()\n\ndef completeness(source, candidate):\n\
          \    source = str(source or \"\").strip()\n    candidate = str(candidate\
          \ or \"\").strip()\n    if not source:\n        return (True, 1.0) if candidate\
          \ else (True, 0.0)\n    if not candidate or normalized_short(candidate)\
          \ in {\"done\", \"完成\", \"已完成\", \"翻译完成\"}:\n        return False, 0.0\n\
          \    source_len = max(len(source), 1)\n    source_words = max(len(re.findall(r\"\
          \\b[A-Za-z][A-Za-z'-]*\\b\", source)), 1)\n    chinese = cjk_count(candidate)\n\
          \    length_ratio = len(candidate) / source_len\n    cjk_ratio = chinese\
          \ / source_words\n    source_lines = nonempty_lines(source)\n    candidate_lines\
          \ = nonempty_lines(candidate)\n    line_ratio = candidate_lines / max(source_lines,\
          \ 1)\n    valid = (\n        chinese >= max(12, int(source_words * 0.18))\n\
          \        and length_ratio >= 0.18\n        and (source_lines < 8 or line_ratio\
          \ >= 0.25)\n    )\n    score = min(length_ratio, 1.5) * 0.35 + min(cjk_ratio,\
          \ 1.5) * 0.45 + min(line_ratio, 1.0) * 0.20\n    return valid, score\n\n\
          def main(answer_raw=\"\", draft_translation=\"\", repaired_translation=\"\
          \"):\n    repaired_ok, repaired_score = completeness(answer_raw, repaired_translation)\n\
          \    draft_ok, draft_score = completeness(answer_raw, draft_translation)\n\
          \    if repaired_ok:\n        return {\"text\": str(repaired_translation\
          \ or \"\").strip(), \"translation_status\": \"repaired_complete\"}\n   \
          \ if draft_ok:\n        return {\"text\": str(draft_translation or \"\"\
          ).strip(), \"translation_status\": \"draft_fallback_complete\"}\n    candidates\
          \ = [\n        (repaired_score, str(repaired_translation or \"\").strip()),\n\
          \        (draft_score, str(draft_translation or \"\").strip()),\n    ]\n\
          \    candidates.sort(key=lambda item: (item[0], cjk_count(item[1]), len(item[1])),\
          \ reverse=True)\n    return {\"text\": candidates[0][1], \"translation_status\"\
          : \"incomplete_best_effort\"}"
