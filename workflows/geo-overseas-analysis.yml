    - data:
        code: "import json\nimport re\n\ndef as_bool(value):\n    if isinstance(value,\
          \ bool):\n        return value\n    if isinstance(value, (int, float)):\n\
          \        return value != 0\n    return str(value or \"\").strip().casefold()\
          \ in {\"true\", \"1\", \"yes\", \"y\"}\n\ndef parse_llm(value):\n    text\
          \ = str(value or \"\")\n    if \"---\" in text:\n        text = text.rsplit(\"\
          ---\", 1)[-1].strip()\n    text = re.sub(r\"```json\\s*|\\s*```\", \"\"\
          , text, flags=re.I).strip()\n    match = re.search(r\"\\{[\\s\\S]*\\}\"\
          , text)\n    if not match:\n        return {}\n    try:\n        data =\
          \ json.loads(match.group(0))\n        return data if isinstance(data, dict)\
          \ else {}\n    except Exception:\n        return {}\n\ndef strong_raw_ranking_signal(answer):\n\
          \    lines = str(answer or \"\").splitlines()\n    numbered = []\n    for\
          \ line in lines:\n        match = re.match(\n            r\"^\\s*(?:[-*+•]\\\
          s*)?(?:#\\s*|no\\.?\\s*|rank\\s*#?\\s*)?(\\d+)(?:st|nd|rd|th)?\\s*[.)\\\
          ]:-]\\s+\\S+\",\n            line,\n            re.I,\n        )\n     \
          \   if match:\n            numbered.append(int(match.group(1)))\n    if\
          \ len(numbered) >= 2 and len(set(numbered)) >= 2:\n        return True,\
          \ \"正文存在多条显式编号排名\"\n\n    for index, line in enumerate(lines[:-1]):\n  \
          \      if \"|\" not in line:\n            continue\n        headers = [re.sub(r\"\
          [^a-z0-9#]+\", \" \", cell.casefold()).strip() for cell in line.strip().strip(\"\
          |\").split(\"|\")]\n        if not any(header in {\"rank\", \"ranking\"\
          , \"position\", \"pos\", \"no\", \"number\", \"#\"} for header in headers):\n\
          \            continue\n        if re.match(r\"^\\s*\\|?\\s*:?-{3,}\", lines[index\
          \ + 1]):\n            return True, \"正文存在Rank列\"\n    return False, \"\"\
          \n\ndef main(llm_output: str, answer_raw: str = \"\") -> dict:\n    data\
          \ = parse_llm(llm_output)\n    llm_value = as_bool(data.get(\"is_ranking\"\
          , False))\n    raw_value, raw_reason = strong_raw_ranking_signal(answer_raw)\n\
          \    value = llm_value or raw_value\n    reason = str(data.get(\"reason\"\
          , \"\")).strip()[:50]\n    if raw_value and not llm_value:\n        reason\
          \ = raw_reason\n    return {\n        \"is_ranking\": \"true\" if value\
          \ else \"false\",\n        \"is_ranking_reason\": reason,\n    }"
