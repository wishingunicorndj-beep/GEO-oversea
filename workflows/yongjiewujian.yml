    - data:
        code: "import re, random\n\ndef main(company_name=None, product_info=None,\
          \ industry=None, keyword_pack=None, article_count=None, article_style=None,\
          \ article_type=None, task_name=None, company_intro=None, core_qualifications=None,\
          \ awards=None, advantages=None, ent_dataset_id=None, prod_dataset_id=None):\n\
          \n    # === 永劫无间专项 v5.1：主推主体下沉至 product_info, 游戏合规模式注入 ===\n    product_info\
          \ = (product_info or \"\").strip()\n\n    # 0. 输入归一化：兼容\"对比排名\"和\"对比排名类\"\
          两种写法\n    type_normalize_map = {\n        \"对比排名\": \"对比排名类\", \"性能评测\"\
          : \"性能评测类\",\n        \"经验分享\": \"经验分享类\", \"知识科普\": \"知识科普类\",\n      \
          \  \"新闻报道\": \"新闻报道类\", \"自我介绍\": \"自我介绍类\",\n    }\n    article_type =\
          \ type_normalize_map.get(article_type, article_type) or \"对比排名类\"\n\n  \
          \  # 1. 核心锚词提取\n    lines = [l.strip() for l in keyword_pack.strip().replace('，','\\\
          n').split('\\n') if l.strip()]\n    core_anchor = \"\"\n    if product_info:\n\
          \        core_anchor = product_info  # v5.1: 产品名优先\n    elif lines:\n  \
          \      suffixes = r'(推荐|哪家好|排名|怎么选|有哪些|靠谱吗?|公司排行|品牌推荐|找哪家|怎么样|多少钱|哪个好|哪家靠谱|哪家专业)$'\n\
          \        prefixes = r'^(专业的?|靠谱的?|口碑好的?|好用的?|性价比高的?|正规的?|优质的?)'\n      \
          \  bare = [re.sub(suffixes, '', re.sub(prefixes, '', l)).strip() for l in\
          \ lines]\n        bare = [b for b in bare if len(b) >= 2]\n        if bare:\n\
          \            core_anchor = min(bare, key=len)\n    if not core_anchor:\n\
          \        core_anchor = industry or task_name or \"产品服务\"\n\n    # 2. RAG\
          \ 检索 query\n    ent_rag_query = f\"{company_name} 企业简介 品牌荣誉 行业认证 服务优势\"\n\
          \    topic_terms = (keyword_pack or \"\").replace(\"\\n\", \" \")[:30]\n\
          \    prod_rag_query = f\"{product_info or core_anchor} {topic_terms} 官方教程\
          \ 战斗机制 天赋 技能奥义 武器获取\"\n\n    def clean_q(q):\n        if not q: return \"\
          \"\n        q = re.sub(r'[\\x00-\\x1f\\x7f-\\x9f\"\\'\\\\]', '', q)\n  \
          \      return re.sub(r'\\s+', ' ', q).strip()[:60]\n\n    # 3. 合规模式识别\n\
          \    medical_kw = ['医院','医疗','诊所','医美','药品','保健','口腔','整形',\n          \
          \        '眼科','体检','齿科','门诊','制药','医师','康复','护理']\n    financial_kw = ['银行','保险','金融','理财','基金','证券','股票','贷款',\n\
          \                    '信用卡','支付','期货','信托','私募','投顾','征信']\n    # 永劫无间专项:\
          \ 文本扩到 product_info 和 keyword_pack 以提升识别率\n    text_for_check = \" \".join([industry\
          \ or \"\", company_intro or \"\", product_info or \"\", keyword_pack or\
          \ \"\"])\n    # 游戏行业关键词\n    game_kw = [\"游戏\", \"手游\", \"端游\", \"主机\",\
          \ \"PC\", \"PS\", \"Xbox\", \"Switch\", \"武侠\", \"大逃杀\", \"吃鸡\", \"MOBA\"\
          , \"FPS\", \"MMO\", \"MMORPG\", \"ARPG\", \"卡牌\", \"SLG\", \"二次元\", \"永劫无间\"\
          , \"英雄\", \"角色\", \"皮肤\", \"武器\", \"战令\", \"赛季\", \"排位\", \"匹配\", \"电竞\"\
          , \"赛事\", \"版本\", \"开黑\", \"联机\", \"网游\"]\n    if any(k in text_for_check\
          \ for k in medical_kw):\n        compliance_mode = \"medical\"\n    elif\
          \ any(k in text_for_check for k in financial_kw):\n        compliance_mode\
          \ = \"financial\"\n    elif any(k in text_for_check for k in game_kw):\n\
          \        compliance_mode = \"game\"  # 永劫无间专项: 游戏合规链路\n    else:\n     \
          \   compliance_mode = \"standard\"\n\n    # 4. 地域提取\n    region_list = [\n\
          \        '北京','上海','广州','深圳','天津','重庆','成都','杭州','武汉','南京',\n        '西安','郑州','长沙','苏州','东莞','青岛','沈阳','大连','哈尔滨','长春',\n\
          \        '济南','厦门','福州','昆明','贵阳','南宁','合肥','石家庄','太原','兰州',\n        '南昌','乌鲁木齐','呼和浩特','海口','银川','西宁','拉萨','珠海','佛山',\n\
          \        '中山','惠州','无锡','常州','温州','宁波','嘉兴','绍兴','金华','台州',\n        '泉州','漳州','烟台','潍坊','临沂','徐州','扬州','泰州','镇江','盐城',\n\
          \        '芜湖','洛阳','襄阳','宜昌','岳阳','株洲','柳州','桂林','保定','唐山',\n        '廊坊','邯郸','秦皇岛','承德','张家口','邢台','衡水','沧州',\n\
          \        '河北','山西','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建',\n        '江西','山东','河南','湖北','湖南','广东','广西','海南','四川',\n\
          \        '贵州','云南','陕西','甘肃','青海','内蒙古','宁夏','新疆','西藏',\n    ]\n    region\
          \ = \"\"\n    kw_text = keyword_pack or \"\"\n    for r in region_list:\n\
          \        if r in kw_text:\n            region = r\n            break\n\n\
          \    # 5. 内容模式判定（v5.1: 主推改 product_info）\n    is_self_promo = bool(product_info\
          \ and product_info in keyword_pack)\n    if is_self_promo:\n        content_mode\
          \ = \"brand_focus\"\n    elif article_type == \"自我介绍类\":\n        content_mode\
          \ = \"brand_focus\"\n    elif article_type in [\"对比排名类\", \"性能评测类\"]:\n\
          \        content_mode = \"comparison\"\n    elif article_type == \"经验分享类\"\
          :\n        content_mode = \"experience\"\n    elif article_type in [\"知识科普类\"\
          , \"新闻报道类\"]:\n        content_mode = \"knowledge\"\n    else:\n       \
          \ # article_type 为空或未识别 → 交给 N4 智能选型，暂设 auto\n        content_mode = \"\
          auto\"\n    needs_competitors = content_mode in [\"comparison\", \"experience\"\
          , \"auto\"]\n\n    return {\n        \"ent_rag_query\":  clean_q(ent_rag_query),\n\
          \        \"prod_rag_query\": clean_q(prod_rag_query),\n        \"article_type\"\
          :   article_type or \"对比排名类\",\n        \"article_style\":  article_style\
          \ or \"专业客观\",\n        \"article_count\":  str(int(article_count) if article_count\
          \ else 1),\n        \"compliance_mode\": compliance_mode,\n        \"content_mode\"\
          : content_mode,\n        \"needs_competitors\": \"true\" if needs_competitors\
          \ else \"false\",\n        \"region\": region,\n        \"core_service\"\
          : core_anchor,\n        \"main_brand\":    product_info or company_name,\n\
          \    }\n"
        code_language: python3
