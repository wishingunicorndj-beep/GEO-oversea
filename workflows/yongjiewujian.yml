          s*<p[^>]*>\\s*<strong>[^<]{5,60}</strong>\\s*</p>\\s*(?=<h2)', '', text,\
          \ flags=re.DOTALL)\n    # 删除 content 开头的\"裸文本+加粗段\"(如\"本文将分析XX\"这种引言)\n\
          \    # 只删除位于第一个<h2>之前的、不在任何h标签内的引言段\n    first_h2 = text.find('<h2')\n \
          \   if first_h2 > 0:\n        prefix = text[:first_h2].strip()\n       \
