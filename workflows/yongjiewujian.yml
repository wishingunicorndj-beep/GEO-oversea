          \    text = _re.sub(r'[、，,；;]\\s*[、，,；;]+', '；', text)\n    text = _re.sub(r'\\\
          s+', ' ', text)\n    return text.strip()\n\n\ndef fix_heading_hierarchy(text):\n\
          \    \"\"\"修复 comparison 模式下 TOPx 应该是 h3 而非 h2 的常见错误\"\"\"\n    if not text:\n\
