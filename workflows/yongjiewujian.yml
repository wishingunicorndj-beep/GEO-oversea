          \        r'[（(]来源[：:][^）)]*公开数据[^）)]*[）)]',\n        r'[（(]按白名单填充[^）)]*[）)]',\n\
          \    ]\n    for pattern in patterns:\n        # 对于带保留组的模式（如行首标签），用 \\1 保留分组\n\
          \        if r'(^|\\n|>)' in pattern:\n            text = re.sub(pattern,\
          \ r'\\1', text)\n        elif r'([。！？!?])' in pattern:\n            # 删除句末多余的\
