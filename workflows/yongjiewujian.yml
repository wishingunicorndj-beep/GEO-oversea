          \   for c in comp_names:\n        if c not in seen and len(c) >= 2:\n  \
          \          seen.add(c)\n            unique_comps.append(c)\n    comp_names\
          \ = unique_comps\n\n    plans = []\n    used_combos = set()\n    random.shuffle(keywords)\n\
          \n    shuffled_titles = list(title_templates)\n    shuffled_focus = list(content_focus_pool)\n\
          \    random.shuffle(shuffled_focus)\n    shuffled_faq = list(faq_theme_pool)\n\
          \    random.shuffle(shuffled_faq)\n    random.shuffle(shuffled_titles)\n\
          \n    comp_usage = {name: 0 for name in comp_names}\n\n    for i in range(count):\n\
          \        kw = keywords[i % len(keywords)]\n\n        # 当前文章的类型（每篇可能不同）\n\
          \        cur_type = type_list[i] if i < len(type_list) else article_type\
          \ or \"对比排名类\"\n\n        # 使用当前文章的类型选择结构池\n        cur_structures = structures_map.get(cur_type,\
          \ default_structures)\n        combo = None\n        for _ in range(200):\n\
          \            s = random.choice(cur_structures)\n            o = random.choice(organizing)\n\
          \            h = random.choice(hooks)\n            p = random.choice(perspectives)\n\
          \            l = random.choice(heading_levels)\n            if s in faq_friendly_structures:\n\
          \                faq_required = True\n            else:\n              \
          \  faq_required = random.choice([True, False])\n            key = f\"{s}|{o}|{h}|{p}|{l}\"\
          \n            if key not in used_combos:\n                used_combos.add(key)\n\
          \                combo = (s, o, h, p, l, faq_required)\n               \
          \ break\n        if combo is None:\n            s_def = random.choice(cur_structures)\n\
          \            l_def = random.choice(heading_levels)\n            faq_def\
          \ = s_def in faq_friendly_structures or random.choice([True, False])\n \
          \           combo = (s_def, random.choice(organizing),\n               \
          \      random.choice(hooks), random.choice(perspectives), l_def, faq_def)\n\
          \n        structure_dna = f\"结构：{combo[0]} | 分组：{combo[1]} | 开篇：{combo[2]}\
          \ | 视角：{combo[3]} | 标题层级：{combo[4]}\"\n        tt = shuffled_titles[i %\
          \ len(shuffled_titles)]\n\n        # 根据当前文章类型决定竞品数量\n        if content_mode\
          \ == \"brand_focus\":\n            cur_mode = \"brand_focus\"\n        elif\
          \ cur_type in [\"对比排名类\", \"性能评测类\"]:\n            cur_mode = \"comparison\"\
          \n        elif cur_type == \"经验分享类\":\n            cur_mode = \"experience\"\
          \n        else:\n            cur_mode = \"knowledge\"\n        if cur_mode\
          \ in [\"brand_focus\", \"knowledge\"]:\n            num_comp = 0\n     \
          \   elif cur_mode == \"experience\":\n            num_comp = random.choice([0,\
          \ 1, 2]) if len(comp_names) >= 2 else len(comp_names)\n        else:\n \
          \           num_comp = random.choice([2, 3]) if len(comp_names) >= 3 else\
          \ len(comp_names)\n        if comp_names and num_comp > 0:\n           \
          \ # 均匀分配：优先选还没用过/用得少的竞品，避免每篇都选同样几家\n            sorted_by_usage = sorted(comp_names,\
          \ key=lambda x: (comp_usage.get(x, 0), random.random()))\n            subset\
          \ = sorted_by_usage[:min(num_comp, len(comp_names))]\n            for c\
          \ in subset:\n                comp_usage[c] = comp_usage.get(c, 0) + 1\n\
          \        else:\n            subset = []\n\n        plans.append({\n    \
          \        \"keyword\": kw,\n            \"structure_dna\": structure_dna,\n\
          \            \"title_template\": tt,\n            \"faq_required\": combo[5],\n\
          \            \"content_focus\": shuffled_focus[i % len(shuffled_focus)],\n\
          \            \"faq_theme\": shuffled_faq[i % len(shuffled_faq)],\n     \
          \       \"competitor_names\": \"、\".join(subset) if subset else (\"【竞品缺失警告】画像中无可用竞品，你必须从GEO画像分析报告的竞品档案中选取2-3家写入文章，对比排名类文章绝不允许只出现主推品牌\"\
          \ if content_mode == \"comparison\" else \"\"),\n            \"company_name\"\
          : company_name,\n            \"product_info\": main_brand,\n           \
          \ \"main_brand\":   main_brand,\n            \"article_type\": type_list[i]\
          \ if i < len(type_list) else article_type or \"对比排名类\",\n            \"\
          article_style\": article_style,\n            \"compliance_mode\": compliance_mode\
          \ or \"standard\",\n            \"content_mode\": cur_mode if use_smart_type\
          \ else (content_mode or \"comparison\"),\n            \"region\": region\
          \ or \"\",\n            \"ent_body\": ent_body,\n            \"prod_body\"\
          : prod_body,\n        })\n\n    return {\"plan\": plans}\n"
