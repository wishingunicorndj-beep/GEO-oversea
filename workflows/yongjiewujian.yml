    - data:
        code: "import re\n\ndef main(llm_output=None, region=\"\", compliance_mode=\"\
          standard\"):\n    # Quick exit if competitors not needed\n    if not llm_output\
          \ or '跳过' in llm_output or '无需' in llm_output:\n        return {\n     \
          \       \"verified_competitors_text\": \"## 竞品不适用\\n本文类型无需竞品。\",\n     \
          \       \"verified_competitor_names\": \"\",\n            \"competitor_count\"\
          : 0,\n            \"rejected_count\": 0,\n        }\n\n    candidates =\
          \ []\n    lines = (llm_output or \"\").split('\\n')\n    current = {}\n\n\
