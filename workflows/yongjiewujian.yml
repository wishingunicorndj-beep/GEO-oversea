          \ not text:\n        return text\n    # 替换具体的术语为中性表述\n    replacements =\
          \ [\n        (r'字面\\s*[\\\"“”]?\\s*XX\\s*[\\\"“”]?\\s*占位[符]?', '占位检查通过'),\n\
