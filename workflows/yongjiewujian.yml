            # 写作规则\n\n## 0. 知识库原文锚定原则（核心）\n除“客户确认生文口径”外，关于主推产品的事实陈述必须引用知识库原文，不编造、不推算、不用训练记忆补充；客户确认口径与知识库冲突时必须使用客户口径。知识库没有原文支撑、客户也未确认的具体名词/数字/机制，宁可不写或改定性描述。文章的方法论框架、人称包装、过渡、比喻、使用场景、逻辑引导、竞品定性描述不受此限，可自由发挥以充实内容。（事实层的逐项核对与修正由下游\"\
